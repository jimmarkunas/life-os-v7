<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GitHub Widgets</title>
  <style>
    :root{color-scheme:dark;--ink:#222222;--text:#f3f3f3;--muted:#a7adb2;--border:#353535}
    *{box-sizing:border-box}
    body{margin:0;padding:48px 24px;background:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,Arial,sans-serif;color:var(--text)}
    main{max-width:760px;margin:0 auto}
    h1{margin:0 0 10px;font-size:34px}
    p{color:var(--muted);line-height:1.6}
    a{display:block;margin-top:28px;padding:20px 22px;border:1px solid var(--border);border-radius:16px;background:var(--ink);color:var(--text);text-decoration:none;font-weight:700}
    a span{display:block;margin-top:6px;color:var(--muted);font-size:14px;font-weight:500}
  </style>
</head>
<body>
  <main>
    <h1>GitHub Widgets</h1>
    <p>Small dashboard widgets hosted with GitHub Pages.</p>
    <a href="./world-clock/">World Clock<span>Honolulu · Los Angeles · Denver · Chicago · New York · London · Paris</span></a>
  </main>
</body>
</html>
