<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Clock + Weather</title>
<style>
:root{
  --page-bg:#ffffff;
  --ink:#353431;
  --muted:#6e6b67;
  --quiet:#98938e;
  --blue:#4f9bea;
  --blue-light:#c8dcf7;
  --orange:#ff9800;
}

@media (prefers-color-scheme:dark){
  :root{
    --page-bg:#191919;
    --ink:#f3f3f3;
    --muted:#c6c1bc;
    --quiet:#96918c;
  }
}

:root[data-theme="light"]{
  --page-bg:#ffffff;
  --ink:#353431;
  --muted:#6e6b67;
  --quiet:#98938e;
}

:root[data-theme="dark"]{
  --page-bg:#191919;
  --ink:#f3f3f3;
  --muted:#c6c1bc;
  --quiet:#96918c;
}

*{box-sizing:border-box}

html,
body,
.scroll,
.widget{
  background:var(--page-bg) !important;
  background-color:var(--page-bg) !important;
  transition:background-color .18s ease,color .18s ease;
}

html{
  color-scheme:light dark;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,Arial,sans-serif;
}

body{padding:8px 0}

.scroll{
  width:100%;
  overflow-x:auto;
  scrollbar-width:none;
}

.scroll::-webkit-scrollbar{display:none}

.widget{
  width:100%;
  min-width:1040px;
  min-height:245px;
  padding:18px 26px 20px;
  border:0;
  box-shadow:none;
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
}

.cities{
  width:100%;
  display:grid;
  grid-template-columns:repeat(7,minmax(125px,1fr));
  gap:14px;
  align-items:start;
}

.city{
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  text-align:center;
}

.city-icon{
  width:54px;
  height:54px;
  display:grid;
  place-items:center;
  margin:0 auto 10px;
}

.city-icon svg{
  width:52px;
  height:52px;
  display:block;
}

.city-name{
  width:100%;
  min-height:21px;
  color:var(--ink);
  font-size:17px;
  line-height:1.15;
  font-weight:600;
  letter-spacing:.01em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-align:center;
}

.time{
  margin-top:10px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:4px;
  color:var(--ink);
  font-size:28px;
  line-height:.95;
  font-weight:450;
  letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  text-align:center;
}

.ampm{
  padding-bottom:3px;
  color:var(--muted);
  font-size:10px;
  line-height:1;
  font-weight:650;
  letter-spacing:.05em;
}

.temps{
  margin-top:15px;
  display:flex;
  align-items:baseline;
  justify-content:center;
  gap:6px;
  white-space:nowrap;
  text-align:center;
}

.temp-f{
  color:var(--ink);
  font-size:23px;
  line-height:1;
  font-weight:650;
}

.slash{
  color:var(--quiet);
  font-size:17px;
  font-weight:400;
}

.temp-c{
  color:var(--muted);
  font-size:18px;
  line-height:1;
  font-weight:450;
}

.condition{
  width:100%;
  margin-top:8px;
  min-height:16px;
  color:var(--muted);
  font-size:12px;
  line-height:1.2;
  font-weight:450;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-align:center;
}

.offset{
  width:100%;
  margin-top:10px;
  min-height:12px;
  color:var(--quiet);
  font-size:10px;
  line-height:1.1;
  font-weight:550;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-align:center;
}

@media (max-width:1180px){
  .widget{padding-left:18px;padding-right:18px}
  .cities{gap:10px}
  .city-name{font-size:16px}
  .time{font-size:26px}
  .temp-f{font-size:22px}
  .temp-c{font-size:17px}
}
</style>
</head>
<body>
<div class="scroll">
  <main class="widget" aria-label="World clock and weather">
    <section class="cities" id="cities" aria-label="Cities"></section>
  </main>
</div>

<script>
const params = new URLSearchParams(location.search);
const themeOverride = params.get("theme");
const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");

function applyTheme(){
  const theme = (themeOverride === "dark" || themeOverride === "light")
    ? themeOverride
    : (systemTheme.matches ? "dark" : "light");
  document.documentElement.dataset.theme = theme;
}

applyTheme();
if(!themeOverride){
  if(systemTheme.addEventListener) systemTheme.addEventListener("change",applyTheme);
  else if(systemTheme.addListener) systemTheme.addListener(applyTheme);
}

const WEATHER_REFRESH_MS = 15 * 60 * 1000;
const LOCAL_ZONE = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";

const cities = [
  {name:"Honolulu",zone:"Pacific/Honolulu",lat:21.3069,lon:-157.8583},
  {name:"Los Angeles",zone:"America/Los_Angeles",lat:34.0522,lon:-118.2437},
  {name:"Denver",zone:"America/Denver",lat:39.7392,lon:-104.9903},
  {name:"Chicago",zone:"America/Chicago",lat:41.8781,lon:-87.6298},
  {name:"New York",zone:"America/New_York",lat:40.7128,lon:-0.1278},
  {name:"London",zone:"Europe/London",lat:51.5074,lon:-0.1278},
  {name:"Paris",zone:"Europe/Paris",lat:48.8566,lon:2.3522}
];

// Correct New York longitude after array declaration to keep the canonical city list readable above.
cities[4].lon = -74.0060;

const citiesEl = document.getElementById("cities");

function weatherLabel(code){
  if(code === 0) return "clear";
  if(code === 1) return "mostly clear";
  if(code === 2) return "partly cloudy";
  if(code === 3) return "cloudy";
  if(code === 45 || code === 48) return "fog";
  if([51,53,55,56,57].includes(code)) return "drizzle";
  if([61,63,65,66,67,80,81,82].includes(code)) return "rain";
  if([71,73,75,77,85,86].includes(code)) return "snow";
  if([95,96,99].includes(code)) return "storm";
  return "current weather";
}

function weatherIcon(code){
  const blue="var(--blue)", light="var(--blue-light)", orange="var(--orange)";
  if(code === 0){
    return `<svg viewBox="0 0 64 64" aria-hidden="true"><g stroke="${orange}" stroke-width="3" stroke-linecap="round"><path d="M32 4v7M32 53v7M4 32h7M53 32h7M12 12l5 5M47 47l5 5M52 12l-5 5M17 47l-5 5"/></g><circle cx="32" cy="32" r="11" fill="${orange}"/></svg>`;
  }
  if(code === 1 || code === 2){
    return `<svg viewBox="0 0 64 64" aria-hidden="true"><g stroke="${orange}" stroke-width="2.7" stroke-linecap="round"><path d="M22 5v6M6 21h6M10.5 9.5l4.5 4.5M34 9.5 29.5 14"/></g><circle cx="22" cy="21" r="9" fill="${orange}"/><path d="M19 48h28a10 10 0 0 0 0-20 14 14 0 0 0-26-3 11 11 0 0 0-2 23Z" fill="${blue}"/></svg>`;
  }
  if(code === 45 || code === 48){
    return `<svg viewBox="0 0 64 64" aria-hidden="true"><g stroke="${blue}" stroke-width="5" stroke-linecap="round"><path d="M9 20h46M5 32h54M11 44h42"/></g></svg>`;
  }
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)){
    return `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 40h35a11 11 0 0 0 0-22 15 15 0 0 0-28-3 12 12 0 0 0-7 25Z" fill="${blue}"/><g stroke="#72b2f1" stroke-width="3" stroke-linecap="round"><path d="M20 47l-2 7M31 47l-2 7M42 47l-2 7"/></g></svg>`;
  }
  if([71,73,75,77,85,86].includes(code)){
    return `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 38h35a11 11 0 0 0 0-22 15 15 0 0 0-28-3 12 12 0 0 0-7 25Z" fill="${blue}"/><g fill="${light}"><circle cx="20" cy="49" r="2.5"/><circle cx="32" cy="53" r="2.5"/><circle cx="44" cy="49" r="2.5"/></g></svg>`;
  }
  if([95,96,99].includes(code)){
    return `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 38h35a11 11 0 0 0 0-22 15 15 0 0 0-28-3 12 12 0 0 0-7 25Z" fill="${blue}"/><path d="M34 41l-8 12h7l-4 8 12-15h-7l4-5Z" fill="${orange}"/></svg>`;
  }
  return `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M13 43h37a12 12 0 0 0 0-24 16 16 0 0 0-30-3 13 13 0 0 0-7 27Z" fill="${blue}"/></svg>`;
}

function build(){
  cities.forEach((city,index) => {
    const el = document.createElement("article");
    el.className = "city";
    el.innerHTML = `
      <div class="city-icon" id="icon-${index}" aria-hidden="true">${weatherIcon(2)}</div>
      <div class="city-name">${city.name}</div>
      <div class="time"><span id="time-${index}">--:--</span><span class="ampm" id="ampm-${index}"></span></div>
      <div class="temps"><span class="temp-f" id="temp-f-${index}">--°F</span><span class="slash">/</span><span class="temp-c" id="temp-c-${index}">--°C</span></div>
      <div class="condition" id="condition-${index}">Loading weather</div>
      <div class="offset" id="offset-${index}"></div>`;
    citiesEl.appendChild(el);
  });
}

function zoneOffsetMinutes(date,zone){
  const parts = new Intl.DateTimeFormat("en-US",{
    timeZone:zone,
    year:"numeric",
    month:"2-digit",
    day:"2-digit",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hour12:false
  }).formatToParts(date);

  const values = {};
  parts.forEach(part => {
    if(part.type !== "literal") values[part.type] = part.value;
  });

  let hour = Number(values.hour);
  if(hour === 24) hour = 0;

  const representedAsUtc = Date.UTC(
    Number(values.year),
    Number(values.month)-1,
    Number(values.day),
    hour,
    Number(values.minute),
    Number(values.second)
  );

  return Math.round((representedAsUtc - date.getTime()) / 60000);
}

function relativeOffset(date,zone){
  const delta = zoneOffsetMinutes(date,zone) - zoneOffsetMinutes(date,LOCAL_ZONE);
  if(delta === 0) return "same as local";

  const sign = delta > 0 ? "+" : "−";
  const absolute = Math.abs(delta);
  const hours = Math.floor(absolute / 60);
  const minutes = absolute % 60;
  const amount = minutes
    ? `${hours}:${String(minutes).padStart(2,"0")}`
    : `${hours}`;

  return `${sign}${amount} hr vs local`;
}

function updateTimes(){
  const now = new Date();
  cities.forEach((city,index) => {
    const parts = new Intl.DateTimeFormat("en-US",{
      timeZone:city.zone,
      hour:"numeric",
      minute:"2-digit",
      hour12:true
    }).formatToParts(now);

    const value = type => parts.find(p => p.type === type)?.value || "";
    document.getElementById(`time-${index}`).textContent = `${value("hour")}:${value("minute")}`;
    document.getElementById(`ampm-${index}`).textContent = value("dayPeriod");
    document.getElementById(`offset-${index}`).textContent = relativeOffset(now,city.zone);
  });
}

async function fetchWeather(){
  try{
    const query = new URLSearchParams({
      latitude:cities.map(c => c.lat).join(","),
      longitude:cities.map(c => c.lon).join(","),
      current:"temperature_2m,weather_code",
      temperature_unit:"fahrenheit",
      forecast_days:"1"
    });

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(),10000);
    const response = await fetch(`https://api.open-meteo.com/v1/forecast?${query.toString()}`,{
      signal:controller.signal,
      cache:"no-store"
    });
    clearTimeout(timeout);

    if(!response.ok) throw new Error(`Weather request failed: ${response.status}`);

    const payload = await response.json();
    const rows = Array.isArray(payload) ? payload : [payload];
    if(rows.length !== cities.length) throw new Error("Unexpected weather response");

    rows.forEach((row,index) => {
      const tempF = row?.current?.temperature_2m;
      const code = row?.current?.weather_code;
      if(typeof tempF !== "number" || typeof code !== "number") throw new Error("Missing weather data");

      const roundedF = Math.round(tempF);
      const roundedC = Math.round((tempF - 32) * 5 / 9);
      document.getElementById(`temp-f-${index}`).textContent = `${roundedF}°F`;
      document.getElementById(`temp-c-${index}`).textContent = `${roundedC}°C`;
      document.getElementById(`condition-${index}`).textContent = weatherLabel(code);
      document.getElementById(`icon-${index}`).innerHTML = weatherIcon(code);
    });
  }catch(error){
    console.error(error);
    cities.forEach((_,index) => {
      document.getElementById(`temp-f-${index}`).textContent = "--°F";
      document.getElementById(`temp-c-${index}`).textContent = "--°C";
      document.getElementById(`condition-${index}`).textContent = "weather unavailable";
    });
  }
}

build();
updateTimes();
fetchWeather();
setInterval(updateTimes,1000);
setInterval(fetchWeather,WEATHER_REFRESH_MS);
</script>
</body>
</html>
