    lane: career-v7
  - path: lifeos/outlook/**
    lane: career-v7
  - path: lifeos/physmail/**
    lane: career-v7
  - path: lifeos/codemap.py
    lane: career-v7
  - path: lifeos/decisions.py
    lane: career-v7
  - path: lifeos/probe.py
    lane: career-v7
  - path: tests/platform/**
    lane: career-v7
  - path: tests/agenda/**
    lane: career-v7
  - path: tests/amazon/**
    lane: career-v7
  - path: tests/bills/**
    lane: career-v7
  - path: tests/calendar_bridge/**
    lane: career-v7
  - path: tests/dcc/**
