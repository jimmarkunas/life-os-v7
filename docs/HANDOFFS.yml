# Approved cross-lane handoffs (LIFE-78). Read by `lifeos/lane_guard.py` from the DEFAULT branch only, so an entry exists only after Jim merges it: a PR's own text never grants one.
# One entry lets exactly one PR number change paths covered by `path` that the OWNING lane (`owner`) holds, until `expires`. A ticket entry (Jim, Oct 25 2026) gives `jira: LIFE-n` and `lane: <the lane using it>` in place
# of `pr`: it covers every PR of that lane whose body names that Jira key, for the same paths and dates only, so a multi-PR ticket needs one handoff, not one per PR. `approval` is the https link to the owning lane's recorded approval (evidence for the reviewer; CI checks only
# that the entry is on the default branch). It cannot lift a `protected` or `unresolved` path.
