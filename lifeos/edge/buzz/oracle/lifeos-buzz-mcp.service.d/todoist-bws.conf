# LIFE-1055 (Jim, option C): the governed MCP reads the two one-hour Todoist access tokens from the Bitwarden project ALERTS through the Bitwarden machine-account token the Oracle ticker already holds.
# The unit loads that SAME existing encrypted credential file under the same name (`bwsalerts`); no new credential file or machine account is created. The token is used only to read two items by id (lifeos/platform/todoist_governed.py).
# No Todoist operation answers until a client holds a grant, and Todoist writes stay off until TODOIST_WRITES=on is set in config.env. LIFE-1094 replaces this with a read-only ALERTS token.
# Rollback: delete this file, `systemctl daemon-reload`, `systemctl restart lifeos-buzz-mcp`.
[Service]
LoadCredentialEncrypted=bwsalerts:/etc/credstore.encrypted/lifeos-ticker.bwsalerts
Environment=LIFEOS_BWS_BIN=/usr/local/bin/bws
