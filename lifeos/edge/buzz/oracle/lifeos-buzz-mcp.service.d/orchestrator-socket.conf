# LIFE-987 (Jim, comments 14334 and 14344: "987 af_unix ok"): the Buzz bridge may open Unix sockets so it can reach the Concord gateway at /run/lifeos-concord-gateway/orchestrator.sock, and nothing else on this host.
# AF_UNIX is added to the one line below; every other setting of the unit is unchanged. The bridge's code connects only to the gateway path (lifeos/platform/orchestrator.py, a constant). The other host sockets it could
# otherwise see are made inaccessible, exactly the set Jim approved: the system D-Bus, snapd and the three tailscale local APIs (the leading '-' ignores a path that does not exist). NOT blocked on purpose: /run/systemd/resolve
# (/etc/resolv.conf points into it, so blocking it would break the bridge's DNS), the journal sockets (logging) and uuidd (harmless: it only hands out UUIDs).
# Rollback: delete this file, `systemctl daemon-reload`, `systemctl restart lifeos-buzz-mcp` (install-gateway.sh bridge-rollback does exactly that).
[Service]
RestrictAddressFamilies=
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
InaccessiblePaths=-/run/dbus -/run/snapd.socket -/run/snapd-snap.socket -/run/tailscale -/run/tailscale-buzz -/run/tailscale-duet
