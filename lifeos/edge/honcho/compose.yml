# LIFE-889: the one durable Honcho stack on lifeos-edge-01 (pinned v3.6.1). Nothing is published except the API on loopback; Postgres and Redis have no host port.
# Every model call goes to the metering proxy on the network gateway (172.28.0.1:8081, meter_proxy.py), which holds the only Anthropic key and refuses at $0.90.
# Install steps and the one-time schema step: README.md in this folder. Secrets are not in this file: /etc/lifeos-honcho/db.env (root 0600); honcho.env holds none.
name: honcho
networks:
  honcho-net:
    external: true          # docker network create --subnet 172.28.0.0/24 --gateway 172.28.0.1 honcho-net
services:
  database:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    env_file: [/etc/lifeos-honcho/db.env]
    environment: [POSTGRES_DB=postgres, POSTGRES_USER=postgres, "PGDATA=/var/lib/postgresql/data/pgdata"]
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data/
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"], interval: 5s, timeout: 5s, retries: 10}
    networks: [honcho-net]
  redis:
    image: redis:8.2
    restart: unless-stopped
    volumes: [redis-data:/data]
    healthcheck: {test: ["CMD-SHELL", "redis-cli ping"], interval: 5s, timeout: 5s, retries: 10}
    networks: [honcho-net]
  api:
    image: ghcr.io/plastic-labs/honcho:v3.6.1
    restart: unless-stopped
    entrypoint: ["sh", "docker/entrypoint.sh"]
    depends_on: {database: {condition: service_healthy}, redis: {condition: service_healthy}}
    ports: ["127.0.0.1:8000:8000"]
    env_file: [./honcho.env, /etc/lifeos-honcho/db.env, /etc/lifeos-honcho/auth.env]
    environment: ["CACHE_URL=redis://redis:6379/0?suppress=true", "CACHE_ENABLED=true"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [honcho-net]
  deriver:
    image: ghcr.io/plastic-labs/honcho:v3.6.1
    restart: unless-stopped
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    depends_on: {api: {condition: service_healthy}}
    env_file: [./honcho.env, /etc/lifeos-honcho/db.env, /etc/lifeos-honcho/auth.env]
    environment: ["CACHE_URL=redis://redis:6379/0?suppress=true", "CACHE_ENABLED=true"]
    networks: [honcho-net]
volumes:
  pgdata:
  redis-data:
