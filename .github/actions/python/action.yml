name: Python and dependencies
description: Python 3.12 with the pip cache, then the locked requirements (requirements.lock, exact versions and hashes; the one place this is declared).
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements*
    - name: Install dependencies
      shell: bash
      run: pip install --require-hashes -r requirements.lock
