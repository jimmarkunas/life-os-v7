name: Browser (Playwright Chromium)
description: >-
  LIFE-604 item 13: the ONE place that installs the browser for a hosted-runner job. It restores the Chromium download and the browser's system libraries from the cache, installs from them
  when it can, and otherwise runs apt with three tries and saves the libraries for the next run. One log line, BROWSER_INSTALL_PATH=..., names the path taken. Used by the hourly finish job and the
  manual Jobright job. Needs the Python environment (./.github/actions/python) first.
inputs:
  cache_bust:
    description: >-
      Any word forces one cold run that rebuilds both saved copies (the repository variable BROWSER_CACHE_BUST, passed in by the caller because a composite action cannot read variables). Exit: set it only
      when the saved libraries stop installing (the log says BROWSER_LIBS_CACHE_FAILED); leave it empty otherwise.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - id: chromium_cache
      name: Chromium download, cached (keyed on requirements-browser.lock; the system libraries are cached next to it)
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}${{ inputs.cache_bust && format('-{0}', inputs.cache_bust) || '' }}-${{ hashFiles('requirements-browser.lock') }}
    - id: runner_image
      name: Runner image version (part of the system-library cache key so a restored copy never meets a different image)
      shell: bash
      run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
    - id: libs_cache
      name: Browser system libraries, cached (the .deb files apt downloaded, keyed on the runner image version and requirements-browser.lock)
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/apt-debs
        key: aptlibs-${{ runner.os }}-${{ steps.runner_image.outputs.version }}${{ inputs.cache_bust && format('-{0}', inputs.cache_bust) || '' }}-${{ hashFiles('requirements-browser.lock') }}
    - id: browser
      name: Browser install (its own timed step, and one log line names the path taken - cache-hit runs no apt, libs-cache installs the saved .deb files without apt, apt-fallback or apt-cold use apt with three tries and then save the .deb files)
      shell: bash
      env:
        CHROMIUM_CACHE_HIT: ${{ steps.chromium_cache.outputs.cache-hit }}
        LIBS_CACHE_HIT: ${{ steps.libs_cache.outputs.cache-hit }}
      run: |
        pip install --require-hashes -r requirements-browser.lock
        DEBS="$HOME/apt-debs"
        if [ "$CHROMIUM_CACHE_HIT" = "true" ]; then
          echo "BROWSER_INSTALL_PATH=cache-hit"
          echo "BROWSER_INSTALL_SKIPPED_APT: Chromium cache hit, no apt command runs"
          timeout 120 python -m playwright install chromium || echo "BROWSER_DOWNLOAD_SKIPPED"
        else
          done_path=""
          if [ "$LIBS_CACHE_HIT" = "true" ] && [ -f "$DEBS/manifest.txt" ]; then
            if { ! ls "$DEBS"/*.deb >/dev/null 2>&1 || sudo dpkg -i "$DEBS"/*.deb; } && timeout 240 python -m playwright install chromium; then
              echo "BROWSER_INSTALL_PATH=libs-cache"
              done_path=yes
            else
              echo "BROWSER_LIBS_CACHE_FAILED: saved libraries did not install, falling back to apt (set the repository variable BROWSER_CACHE_BUST to rebuild the saved copy)"
            fi
          fi
          if [ -z "$done_path" ]; then
            if [ "$LIBS_CACHE_HIT" = "true" ]; then echo "BROWSER_INSTALL_PATH=apt-fallback"; else echo "BROWSER_INSTALL_PATH=apt-cold"; fi
            dpkg-query -W -f '${Package}=${Version}\n' 2>/dev/null | sort > "$HOME/pkgs-before.txt" || true
            browser=""
            for attempt in 1 2 3; do
              if timeout 240 python -m playwright install --with-deps chromium; then browser=yes; break; fi
              echo "BROWSER_INSTALL_ATTEMPT_${attempt}_FAILED"
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
            done
            if [ -z "$browser" ]; then echo "BROWSER_INSTALL_FAILED: three tries used up"; exit 1; fi
            if [ "$LIBS_CACHE_HIT" != "true" ]; then
              rm -rf "$DEBS"; mkdir -p "$DEBS"
              dpkg-query -W -f '${Package}=${Version}\n' 2>/dev/null | sort > "$HOME/pkgs-after.txt" || true
              comm -13 "$HOME/pkgs-before.txt" "$HOME/pkgs-after.txt" > "$DEBS/manifest.txt" || true
              if [ -s "$DEBS/manifest.txt" ]; then
                (cd "$DEBS" && apt-get download $(cat manifest.txt)) || { echo "BROWSER_LIBS_SAVE_FAILED: nothing saved"; rm -rf "$DEBS"; }
              fi
              if [ -d "$DEBS" ]; then echo "BROWSER_LIBS_SAVED: $(ls "$DEBS"/*.deb 2>/dev/null | wc -l | tr -d " ") packages"; fi
            fi
          fi
        fi
