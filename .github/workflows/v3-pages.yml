name: v3-pages
# LIFE-793: the five V3 accountability stages (This week, Quarterly goals, Quarterly review, Knowledge center, Canon / Change Log; LIFE-671 and LIFE-673) in their own workflow, so the hourly jira job (domains.yml) is about 56 seconds shorter once
# they are removed there. They read Jira only and write only the callouts on Jim & Matt V3 in Notion (counts only). Same checkout, credential loading and LIVE rule as the jira job, and only the three credentials these stages use.
# Hourly at minute 40: the hourly tick runs at :07/:27/:47 and the domains jobs follow it, the watchdog is at :17/:47, so :40 keeps Jira and Notion calls off those minutes. Manual runs are a dry run unless "Actually write" is ticked; a scheduled run follows V7_LIVE (dry run if it cannot be read).
on:
  schedule:
    - cron: "40 * * * *"           # the fallback: GitHub fires it only about twice a day (Nov 26 2026), so it is no longer the page's clock
  workflow_run:                    # LIFE-1000 (Jim, Nov 26 2026, 2:54 PM CT): the page refreshes after every hourly domains run, like the Jira job did before LIFE-793
    workflows: ["domains"]
    types: [completed]
  workflow_dispatch:
    inputs:
      live:
        description: "Actually write the V3 page callouts. Unticked = dry run, counts only"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: life-os-v7-v3-pages
  cancel-in-progress: false
jobs:
  v3pages:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.display_title == 'domains (after tick)' && github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}   # LIFE-1009: only a successful late after-tick domains run starts this path
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the exact commit (own git fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Python and the Bitwarden helper
        uses: ./.github/actions/job-start
        with:
          wait_seconds: "200"
      # why: Load the migrated credentials from Bitwarden (the three the V3 stages use, the same ids the jira job loads; masked step outputs only, nothing exported job-wide; the job fails if retrieval fails, no fallback)
      - id: bws_v3pages
        name: Load the migrated credentials from Bitwarden
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          doppler_compare: ${{ secrets.DOPPLER_TOKEN }}
          set_env: false
          secrets: |
            3fa6f4f4-bd6d-45e7-8f2c-b4db015ec0c3 > JIRA_API_TOKEN
            e6466367-9a55-4899-ae1c-b4db015ec49f > JIRA_EMAIL
            53f47cb9-f6bb-4cde-87f4-b4db015ef928 > NOTION_JIRA_TOKEN
      # why: Plain switches from Bitwarden (LIFE-704; read WITHOUT masking, validated; fixed fail modes - dry run when it cannot be read - names and codes only)
      - name: Plain switches from Bitwarden
        uses: ./.github/actions/bws-plain
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          names: LIVE
          live_mode: ${{ github.event_name == 'workflow_dispatch' && (inputs.live && 'true' || 'false') || 'follow' }}
      # why: Runtime Configuration source ID from Bitwarden so the settings read uses the new source (LIFE-859; read only, an address not a secret; if it fails the step runs exactly as before)
      - id: bws_runtime_config
        continue-on-error: true
        name: Runtime Configuration source ID from Bitwarden
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          doppler_compare: ${{ secrets.DOPPLER_TOKEN }}
          set_env: false
          secrets: |
            0053654c-d504-4453-87f7-b5080113d136 > V7_RUNTIME_CONFIG_SOURCE_ID
      # why: V7 settings page for the Jira base URL (LIFE-699; names and counts only; an unreadable page changes nothing). Only this step holds the Notion token; the stage steps get the value through the job environment
      - id: settings
        continue-on-error: true
        name: V7 settings page for the Jira base URL
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          NOTION_JIRA_TOKEN: ${{ steps.bws_v3pages.outputs.NOTION_JIRA_TOKEN }}
          JIRA_BASE_URL: ""
          JIRA_BOARDS: ""
          JIRA_GTV_EPIC: ""
          V3_WEEK_VIEW: ""   # LIFE-918: off unless the Runtime Configuration row says on; the stages below read it from the job environment
          V2_QUARTER_SHADOW: ""   # LIFE-918: same rule; the v2 preview column of the two Quarterly Goals & Review blocks
        run: python3 -m lifeos.platform.settings
      # why: V3 This week for Jim and Matt (LIFE-671; read-only from Jira; the callouts on Jim & Matt V3 are written only when live; counts only)
      - id: acweek
        continue-on-error: true
        name: V3 This week for Jim and Matt
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          JIRA_SITE_URL: ""
          JIRA_API_TOKEN: ${{ steps.bws_v3pages.outputs.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ steps.bws_v3pages.outputs.JIRA_EMAIL }}
          NOTION_JIRA_TOKEN: ${{ steps.bws_v3pages.outputs.NOTION_JIRA_TOKEN }}
        run: python -m lifeos.run accountability-week $([ "$LIVE" = "true" ] && echo --live)
      # why: V3 Quarterly goals for Jim and Matt (LIFE-671; read-only from Jira; the callouts on Jim & Matt V3 are written only when live; counts only)
      - id: acgoals
        continue-on-error: true
        name: V3 Quarterly goals for Jim and Matt
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          JIRA_API_TOKEN: ${{ steps.bws_v3pages.outputs.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ steps.bws_v3pages.outputs.JIRA_EMAIL }}
          NOTION_JIRA_TOKEN: ${{ steps.bws_v3pages.outputs.NOTION_JIRA_TOKEN }}
        run: python -m lifeos.run accountability-goals $([ "$LIVE" = "true" ] && echo --live)
      # why: V3 Quarterly review for Jim and Matt (LIFE-671; read-only from Jira; the callouts on Jim & Matt V3 are written only when live; counts only)
      - id: acreview
        continue-on-error: true
        name: V3 Quarterly review for Jim and Matt
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          JIRA_API_TOKEN: ${{ steps.bws_v3pages.outputs.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ steps.bws_v3pages.outputs.JIRA_EMAIL }}
          NOTION_JIRA_TOKEN: ${{ steps.bws_v3pages.outputs.NOTION_JIRA_TOKEN }}
        run: python -m lifeos.run accountability-review $([ "$LIVE" = "true" ] && echo --live)
      # why: V3 Knowledge center (LIFE-673; the callouts on Jim & Matt V3 are written only when live; counts only)
      - id: acart
        continue-on-error: true
        name: V3 Knowledge center
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          JIRA_SITE_URL: ""
          JIRA_API_TOKEN: ${{ steps.bws_v3pages.outputs.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ steps.bws_v3pages.outputs.JIRA_EMAIL }}
          NOTION_JIRA_TOKEN: ${{ steps.bws_v3pages.outputs.NOTION_JIRA_TOKEN }}
        run: python -m lifeos.run accountability-artifacts $([ "$LIVE" = "true" ] && echo --live)
      # why: V3 Canon / Change Log (LIFE-673; the callouts on Jim & Matt V3 are written only when live; counts only)
      - id: acchange
        continue-on-error: true
        name: V3 Canon / Change Log
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          NOTION_JIRA_TOKEN: ${{ steps.bws_v3pages.outputs.NOTION_JIRA_TOKEN }}
        run: python -m lifeos.run accountability-changelog $([ "$LIVE" = "true" ] && echo --live)
      # why: V3 pages warning (does not fail the run while the stages are being stabilised, LIFE-730)
      - name: V3 pages warning
        if: ${{ always() && (steps.acweek.outcome == 'failure' || steps.acgoals.outcome == 'failure' || steps.acreview.outcome == 'failure' || steps.acart.outcome == 'failure' || steps.acchange.outcome == 'failure') }}
        run: echo "::warning title=V3 pages::a V3 stage failed; nothing else is affected"
