name: manual-job
# LIFE-37 (Jim, Oct 26 2026). Manual only, no schedule: ONE job Jim names by hand goes into Jobs OS (like a recruiter's posting link) and into the Interview OS writer (its machine
# opportunity page and Interview 1 round), so a meeting can be matched to it (lifeos/sources/manual_job.py). Dry run unless `live` is ticked: a dry run reads the store and the
# Hiring Pipeline and PLANS the writes. It holds the store credentials and the Interview token; no mail, Calendar, Gmail or Jobs/Recruiters token. Counts and fixed codes only.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "The employer's own single-vacancy posting link (https)"
        type: string
        default: ""
      company:
        description: "Company, as it should read on the opportunity page"
        type: string
        default: ""
      title:
        description: "Job title, as it should read on the opportunity page"
        type: string
        default: ""
      round_day:
        description: "Central day (YYYY-MM-DD) of the call, to date Interview 1. Leave blank when a request message link is given"
        type: string
        default: ""
      request_url:
        description: "https link to the request message, for a Scheduling Pending Interview 1. Leave blank when a round day is given"
        type: string
        default: ""
      live:
        description: "Actually add the job and write the Interview OS pages (false = dry run: nothing written)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: life-os-v7-interview-writer     # the one writer of the opportunity pages: this run, the after-tick Interview step and the Granola run take turns
  cancel-in-progress: false
jobs:
  manual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - uses: ./.github/actions/python
      - name: Bitwarden helper from a saved, fingerprint-checked copy (LIFE-406; downloads, with a long retry, only when no saved copy exists)
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "300"
      - id: bws_manual
        name: Load the migrated credentials from Bitwarden (EDGE-1.3, exactly these 8; masked step outputs only, nothing exported job-wide; the job fails if retrieval fails, no fallback)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            d71bbaed-6a6c-49b5-8a1f-b4db015ecfda > LIFEOS_ACQ_DB_NAME
            00d82e0d-be10-4c8c-bdbe-b4db015ed389 > LIFEOS_ACQ_DB_PASSWORD
            9422b842-3bb0-4153-bb8d-b4db015ed746 > LIFEOS_ACQ_DB_USER
            6f1c86f6-c48f-4e77-b65d-b4db015edb15 > LIFEOS_ACQ_SSH_HOST
            b65dd2fc-2573-4bda-9e80-b4db015edec6 > LIFEOS_ACQ_SSH_KNOWN_HOSTS
            7ada9cea-8711-4b37-bef9-b4db015ee298 > LIFEOS_ACQ_SSH_PRIVATE_KEY
            6b3e12b9-1987-4073-bda2-b4db015ee653 > LIFEOS_ACQ_SSH_USER
            092b44ae-32cb-453b-8cc2-b4db015ef571 > NOTION_INTERVIEW_TOKEN
      - id: doppler_bws_manual
        if: ${{ steps.bws_manual.outcome == 'success' }}
        continue-on-error: true       # LIFE-981: a Doppler problem is a fixed code in the log and never fails the job; the Bitwarden values above are the ones this job uses
        name: Doppler parity compare (LIFE-981; the same 8 names read from Doppler and compared with Bitwarden's value by hash; counts and a fixed code only; production keeps Bitwarden)
        uses: ./.github/actions/doppler-load
        with:
          token: ${{ secrets.DOPPLER_TOKEN }}
          names: LIFEOS_ACQ_DB_NAME,LIFEOS_ACQ_DB_PASSWORD,LIFEOS_ACQ_DB_USER,LIFEOS_ACQ_SSH_HOST,LIFEOS_ACQ_SSH_KNOWN_HOSTS,LIFEOS_ACQ_SSH_PRIVATE_KEY,LIFEOS_ACQ_SSH_USER,NOTION_INTERVIEW_TOKEN
          bitwarden: '{}'
      - name: Plain switches from Bitwarden (LIFE-704; read WITHOUT masking, validated; fixed fail modes - dry run, cloud fit off, alerts on, port fails - names and codes only)
        uses: ./.github/actions/bws-plain
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          names: LIFEOS_ACQ_SSH_PORT
      - id: bws_settings
        continue-on-error: true
        name: Notion token from Bitwarden for the V7 settings page
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            53f47cb9-f6bb-4cde-87f4-b4db015ef928 > NOTION_JIRA_TOKEN
            0053654c-d504-4453-87f7-b5080113d136 > V7_RUNTIME_CONFIG_SOURCE_ID
      - id: doppler_bws_settings
        if: ${{ steps.bws_settings.outcome == 'success' }}
        continue-on-error: true       # LIFE-981: a Doppler problem is a fixed code in the log and never fails the job; the Bitwarden values above are the ones this job uses
        name: Doppler parity compare (LIFE-981; the same 2 names read from Doppler and compared with Bitwarden's value by hash; counts and a fixed code only; production keeps Bitwarden)
        uses: ./.github/actions/doppler-load
        with:
          token: ${{ secrets.DOPPLER_TOKEN }}
          names: NOTION_JIRA_TOKEN,V7_RUNTIME_CONFIG_SOURCE_ID
          bitwarden: '{}'
      - name: Manual job (one job into Jobs OS and the Interview OS writer; dry run unless live is ticked; counts and fixed codes only)
        env:
          NOTION_JIRA_TOKEN: ${{ steps.bws_settings.outputs.NOTION_JIRA_TOKEN }}
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_settings.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          LIFEOS_NOTION_IDS: ""
          MANUAL_JOB_URL: ${{ inputs.url }}
          MANUAL_JOB_COMPANY: ${{ inputs.company }}
          MANUAL_JOB_TITLE: ${{ inputs.title }}
          MANUAL_JOB_ROUND_DAY: ${{ inputs.round_day }}
          MANUAL_JOB_REQUEST_URL: ${{ inputs.request_url }}
          HIRING_PIPELINE_PAGE_ID: ""
          INTERVIEW_OS_WRITER: ""
          LIFEOS_ACQ_DB_NAME: ${{ steps.bws_manual.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: ${{ steps.bws_manual.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: ${{ steps.bws_manual.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: ${{ steps.bws_manual.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ steps.bws_manual.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ steps.bws_manual.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: ${{ steps.bws_manual.outputs.LIFEOS_ACQ_SSH_USER }}
          NOTION_INTERVIEW_TOKEN: ${{ steps.bws_manual.outputs.NOTION_INTERVIEW_TOKEN }}
          NOTION_JOB_LEDGER_DATA_SOURCE_ID: ""   # LIFE-361 (Jim approved Nov 8): a new manual pursuit finds or creates its Ledger row
          LIVE: ${{ inputs.live }}
        run: python -m lifeos.run manual-job --limit 5 $([ "$LIVE" = "true" ] && echo --live)
