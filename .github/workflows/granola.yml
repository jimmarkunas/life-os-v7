name: granola
# LIFE-37 Step 2 (Jim's approvals, LIFE-37 comments 11227 to 11231). Manual only, no schedule: carries ONE Granola meeting, pinned to a Central day, from Oracle into its
# Interview round as a "Full Transcript" page, reads it back, and only then asks Oracle to purge its copy (lifeos/interview/granola_bridge.py). Dry run unless `live` is
# ticked: a dry run asks Oracle to sync and list, matches, checks the transcript contract and PLANS the page, writing and purging nothing. It holds the Interview Notion
# token, the Oracle host and the tailnet join (the existing ephemeral tag:v7-runner node, TCP 47341 only); no mail, store or Jobs secret. Counts and fixed codes only.
on:
  workflow_dispatch:
    inputs:
      day:
        description: "Central calendar day (YYYY-MM-DD) of the ONE Granola meeting to carry; exactly one synced meeting must fall on it"
        type: string
        default: ""
      live:
        description: "Actually write the Full Transcript page and purge Oracle's copy (false = dry run: nothing written, nothing purged)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: life-os-v7-granola
  cancel-in-progress: false
jobs:
  granola:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/python
      - name: Bitwarden helper from a saved, fingerprint-checked copy (LIFE-406; downloads, with a long retry, only when no saved copy exists)
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "300"
      - id: bws_granola
        name: Load the migrated credentials from Bitwarden (EDGE-1.3, exactly these 4; masked step outputs only, nothing exported job-wide; the job fails if retrieval fails, no fallback)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            092b44ae-32cb-453b-8cc2-b4db015ef571 > NOTION_INTERVIEW_TOKEN
            454e12df-637f-4f65-9ec1-b4e30052942f > TAILSCALE_OAUTH_CLIENT_ID
            e54f0a84-84c3-47d8-8b5b-b4e30052d6e9 > TAILSCALE_OAUTH_CLIENT_SECRET
            6590208b-506d-4238-ab10-b4e30051b25f > IMESSAGE_ALERTS_HOST
      - name: Join the tailnet as the existing ephemeral tag:v7-runner node (the tailnet policy admits it only to Oracle TCP 22 and 47341); no join means no Oracle, and the run stops with a fixed code
        uses: ./.github/actions/tailscale
        with:
          oauth-client-id: ${{ steps.bws_granola.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_granola.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
      - name: Granola bridge (one pinned meeting; dry run unless live is ticked; counts and fixed codes only)
        env:
          GRAN_PIN_DAY: ${{ inputs.day }}
          HIRING_PIPELINE_PAGE_ID: ${{ secrets.HIRING_PIPELINE_PAGE_ID }}
          IMESSAGE_ALERTS_HOST: ${{ steps.bws_granola.outputs.IMESSAGE_ALERTS_HOST }}
          NOTION_INTERVIEW_TOKEN: ${{ steps.bws_granola.outputs.NOTION_INTERVIEW_TOKEN }}
          LIVE: ${{ inputs.live }}
        run: python -m lifeos.run granola $([ "$LIVE" = "true" ] && echo --live)
