name: boards
# LIFE-854 (Jim, Nov 21 2026, comment 13632): employer-board crawling in its own four daily windows, out of the hourly tick: 1:00 AM, 7:00 AM, 1:00 PM and 7:00 PM Central.
# Daylight-saving safe: two UTC cron lines per window (standard time, then daylight time). One of the two opens the window; the other lands an hour off and is skipped as a duplicate by the `window` job
# (lifeos.platform.boards_window), which also turns a window whose predecessor never finished into a catch-up (leftovers first: the board list is read oldest-due first). GitHub drops and delays scheduled runs;
# the gate settles it from this workflow's own run history, and an unreadable history never stops a window.
# Window: up to BOARDS_PER_RUN (1,800) boards, step timeout 35 minutes. Catch-up: BOARDS_CATCHUP_PER_RUN (2,900), step timeout 60 minutes. The stage is the one the hourly tick ran (`lifeos.run boards`):
# same reader, same provider protections (4 workers, 3 answers of 429 stop an ATS for the run). Each window prints one receipt (counts only) and writes it to the job summary.
# Scheduled runs are live only when the Bitwarden switch LIVE is true, and parked when V7_PIPELINE is not true (the same switches the tick follows). Manual runs are a dry run unless "Actually write" is ticked.
# Rollback: revert the PR; the stage returns to the hourly tick.
on:
  schedule:
    - cron: "0 0 * * *"          # 7:00 PM CDT (daylight time)
    - cron: "0 1 * * *"          # 7:00 PM CST (standard time)
    - cron: "0 6 * * *"          # 1:00 AM CDT
    - cron: "0 7 * * *"          # 1:00 AM CST
    - cron: "0 12 * * *"         # 7:00 AM CDT
    - cron: "0 13 * * *"         # 7:00 AM CST
    - cron: "0 18 * * *"         # 1:00 PM CDT
    - cron: "0 19 * * *"         # 1:00 PM CST
  workflow_dispatch:
    inputs:
      mode:
        description: "window (cap 1,800, 35 minutes) or catchup (cap 2,900, 60 minutes); a manual run needs no gate"
        type: choice
        options: ["window", "catchup"]
        default: "window"
      live:
        description: "Actually write (the boards' state and admissions). Unticked = dry run, counts only"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: life-os-v7-boards
  cancel-in-progress: false
jobs:
  window:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      mode: ${{ steps.gate.outputs.mode }}
      limit: ${{ steps.gate.outputs.limit }}
      deadline_minutes: ${{ steps.gate.outputs.deadline_minutes }}
      slot: ${{ steps.gate.outputs.slot }}
      slot_ct: ${{ steps.gate.outputs.slot_ct }}
      late_reason: ${{ steps.gate.outputs.late_reason }}
    steps:
      - name: Checkout the exact commit (own git fetch; the token is passed once and never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - id: gate
        name: Window gate - which window this firing belongs to, whether it already ran, and whether it is a catch-up (reads this workflow's run history only; counts and codes)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MODE_INPUT: ${{ inputs.mode }}
        run: python3 -m lifeos.platform.boards_window
  boards:
    needs: window
    if: ${{ needs.window.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70                 # the catch-up's 60-minute crawl step plus checkout, the Bitwarden helper wait and the tailnet join
    steps:
      - name: Checkout the exact commit (own git fetch; the token is passed once and never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - uses: ./.github/actions/python
      - name: Bitwarden helper from a saved, fingerprint-checked copy (LIFE-406; downloads, with a long retry, only when no saved copy exists)
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "600"
      - id: bws_boards
        name: Load the credentials the board crawl uses from Bitwarden (exactly these 12, the same ids the hourly job loads; masked step outputs only, nothing exported job-wide; the job fails if retrieval fails, no fallback)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            d71bbaed-6a6c-49b5-8a1f-b4db015ecfda > LIFEOS_ACQ_DB_NAME
            00d82e0d-be10-4c8c-bdbe-b4db015ed389 > LIFEOS_ACQ_DB_PASSWORD
            9422b842-3bb0-4153-bb8d-b4db015ed746 > LIFEOS_ACQ_DB_USER
            6f1c86f6-c48f-4e77-b65d-b4db015edb15 > LIFEOS_ACQ_SSH_HOST
            b65dd2fc-2573-4bda-9e80-b4db015edec6 > LIFEOS_ACQ_SSH_KNOWN_HOSTS
            7ada9cea-8711-4b37-bef9-b4db015ee298 > LIFEOS_ACQ_SSH_PRIVATE_KEY
            6b3e12b9-1987-4073-bda2-b4db015ee653 > LIFEOS_ACQ_SSH_USER
            192db2d1-be66-4fca-b9b5-b4e900240507 > LIFEOS_ACQ_SSH_JUMP_KEY
            454e12df-637f-4f65-9ec1-b4e30052942f > TAILSCALE_OAUTH_CLIENT_ID
            e54f0a84-84c3-47d8-8b5b-b4e30052d6e9 > TAILSCALE_OAUTH_CLIENT_SECRET
            4d0c7449-ed0a-46c1-9c2c-b503015f8d54 > LIFEOS_ACQ_SSH_JUMP_HOST
            82efa413-6b9c-4c5c-b0d2-b503015f8e3d > LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS
      - name: Plain switches from Bitwarden (LIFE-704; read WITHOUT masking, validated; fixed fail modes - dry run, pipeline parked, port fails - names and codes only)
        uses: ./.github/actions/bws-plain
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          names: LIVE,V7_PIPELINE,V7_STORE_VIA,LIFEOS_ACQ_SSH_PORT
          live_mode: ${{ github.event_name == 'workflow_dispatch' && (inputs.live && 'true' || 'false') || 'follow' }}
      - id: pipeline
        name: Pipeline decision (the tick's rule - a scheduled window crawls only while the Bitwarden switch V7_PIPELINE is true; a manual run always crawls, a dry run unless live)
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$V7_PIPELINE" = true ]; then v=true; else v=false; fi
          echo "PIPELINE=$v" >> "$GITHUB_ENV"
          [ "$v" = true ] || { echo "boards: parked (V7_PIPELINE is not true); nothing read"; echo "### Employer boards: parked (V7_PIPELINE is not true); nothing read" >> "$GITHUB_STEP_SUMMARY"; }
      - name: LIFE-85 - join the tailnet as the ephemeral tag:v7-runner node (the store's Oracle fallback; the policy admits it only to Oracle TCP 22 and 47341; a failed join only means no fallback)
        if: ${{ env.PIPELINE == 'true' }}
        continue-on-error: true
        uses: ./.github/actions/tailscale
        with:
          oauth-client-id: ${{ steps.bws_boards.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_boards.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
      - id: crawl_window
        name: Employer boards, one window (up to 1,800 due boards, oldest due first; 35-minute step timeout; the receipt is printed and written to the job summary)
        if: ${{ env.PIPELINE == 'true' && needs.window.outputs.mode == 'window' }}
        timeout-minutes: 35
        env:
          BOARDS_MODE: window
          BOARDS_SLOT: ${{ needs.window.outputs.slot }}
          BOARDS_SLOT_CT: ${{ needs.window.outputs.slot_ct }}
          BOARDS_LATE_REASON: ${{ needs.window.outputs.late_reason }}
          BOARDS_DEADLINE_MINUTES: ${{ needs.window.outputs.deadline_minutes }}
          LIFEOS_ACQ_DB_NAME: ${{ steps.bws_boards.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: ${{ steps.bws_boards.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: ${{ steps.bws_boards.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: ${{ steps.bws_boards.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: ${{ steps.bws_boards.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_JUMP_HOST: ${{ steps.bws_boards.outputs.LIFEOS_ACQ_SSH_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: ${{ steps.bws_boards.outputs.LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ steps.bws_boards.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ steps.bws_boards.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: ${{ steps.bws_boards.outputs.LIFEOS_ACQ_SSH_USER }}
        run: python -m lifeos.run boards --limit ${{ needs.window.outputs.limit }} $([ "$LIVE" = "true" ] && echo --live)
      - id: crawl_catchup
        name: Employer boards, catch-up window (up to 2,900 due boards, leftovers first; 60-minute step timeout; the receipt is printed and written to the job summary)
        if: ${{ env.PIPELINE == 'true' && needs.window.outputs.mode == 'catchup' }}
        timeout-minutes: 60
        env:
          BOARDS_MODE: catchup
          BOARDS_SLOT: ${{ needs.window.outputs.slot }}
          BOARDS_SLOT_CT: ${{ needs.window.outputs.slot_ct }}
          BOARDS_LATE_REASON: ${{ needs.window.outputs.late_reason }}
          BOARDS_DEADLINE_MINUTES: ${{ needs.window.outputs.deadline_minutes }}
          LIFEOS_ACQ_DB_NAME: ${{ steps.bws_boards.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: ${{ steps.bws_boards.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: ${{ steps.bws_boards.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: ${{ steps.bws_boards.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: ${{ steps.bws_boards.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_JUMP_HOST: ${{ steps.bws_boards.outputs.LIFEOS_ACQ_SSH_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: ${{ steps.bws_boards.outputs.LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ steps.bws_boards.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ steps.bws_boards.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: ${{ steps.bws_boards.outputs.LIFEOS_ACQ_SSH_USER }}
        run: python -m lifeos.run boards --limit ${{ needs.window.outputs.limit }} $([ "$LIVE" = "true" ] && echo --live)
