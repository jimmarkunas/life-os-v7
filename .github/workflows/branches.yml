name: branches
# D244 (LIFE-81, Jim Oct 20 2026): repository hygiene. Two jobs, never both in one run.
#   archive: a merged pull request from this repository. Tags its head commit in life-os-automation as v7-archive/<branch>-pr<N> (read back),
#            then deletes the branch only when safe (unchanged since the merge, no other open PR, not on the keep-list). Runs main's code, not the PR's.
#   report:  after the weekly safety check (Mondays, D142; no schedule of its own: the guardrail allows no new scheduler), or on demand. Read-only on GitHub: stale branches on the run summary, and (live) V7's one owned callout
#            on the Weekly LIFE OS Review page, rewritten in place and read back. Nothing is closed or deleted.
on:
  pull_request:
    types: [closed]
  workflow_run:
    workflows: [safety]
    types: [completed]
  workflow_dispatch:
    inputs:
      live:
        description: "report: also write the Repository hygiene callout on the Weekly LIFE OS Review page (unticked = run summary only)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: life-os-v7-branches-${{ github.event.pull_request.number || 'report' }}     # one group per merged PR: GitHub keeps only one waiting run per group, so a shared group cancelled archives
  cancel-in-progress: false
jobs:
  archive:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write                       # deleting the merged branch in this repository only; the archive push uses its own narrow token
    steps:
      - name: Checkout the exact commit (own git fetch; the token is passed once and never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --tags origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout -q -B main origin/main   # main's code decides, never the pull request's
      - uses: ./.github/actions/python
      - name: Bitwarden helper from a saved, fingerprint-checked copy (LIFE-406; downloads, with a long retry, only when no saved copy exists)
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "60"
      - id: bws_archive
        name: Load the branch archive token from Bitwarden (LIFE-704; masked step output only, nothing exported job-wide; the job fails if retrieval fails, no fallback; nothing is archived or deleted then)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            c7b3ff1a-e0d9-456a-b8c6-b5030158f900 > V7_ARCHIVE_TOKEN
      - name: Archive the merged branch (tag in life-os-automation, read back) and delete it only when safe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          V7_ARCHIVE_TOKEN: ${{ steps.bws_archive.outputs.V7_ARCHIVE_TOKEN }}
        run: python -m lifeos.platform.branches archive
  report:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the exact commit (own git fetch; the token is passed once and never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - uses: ./.github/actions/python
      - name: Bitwarden helper from a saved, fingerprint-checked copy (LIFE-406; downloads, with a long retry, only when no saved copy exists)
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "200"
      - id: bws_report
        name: Load the Notion report token from Bitwarden (D244, exactly this 1; masked step outputs only; the job fails if retrieval fails, no fallback)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            53f47cb9-f6bb-4cde-87f4-b4db015ef928 > NOTION_JIRA_TOKEN
      - id: bws_runtime_config
        continue-on-error: true
        name: Runtime Configuration source ID from Bitwarden so the settings read uses the new source (LIFE-859; read only, an address not a secret; if it fails the step runs exactly as before)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            0053654c-d504-4453-87f7-b5080113d136 > V7_RUNTIME_CONFIG_SOURCE_ID
      - name: V7 settings page for the Weekly Review page address (LIFE-703; names and counts only; an unreadable page changes nothing)
        continue-on-error: true
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          NOTION_JIRA_TOKEN: ${{ steps.bws_report.outputs.NOTION_JIRA_TOKEN }}
          WEEKLY_REVIEW_PAGE_ID: ""
        run: python -m lifeos.platform.settings
      - name: Repository hygiene report (stale branches; run summary, and the Weekly Review callout when live)
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          WEEKLY_REVIEW_PAGE_ID: ${{ env.WEEKLY_REVIEW_PAGE_ID }}
          NOTION_JIRA_TOKEN: ${{ steps.bws_report.outputs.NOTION_JIRA_TOKEN }}
          LIVE: ${{ github.event_name == 'workflow_run' || inputs.live }}
        run: python -m lifeos.platform.branches report $([ "$LIVE" = "true" ] && echo --live)
