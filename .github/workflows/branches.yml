name: branches
# D244 (LIFE-81, Jim Oct 20 2026): repository hygiene. Two jobs, never both in one run.
#   archive: a closed pull request from this repository (D244, amended by the LIFE-1071 decision). Tags its head commit in this repository as archive/<branch>-pr<N> (read back),
#            then deletes the branch only when safe (unchanged since the close, no other open PR, not on the keep-list). Merged: always. Closed unmerged: only while .github/branch-deletes says on.
#            Runs main's code, not the PR's.
#   report:  after the weekly safety check (Mondays, D142; no schedule of its own: the guardrail allows no new scheduler), or on demand. Stale branches on the run summary, and (live) V7's one owned callout
#            on the Weekly LIFE OS Review page, rewritten in place and read back. Branches with no open PR idle 14+ days are tagged archive/<branch>-nopr, read back and deleted only while .github/branch-deletes says on;
#            while it says off the run summary lists what it WOULD delete and nothing is written.
on:
  pull_request:
    types: [closed]
  workflow_run:
    workflows: [safety]
    types: [completed]
  workflow_dispatch:
    inputs:
      live:
        description: "report: also write the Repository hygiene callout on the Weekly LIFE OS Review page (unticked = run summary only)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: life-os-v7-branches-${{ github.event.pull_request.number || 'report' }}     # one group per merged PR: GitHub keeps only one waiting run per group, so a shared group cancelled archives
  cancel-in-progress: false
jobs:
  archive:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write                       # the archive tag and the branch delete, this repository only, with the job's own token
    steps:
      - name: Checkout main (own fetch, token never stored; main's code decides, never the pull request's)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for try in 1 2 3; do git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin main && break; [ "$try" = 3 ] && exit 1; sleep $((try * 5)); done
          git checkout -q -B main FETCH_HEAD
      - uses: ./.github/actions/python
      - name: Archive the closed branch (tag archive/<branch>-pr<N> in this repository, read back) and delete it only when safe (a merged PR always; a PR closed unmerged only while .github/branch-deletes says on)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m lifeos.platform.branches archive
  report:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write                       # LIFE-1071: the idle-branch sweep tags and deletes in this repository only, and only while .github/branch-deletes says on
      pull-requests: read
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for try in 1 2 3; do git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA" && break; [ "$try" = 3 ] && exit 1; sleep $((try * 5)); done
          git checkout -q --detach FETCH_HEAD
      - uses: ./.github/actions/python
      - name: Bitwarden helper from a saved, fingerprint-checked copy (LIFE-406; downloads, with a long retry, only when no saved copy exists)
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "200"
      - id: bws_report
        name: Load the Notion report token from Bitwarden (D244, exactly this 1; masked step outputs only; the job fails if retrieval fails, no fallback)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            53f47cb9-f6bb-4cde-87f4-b4db015ef928 > NOTION_JIRA_TOKEN
      - id: doppler_bws_report
        if: ${{ steps.bws_report.outcome == 'success' }}
        continue-on-error: true       # LIFE-981: a Doppler problem is a fixed code in the log and never fails the job; the Bitwarden values above are the ones this job uses
        name: Doppler parity compare (LIFE-981; the same 1 name read from Doppler and compared with Bitwarden's value by hash; counts and a fixed code only; production keeps Bitwarden)
        uses: ./.github/actions/doppler-load
        with:
          token: ${{ secrets.DOPPLER_TOKEN }}
          names: NOTION_JIRA_TOKEN
          bitwarden: '{}'
      - id: bws_runtime_config
        continue-on-error: true
        name: Runtime Configuration source ID from Bitwarden so the settings read uses the new source (LIFE-859; read only, an address not a secret; if it fails the step runs exactly as before)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            0053654c-d504-4453-87f7-b5080113d136 > V7_RUNTIME_CONFIG_SOURCE_ID
      - id: doppler_bws_runtime_config
        if: ${{ steps.bws_runtime_config.outcome == 'success' }}
        continue-on-error: true       # LIFE-981: a Doppler problem is a fixed code in the log and never fails the job; the Bitwarden values above are the ones this job uses
        name: Doppler parity compare (LIFE-981; the same 1 name read from Doppler and compared with Bitwarden's value by hash; counts and a fixed code only; production keeps Bitwarden)
        uses: ./.github/actions/doppler-load
        with:
          token: ${{ secrets.DOPPLER_TOKEN }}
          names: V7_RUNTIME_CONFIG_SOURCE_ID
          bitwarden: '{}'
      - name: V7 settings page for the Weekly Review page address (LIFE-703; names and counts only; an unreadable page changes nothing)
        continue-on-error: true
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          NOTION_JIRA_TOKEN: ${{ steps.bws_report.outputs.NOTION_JIRA_TOKEN }}
          WEEKLY_REVIEW_PAGE_ID: ""
        run: python -m lifeos.platform.settings
      - name: Repository hygiene report (stale branches and the idle-branch sweep, a dry run listing what it would delete while .github/branch-deletes is off; run summary, and the Weekly Review callout when live)
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          WEEKLY_REVIEW_PAGE_ID: ${{ env.WEEKLY_REVIEW_PAGE_ID }}
          NOTION_JIRA_TOKEN: ${{ steps.bws_report.outputs.NOTION_JIRA_TOKEN }}
          LIVE: ${{ github.event_name == 'workflow_run' || inputs.live }}
        run: python -m lifeos.platform.branches report $([ "$LIVE" = "true" ] && echo --live)
