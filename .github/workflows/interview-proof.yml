name: interview-proof
# LIFE-78. Manual only: the synthetic Interview journey (lifeos/sources/interview_journey_proof.py) on real Notion, in a fresh sandbox under the QA Interview OS
# parent. Mail, Calendar and the Job Ledger are synthetic and in memory, so this job loads only the Interview Notion token: no mail read, no store, and it never
# waits behind the domain runs. The real Hiring Pipeline is never read or written. Counts, fixed codes and PASS/FAIL per step only.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type QA to create a fresh synthetic sandbox and run the journey in it"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: life-os-v7-interview-proof              # its own sandbox per run, so it shares no queue with the real Interview writer
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - uses: ./.github/actions/python
      - name: Bitwarden helper from a saved, fingerprint-checked copy (LIFE-406; downloads, with a long retry, only when no saved copy exists)
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "600"
      - id: bws_proof
        name: Load the migrated credentials from Bitwarden (EDGE-1.3, exactly these 1; masked step outputs only, nothing exported job-wide; the job fails if retrieval fails, no fallback)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            092b44ae-32cb-453b-8cc2-b4db015ef571 > NOTION_INTERVIEW_TOKEN
      - id: doppler_bws_proof
        if: ${{ steps.bws_proof.outcome == 'success' }}
        continue-on-error: true       # LIFE-981: a Doppler problem is a fixed code in the log and never fails the job; the Bitwarden values above are the ones this job uses
        name: Doppler parity compare (LIFE-981; the same 1 name read from Doppler and compared with Bitwarden's value by hash; counts and a fixed code only; production keeps Bitwarden)
        uses: ./.github/actions/doppler-load
        with:
          token: ${{ secrets.DOPPLER_TOKEN }}
          names: NOTION_INTERVIEW_TOKEN
          bitwarden: ${{ toJSON(steps.bws_proof.outputs) }}
      - id: bws_settings
        continue-on-error: true
        name: Notion token from Bitwarden for the V7 settings page
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            53f47cb9-f6bb-4cde-87f4-b4db015ef928 > NOTION_JIRA_TOKEN
            0053654c-d504-4453-87f7-b5080113d136 > V7_RUNTIME_CONFIG_SOURCE_ID
      - id: doppler_bws_settings
        if: ${{ steps.bws_settings.outcome == 'success' }}
        continue-on-error: true       # LIFE-981: a Doppler problem is a fixed code in the log and never fails the job; the Bitwarden values above are the ones this job uses
        name: Doppler parity compare (LIFE-981; the same 2 names read from Doppler and compared with Bitwarden's value by hash; counts and a fixed code only; production keeps Bitwarden)
        uses: ./.github/actions/doppler-load
        with:
          token: ${{ secrets.DOPPLER_TOKEN }}
          names: NOTION_JIRA_TOKEN,V7_RUNTIME_CONFIG_SOURCE_ID
          bitwarden: ${{ toJSON(steps.bws_settings.outputs) }}
      - name: Interview journey proof (synthetic mail, Calendar and Ledger; real Notion in a fresh QA sandbox only; refuses unless confirm is QA)
        env:
          NOTION_JIRA_TOKEN: ${{ steps.bws_settings.outputs.NOTION_JIRA_TOKEN }}
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_settings.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          LIFEOS_NOTION_IDS: ""
          INTERVIEW_JOURNEY_PROOF: ${{ inputs.confirm }}
          NOTION_INTERVIEW_TOKEN: ${{ steps.bws_proof.outputs.NOTION_INTERVIEW_TOKEN }}
        run: python -m lifeos.run interview --limit 20
