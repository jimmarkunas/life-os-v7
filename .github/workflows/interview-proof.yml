name: interview-proof
# LIFE-78. Manual only: the synthetic Interview journey (lifeos/sources/interview_journey_proof.py) on real Notion, in a fresh sandbox under the QA Interview OS
# parent. Mail, Calendar and the Job Ledger are synthetic and in memory, so this job loads only the Interview Notion token: no mail read, no store, and it never
# waits behind the domain runs. The real Hiring Pipeline is never read or written. Counts, fixed codes and PASS/FAIL per step only.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type QA to create a fresh synthetic sandbox and run the journey in it"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: life-os-v7-interview-proof              # its own sandbox per run, so it shares no queue with the real Interview writer
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python
      - name: Bitwarden helper from a saved, fingerprint-checked copy (LIFE-406; downloads, with a long retry, only when no saved copy exists)
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "600"
      - id: bws_proof
        name: Load the migrated credentials from Bitwarden (EDGE-1.3, exactly these 1; masked step outputs only, nothing exported job-wide; the job fails if retrieval fails, no fallback)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            092b44ae-32cb-453b-8cc2-b4db015ef571 > NOTION_INTERVIEW_TOKEN
      - name: Interview journey proof (synthetic mail, Calendar and Ledger; real Notion in a fresh QA sandbox only; refuses unless confirm is QA)
        env:
          LIFEOS_NOTION_IDS: ${{ secrets.LIFEOS_NOTION_IDS }}
          INTERVIEW_JOURNEY_PROOF: ${{ inputs.confirm }}
          NOTION_INTERVIEW_TOKEN: ${{ steps.bws_proof.outputs.NOTION_INTERVIEW_TOKEN }}
        run: python -m lifeos.run interview --limit 20
