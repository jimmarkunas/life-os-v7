name: domain-imessage
on:
  workflow_call:
    inputs:
      live:
        type: boolean
        default: false
      phase:
        type: string
        default: "none"
    secrets:
      DOPPLER_TOKEN:
        required: false
      LIFEOS_BWS_RUNTIME_TOKEN:
        required: false
permissions:
  contents: read
env:
  STAGE_TIMING_FILE: /tmp/stage-timing-domains.jsonl
jobs:
  imessage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for try in 1 2 3; do git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA" && break; [ "$try" = 3 ] && exit 1; sleep $((try * 5)); done
          git checkout -q --detach FETCH_HEAD
      - name: Python and the Bitwarden helper
        uses: ./.github/actions/job-start
        with:
          wait_seconds: "200"
      - id: bws_imessage
        name: Load the iMessage alert credentials from Bitwarden
        uses: &a1 ./.github/actions/bws-load
        with:
          access_token: &a2 ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          doppler_compare: &a3 ${{ secrets.DOPPLER_TOKEN }}
          set_env: false
          set: imessage
      - name: Plain switches from Bitwarden
        uses: ./.github/actions/bws-plain
        with:
          access_token: *a2
          names: ALERTS_ENABLED,ALERTS_MUTED_UNTIL,ALERT_SETTINGS,LIFEOS_ACQ_SSH_PORT,V7_STORE_VIA,LIVE
          live_mode: ${{ (github.event_name == 'workflow_run' || inputs.phase == 'tick') && 'follow' || github.event_name == 'workflow_dispatch' && (inputs.live && 'true' || 'false') || 'false' }}
      - name: Join the tailnet as an ephemeral tag:v7-runner node
        uses: ./.github/actions/tailscale
        with:
          oauth-client-id: ${{ steps.bws_imessage.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_imessage.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
      - id: imsg
        continue-on-error: true
        name: IMessage urgent alerts
        env:
          LIFEOS_ACQ_DB_NAME: &a4 ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: &a5 ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: &a6 ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: &a7 ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: &a8 ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_JUMP_HOST: &a9 ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_SSH_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: &a10 ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: &a11 ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: &a12 ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: &a13 ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_SSH_USER }}
          NTFY_TOPIC: &a14 ${{ steps.bws_imessage.outputs.NTFY_TOPIC }}
          IMESSAGE_ALERTS_HOST: &a15 ${{ steps.bws_imessage.outputs.IMESSAGE_ALERTS_HOST }}
        run: python -m lifeos.run imessage-alerts $([ "$LIVE" = "true" ] && echo --live)
      - name: iMessage alerts warning (does not fail the run)
        if: ${{ always() && steps.imsg.outcome == 'failure' }}
        run: echo "::warning title=iMessage alerts::the iMessage alert stage failed; no alert was lost (undelivered alerts stay queued)"
      - id: bws_runtime_config
        continue-on-error: true
        name: Runtime Configuration source ID from Bitwarden
        uses: *a1
        with:
          access_token: *a2
          doppler_compare: *a3
          set_env: false
          set: runtime-config
      - id: comms
        continue-on-error: true
        if: &a16 ${{ always() }}
        name: Communications card, Messages row
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: &a17 ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          IMESSAGE_ALERTS_HOST: *a15
          NOTION_JIRA_TOKEN: &a18 ${{ steps.bws_imessage.outputs.NOTION_JIRA_TOKEN }}
          FOLLOWUP_TODOIST_PERSONAL_TOKEN: ${{ steps.bws_imessage.outputs.FOLLOWUP_TODOIST_PERSONAL_TOKEN }}
          AMAZON_CARD_BLOCK_ID: ""
          BILLS_CARD_BLOCK_ID: ""
          CALENDAR_CARD_BLOCK_ID: ""
          JIRA_CARD_BLOCK_ID: ""
          HIRING_CARD_BLOCK_ID: ""
          DASHBOARD_TODOIST_BLOCK_ID: ""
        run: python -m lifeos.run imessage-comms --limit 0 $([ "$LIVE" = "true" ] && echo --live)
      - name: Communications card warning (does not fail the run)
        if: ${{ always() && steps.comms.outcome == 'failure' }}
        run: echo "::warning title=Communications card::the Messages row was not updated; the Daily Report keeps its previous update time"
      - id: oracle
        continue-on-error: true
        if: *a16
        name: System card (every tick; writes only when live)
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: *a17
          LIFEOS_ACQ_DB_NAME: *a4
          LIFEOS_ACQ_DB_PASSWORD: *a5
          LIFEOS_ACQ_DB_USER: *a6
          LIFEOS_ACQ_SSH_HOST: *a7
          LIFEOS_ACQ_SSH_JUMP_KEY: *a8
          LIFEOS_ACQ_SSH_JUMP_HOST: *a9
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: *a10
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: *a11
          LIFEOS_ACQ_SSH_PRIVATE_KEY: *a12
          LIFEOS_ACQ_SSH_USER: *a13
          NTFY_TOPIC: *a14
          IMESSAGE_ALERTS_HOST: *a15
          NOTION_JIRA_TOKEN: *a18
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LIFEOS_NOTION_IDS: ""
          AMAZON_CARD_BLOCK_ID: ""
          BILLS_CARD_BLOCK_ID: ""
          CALENDAR_CARD_BLOCK_ID: ""
          JIRA_CARD_BLOCK_ID: ""
          HIRING_CARD_BLOCK_ID: ""
        run: python -m lifeos.run oracle-card --limit 0 $([ "$LIVE" = "true" ] && echo --live)
      - name: System card warning (does not fail the run)
        if: ${{ always() && steps.oracle.outcome == 'failure' }}
        run: echo "::warning title=System card::the System card was not updated; it keeps its previous update time"
      - name: Fail the job if any stage step failed
        if: ${{ always() && contains(steps.*.outcome, 'failure') }}
        run: echo "::error title=imessage::a stage step failed in the imessage job (see the step marked failed above)"; exit 1
