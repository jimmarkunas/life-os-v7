          LIFEOS_ACQ_SSH_USER: ${{ steps.bws_jobright.outputs.LIFEOS_ACQ_SSH_USER || steps.bws_jobright_retry.outputs.LIFEOS_ACQ_SSH_USER }}
          NOTION_API_TOKEN: ${{ steps.bws_jobright.outputs.NOTION_API_TOKEN || steps.bws_jobright_retry.outputs.NOTION_API_TOKEN }}
          OPEN_JOBS_CONTACT: ${{ steps.bws_jobright.outputs.OPEN_JOBS_CONTACT || steps.bws_jobright_retry.outputs.OPEN_JOBS_CONTACT }}
          TINYFISH_API_KEY: ${{ steps.bws_jobright.outputs.TINYFISH_API_KEY || steps.bws_jobright_retry.outputs.TINYFISH_API_KEY }}
        run: |
