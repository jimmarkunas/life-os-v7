name: hourly
run-name: ${{ (github.event_name == 'schedule' || inputs.tick) && 'tick' || 'manual' }}
on:
  schedule:
    - cron: "7 * * * *"
    - cron: "27 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      interview_probe:
        description: "Interview OS shape probe (counts only, never writes): reads the Hiring Pipeline page with the separate Interview token"
        type: boolean
        default: false
      interview:
        description: "Interview OS stage (dry run unless Actually move mail is ticked); a failure is a warning and never fails the Jobs run"
        type: boolean
        default: false
      interview_acceptance:
        description: "Interview OS private acceptance (manual only): one case from the INTERVIEW_ACCEPTANCE_JSON secret; dry run unless Actually move mail is ticked"
        type: boolean
        default: false
      discover:
        description: "Scale-Up discovery: web search for jobs at sponsors with no job board; unresolved leads are never published (saves only when live)"
        type: boolean
        default: false
      tick:
        description: "Scheduler tick - sent by the outside timer (D31); runs the full pipeline exactly like a scheduled run. Do not tick by hand."
        type: boolean
        default: false
      live:
        description: "Actually move mail (false = dry run)"
        type: boolean
        default: false
      check_store:
        description: "Also run the Hostinger connectivity/schema check (Step 2)"
        type: boolean
        default: false
      reconcile:
        description: "Repair pass: recover cards from recent Processed mail missing in the store (needs live)"
        type: boolean
        default: false
      resolve_jobright:
        description: "Resolve NEW Jobright jobs to final apply links and save them (saves only when live)"
        type: boolean
        default: false
      resolve_linkedin:
        description: "Resolve NEW LinkedIn jobs (guest page, then employer ATS board match); saves only when live"
        type: boolean
        default: false
      enrich:
        description: "ENRICH - read final pages of RESOLVED jobs: description, posting date, liveness (saves only when live)"
        type: boolean
        default: false
      web:
        description: "US Remote web acquisition: poll due ATS boards, classify, admit new postings (counts only unless live)"
        type: boolean
        default: false
      web_scale_up:
        description: "UK Scale-Up web acquisition (also scheduled): poll due sponsor boards; counts only unless live"
        type: boolean
        default: false
      sponsors:
        description: "Load the UK sponsor register (Skilled Worker evidence): counts only unless live; forces a refresh"
        type: boolean
        default: false
      probe:
        description: "Shape probe (counts only): Open Jobs feed, Teamtailor boards, Dice job pages. Writes nothing"
        type: boolean
        default: false
      report:
        description: "Report (read-only; never moves mail): type funnel for the per-provider funnel and canary (counts only), or a company or source name (3+ letters) for a private Notion page of every job of it and why it was or was not published (that page is written only when live)"
        type: string
        default: ""
      fit:
        description: "Score jobs with the Fit model: counts only unless live (also reports the semantic shadow counts)"
        type: boolean
        default: false
      fit_all:
        description: "With Fit: also re-score jobs already published (calibration; counts only unless live)"
        type: boolean
        default: false
      audit:
        description: "Demote READY/PUBLISHED jobs failing the quality guards; trash their Notion pages (saves only when live)"
        type: boolean
        default: false
      publish:
        description: "Publish READY jobs to the Notion Job Ledger (dry run counts only unless live)"
        type: boolean
        default: false
      maintenance:
        description: "Run Last Seen sync and the retention purge now (saves only when live)"
        type: boolean
        default: false
      finalize:
        description: "FINALIZE - label newsletter mail Done when every job in it has an outcome (also runs with Publish; saves only when live)"
        type: boolean
        default: false
      quick:
        description: "Quick proof run (LIFE-76, D208): runs exactly what a tick runs (lifeos.jobs.tick in the finish job) with small caps (publish 10, board backfill 50 when its switch in lifeos/platform/switches.json is on), so the tick path is proven by hand first; the lane jobs do not run; ticks never set it"
        type: boolean
        default: false
      cloud_backlog:
        description: "Cloud Fit backlog (LIFE-41 D219, manual only): ask at most this many jobs through Oracle fit1, V7_CLOUD_FIT_PARALLEL at a time (unset: one), never more than the V7_CLOUD_FIT_BACKLOG_MAX variable (Jim's approved ceiling; unset = nothing asked). Empty or 0: off"
        type: string
        default: ""
env:
  NOTION_JOB_LEDGER_DATA_SOURCE_ID: ""
  V7_FIT_GATE: ""
  HIRING_PIPELINE_PAGE_ID: ""
permissions:
  contents: read
concurrency:
  group: life-os-v7-hourly-${{ (github.event_name == 'schedule' || inputs.tick) && 'tick-b' || 'manual' }}
  cancel-in-progress: false
jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
      issues: write
    outputs:
      pipeline: ${{ steps.pipeline.outputs.value }}
      extract: ${{ steps.extract.outcome }}
      sweep: ${{ steps.sweep.outcome }}
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for try in 1 2 3; do git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA" && break; [ "$try" = 3 ] && exit 1; sleep $((try * 5)); done
          git checkout -q --detach FETCH_HEAD
      - name: Cloud Fit backlog runs alone
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cloud_backlog != '' && inputs.cloud_backlog != '0' && (inputs.interview_probe || inputs.interview || inputs.interview_acceptance || inputs.discover || inputs.tick || inputs.check_store || inputs.reconcile || inputs.resolve_jobright || inputs.resolve_linkedin || inputs.enrich || inputs.web || inputs.web_scale_up || inputs.sponsors || inputs.probe || inputs.fit || inputs.fit_all || inputs.audit || inputs.publish || inputs.maintenance || inputs.finalize || inputs.quick || inputs.report != '') }}
        run: |
          echo "CLOUD_BACKLOG_COMBINED_INPUTS: a cloud_backlog dispatch runs alone (only live may be set with it); nothing ran"
          exit 1
      - name: Bitwarden helper from a saved, fingerprint-checked copy
        uses: &a1 ./.github/actions/bws-helper
        with:
          wait_seconds: "600"
      - id: bws_prep
        name: &a2 Load the migrated credentials from Bitwarden
        uses: &a3 ./.github/actions/bws-load
        with:
          access_token: &a4 ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          doppler_compare: &a5 ${{ secrets.DOPPLER_TOKEN }}
          set_env: false
          set: hourly-prep
      - name: Plain switches from Bitwarden
        uses: &a6 ./.github/actions/bws-plain
        with:
          access_token: *a4
          names: ALERTS_ENABLED,ALERTS_MUTED_UNTIL,ALERT_SETTINGS,LIFEOS_ACQ_SSH_PORT,V7_STORE_VIA,V7_PIPELINE,GATE_MIN_GAP_MINUTES,LIVE
          live_mode: &a7 ${{ github.event_name == 'workflow_dispatch' && !inputs.tick && (inputs.live && 'true' || 'false') || 'follow' }}
      - id: pipeline
        name: Pipeline decision
        run: |
          tick=${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tick)) && 'true' || 'false' }}
          if [ "$tick" = true ] && [ "$V7_PIPELINE" = true ]; then v=true; else v=false; fi
          echo "PIPELINE=$v" >> "$GITHUB_ENV"
          echo "value=$v" >> "$GITHUB_OUTPUT"
      - name: Join the tailnet as the ephemeral tag:v7-runner node
        continue-on-error: true
        uses: &a8 ./.github/actions/tailscale
        with:
          oauth-client-id: ${{ steps.bws_prep.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_prep.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
      - name: Gate - skip a run when another tick started recently
        env:
          GITHUB_TOKEN: &a9 ${{ github.token }}
          TICK: ${{ inputs.tick }}
          GMAIL_OAUTH_CLIENT_SECRET: &a10 ${{ steps.bws_prep.outputs.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_CLIENT_ID: &a11 ${{ steps.bws_prep.outputs.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_REFRESH_TOKEN: &a12 ${{ steps.bws_prep.outputs.GMAIL_OAUTH_REFRESH_TOKEN }}
          LIFEOS_ACQ_DB_NAME: &a13 ${{ steps.bws_prep.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: &a14 ${{ steps.bws_prep.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: &a15 ${{ steps.bws_prep.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: &a16 ${{ steps.bws_prep.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: &a17 ${{ steps.bws_prep.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_JUMP_HOST: &a18 ${{ steps.bws_prep.outputs.LIFEOS_ACQ_SSH_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: &a19 ${{ steps.bws_prep.outputs.LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: &a20 ${{ steps.bws_prep.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: &a21 ${{ steps.bws_prep.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: &a22 ${{ steps.bws_prep.outputs.LIFEOS_ACQ_SSH_USER }}
          NOTION_API_TOKEN: &a23 ${{ steps.bws_prep.outputs.NOTION_API_TOKEN }}
        run: python3 -m lifeos.platform.gate
      - name: Start the early domains run now
        if: ${{ (github.event_name == 'schedule' || inputs.tick) && github.run_attempt == 1 && !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: *a9
        run: |
          status=0
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/domains.yml/dispatches" -f ref="${GITHUB_REF_NAME}" -f "inputs[phase]=tick" -f "inputs[tick_run]=${GITHUB_RUN_ID}" || status=$?
          # LIFE-957: GitHub's own cron ran the AI Capacity card (capacity-card.yml, minute 55) only every 5 to 10 hours, so the card went stale. The tick, which the Oracle ticker starts every hour, starts the card whenever its last run is 40 minutes or more old; a card the cron already started leaves this a no-op. A failure here costs only a stale card until the next tick.
          last=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/capacity-card.yml/runs?per_page=1" --jq '.workflow_runs[0].created_at // ""' 2>/dev/null || true)
          age=$(python3 -c 'import sys, datetime as d; t = sys.argv[1]; print(int((d.datetime.now(d.timezone.utc) - d.datetime.fromisoformat(t.replace("Z", "+00:00"))).total_seconds()) if t else 99999)' "$last" 2>/dev/null || echo 99999)
          if [ "$age" -ge 2400 ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/capacity-card.yml/dispatches" -f ref="${GITHUB_REF_NAME}" -f "inputs[tick]=true" || true
          fi
          exit $status
      - uses: &a24 ./.github/actions/python
      - id: sweep
        continue-on-error: true
        name: Stage 1 - sweep
        if: &a25 ${{ !(github.event_name == 'workflow_dispatch' && inputs.cloud_backlog != '' && inputs.cloud_backlog != '0') }}
        env: &m1
          GMAIL_OAUTH_CLIENT_SECRET: *a10
          GMAIL_OAUTH_CLIENT_ID: *a11
          GMAIL_OAUTH_REFRESH_TOKEN: *a12
          LIFEOS_ACQ_DB_NAME: *a13
          LIFEOS_ACQ_DB_PASSWORD: *a14
          LIFEOS_ACQ_DB_USER: *a15
          LIFEOS_ACQ_SSH_HOST: *a16
          LIFEOS_ACQ_SSH_JUMP_KEY: *a17
          LIFEOS_ACQ_SSH_JUMP_HOST: *a18
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: *a19
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: *a20
          LIFEOS_ACQ_SSH_PRIVATE_KEY: *a21
          LIFEOS_ACQ_SSH_USER: *a22
          NOTION_API_TOKEN: *a23
        run: python -m lifeos.sources.newsletters.sweep $([ "$LIVE" = "true" ] && echo --live)
      - name: Step 3b - reconcile (repair, manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reconcile && inputs.live }}
        env: *m1
        run: python -m lifeos.sources.newsletters.ingest --reconcile --live --limit 300
      - name: Step 2 - store check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_store }}
        env: *m1
        run: python -m lifeos.jobs.store
      - id: extract
        continue-on-error: true
        name: Stage - extract cards from mail
        if: ${{ (github.event_name == 'workflow_dispatch' || env.PIPELINE == 'true') && !(github.event_name == 'workflow_dispatch' && inputs.cloud_backlog != '' && inputs.cloud_backlog != '0') }}
        env: *m1
        run: python -m lifeos.sources.newsletters.ingest $([ "$LIVE" = "true" ] && echo --live)

  unit-tests:
    if: *a25
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for try in 1 2 3; do git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA" && break; [ "$try" = 3 ] && exit 1; sleep $((try * 5)); done
          git checkout -q --detach FETCH_HEAD
      - uses: *a24
      - name: Unit-test gate
        id: testgate
        env:
          GITHUB_TOKEN: *a9
        run: python -m lifeos.platform.testgate
      - name: Test-only dependency
        if: &a26 ${{ steps.testgate.outputs.skip != 'true' }}
        run: pip install --require-hashes -r requirements-yaml.lock || echo "pyyaml unavailable; the workflow contract tests will skip"
      - name: Unit tests
        if: *a26
        run: python -m unittest discover -s tests -t . -v
  jobright:
    needs: prep
    if: &a27 ${{ always() && needs.prep.result == 'success' && github.event_name == 'workflow_dispatch' && !inputs.tick && !inputs.quick && (inputs.cloud_backlog == '' || inputs.cloud_backlog == '0') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for try in 1 2 3; do git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA" && break; [ "$try" = 3 ] && exit 1; sleep $((try * 5)); done
          git checkout -q --detach FETCH_HEAD
      - name: Python and the Bitwarden helper
        uses: &a28 ./.github/actions/job-start
        with:
          wait_seconds: "600"
      - id: bws_jobright
        name: *a2
        uses: *a3
        with: &m2
          access_token: *a4
          doppler_compare: *a5
          set_env: false
          set: hourly-jobright
      - name: Plain switches from Bitwarden
        uses: *a6
        with: &m3
          access_token: *a4
          names: ALERTS_ENABLED,ALERTS_MUTED_UNTIL,ALERT_SETTINGS,LIFEOS_ACQ_SSH_PORT,V7_STORE_VIA,LIVE
          live_mode: *a7
      - name: Join the tailnet as the ephemeral tag:v7-runner node
        continue-on-error: true
        uses: *a8
        with:
          oauth-client-id: ${{ steps.bws_jobright.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_jobright.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
      - id: jobright_browser
        name: Browser install for the Jobright resolver
        if: &a29 ${{ needs.prep.outputs.pipeline == 'true' || (github.event_name == 'workflow_dispatch' && inputs.resolve_jobright) }}
        uses: &a30 ./.github/actions/browser
        with:
          cache_bust: life576a
      - id: bws_runtime_config
        continue-on-error: true
        name: &a31 Runtime Configuration source ID from Bitwarden
        uses: *a3
        with: &m4
          access_token: *a4
          doppler_compare: *a5
          set_env: false
          set: runtime-config
      - id: jobright
        name: Step 5 - resolve Jobright jobs (free Chromium)
        if: *a29
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: &a32 ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          FIT_PROFILE_EXTRA_JSON: ${{ steps.bws_jobright.outputs.FIT_PROFILE_EXTRA_JSON }}
          FIT_PROFILE_JSON: ${{ steps.bws_jobright.outputs.FIT_PROFILE_JSON }}
          JOBRIGHT_EMAIL: ${{ steps.bws_jobright.outputs.JOBRIGHT_EMAIL }}
          JOBRIGHT_PASSWORD: ${{ steps.bws_jobright.outputs.JOBRIGHT_PASSWORD }}
          LIFEOS_ACQ_DB_NAME: ${{ steps.bws_jobright.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: ${{ steps.bws_jobright.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: ${{ steps.bws_jobright.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: ${{ steps.bws_jobright.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: ${{ steps.bws_jobright.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_JUMP_HOST: ${{ steps.bws_jobright.outputs.LIFEOS_ACQ_SSH_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: ${{ steps.bws_jobright.outputs.LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ steps.bws_jobright.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ steps.bws_jobright.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: ${{ steps.bws_jobright.outputs.LIFEOS_ACQ_SSH_USER }}
          NOTION_API_TOKEN: ${{ steps.bws_jobright.outputs.NOTION_API_TOKEN }}
          TINYFISH_API_KEY: ${{ steps.bws_jobright.outputs.TINYFISH_API_KEY }}
        run: |
          python -m lifeos.run resolve-jobright --limit 40 $([ "$LIVE" = "true" ] && echo --live)

  linkedin:
    needs: prep
    if: *a27
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for try in 1 2 3; do git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA" && break; [ "$try" = 3 ] && exit 1; sleep $((try * 5)); done
          git checkout -q --detach FETCH_HEAD
      - name: Python and the Bitwarden helper
        uses: *a28
        with:
          wait_seconds: "600"
      - id: bws_linkedin
        name: *a2
        uses: *a3
        with: *m2
      - name: Plain switches from Bitwarden
        uses: *a6
        with: *m3
      - name: Join the tailnet as the ephemeral tag:v7-runner node
        continue-on-error: true
        uses: *a8
        with:
          oauth-client-id: ${{ steps.bws_linkedin.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_linkedin.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
      - id: bws_runtime_config
        continue-on-error: true
        name: *a31
        uses: *a3
        with: *m4
      - id: linkedin
        name: Step 5 - resolve LinkedIn jobs (no login, no browser)
        if: &a33 ${{ needs.prep.outputs.pipeline == 'true' || (github.event_name == 'workflow_dispatch' && inputs.resolve_linkedin) }}
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: *a32
          FIT_PROFILE_EXTRA_JSON: ${{ steps.bws_linkedin.outputs.FIT_PROFILE_EXTRA_JSON }}
          FIT_PROFILE_JSON: ${{ steps.bws_linkedin.outputs.FIT_PROFILE_JSON }}
          JOBRIGHT_EMAIL: ${{ steps.bws_linkedin.outputs.JOBRIGHT_EMAIL }}
          JOBRIGHT_PASSWORD: ${{ steps.bws_linkedin.outputs.JOBRIGHT_PASSWORD }}
          LIFEOS_ACQ_DB_NAME: &a34 ${{ steps.bws_linkedin.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: &a35 ${{ steps.bws_linkedin.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: &a36 ${{ steps.bws_linkedin.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: &a37 ${{ steps.bws_linkedin.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: &a38 ${{ steps.bws_linkedin.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_JUMP_HOST: &a39 ${{ steps.bws_linkedin.outputs.LIFEOS_ACQ_SSH_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: &a40 ${{ steps.bws_linkedin.outputs.LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: &a41 ${{ steps.bws_linkedin.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: &a42 ${{ steps.bws_linkedin.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: &a43 ${{ steps.bws_linkedin.outputs.LIFEOS_ACQ_SSH_USER }}
          NOTION_API_TOKEN: ${{ steps.bws_linkedin.outputs.NOTION_API_TOKEN }}
          TINYFISH_API_KEY: ${{ steps.bws_linkedin.outputs.TINYFISH_API_KEY }}
        run: python -m lifeos.run resolve-linkedin --limit 150 $([ "$LIVE" = "true" ] && echo --live)
      - id: linkedin_search
        continue-on-error: true
        timeout-minutes: 4
        name: Step 5a - LinkedIn job search
        if: *a33
        env:
          LIFEOS_ACQ_DB_NAME: *a34
          LIFEOS_ACQ_DB_PASSWORD: *a35
          LIFEOS_ACQ_DB_USER: *a36
          LIFEOS_ACQ_SSH_HOST: *a37
          LIFEOS_ACQ_SSH_JUMP_KEY: *a38
          LIFEOS_ACQ_SSH_JUMP_HOST: *a39
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: *a40
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: *a41
          LIFEOS_ACQ_SSH_PRIVATE_KEY: *a42
          LIFEOS_ACQ_SSH_USER: *a43
        run: python -m lifeos.run linkedin-search --limit 40 $([ "$LIVE" = "true" ] && echo --live)

  lensa:
    needs: prep
    if: *a27
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for try in 1 2 3; do git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA" && break; [ "$try" = 3 ] && exit 1; sleep $((try * 5)); done
          git checkout -q --detach FETCH_HEAD
      - name: Python and the Bitwarden helper
        uses: *a28
        with:
          wait_seconds: "600"
      - id: bws_lensa
        name: *a2
        uses: *a3
