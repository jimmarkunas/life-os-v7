name: hourly
on:
  schedule:
    - cron: "7 * * * *"          # hourly; GitHub may delay by several minutes
  workflow_dispatch:
    inputs:
      live:
        description: "Actually move mail (false = dry run)"
        type: boolean
        default: false
      check_store:
        description: "Also run the Hostinger connectivity/schema check (Step 2)"
        type: boolean
        default: false
      reconcile:
        description: "Repair pass: recover cards from recent Processed mail missing in the store (needs live)"
        type: boolean
        default: false
      probe:
        description: "Read-only probe of the resolve chain on a sample (counts only)"
        type: boolean
        default: false
      docs_url:
        description: "Print text of a public docs page (docs.tinyfish.ai only) for reading API shapes"
        type: string
        default: ""
      probe_tinyfish:
        description: "Read-only probe of TinyFish Fetch on a sample (counts only)"
        type: boolean
        default: false
      probe_linkedin:
        description: "Free plain-HTTP probe of the no-login LinkedIn apply-link method (counts only)"
        type: boolean
        default: false
      probe_jobright:
        description: "Free Chromium login + Apply click on a Jobright sample (counts only)"
        type: boolean
        default: false
      probe_lensa:
        description: "Free Chromium follow of Lensa job links (counts only)"
        type: boolean
        default: false
      resolve_jobright:
        description: "Resolve NEW Jobright jobs to final apply links and save them (saves only when live)"
        type: boolean
        default: false
      probe_linkedin_browser:
        description: "Free Chromium, no-login LinkedIn apply chain on a sample (counts only)"
        type: boolean
        default: false
      resolve_linkedin:
        description: "Resolve NEW LinkedIn jobs (guest page, then employer ATS board match); saves only when live"
        type: boolean
        default: false
      enrich:
        description: "Read final pages of RESOLVED jobs: description, posting date, liveness (saves only when live)"
        type: boolean
        default: false
      resolve_lensa:
        description: "Resolve NEW Lensa jobs via ATS board match + free Search (saves only when live)"
        type: boolean
        default: false
      publish:
        description: "Publish READY jobs to the Notion Job Ledger (dry run counts only unless live)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: life-os-v7-hourly
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PIPELINE: ${{ github.event_name == 'schedule' && vars.V7_PIPELINE == 'true' && 'true' || 'false' }}
      GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
      GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
      GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
      TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      NOTION_JOB_LEDGER_DATA_SOURCE_ID: ${{ secrets.NOTION_JOB_LEDGER_DATA_SOURCE_ID }}
      JOBRIGHT_EMAIL: ${{ secrets.JOBRIGHT_EMAIL }}
      JOBRIGHT_PASSWORD: ${{ secrets.JOBRIGHT_PASSWORD }}
      LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ secrets.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
      LIFEOS_ACQ_DB_PASSWORD: ${{ secrets.LIFEOS_ACQ_DB_PASSWORD }}
      LIFEOS_ACQ_SSH_HOST: ${{ secrets.LIFEOS_ACQ_SSH_HOST }}
      LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
      LIFEOS_ACQ_SSH_USER: ${{ secrets.LIFEOS_ACQ_SSH_USER }}
      LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ secrets.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
      LIFEOS_ACQ_DB_NAME: ${{ secrets.LIFEOS_ACQ_DB_NAME }}
      LIFEOS_ACQ_DB_USER: ${{ secrets.LIFEOS_ACQ_DB_USER }}
      # Manual runs obey the 'live' input ONLY. Scheduled runs are live only when repo variable V7_LIVE=true.
      LIVE: ${{ github.event_name == 'workflow_dispatch' && (inputs.live && 'true' || 'false') || (vars.V7_LIVE == 'true' && 'true' || 'false') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Stage 1 - sweep
        run: python -m pipeline.sweep $([ "$LIVE" = "true" ] && echo --live)
      - name: Step 3b - reconcile (repair, manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reconcile && inputs.live }}
        run: python -m pipeline.extract --reconcile --live --limit 300
      - name: Step 2 - store check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_store }}
        run: python -m pipeline.store
      - name: Step 5 - resolve probe (read-only, counts only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        run: python -m pipeline.resolve --probe --per-source 12
      - name: Print public API docs (docs.tinyfish.ai only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.docs_url != '' }}
        env:
          DOCS_URL: ${{ inputs.docs_url }}
        run: python -m pipeline.docs_print
      - name: Step 5 - TinyFish fetch probe (read-only, counts only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_tinyfish }}
        run: python -m pipeline.resolve --probe-tinyfish --per-source 10
      - name: Step 5 - LinkedIn no-login probe (free, throttled, counts only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_linkedin }}
        run: python -m pipeline.resolve --probe-linkedin --per-source 20
      - name: Step 5 - Jobright browser probe (free Chromium, counts only)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.probe_jobright || inputs.probe_lensa || inputs.probe_linkedin_browser) }}
        run: |
          python -m playwright install --with-deps chromium
          [ "${{ inputs.probe_jobright }}" = "true" ] && python -m pipeline.resolve --probe-jobright --per-source 8 || true
          [ "${{ inputs.probe_lensa }}" = "true" ] && python -m pipeline.resolve --probe-lensa --per-source 8 || true
          [ "${{ inputs.probe_linkedin_browser }}" = "true" ] && python -m pipeline.resolve --probe-linkedin-browser --per-source 10 || true
      - id: extract
        continue-on-error: true
        name: Stage - extract cards from mail
        if: ${{ github.event_name == 'workflow_dispatch' || env.PIPELINE == 'true' }}
        run: python -m pipeline.extract $([ "$LIVE" = "true" ] && echo --live)
      - id: jobright
        continue-on-error: true
        name: Step 5 - resolve Jobright jobs (free Chromium, saves when live)
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.resolve_jobright) }}
        run: |
          python -m playwright install --with-deps chromium
          python -m pipeline.resolve --resolve jobright --limit 40 $([ "$LIVE" = "true" ] && echo --live)
      - id: linkedin
        continue-on-error: true
        name: Step 5 - resolve LinkedIn jobs (no login, no browser)
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.resolve_linkedin) }}
        run: python -m pipeline.resolve --resolve linkedin --limit 150 $([ "$LIVE" = "true" ] && echo --live)
      - id: lensa
        continue-on-error: true
        name: Step 5 - resolve Lensa jobs (board match + search, no Lensa page access)
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.resolve_lensa) }}
        run: python -m pipeline.resolve --resolve lensa --limit 90 $([ "$LIVE" = "true" ] && echo --live)
      - id: enrich
        continue-on-error: true
        name: "Step 6 - enrich RESOLVED jobs (final page - JD, date, liveness)"
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.enrich) }}
        run: python -m pipeline.resolve --enrich --limit 150 $([ "$LIVE" = "true" ] && echo --live)
      - id: publish
        continue-on-error: true
        name: Step 7 - publish READY jobs to Notion
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: python -m pipeline.resolve --publish --limit 60 $([ "$LIVE" = "true" ] && echo --live)
      - name: Stage failures fail the run (other stages still ran)
        if: ${{ always() }}
        run: |
          failed=""
          for pair in extract=${{ steps.extract.outcome }} jobright=${{ steps.jobright.outcome }} linkedin=${{ steps.linkedin.outcome }} lensa=${{ steps.lensa.outcome }} enrich=${{ steps.enrich.outcome }} publish=${{ steps.publish.outcome }}; do
            [ "${pair#*=}" = "failure" ] && failed="$failed ${pair%=*}"
          done
          if [ -n "$failed" ]; then echo "FAILED STAGES:$failed"; exit 1; fi
