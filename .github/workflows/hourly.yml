name: hourly
on:
  schedule:
    - cron: "7 * * * *"          # hourly; GitHub may delay by several minutes
  workflow_dispatch:
    inputs:
      live:
        description: "Actually move mail (false = dry run)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: life-os-v7-hourly
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
      GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
      GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
      # Scheduled runs are live only after you set repo variable V7_LIVE=true.
      LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.live || vars.V7_LIVE == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Stage 1 - sweep
        run: python -m pipeline.sweep $([ "$LIVE" = "true" ] && echo --live)
