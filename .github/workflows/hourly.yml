name: hourly
run-name: ${{ (github.event_name == 'schedule' || inputs.tick) && 'tick' || 'manual' }}
on:
  schedule:
    - cron: "7 * * * *"
    - cron: "27 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      interview_probe:
        description: "Interview OS shape probe (counts only, never writes): reads the Hiring Pipeline page with the separate Interview token"
        type: boolean
        default: false
      interview:
        description: "Interview OS stage (dry run unless Actually move mail is ticked); a failure is a warning and never fails the Jobs run"
        type: boolean
        default: false
      interview_acceptance:
        description: "Interview OS private acceptance (manual only): one case from the INTERVIEW_ACCEPTANCE_JSON secret; dry run unless Actually move mail is ticked"
        type: boolean
        default: false
      discover:
        description: "Scale-Up discovery: web search for jobs at sponsors with no job board; unresolved leads are never published (saves only when live)"
        type: boolean
        default: false
      tick:
        description: "Scheduler tick - sent by the outside timer (D31); runs the full pipeline exactly like a scheduled run. Do not tick by hand."
        type: boolean
        default: false
      live:
        description: "Actually move mail (false = dry run)"
        type: boolean
        default: false
      check_store:
        description: "Also run the Hostinger connectivity/schema check (Step 2)"
        type: boolean
        default: false
      reconcile:
        description: "Repair pass: recover cards from recent Processed mail missing in the store (needs live)"
        type: boolean
        default: false
      resolve_jobright:
        description: "Resolve NEW Jobright jobs to final apply links and save them (saves only when live)"
        type: boolean
        default: false
      resolve_linkedin:
        description: "Resolve NEW LinkedIn jobs (guest page, then employer ATS board match); saves only when live"
        type: boolean
        default: false
      enrich:
        description: "ENRICH - read final pages of RESOLVED jobs: description, posting date, liveness (saves only when live)"
        type: boolean
        default: false
      web:
        description: "US Remote web acquisition: poll due ATS boards, classify, admit new postings (counts only unless live)"
        type: boolean
        default: false
      web_scale_up:
        description: "UK Scale-Up web acquisition (also scheduled): poll due sponsor boards; counts only unless live"
        type: boolean
        default: false
      sponsors:
        description: "Load the UK sponsor register (Skilled Worker evidence): counts only unless live; forces a refresh"
        type: boolean
        default: false
      probe:
        description: "Shape probe (counts only): Open Jobs feed, Teamtailor boards, Dice job pages. Writes nothing"
        type: boolean
        default: false
      report:
        description: "Report (read-only; never moves mail): type funnel for the per-provider funnel and canary (counts only), or a company or source name (3+ letters) for a private Notion page of every job of it and why it was or was not published (that page is written only when live)"
        type: string
        default: ""
      fit:
        description: "Score jobs with the Fit model: counts only unless live (also reports the semantic shadow counts)"
        type: boolean
        default: false
      fit_all:
        description: "With Fit: also re-score jobs already published (calibration; counts only unless live)"
        type: boolean
        default: false
      audit:
        description: "Demote READY/PUBLISHED jobs failing the quality guards; trash their Notion pages (saves only when live)"
        type: boolean
        default: false
      publish:
        description: "Publish READY jobs to the Notion Job Ledger (dry run counts only unless live)"
        type: boolean
        default: false
      maintenance:
        description: "Run Last Seen sync and the retention purge now (saves only when live)"
        type: boolean
        default: false
      finalize:
        description: "FINALIZE - label newsletter mail Done when every job in it has an outcome (also runs with Publish; saves only when live)"
        type: boolean
        default: false
      quick:
        description: "Quick proof run (LIFE-76, D208): runs exactly what a tick runs (lifeos.jobs.tick in the finish job) with small caps (publish 10, board backfill 50 when its switch in lifeos/platform/switches.json is on), so the tick path is proven by hand first; the lane jobs do not run; ticks never set it"
        type: boolean
        default: false
      cloud_backlog:
        description: "Cloud Fit backlog (LIFE-41 D219, manual only): ask at most this many jobs through Oracle fit1, V7_CLOUD_FIT_PARALLEL at a time (unset: one), never more than the V7_CLOUD_FIT_BACKLOG_MAX variable (Jim's approved ceiling; unset = nothing asked). Empty or 0: off"
        type: string
        default: ""
env:
  NOTION_JOB_LEDGER_DATA_SOURCE_ID: ""
  V7_FIT_GATE: ""
  HIRING_PIPELINE_PAGE_ID: ""
permissions:
  contents: read
concurrency:
  group: life-os-v7-hourly-${{ (github.event_name == 'schedule' || inputs.tick) && 'tick-b' || 'manual' }}
  cancel-in-progress: false
jobs:
  prep:
    permissions:
      contents: read
      actions: write
      issues: write
    uses: ./.github/workflows/tick-prep.yml
    with:
      audit: &a1 ${{ inputs.audit || false }}
      check_store: ${{ inputs.check_store || false }}
      cloud_backlog: &a2 ${{ inputs.cloud_backlog || '' }}
      discover: &a3 ${{ inputs.discover || false }}
      enrich: &a4 ${{ inputs.enrich || false }}
      finalize: &a5 ${{ inputs.finalize || false }}
      fit: &a6 ${{ inputs.fit || false }}
      fit_all: &a7 ${{ inputs.fit_all || false }}
      interview: &a8 ${{ inputs.interview || false }}
      interview_acceptance: &a9 ${{ inputs.interview_acceptance || false }}
      interview_probe: &a10 ${{ inputs.interview_probe || false }}
      live: &a11 ${{ inputs.live || false }}
      maintenance: &a12 ${{ inputs.maintenance || false }}
      probe: &a13 ${{ inputs.probe || false }}
      publish: &a14 ${{ inputs.publish || false }}
      quick: &a15 ${{ inputs.quick || false }}
      reconcile: ${{ inputs.reconcile || false }}
      report: &a16 ${{ inputs.report || '' }}
      resolve_jobright: &a17 ${{ inputs.resolve_jobright || false }}
      resolve_linkedin: &a18 ${{ inputs.resolve_linkedin || false }}
      sponsors: &a19 ${{ inputs.sponsors || false }}
      tick: &a20 ${{ inputs.tick || false }}
      web: &a21 ${{ inputs.web || false }}
      web_scale_up: &a22 ${{ inputs.web_scale_up || false }}
    secrets: &m1
      DOPPLER_TOKEN: &a23 ${{ secrets.DOPPLER_TOKEN }}
      LIFEOS_BWS_RUNTIME_TOKEN: &a24 ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
  unit-tests:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.cloud_backlog != '' && inputs.cloud_backlog != '0') }}
    uses: ./.github/workflows/tick-unit-tests.yml
  jobright:
    needs: prep
    if: &a25 ${{ always() && needs.prep.result == 'success' && github.event_name == 'workflow_dispatch' && !inputs.tick && !inputs.quick && (inputs.cloud_backlog == '' || inputs.cloud_backlog == '0') }}
    uses: ./.github/workflows/tick-jobright.yml
    with:
      live: *a11
      resolve_jobright: *a17
      tick: *a20
      prep_pipeline: &a26 ${{ needs.prep.outputs.pipeline }}
    secrets: *m1
  linkedin:
    needs: prep
    if: *a25
    uses: ./.github/workflows/tick-linkedin.yml
    with:
      live: *a11
      resolve_linkedin: *a18
      tick: *a20
      prep_pipeline: *a26
    secrets: *m1
  lensa:
    needs: prep
    if: *a25
    uses: ./.github/workflows/tick-lensa.yml
    with:
      discover: *a3
      live: *a11
      tick: *a20
      prep_pipeline: *a26
    secrets: *m1
  finish:
    needs: [prep]
    if: ${{ always() && needs.prep.result == 'success' && ((github.event_name == 'workflow_dispatch' && !inputs.tick) || needs.prep.outputs.pipeline == 'true') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tick-finish.yml
    with:
      fit: *a6
      live: *a11
      publish: *a14
      quick: *a15
      tick: *a20
      prep_extract: ${{ needs.prep.outputs.extract }}
      prep_pipeline: *a26
    secrets: *m1
  manual_acquire:
    needs: [prep, finish]
    if: ${{ always() && needs.prep.result == 'success' && ((github.event_name == 'workflow_dispatch' && !inputs.tick) || needs.prep.outputs.pipeline == 'true') && github.event_name == 'workflow_dispatch' && (inputs.web || inputs.enrich) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tick-manual-acquire.yml
    with:
      enrich: *a4
      fit: *a6
      live: *a11
      publish: *a14
      quick: *a15
      tick: *a20
      web: *a21
      prep_pipeline: *a26
    secrets: *m1
  manual_fit:
    needs: [prep, manual_acquire]
    if: ${{ always() && needs.prep.result == 'success' && ((github.event_name == 'workflow_dispatch' && !inputs.tick) || needs.prep.outputs.pipeline == 'true') && github.event_name == 'workflow_dispatch' && (inputs.fit || inputs.publish || inputs.audit || (inputs.cloud_backlog != '' && inputs.cloud_backlog != '0')) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tick-manual-fit.yml
    with:
      audit: *a1
      cloud_backlog: *a2
      fit: *a6
      fit_all: *a7
      live: *a11
      publish: *a14
      quick: *a15
      report: *a16
      tick: *a20
      prep_pipeline: *a26
    secrets: *m1
  manual_publish:
    needs: [prep, manual_fit]
    if: ${{ always() && needs.prep.result == 'success' && ((github.event_name == 'workflow_dispatch' && !inputs.tick) || needs.prep.outputs.pipeline == 'true') && github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.finalize) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tick-manual-publish.yml
    with:
      finalize: *a5
      fit: *a6
      live: *a11
      publish: *a14
      quick: *a15
      tick: *a20
      prep_pipeline: *a26
    secrets: *m1
  manual_scaleup:
    needs: [prep, manual_publish]
    if: ${{ always() && needs.prep.result == 'success' && ((github.event_name == 'workflow_dispatch' && !inputs.tick) || needs.prep.outputs.pipeline == 'true') && github.event_name == 'workflow_dispatch' && (inputs.web_scale_up || inputs.sponsors) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tick-manual-scaleup.yml
    with:
      fit: *a6
      live: *a11
      publish: *a14
      quick: *a15
      report: *a16
      sponsors: *a19
      tick: *a20
      web_scale_up: *a22
      prep_pipeline: *a26
    secrets: *m1
  manual_reports:
    needs: [prep, manual_scaleup]
    if: ${{ always() && needs.prep.result == 'success' && ((github.event_name == 'workflow_dispatch' && !inputs.tick) || needs.prep.outputs.pipeline == 'true') && github.event_name == 'workflow_dispatch' && (inputs.report != '' || inputs.probe) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tick-manual-reports.yml
    with:
      fit: *a6
      live: *a11
      probe: *a13
      publish: *a14
      quick: *a15
      report: *a16
      tick: *a20
      prep_pipeline: *a26
    secrets: *m1
  manual_maintenance:
    needs: [prep, manual_reports]
    if: ${{ always() && needs.prep.result == 'success' && ((github.event_name == 'workflow_dispatch' && !inputs.tick) || needs.prep.outputs.pipeline == 'true') && github.event_name == 'workflow_dispatch' && (inputs.maintenance) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tick-manual-maintenance.yml
    with:
      fit: *a6
      live: *a11
      maintenance: *a12
      publish: *a14
      quick: *a15
      tick: *a20
      prep_pipeline: *a26
    secrets: *m1
  interview:
    needs: prep
    if: ${{ always() && needs.prep.result == 'success' && github.event_name == 'workflow_dispatch' && (inputs.interview || inputs.interview_probe || inputs.interview_acceptance) }}
    uses: ./.github/workflows/tick-interview.yml
    with:
      interview: *a8
      interview_acceptance: *a9
      interview_probe: *a10
      live: *a11
      tick: *a20
    secrets: *m1
  report:
    needs: [prep, unit-tests, jobright, linkedin, lensa, finish, manual_acquire, manual_fit, manual_publish, manual_scaleup, manual_reports, manual_maintenance]
    if: ${{ always() && (needs.prep.result == 'success' || (needs.prep.result == 'failure' && (github.event_name == 'schedule' || (inputs.tick && (inputs.cloud_backlog == '' || inputs.cloud_backlog == '0'))))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for try in 1 2 3; do git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA" && break; [ "$try" = 3 ] && exit 1; sleep $((try * 5)); done
          git checkout -q --detach FETCH_HEAD
      - name: Bitwarden helper from a saved, fingerprint-checked copy
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "100"
      - id: bws_report
        name: Load the migrated credentials from Bitwarden
        uses: ./.github/actions/bws-load
        with:
          access_token: *a24
          doppler_compare: *a23
          set_env: false
          set: report
      - name: Plain switches from Bitwarden
        uses: ./.github/actions/bws-plain
        with:
          access_token: *a24
          names: ALERTS_ENABLED,ALERTS_MUTED_UNTIL,ALERT_SETTINGS,LIFEOS_ACQ_SSH_PORT,LIVE
          live_mode: ${{ github.event_name == 'workflow_dispatch' && !inputs.tick && (inputs.live && 'true' || 'false') || 'follow' }}
      - name: Lanes and the finish job report (fails if a lane failed)
        env:
          NTFY_TOPIC: ${{ steps.bws_report.outputs.NTFY_TOPIC }}
          STAGES: ${{ needs.finish.outputs.failed }} ${{ needs.manual_acquire.outputs.failed }} ${{ needs.manual_fit.outputs.failed }} ${{ needs.manual_publish.outputs.failed }} ${{ needs.manual_scaleup.outputs.failed }} ${{ needs.manual_reports.outputs.failed }} ${{ needs.manual_maintenance.outputs.failed }}
          CODES: ${{ needs.finish.outputs.codes }} ${{ needs.manual_fit.outputs.codes }}
        run: |
          STAGES=$(echo $STAGES)
          CODES=$(echo $CODES)
          failed=""
          for pair in prep=${{ needs.prep.result }} unit-tests=${{ needs.unit-tests.result }} sweep=${{ needs.prep.outputs.sweep }} jobright=${{ needs.jobright.result }} linkedin=${{ needs.linkedin.result }} lensa=${{ needs.lensa.result }} finish=${{ needs.finish.result }} manual_acquire=${{ needs.manual_acquire.result }} manual_fit=${{ needs.manual_fit.result }} manual_publish=${{ needs.manual_publish.result }} manual_scaleup=${{ needs.manual_scaleup.result }} manual_reports=${{ needs.manual_reports.result }} manual_maintenance=${{ needs.manual_maintenance.result }}; do
            [ "${pair#*=}" = "failure" ] && failed="$failed ${pair%=*}"
          done
          if [ -n "$failed" ]; then
            python3 -m lifeos.platform.alerts push --key run_failed --title "V7 run failed" --body "Failed lanes:$failed${STAGES:+; stages: $STAGES}${CODES:+; codes: $CODES}. Open the Actions tab."
            echo "FAILED LANES:$failed"; exit 1
          fi
