name: hourly
on:
  schedule:
    - cron: "7 * * * *"          # hourly; GitHub may delay by several minutes
  workflow_dispatch:
    inputs:
      live:
        description: "Actually move mail (false = dry run)"
        type: boolean
        default: false
      check_store:
        description: "Also run the Hostinger connectivity/schema check (Step 2)"
        type: boolean
        default: false
      reconcile:
        description: "Repair pass: recover cards from recent Processed mail missing in the store (needs live)"
        type: boolean
        default: false
      resolve_jobright:
        description: "Resolve NEW Jobright jobs to final apply links and save them (saves only when live)"
        type: boolean
        default: false
      resolve_linkedin:
        description: "Resolve NEW LinkedIn jobs (guest page, then employer ATS board match); saves only when live"
        type: boolean
        default: false
      enrich:
        description: "Read final pages of RESOLVED jobs: description, posting date, liveness (saves only when live)"
        type: boolean
        default: false
      resolve_lensa:
        description: "Resolve NEW Lensa jobs via ATS board match + free Search (saves only when live)"
        type: boolean
        default: false
      audit:
        description: "Demote READY/PUBLISHED jobs failing the quality guards; trash their Notion pages (saves only when live)"
        type: boolean
        default: false
      publish:
        description: "Publish READY jobs to the Notion Job Ledger (dry run counts only unless live)"
        type: boolean
        default: false
      maintenance:
        description: "Run Last Seen sync and the retention purge now (saves only when live)"
        type: boolean
        default: false
      publish_limit:
        description: "How many READY jobs to publish this run (keep small for the first live batch)"
        type: string
        default: "60"
env:
  PIPELINE: ${{ github.event_name == 'schedule' && vars.V7_PIPELINE == 'true' && 'true' || 'false' }}
  GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
  GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
  GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
  TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
  NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
  NOTION_JOB_LEDGER_DATA_SOURCE_ID: ${{ secrets.NOTION_JOB_LEDGER_DATA_SOURCE_ID }}
  JOBRIGHT_EMAIL: ${{ secrets.JOBRIGHT_EMAIL }}
  JOBRIGHT_PASSWORD: ${{ secrets.JOBRIGHT_PASSWORD }}
  LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ secrets.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
  LIFEOS_ACQ_DB_PASSWORD: ${{ secrets.LIFEOS_ACQ_DB_PASSWORD }}
  LIFEOS_ACQ_SSH_HOST: ${{ secrets.LIFEOS_ACQ_SSH_HOST }}
  LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
  LIFEOS_ACQ_SSH_USER: ${{ secrets.LIFEOS_ACQ_SSH_USER }}
  LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ secrets.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
  LIFEOS_ACQ_DB_NAME: ${{ secrets.LIFEOS_ACQ_DB_NAME }}
  LIFEOS_ACQ_DB_USER: ${{ secrets.LIFEOS_ACQ_DB_USER }}
  FIT_PROFILE_JSON: ${{ secrets.FIT_PROFILE_JSON }}
  V7_FIT_GATE: ${{ vars.V7_FIT_GATE }}
  # Manual runs obey the 'live' input ONLY. Scheduled runs are live only when repo variable V7_LIVE=true.
  LIVE: ${{ github.event_name == 'workflow_dispatch' && (inputs.live && 'true' || 'false') || (vars.V7_LIVE == 'true' && 'true' || 'false') }}
permissions:
  contents: read
concurrency:
  group: life-os-v7-hourly
  cancel-in-progress: false
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      extract: ${{ steps.extract.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Stage 1 - sweep
        run: python -m lifeos.sources.newsletters.sweep $([ "$LIVE" = "true" ] && echo --live)
      - name: Step 3b - reconcile (repair, manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reconcile && inputs.live }}
        run: python -m lifeos.sources.newsletters.ingest --reconcile --live --limit 300
      - name: Step 2 - store check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_store }}
        run: python -m lifeos.jobs.store
      - id: extract
        continue-on-error: true
        name: Stage - extract cards from mail
        if: ${{ github.event_name == 'workflow_dispatch' || env.PIPELINE == 'true' }}
        run: python -m lifeos.sources.newsletters.ingest $([ "$LIVE" = "true" ] && echo --live)

  jobright:
    needs: prep
    if: ${{ always() && needs.prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - id: jobright
        name: Step 5 - resolve Jobright jobs (free Chromium, saves when live)
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.resolve_jobright) }}
        run: |
          python -m playwright install --with-deps chromium
          python -m lifeos.run resolve-jobright --limit 40 $([ "$LIVE" = "true" ] && echo --live)

  linkedin:
    needs: prep
    if: ${{ always() && needs.prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - id: linkedin
        name: Step 5 - resolve LinkedIn jobs (no login, no browser)
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.resolve_linkedin) }}
        run: python -m lifeos.run resolve-linkedin --limit 150 $([ "$LIVE" = "true" ] && echo --live)

  lensa:
    needs: prep
    if: ${{ always() && needs.prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - id: lensa
        name: Step 5 - resolve Lensa jobs (board match + search, no Lensa page access)
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.resolve_lensa) }}
        run: python -m lifeos.run resolve-lensa --limit 400 $([ "$LIVE" = "true" ] && echo --live)

  finish:
    needs: [prep, jobright, linkedin, lensa]
    if: ${{ always() && needs.prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FASTEMBED_CACHE: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Semantic layer (optional, shadow) - local embedding model, cached
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-v1
      - name: Install semantic layer
        run: pip install -r requirements-fit.txt || echo "semantic layer unavailable (scoring unchanged)"
      - id: enrich
        continue-on-error: true
        name: "Step 6 - enrich RESOLVED jobs (final page - JD, date, liveness)"
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.enrich) }}
        run: python -m lifeos.run enrich --limit 150 $([ "$LIVE" = "true" ] && echo --live)
      - id: fit
        continue-on-error: true
        name: Step 6a - fit scoring (deterministic, private profile)
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.audit || inputs.publish)) }}
        run: python -m lifeos.run fit $([ "$LIVE" = "true" ] && echo --live)
      - id: audit
        continue-on-error: true
        name: Step 6b - precision audit (before publish)
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.audit || inputs.publish)) }}
        run: python -m lifeos.run audit $([ "$LIVE" = "true" ] && echo --live)
      - id: publish
        continue-on-error: true
        name: Step 7 - publish READY jobs to Notion
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: python -m lifeos.run publish --limit ${{ inputs.publish_limit || '60' }} $([ "$LIVE" = "true" ] && echo --live)
      - id: maintain
        continue-on-error: true
        name: Step 8 - Last Seen sync (daily) and retention purge (weekly, Sunday 03 UTC)
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.maintenance) }}
        run: |
          python -m lifeos.run sync-seen $([ "$LIVE" = "true" ] && echo --live)
          if [ "${{ inputs.maintenance }}" = "true" ] || [ "$(date -u +%u%H)" = "703" ]; then
            python -m lifeos.run purge $([ "$LIVE" = "true" ] && echo --live)
          fi
      - name: Lane failures fail the run (other stages still ran)
        if: ${{ always() }}
        run: |
          failed=""
          for pair in extract=${{ needs.prep.outputs.extract }} jobright=${{ needs.jobright.result }} linkedin=${{ needs.linkedin.result }} lensa=${{ needs.lensa.result }} enrich=${{ steps.enrich.outcome }} fit=${{ steps.fit.outcome }} audit=${{ steps.audit.outcome }} publish=${{ steps.publish.outcome }} maintain=${{ steps.maintain.outcome }}; do
            [ "${pair#*=}" = "failure" ] && failed="$failed ${pair%=*}"
          done
          if [ -n "$failed" ]; then echo "FAILED STAGES:$failed"; exit 1; fi
