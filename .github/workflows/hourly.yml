name: hourly
on:
  schedule:
    - cron: "7 * * * *"          # three triggers an hour: GitHub drops and delays scheduled runs, so the gate (lifeos.platform.gate)
    - cron: "27 * * * *"         # keeps the effective cadence at about one run per hour and a dropped slot is covered by the next
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      interview_probe:
        description: "Interview OS shape probe (counts only, never writes): reads the Hiring Pipeline page with the separate Interview token"
        type: boolean
        default: false
      interview:
        description: "Interview OS stage (dry run unless Actually move mail is ticked); a failure is a warning and never fails the Jobs run"
        type: boolean
        default: false
      interview_acceptance:
        description: "Interview OS private acceptance (manual only): one case from the INTERVIEW_ACCEPTANCE_JSON secret; dry run unless Actually move mail is ticked"
        type: boolean
        default: false
      jira:
        description: "Jira (read-only dry run unless Actually move mail is ticked): snapshot = save the board snapshot to the private database; card = write the saved snapshot into the Daily Report Jira card; report = snapshot then card; rollover = weekly sprint rollover, never before the sprint ends"
        type: choice
        options: ["none", "snapshot", "card", "report", "rollover", "both", "probe"]
        default: "none"
      discover:
        description: "Scale-Up discovery: web search for jobs at sponsors with no job board; unresolved leads are never published (saves only when live)"
        type: boolean
        default: false
      tick:
        description: "Scheduler tick - sent by the outside timer (D31); runs the full pipeline exactly like a scheduled run. Do not tick by hand."
        type: boolean
        default: false
      live:
        description: "Actually move mail (false = dry run)"
        type: boolean
        default: false
      check_store:
        description: "Also run the Hostinger connectivity/schema check (Step 2)"
        type: boolean
        default: false
      reconcile:
        description: "Repair pass: recover cards from recent Processed mail missing in the store (needs live)"
        type: boolean
        default: false
      resolve_jobright:
        description: "Resolve NEW Jobright jobs to final apply links and save them (saves only when live)"
        type: boolean
        default: false
      resolve_linkedin:
        description: "Resolve NEW LinkedIn jobs (guest page, then employer ATS board match); saves only when live"
        type: boolean
        default: false
      enrich:
        description: "ENRICH - read final pages of RESOLVED jobs: description, posting date, liveness (saves only when live)"
        type: boolean
        default: false
      resolve_lensa:
        description: "Resolve NEW Lensa jobs via ATS board match + free Search (saves only when live)"
        type: boolean
        default: false
      web:
        description: "US Remote web acquisition: poll due ATS boards, classify, admit new postings (counts only unless live)"
        type: boolean
        default: false
      web_scale_up:
        description: "UK Scale-Up web acquisition (also scheduled): poll due sponsor boards; counts only unless live"
        type: boolean
        default: false
      openjobs:
        description: "Open Jobs change feed (US Remote discovery): apply new generations; counts only unless live"
        type: boolean
        default: false
      sponsors:
        description: "Load the UK sponsor register (Skilled Worker evidence): counts only unless live; forces a refresh"
        type: boolean
        default: false
      probe:
        description: "Shape probe (counts only): Open Jobs feed, Teamtailor boards, Dice job pages. Writes nothing"
        type: boolean
        default: false
      fit:
        description: "Score jobs with the Fit model: counts only unless live (also reports the semantic shadow counts)"
        type: boolean
        default: false
      fit_all:
        description: "With Fit: also re-score jobs already published (calibration; counts only unless live)"
        type: boolean
        default: false
      audit:
        description: "Demote READY/PUBLISHED jobs failing the quality guards; trash their Notion pages (saves only when live)"
        type: boolean
        default: false
      publish:
        description: "Publish READY jobs to the Notion Job Ledger (dry run counts only unless live)"
        type: boolean
        default: false
      maintenance:
        description: "Run Last Seen sync and the retention purge now (saves only when live)"
        type: boolean
        default: false
      finalize:
        description: "FINALIZE - label newsletter mail Done when every job in it has an outcome (also runs with Publish; saves only when live)"
        type: boolean
        default: false
      publish_limit:
        description: "How many READY jobs to publish this run (keep small for the first live batch)"
        type: string
        default: "60"
env:
  PIPELINE: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tick)) && vars.V7_PIPELINE == 'true' && 'true' || 'false' }}
  GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
  GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
  GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
  TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
  NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
  NOTION_JOB_LEDGER_DATA_SOURCE_ID: ${{ secrets.NOTION_JOB_LEDGER_DATA_SOURCE_ID }}
  JOBRIGHT_EMAIL: ${{ secrets.JOBRIGHT_EMAIL }}
  JOBRIGHT_PASSWORD: ${{ secrets.JOBRIGHT_PASSWORD }}
  LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ secrets.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
  LIFEOS_ACQ_DB_PASSWORD: ${{ secrets.LIFEOS_ACQ_DB_PASSWORD }}
  LIFEOS_ACQ_SSH_HOST: ${{ secrets.LIFEOS_ACQ_SSH_HOST }}
  LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
  LIFEOS_ACQ_SSH_USER: ${{ secrets.LIFEOS_ACQ_SSH_USER }}
  LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ secrets.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
  LIFEOS_ACQ_DB_NAME: ${{ secrets.LIFEOS_ACQ_DB_NAME }}
  LIFEOS_ACQ_DB_USER: ${{ secrets.LIFEOS_ACQ_DB_USER }}
  FIT_PROFILE_JSON: ${{ secrets.FIT_PROFILE_JSON }}
  V7_FIT_GATE: ${{ vars.V7_FIT_GATE }}
  OPEN_JOBS_CONTACT: ${{ secrets.OPEN_JOBS_CONTACT }}
  HIRING_PIPELINE_PAGE_ID: ${{ secrets.HIRING_PIPELINE_PAGE_ID }}
  # Manual runs obey the 'live' input ONLY. Scheduled runs are live only when repo variable V7_LIVE=true.
  LIVE: ${{ github.event_name == 'workflow_dispatch' && !inputs.tick && (inputs.live && 'true' || 'false') || (vars.V7_LIVE == 'true' && 'true' || 'false') }}
permissions:
  contents: read
concurrency:
  group: life-os-v7-hourly
  cancel-in-progress: false
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
      issues: write
    outputs:
      extract: ${{ steps.extract.outcome }}
    steps:
      - uses: actions/checkout@v4
      - name: Gate - skip a scheduled run when a run started in the last 50 minutes; flag a stale pipeline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TICK: ${{ inputs.tick }}
        run: python3 -m lifeos.platform.gate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Stage 1 - sweep
        run: python -m lifeos.sources.newsletters.sweep $([ "$LIVE" = "true" ] && echo --live)
      - name: Step 3b - reconcile (repair, manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reconcile && inputs.live }}
        run: python -m lifeos.sources.newsletters.ingest --reconcile --live --limit 300
      - name: Step 2 - store check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_store }}
        run: python -m lifeos.jobs.store
      - id: extract
        continue-on-error: true
        name: Stage - extract cards from mail
        if: ${{ github.event_name == 'workflow_dispatch' || env.PIPELINE == 'true' }}
        run: python -m lifeos.sources.newsletters.ingest $([ "$LIVE" = "true" ] && echo --live)

  jobright:
    needs: prep
    if: ${{ always() && needs.prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - id: jobright
        name: Step 5 - resolve Jobright jobs (free Chromium, saves when live)
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.resolve_jobright) }}
        run: |
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
          python -m lifeos.run resolve-jobright --limit 40 $([ "$LIVE" = "true" ] && echo --live)

  linkedin:
    needs: prep
    if: ${{ always() && needs.prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - id: linkedin
        name: Step 5 - resolve LinkedIn jobs (no login, no browser)
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.resolve_linkedin) }}
        run: python -m lifeos.run resolve-linkedin --limit 150 $([ "$LIVE" = "true" ] && echo --live)

  lensa:
    needs: prep
    if: ${{ always() && needs.prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - id: lensa
        name: Step 5 - resolve Lensa jobs (board match + search, no Lensa page access)
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.resolve_lensa) }}
        run: python -m lifeos.run resolve-lensa --limit 400 $([ "$LIVE" = "true" ] && echo --live)
      - id: discover
        continue-on-error: true
        name: Step 5f - Scale-Up sponsors with no job board - find their jobs by web search (runs after Lensa on the same search pace)
        if: ${{ always() && (env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.discover)) }}
        run: python -m lifeos.run discover-jobs --limit 12 $([ "$LIVE" = "true" ] && echo --live)

  finish:
    needs: [prep]                         # does not wait for the resolvers: what they resolve is enriched by the next hourly run
    if: ${{ always() && needs.prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FASTEMBED_CACHE: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Semantic layer (optional, shadow) - local embedding model, cached
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.fit || inputs.publish)) }}
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-v1
      - name: Install semantic layer
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.fit || inputs.publish)) }}
        run: pip install -r requirements-fit.txt || echo "semantic layer unavailable (scoring unchanged)"
      - id: web
        continue-on-error: true
        name: Step 5b - US Remote web acquisition (due ATS boards)
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.web) }}
        run: python -m lifeos.run web --limit 12 $([ "$LIVE" = "true" ] && echo --live)
      - id: openjobs
        continue-on-error: true
        name: Step 5d - Open Jobs change feed (tail of new generations)
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.openjobs) }}
        run: python -m lifeos.run openjobs $([ "$LIVE" = "true" ] && echo --live)
      - id: web_scale_up
        continue-on-error: true
        name: Step 5c - UK Scale-Up web acquisition (scheduled; due sponsor boards)
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.web_scale_up) }}
        run: python -m lifeos.run web-scale-up --limit 12 $([ "$LIVE" = "true" ] && echo --live)
      - id: sponsors
        continue-on-error: true
        name: Step 5e - UK sponsor register (weekly refresh; forced when dispatched)
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.sponsors) }}
        env:
          SPONSORS_FORCE: ${{ inputs.sponsors && 'true' || '' }}
        run: python -m lifeos.run sponsors $([ "$LIVE" = "true" ] && echo --live)
      - id: enrich
        continue-on-error: true
        name: "Step 6 - enrich RESOLVED jobs (final page - JD, date, liveness)"
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.enrich) }}
        run: python -m lifeos.run enrich --limit 150 $([ "$LIVE" = "true" ] && echo --live)
      - id: fit
        continue-on-error: true
        name: Step 6a - fit scoring (deterministic, private profile)
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.fit || inputs.publish)) }}
        env:
          FIT_ALL: ${{ inputs.fit_all && 'true' || '' }}
        run: python -m lifeos.run fit $([ "$LIVE" = "true" ] && echo --live)
      - id: audit
        continue-on-error: true
        name: Step 6b - precision audit (before publish)
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.audit || inputs.publish)) }}
        run: python -m lifeos.run audit $([ "$LIVE" = "true" ] && echo --live)
      - id: publish
        continue-on-error: true
        name: Step 7 - publish READY jobs to Notion
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: python -m lifeos.run publish --limit ${{ inputs.publish_limit || '60' }} $([ "$LIVE" = "true" ] && echo --live)
      - id: finalize
        continue-on-error: true
        name: Step 7b - close out newsletter mail whose jobs all have an outcome
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.finalize)) }}
        run: python -m lifeos.sources.newsletters.finalize $([ "$LIVE" = "true" ] && echo --live)
      - id: probe
        continue-on-error: true
        name: Probe - source shapes (dispatch only, counts only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        run: python -m lifeos.run probe
      - id: maintain
        continue-on-error: true
        name: Step 8 - Last Seen sync (daily) and retention purge (weekly, Sunday 03 UTC)
        if: ${{ env.PIPELINE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.maintenance) }}
        run: |
          python -m lifeos.run sync-seen $([ "$LIVE" = "true" ] && echo --live)
          if [ "${{ inputs.maintenance }}" = "true" ] || [ "$(date -u +%u%H)" = "703" ]; then
            python -m lifeos.run purge $([ "$LIVE" = "true" ] && echo --live)
          fi
      - id: alerts
        continue-on-error: true
        name: Alerts - detect, dedupe and push to the phone (counts only; a failure here never fails the run)
        if: ${{ env.PIPELINE == 'true' }}
        run: python -m lifeos.run alerts $([ "$LIVE" = "true" ] && echo --live)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Lane failures fail the run (other stages still ran)
        if: ${{ always() }}
        run: |
          failed=""
          for pair in extract=${{ needs.prep.outputs.extract }} web=${{ steps.web.outcome }} scale_up=${{ steps.web_scale_up.outcome }} openjobs=${{ steps.openjobs.outcome }} sponsors=${{ steps.sponsors.outcome }} enrich=${{ steps.enrich.outcome }} fit=${{ steps.fit.outcome }} audit=${{ steps.audit.outcome }} publish=${{ steps.publish.outcome }} finalize=${{ steps.finalize.outcome }} probe=${{ steps.probe.outcome }} maintain=${{ steps.maintain.outcome }}; do
            [ "${pair#*=}" = "failure" ] && failed="$failed ${pair%=*}"
          done
          if [ -n "$failed" ]; then echo "FAILED STAGES:$failed"; exit 1; fi

  interview:
    # Interview OS runs in its OWN job (D38/handoff): dispatch-only until promoted, no Jobs secrets, and its failure never fails the Jobs run
    # (the stale-pipeline alert and the gate are keyed on run success). Step-level continue-on-error + a warning, not job-level.
    needs: prep
    if: ${{ always() && needs.prep.result == 'success' && github.event_name == 'workflow_dispatch' && (inputs.interview || inputs.interview_probe || inputs.interview_acceptance) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:                                   # least privilege: blank every secret this job does not use (workflow-level env is inherited)
      NOTION_API_TOKEN: ""
      NOTION_JOB_LEDGER_DATA_SOURCE_ID: ""
      GMAIL_OAUTH_CLIENT_ID: ""
      GMAIL_OAUTH_CLIENT_SECRET: ""
      GMAIL_OAUTH_REFRESH_TOKEN: ""
      TINYFISH_API_KEY: ""
      JOBRIGHT_EMAIL: ""
      JOBRIGHT_PASSWORD: ""
      LIFEOS_ACQ_SSH_PRIVATE_KEY: ""
      LIFEOS_ACQ_DB_PASSWORD: ""
      LIFEOS_ACQ_SSH_HOST: ""
      LIFEOS_ACQ_SSH_PORT: ""
      LIFEOS_ACQ_SSH_USER: ""
      LIFEOS_ACQ_SSH_KNOWN_HOSTS: ""
      LIFEOS_ACQ_DB_NAME: ""
      LIFEOS_ACQ_DB_USER: ""
      FIT_PROFILE_JSON: ""
      OPEN_JOBS_CONTACT: ""
      NOTION_INTERVIEW_TOKEN: ${{ secrets.NOTION_INTERVIEW_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - id: iprobe
        continue-on-error: true
        name: Interview shape probe (counts only, writes nothing)
        if: ${{ inputs.interview_probe }}
        run: python -m lifeos.run interview-probe
      - id: irun
        continue-on-error: true
        name: Interview stage (live only when Actually move mail is ticked)
        if: ${{ inputs.interview }}
        run: python -m lifeos.run interview --limit 20 $([ "$LIVE" = "true" ] && echo --live)
      - id: iacc
        continue-on-error: true
        name: Interview private acceptance (manual dispatch only; case comes from the secret)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.interview_acceptance == true && inputs.tick != true }}
        env:
          INTERVIEW_ACCEPTANCE_JSON: ${{ secrets.INTERVIEW_ACCEPTANCE_JSON }}
        run: python -m lifeos.run interview-acceptance --limit 1 $([ "$LIVE" = "true" ] && echo --live)
      - name: Interview warning (does not fail the run)
        if: ${{ always() && (steps.iprobe.outcome == 'failure' || steps.irun.outcome == 'failure' || steps.iacc.outcome == 'failure') }}
        run: echo "::warning title=Interview OS::the Interview step failed or was DEGRADED; the Jobs pipeline is unaffected"

  jira:
    # Jira runs in its OWN job, like Interview: scheduled and tick runs refresh the snapshot and the report card (rollover stays manual), only the Jira secrets (the database secrets are
    # re-supplied to the snapshot step alone), and a failure is a warning that never fails the Jobs run.
    needs: prep
    if: ${{ always() && needs.prep.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.tick || inputs.jira != 'none') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOTION_API_TOKEN: ""
      NOTION_JOB_LEDGER_DATA_SOURCE_ID: ""
      GMAIL_OAUTH_CLIENT_ID: ""
      GMAIL_OAUTH_CLIENT_SECRET: ""
      GMAIL_OAUTH_REFRESH_TOKEN: ""
      TINYFISH_API_KEY: ""
      JOBRIGHT_EMAIL: ""
      JOBRIGHT_PASSWORD: ""
      LIFEOS_ACQ_SSH_PRIVATE_KEY: ""
      LIFEOS_ACQ_DB_PASSWORD: ""
      LIFEOS_ACQ_SSH_HOST: ""
      LIFEOS_ACQ_SSH_PORT: ""
      LIFEOS_ACQ_SSH_USER: ""
      LIFEOS_ACQ_SSH_KNOWN_HOSTS: ""
      LIFEOS_ACQ_DB_NAME: ""
      LIFEOS_ACQ_DB_USER: ""
      FIT_PROFILE_JSON: ""
      OPEN_JOBS_CONTACT: ""
      HIRING_PIPELINE_PAGE_ID: ""
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_BOARDS: ${{ secrets.JIRA_BOARDS }}
      JIRA_GTV_EPIC: ${{ secrets.JIRA_GTV_EPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - id: jrollauto
        continue-on-error: true
        name: Jira sprint rollover (scheduled; waits for the sprint to end and Monday 6 AM; live only when V7_LIVE)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tick }}
        run: python -m lifeos.run jira-rollover-scheduled $([ "$LIVE" = "true" ] && echo --live)
      - id: jsnap
        continue-on-error: true
        name: Jira snapshot (counts only; saved to the private database only when live)
        if: ${{ inputs.jira == 'snapshot' || inputs.jira == 'both' || inputs.jira == 'report' || github.event_name != 'workflow_dispatch' || inputs.tick }}
        env:
          LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ secrets.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_DB_PASSWORD: ${{ secrets.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_SSH_HOST: ${{ secrets.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
          LIFEOS_ACQ_SSH_USER: ${{ secrets.LIFEOS_ACQ_SSH_USER }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ secrets.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_DB_NAME: ${{ secrets.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_USER: ${{ secrets.LIFEOS_ACQ_DB_USER }}
        run: python -m lifeos.run jira-snapshot $([ "$LIVE" = "true" ] && echo --live)
      - id: jcard
        continue-on-error: true
        name: Jira card (Daily Report; counts only; the page is written only when live)
        if: ${{ inputs.jira == 'card' || inputs.jira == 'report' || github.event_name != 'workflow_dispatch' || inputs.tick }}
        env:
          NOTION_JIRA_TOKEN: ${{ secrets.NOTION_JIRA_TOKEN }}
          JIRA_CARD_BLOCK_ID: ${{ secrets.JIRA_CARD_BLOCK_ID }}
          JIRA_CARD_PROJECTS: ${{ secrets.JIRA_CARD_PROJECTS }}
          JIRA_SITE_URL: ${{ secrets.JIRA_SITE_URL }}
          JIRA_GTV_CONTEXT_URL: ${{ secrets.JIRA_GTV_CONTEXT_URL }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ secrets.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_DB_PASSWORD: ${{ secrets.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_SSH_HOST: ${{ secrets.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
          LIFEOS_ACQ_SSH_USER: ${{ secrets.LIFEOS_ACQ_SSH_USER }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ secrets.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_DB_NAME: ${{ secrets.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_USER: ${{ secrets.LIFEOS_ACQ_DB_USER }}
        run: python -m lifeos.run jira-card $([ "$LIVE" = "true" ] && echo --live)
      - id: jprobe
        continue-on-error: true
        name: Jira layout probe (read-only; counts only)
        if: ${{ inputs.jira == 'probe' }}
        run: python -m lifeos.run jira-probe
      - id: jroll
        continue-on-error: true
        name: Jira sprint rollover (dry run unless live; never before the sprint ends)
        if: ${{ inputs.jira == 'rollover' || inputs.jira == 'both' }}
        run: python -m lifeos.run jira-rollover $([ "$LIVE" = "true" ] && echo --live)
      - name: Jira warning (does not fail the run)
        if: ${{ always() && (steps.jsnap.outcome == 'failure' || steps.jcard.outcome == 'failure' || steps.jrollauto.outcome == 'failure' || steps.jroll.outcome == 'failure' || steps.jprobe.outcome == 'failure') }}
        run: echo "::warning title=Jira::a Jira step failed; the Jobs pipeline is unaffected"

  report:
    needs: [prep, jobright, linkedin, lensa, finish]
    if: ${{ always() && needs.prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Resolver lanes and the finish job report here (the run fails if any lane failed)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          failed=""
          for pair in jobright=${{ needs.jobright.result }} linkedin=${{ needs.linkedin.result }} lensa=${{ needs.lensa.result }} finish=${{ needs.finish.result }}; do
            [ "${pair#*=}" = "failure" ] && failed="$failed ${pair%=*}"
          done
          if [ -n "$failed" ]; then
            python3 -m lifeos.platform.alerts push --severity page --title "V7 run failed" --body "Failed lanes:$failed. Open the Actions tab."
            echo "FAILED LANES:$failed"; exit 1
          fi
