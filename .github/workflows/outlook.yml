name: outlook
# Outlook sign-in and health check (manual only). Kept out of the hourly workflow: that one is at GitHub's 25-input limit, and mailbox
# credentials never share a job with job-search secrets. Refresh tokens live in the private database, never in a secret or a log.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "auth = sign one mailbox in read-only (prints a short code to enter at the Microsoft page; needs the Save box); auth-write = sign in again with permission to move newsletters into a folder; probe = read-only check, counts only; newsletters = read job-alert mail into Jobs OS (counts only; saves only with the Save box)"
        type: choice
        options: ["probe", "auth", "auth-write", "newsletters"]
        default: "probe"
      account:
        description: "Which mailbox (used by auth)"
        type: choice
        options: ["personal", "work"]
        default: "personal"
      replace:
        description: "auth only: allow this label to switch to a different mailbox (normally refused, to stop a mix-up)"
        type: boolean
        default: false
      live:
        description: "Save (auth: the sign-in; newsletters: the jobs found; probe never writes)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: life-os-v7-outlook
  cancel-in-progress: false
jobs:
  outlook:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OUTLOOK_CLIENT_ID: ${{ secrets.OUTLOOK_CLIENT_ID }}
      OUTLOOK_ACCOUNT: ${{ inputs.account }}
      OUTLOOK_REPLACE: ${{ inputs.replace }}
      OUTLOOK_WRITE: ${{ inputs.action == 'auth-write' }}
      LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
    steps:
      - uses: actions/checkout@v5
      - name: Load the migrated credentials from Bitwarden (EDGE-1.3, exactly these 7; the job fails if retrieval fails, no fallback)
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          secrets: |
            d71bbaed-6a6c-49b5-8a1f-b4db015ecfda > LIFEOS_ACQ_DB_NAME
            00d82e0d-be10-4c8c-bdbe-b4db015ed389 > LIFEOS_ACQ_DB_PASSWORD
            9422b842-3bb0-4153-bb8d-b4db015ed746 > LIFEOS_ACQ_DB_USER
            6f1c86f6-c48f-4e77-b65d-b4db015edb15 > LIFEOS_ACQ_SSH_HOST
            b65dd2fc-2573-4bda-9e80-b4db015edec6 > LIFEOS_ACQ_SSH_KNOWN_HOSTS
            7ada9cea-8711-4b37-bef9-b4db015ee298 > LIFEOS_ACQ_SSH_PRIVATE_KEY
            6b3e12b9-1987-4073-bda2-b4db015ee653 > LIFEOS_ACQ_SSH_USER
      - uses: ./.github/actions/python
      - name: Outlook sign-in (live only)
        if: ${{ inputs.action == 'auth' || inputs.action == 'auth-write' }}
        run: python -u -m lifeos.run outlook-auth $([ "${{ inputs.live }}" = "true" ] && echo --live)
      - name: Outlook newsletters (counts only; saves jobs only when the Save box is ticked)
        if: ${{ inputs.action == 'newsletters' }}
        env:
          OUTLOOK_NEWSLETTER_ACCOUNTS: ${{ inputs.account }}
        run: python -u -m lifeos.run outlook-newsletters $([ "${{ inputs.live }}" = "true" ] && echo --live)
      - name: Outlook probe (read-only; counts only)
        if: ${{ inputs.action == 'probe' }}
        run: python -m lifeos.run outlook-probe
