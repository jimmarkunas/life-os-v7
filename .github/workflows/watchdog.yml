name: watchdog
on:
  schedule:
    - cron: "17 * * * *"         # outside the pipeline: opens the pipeline-stale issue when no hourly run has succeeded for 2.5 hours (D52)
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Send a test push to the phone (proves NTFY_TOPIC and the ntfy app)"
        type: boolean
        default: false
      test_severity:
        description: "Severity of the test push: page is what a real failure sends (high priority); info is the quiet kind"
        type: choice
        options: [page, info]
        default: page
env:
  ALERTS_MUTED_UNTIL: ${{ vars.ALERTS_MUTED_UNTIL }}      # LIFE-73: silences every alert channel until this time (lifeos.platform.alerts.muted); empty = not muted
  ALERTS_ENABLED: ${{ vars.ALERTS_ENABLED }}      # LIFE-75: the master switch from the Alert settings page; anything but "on" means alerts are OFF (lifeos.platform.alert_settings)
  ALERT_SETTINGS: ${{ vars.ALERT_SETTINGS }}      # LIFE-75: per-alert channel choices from the Alert settings page; empty = the registry defaults
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - id: bws_watch
        name: Load the push topic from Bitwarden (EDGE-1.3, the one secret this job reads; the job fails if retrieval fails, no fallback)
        continue-on-error: true                 # D209: one retry below; the retry fails the job
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          secrets: |
            83c553e9-23a6-45aa-9006-b4db015f00ac > NTFY_TOPIC
      - name: Bitwarden refused or timed out (429 / 5xx) - pause before the one retry
        if: ${{ steps.bws_watch.outcome == 'failure' }}
        run: sleep $((30 + RANDOM % 45))
      - id: bws_watch_retry
        name: Load the same credentials from Bitwarden - the one retry (the job fails if it fails, no fallback)
        if: ${{ steps.bws_watch.outcome == 'failure' }}
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          secrets: |
            83c553e9-23a6-45aa-9006-b4db015f00ac > NTFY_TOPIC
      - name: Stale-pipeline check (counts only; no job data; the only secret is the push topic)
        run: python3 -m lifeos.platform.gate --watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test push (dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_push }}
        env:
          TEST_SEVERITY: ${{ inputs.test_severity }}
        run: python3 -m lifeos.platform.alerts push --key test_push --severity "$TEST_SEVERITY" --title "V7 test push ($TEST_SEVERITY)" --body "If this appeared on your lock screen, alerts work. If it is only in the ntfy app, check the phone's notification settings."
