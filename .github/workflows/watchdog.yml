name: watchdog
on:
  schedule:
    - cron: "17 * * * *"         # outside the pipeline: opens the pipeline-stale issue when no hourly run has succeeded for 2.5 hours (D52)
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Send a test push to the phone (proves NTFY_TOPIC and the ntfy app)"
        type: boolean
        default: false
      test_severity:
        description: "Severity of the test push: page is what a real failure sends (high priority); info is the quiet kind"
        type: choice
        options: [page, info]
        default: page
      bws_test:
        description: "Test only (LIFE-406): fail forces the Bitwarden helper download to fail, to prove the retry and the clear failure message; normal is the default"
        type: choice
        options: ["normal", "fail"]
        default: "normal"
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Bitwarden helper from a saved, fingerprint-checked copy (LIFE-406; downloads, with a long retry, only when no saved copy exists)
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "60"
          test_download: ${{ inputs.bws_test || 'normal' }}
      - id: bws_watch
        name: Load the push topic from Bitwarden (EDGE-1.3, the one secret this job reads; the job fails if retrieval fails, no fallback)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          secrets: |
            83c553e9-23a6-45aa-9006-b4db015f00ac > NTFY_TOPIC
      - id: doppler_bws_watch
        if: ${{ steps.bws_watch.outcome == 'success' }}
        continue-on-error: true       # LIFE-981: a Doppler problem is a fixed code in the log and never fails the job; the Bitwarden values above are the ones this job uses
        name: Doppler parity compare (LIFE-981; the same 1 name read from Doppler and compared with Bitwarden's value by hash; counts and a fixed code only; production keeps Bitwarden)
        uses: ./.github/actions/doppler-load
        with:
          token: ${{ secrets.DOPPLER_TOKEN }}
          names: NTFY_TOPIC
          bitwarden: ${{ toJSON(steps.bws_watch.outputs) }}
      - name: Plain switches from Bitwarden (LIFE-704; read WITHOUT masking, validated; fixed fail modes - dry run, cloud fit off, alerts on, port fails - names and codes only)
        uses: ./.github/actions/bws-plain
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          names: ALERTS_ENABLED,ALERTS_MUTED_UNTIL,ALERT_SETTINGS
      - name: Stale-pipeline check (counts only; no job data; the only secret is the push topic)
        run: python3 -m lifeos.platform.gate --watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test push (dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_push }}
        env:
          TEST_SEVERITY: ${{ inputs.test_severity }}
        run: python3 -m lifeos.platform.alerts push --key test_push --severity "$TEST_SEVERITY" --title "V7 test push ($TEST_SEVERITY)" --body "If this appeared on your lock screen, alerts work. If it is only in the ntfy app, check the phone's notification settings."
  alarm:
    # LIFE-704 step 2: the alarm must not depend on the systems it alarms about. The watch job needs Bitwarden for the push topic and fails (no fallback, D209) when Bitwarden cannot be read, so on its own it
    # cannot tell Jim that pushes are down. This job reads NOTHING from Bitwarden or Notion: it uses only the run's own GitHub token, and opens ONE GitHub issue (label watchdog-failed) while the watch job fails
    # for any reason (GitHub notifies Jim), and closes it again after the next successful watch run. Names only: it never reads or prints a value.
    needs: [watch]
    if: ${{ always() && (needs.watch.result == 'failure' || needs.watch.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Open the watchdog-failed issue while the watch job fails; close it when the watch job passes (GitHub token only; no Bitwarden, no Notion)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          WATCH_RESULT='${{ needs.watch.result }}'
          RUN_URL='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          TEST_RUN='${{ inputs.bws_test == 'fail' && ' (TEST RUN, Bitwarden forced unreadable)' || '' }}'
          open=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=watchdog-failed&per_page=1" --jq '.[0].number // empty')
          if [ "$WATCH_RESULT" = "failure" ]; then
            body="The watchdog job failed. If Bitwarden cannot be read, the phone push topic is unavailable and no push can be sent, so this issue is the alert. Run: $RUN_URL. It closes itself after the next passing watchdog run."
            if [ -z "$open" ]; then
              gh api "repos/$GITHUB_REPOSITORY/issues" -f title="V7 watchdog failed, pushes may be down$TEST_RUN" -f body="$body" -f "labels[]=watchdog-failed" --jq '"WATCHDOG_ALERT opened issue " + (.number|tostring)'
            else
              gh api "repos/$GITHUB_REPOSITORY/issues/$open/comments" -f body="Still failing. $body" --jq '"WATCHDOG_ALERT commented on issue " + (.issue_url|split("/")|last)'
            fi
          elif [ -n "$open" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$open" -f state=closed -f state_reason=completed --jq '"WATCHDOG_ALERT closed issue " + (.number|tostring)'
          else
            echo "WATCHDOG_ALERT none open"
          fi
