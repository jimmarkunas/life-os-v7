name: lane-guard
# LIFE-78 lane enforcement. pull_request_target: this workflow file, the checkout and every line of code it runs come from the DEFAULT branch, never from the pull request, so a PR cannot change the check that judges it. The PR is read as
# DATA through the read-only GitHub API (lifeos/lane_guard.py) and nothing from it is checked out, built, imported or executed. No secret, no write permission, no dispatch, no schedule. The ordinary unit tests stay in pr-tests.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: life-os-v7-lane-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  lane-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5            # pull_request_target checks out the default branch; no `ref:` is ever given
        with:
          persist-credentials: false
      - name: Lane guard (trusted code from the default branch; stdlib only; fails closed)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I lifeos/lane_guard.py        # stdlib only: the runner's own Python, nothing installed
