name: tick-manual-maintenance
on:
  workflow_call:
    inputs:
      fit:
        type: boolean
        default: false
      live:
        type: boolean
        default: false
      maintenance:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false
      quick:
        type: boolean
        default: false
      tick:
        type: boolean
        default: false
      prep_pipeline:
        type: string
        default: ""
    secrets:
      DOPPLER_TOKEN:
        required: false
      LIFEOS_BWS_RUNTIME_TOKEN:
        required: false
    outputs:
      failed:
        value: ${{ jobs.manual_maintenance.outputs.failed }}
permissions:
  contents: read
env:
  NOTION_JOB_LEDGER_DATA_SOURCE_ID: ""
  V7_FIT_GATE: ""
  HIRING_PIPELINE_PAGE_ID: ""
jobs:
  manual_maintenance:
    outputs:
      failed: ${{ steps.lanes.outputs.failed }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 58
    env:
      FASTEMBED_CACHE: ${{ github.workspace }}/.cache/fastembed
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for try in 1 2 3; do git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA" && break; [ "$try" = 3 ] && exit 1; sleep $((try * 5)); done
          git checkout -q --detach FETCH_HEAD
      - uses: ./.github/actions/python
      - name: Semantic layer (optional shadow; local embedding model)
        if: &a1 ${{ inputs.prep_pipeline == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.fit || inputs.publish || inputs.quick)) }}
        uses: &a2 actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-v1
      - name: Pip cache for the semantic layer (requirements-fit.lock)
        if: *a1
        uses: *a2
        with:
          path: ~/.cache/pip
          key: pip-fit-${{ runner.os }}-${{ hashFiles('requirements-fit.lock') }}
      - name: Install semantic layer
        if: *a1
        run: pip install --require-hashes -r requirements-fit.lock || echo "semantic layer unavailable (scoring unchanged)"
      - name: Bitwarden helper from a saved, fingerprint-checked copy
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "600"
      - id: bws_finish
        name: Load the migrated credentials from Bitwarden
        uses: &a3 ./.github/actions/bws-load
        with:
          access_token: &a4 ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          doppler_compare: &a5 ${{ secrets.DOPPLER_TOKEN }}
          set_env: false
          set: hourly-manual-maintenance
      - name: Plain switches from Bitwarden
        uses: ./.github/actions/bws-plain
        with:
          access_token: *a4
          names: ALERTS_ENABLED,ALERTS_MUTED_UNTIL,ALERT_SETTINGS,V7_CLOUD_FIT,V7_CLOUD_FIT_SCHEDULED,V7_CLOUD_FIT_BACKLOG_BUDGET,V7_CLOUD_FIT_BACKLOG_MAX,V7_CLOUD_FIT_PARALLEL,V7_CLOUD_FIT_BACKLOG_PAGE,LIFEOS_ACQ_SSH_PORT,V7_STORE_VIA,LIVE
          live_mode: ${{ github.event_name == 'workflow_dispatch' && !inputs.tick && (inputs.live && 'true' || 'false') || 'follow' }}
      - name: Join the tailnet (Cloud-Fit shadow only)
        continue-on-error: true
        uses: ./.github/actions/tailscale
        with:
          oauth-client-id: ${{ steps.bws_finish.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_finish.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
      - id: bws_runtime_config
        if: ${{ inputs.prep_pipeline == 'true' || (github.event_name == 'workflow_dispatch' && inputs.quick) }}
        continue-on-error: true
        name: Runtime Configuration source ID from Bitwarden
        uses: *a3
        with:
          access_token: *a4
          doppler_compare: *a5
          set_env: false
          set: runtime-config
      - id: sync_seen
        continue-on-error: true
        name: Step 8 - Last Seen sync
        if: &a6 ${{ github.event_name == 'workflow_dispatch' && inputs.maintenance && inputs.prep_pipeline != 'true' }}
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: &a7 ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          FIT_PROFILE_EXTRA_JSON: &a8 ${{ steps.bws_finish.outputs.FIT_PROFILE_EXTRA_JSON }}
          FIT_PROFILE_JSON: &a9 ${{ steps.bws_finish.outputs.FIT_PROFILE_JSON }}
          JOBRIGHT_EMAIL: &a10 ${{ steps.bws_finish.outputs.JOBRIGHT_EMAIL }}
          JOBRIGHT_PASSWORD: &a11 ${{ steps.bws_finish.outputs.JOBRIGHT_PASSWORD }}
          LIFEOS_ACQ_DB_NAME: &a12 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: &a13 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: &a14 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: &a15 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: &a16 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_JUMP_HOST: &a17 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: &a18 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: &a19 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: &a20 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: &a21 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_USER }}
          NOTION_API_TOKEN: &a22 ${{ steps.bws_finish.outputs.NOTION_API_TOKEN }}
          TINYFISH_API_KEY: &a23 ${{ steps.bws_finish.outputs.TINYFISH_API_KEY }}
        run: python -m lifeos.run sync-seen $([ "$LIVE" = "true" ] && echo --live)
      - id: purge
        continue-on-error: true
        name: Step 8b - retention purge
        if: *a6
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: *a7
          FIT_PROFILE_EXTRA_JSON: *a8
          FIT_PROFILE_JSON: *a9
          JOBRIGHT_EMAIL: *a10
          JOBRIGHT_PASSWORD: *a11
          LIFEOS_ACQ_DB_NAME: *a12
          LIFEOS_ACQ_DB_PASSWORD: *a13
          LIFEOS_ACQ_DB_USER: *a14
          LIFEOS_ACQ_SSH_HOST: *a15
          LIFEOS_ACQ_SSH_JUMP_KEY: *a16
          LIFEOS_ACQ_SSH_JUMP_HOST: *a17
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: *a18
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: *a19
          LIFEOS_ACQ_SSH_PRIVATE_KEY: *a20
          LIFEOS_ACQ_SSH_USER: *a21
          NOTION_API_TOKEN: *a22
          TINYFISH_API_KEY: *a23
          NTFY_TOPIC: ${{ steps.bws_finish.outputs.NTFY_TOPIC }}
          PURGE_FORCE: ${{ inputs.maintenance }}
        run: |
          # D168: the stage decides when it is due (about weekly, 6.5 days after the last success, retried every 6 hours after a failure), so a failed Sunday no longer waits a week.
          status=0
          out=$(python -m lifeos.run purge $([ "$LIVE" = "true" ] && echo --live) 2>&1) || status=$?
          echo "$out"
          last=$(printf '%s\n' "$out" | tail -n 1)
          if [ "$status" = "0" ]; then
            case "$last" in
              *not_due*|*skipped_dry_run*) ;;
              *) python3 -m lifeos.platform.alerts push --key purge_done --title "V7 weekly purge done" --body "$last" || true ;;
            esac
          else
            python3 -m lifeos.platform.alerts push --key purge_failed --title "V7 weekly purge FAILED" --body "$last" || true
            exit 1
          fi
      - id: lanes
        name: Lane failures fail the run (other stages still ran)
        if: ${{ always() }}
        run: |
          failed=""
          for pair in sync_seen=${{ steps.sync_seen.outcome }} purge=${{ steps.purge.outcome }}; do
            [ "${pair#*=}" = "failure" ] && failed="$failed ${pair%=*}"
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
          if [ -n "$failed" ]; then echo "FAILED STAGES:$failed"; exit 1; fi
