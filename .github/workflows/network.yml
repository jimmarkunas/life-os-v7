name: network
# Manual only. inspect: read-only, counts only, writes nothing (NET-1a). import: NET-1b, reads the same attached file and records it in the approved Hostinger tables;
# dry unless "Actually write" is ticked (a dry run opens no database connection). No schedule: the seed is one batch and replaying it is a no-op.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "inspect (counts of the file), import (record it in Hostinger) or audit (read-only counts of the stored tables) or match (NET-2.2: read-only counts of network leads; writes nothing) or surface (NET-2.3: the Network Leads block on Job Ledger pages; dry unless Actually write)"
        type: choice
        options: ["inspect", "import", "audit", "match", "surface"]
        default: "inspect"
      pages:
        description: "surface only: the most Ledger pages one run may read (default 40; 1 for a first acceptance run)"
        type: string
        default: "40"
      live:
        description: "import or surface only: actually write (import: Hostinger tables; surface: the two surface tables and the owned Network Leads block). Unticked = dry run, counts only"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: life-os-v7-network
  cancel-in-progress: false
jobs:
  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python
      - id: bws_network
        name: Load the migrated credentials from Bitwarden (EDGE-1.3, exactly these 8; masked step outputs only, nothing exported job-wide; the job fails if retrieval fails, no fallback)
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            d71bbaed-6a6c-49b5-8a1f-b4db015ecfda > LIFEOS_ACQ_DB_NAME
            00d82e0d-be10-4c8c-bdbe-b4db015ed389 > LIFEOS_ACQ_DB_PASSWORD
            9422b842-3bb0-4153-bb8d-b4db015ed746 > LIFEOS_ACQ_DB_USER
            6f1c86f6-c48f-4e77-b65d-b4db015edb15 > LIFEOS_ACQ_SSH_HOST
            b65dd2fc-2573-4bda-9e80-b4db015edec6 > LIFEOS_ACQ_SSH_KNOWN_HOSTS
            7ada9cea-8711-4b37-bef9-b4db015ee298 > LIFEOS_ACQ_SSH_PRIVATE_KEY
            6b3e12b9-1987-4073-bda2-b4db015ee653 > LIFEOS_ACQ_SSH_USER
            53dc3d04-dbb2-45fe-8185-b4db015eedcb > NOTION_API_TOKEN
      - name: Network (reads the attached CSV through Notion; prints counts only)
        env:
          NETWORK_HANDOFF_PAGE_ID: ${{ secrets.NETWORK_HANDOFF_PAGE_ID }}
          NOTION_JOB_LEDGER_DATA_SOURCE_ID: ${{ secrets.NOTION_JOB_LEDGER_DATA_SOURCE_ID }}
          LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
          STAGE: ${{ inputs.stage }}
          LIVE: ${{ inputs.live }}
          PAGES: ${{ inputs.pages }}
          LIFEOS_ACQ_DB_NAME: ${{ steps.bws_network.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: ${{ steps.bws_network.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: ${{ steps.bws_network.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: ${{ steps.bws_network.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ steps.bws_network.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ steps.bws_network.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: ${{ steps.bws_network.outputs.LIFEOS_ACQ_SSH_USER }}
          NOTION_API_TOKEN: ${{ steps.bws_network.outputs.NOTION_API_TOKEN }}
        run: python -m lifeos.run "network-$STAGE" $([ "$STAGE" = "surface" ] && echo --limit "$PAGES") $( { [ "$STAGE" = "import" ] || [ "$STAGE" = "surface" ]; } && [ "$LIVE" = "true" ] && echo --live)
