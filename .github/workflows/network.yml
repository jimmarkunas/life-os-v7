name: network
# Manual only. inspect: read-only, counts only, writes nothing (NET-1a). import: NET-1b, reads the same attached file and records it in the approved Hostinger tables;
# dry unless "Actually write" is ticked (a dry run opens no database connection). No schedule: the seed is one batch and replaying it is a no-op.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "inspect (counts of the file), import (record it in Hostinger) or audit (read-only counts of the stored tables) or match (NET-2.2: read-only counts of network leads; writes nothing) or surface (NET-2.3: the Network Leads block on Job Ledger pages; dry unless Actually write) or layout (Jim, Oct 27: move flat Ledger pages to the approved two-column layout, one page proven at a time; dry unless Actually write)"
        type: choice
        options: ["inspect", "import", "audit", "match", "surface", "layout"]
        default: "inspect"
      pages:
        description: "surface or layout only: the most Ledger pages one run may read (surface default 40, layout 20; 1 for a first acceptance run)"
        type: string
        default: "40"
      shard:
        description: "layout only: i/n (for example 0/4) - this run moves only its own slice of the pages, so up to 8 layout runs can go at once; leave 0/1 for all"
        type: string
        default: "0/1"
      live:
        description: "import, surface or layout only: actually write (import: Hostinger tables; surface: the two surface tables and the owned Network Leads block; layout: the Ledger pages' layout and the layout table). Unticked = dry run, counts only"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ inputs.stage == 'layout' && format('life-os-v7-network-layout-{0}', inputs.shard) || 'life-os-v7-network' }}
  cancel-in-progress: false
jobs:
  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python
      - id: bws_network
        name: Load the migrated credentials from Bitwarden (EDGE-1.3, exactly these 11; masked step outputs only, nothing exported job-wide; the job fails if retrieval fails, no fallback)
        continue-on-error: true                 # D209: one retry below; the retry fails the job
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            d71bbaed-6a6c-49b5-8a1f-b4db015ecfda > LIFEOS_ACQ_DB_NAME
            00d82e0d-be10-4c8c-bdbe-b4db015ed389 > LIFEOS_ACQ_DB_PASSWORD
            9422b842-3bb0-4153-bb8d-b4db015ed746 > LIFEOS_ACQ_DB_USER
            6f1c86f6-c48f-4e77-b65d-b4db015edb15 > LIFEOS_ACQ_SSH_HOST
            b65dd2fc-2573-4bda-9e80-b4db015edec6 > LIFEOS_ACQ_SSH_KNOWN_HOSTS
            7ada9cea-8711-4b37-bef9-b4db015ee298 > LIFEOS_ACQ_SSH_PRIVATE_KEY
            6b3e12b9-1987-4073-bda2-b4db015ee653 > LIFEOS_ACQ_SSH_USER
            192db2d1-be66-4fca-b9b5-b4e900240507 > LIFEOS_ACQ_SSH_JUMP_KEY
            454e12df-637f-4f65-9ec1-b4e30052942f > TAILSCALE_OAUTH_CLIENT_ID
            e54f0a84-84c3-47d8-8b5b-b4e30052d6e9 > TAILSCALE_OAUTH_CLIENT_SECRET
            53dc3d04-dbb2-45fe-8185-b4db015eedcb > NOTION_API_TOKEN
      - name: Bitwarden refused or timed out (429 / 5xx) - pause before the one retry
        if: ${{ steps.bws_network.outcome == 'failure' }}
        run: sleep $((30 + RANDOM % 45))
      - id: bws_network_retry
        name: Load the same credentials from Bitwarden - the one retry (the job fails if it fails, no fallback)
        if: ${{ steps.bws_network.outcome == 'failure' }}
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            d71bbaed-6a6c-49b5-8a1f-b4db015ecfda > LIFEOS_ACQ_DB_NAME
            00d82e0d-be10-4c8c-bdbe-b4db015ed389 > LIFEOS_ACQ_DB_PASSWORD
            9422b842-3bb0-4153-bb8d-b4db015ed746 > LIFEOS_ACQ_DB_USER
            6f1c86f6-c48f-4e77-b65d-b4db015edb15 > LIFEOS_ACQ_SSH_HOST
            b65dd2fc-2573-4bda-9e80-b4db015edec6 > LIFEOS_ACQ_SSH_KNOWN_HOSTS
            7ada9cea-8711-4b37-bef9-b4db015ee298 > LIFEOS_ACQ_SSH_PRIVATE_KEY
            6b3e12b9-1987-4073-bda2-b4db015ee653 > LIFEOS_ACQ_SSH_USER
            192db2d1-be66-4fca-b9b5-b4e900240507 > LIFEOS_ACQ_SSH_JUMP_KEY
            454e12df-637f-4f65-9ec1-b4e30052942f > TAILSCALE_OAUTH_CLIENT_ID
            e54f0a84-84c3-47d8-8b5b-b4e30052d6e9 > TAILSCALE_OAUTH_CLIENT_SECRET
            53dc3d04-dbb2-45fe-8185-b4db015eedcb > NOTION_API_TOKEN
      - name: LIFE-85 - join the tailnet as the ephemeral tag:v7-runner node (the store's Oracle fallback; the policy admits it only to Oracle TCP 22 and 47341; a failed join only means no fallback)
        continue-on-error: true
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd   # v4.2.0
        with:
          oauth-client-id: ${{ steps.bws_network.outputs.TAILSCALE_OAUTH_CLIENT_ID || steps.bws_network_retry.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_network.outputs.TAILSCALE_OAUTH_CLIENT_SECRET || steps.bws_network_retry.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
          use-cache: "false"
      - name: Network (reads the attached CSV through Notion; prints counts only)
        env:
          NETWORK_HANDOFF_PAGE_ID: ${{ secrets.NETWORK_HANDOFF_PAGE_ID }}
          NOTION_JOB_LEDGER_DATA_SOURCE_ID: ${{ secrets.NOTION_JOB_LEDGER_DATA_SOURCE_ID }}
          LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
          STAGE: ${{ inputs.stage }}
          LIVE: ${{ inputs.live }}
          PAGES: ${{ inputs.pages }}
          LAYOUT_SHARD: ${{ inputs.shard }}
          LIFEOS_ACQ_DB_NAME: ${{ steps.bws_network.outputs.LIFEOS_ACQ_DB_NAME || steps.bws_network_retry.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: ${{ steps.bws_network.outputs.LIFEOS_ACQ_DB_PASSWORD || steps.bws_network_retry.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: ${{ steps.bws_network.outputs.LIFEOS_ACQ_DB_USER || steps.bws_network_retry.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: ${{ steps.bws_network.outputs.LIFEOS_ACQ_SSH_HOST || steps.bws_network_retry.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: ${{ steps.bws_network.outputs.LIFEOS_ACQ_SSH_JUMP_KEY || steps.bws_network_retry.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_JUMP_HOST: ${{ vars.V7_STORE_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: ${{ vars.V7_STORE_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_VIA: ${{ vars.V7_STORE_VIA }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ steps.bws_network.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS || steps.bws_network_retry.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ steps.bws_network.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY || steps.bws_network_retry.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: ${{ steps.bws_network.outputs.LIFEOS_ACQ_SSH_USER || steps.bws_network_retry.outputs.LIFEOS_ACQ_SSH_USER }}
          NOTION_API_TOKEN: ${{ steps.bws_network.outputs.NOTION_API_TOKEN || steps.bws_network_retry.outputs.NOTION_API_TOKEN }}
        run: python -m lifeos.run "network-$STAGE" $( { [ "$STAGE" = "surface" ] || [ "$STAGE" = "layout" ]; } && echo --limit "$PAGES") $( { [ "$STAGE" = "import" ] || [ "$STAGE" = "surface" ] || [ "$STAGE" = "layout" ]; } && [ "$LIVE" = "true" ] && echo --live)
