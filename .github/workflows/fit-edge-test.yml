name: fit-edge-test
# LIFE-60 (Jim's approval, Jira 10361): the manual, synthetic-only proof of the Oracle `fit1` verb. Manual only, never scheduled and never part of a tick; it writes nothing. It joins the tailnet as the
# existing ephemeral tag:v7-runner node (the same identity the iMessage job uses) and reaches only Oracle TCP 47341. mode "negative" sends the refusal probes (no model call expected); any other value is one
# fixture label from lifeos/jobs/fit/edge_fixtures.json: one real model invocation on Oracle's own 20-per-day budget. Nothing is retried.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SYNTHETIC to confirm that only the committed synthetic fixtures or probes are sent"
        required: true
        type: string
      mode:
        description: "negative (refusal probes only) or one fixture label from the manifest (one real model call)"
        required: true
        type: string
        default: "negative"
permissions:
  contents: read
concurrency:
  group: life-os-v7-fit-edge
  cancel-in-progress: false
jobs:
  fit_edge:
    if: ${{ inputs.confirm == 'SYNTHETIC' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python
      - id: bws_fit_edge
        name: Load the tailnet and Oracle host values from Bitwarden (exactly these 3; masked step outputs only; the job fails if retrieval fails, no fallback)
        continue-on-error: true                 # D209: one retry below; the retry fails the job
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            454e12df-637f-4f65-9ec1-b4e30052942f > TAILSCALE_OAUTH_CLIENT_ID
            e54f0a84-84c3-47d8-8b5b-b4e30052d6e9 > TAILSCALE_OAUTH_CLIENT_SECRET
            6590208b-506d-4238-ab10-b4e30051b25f > IMESSAGE_ALERTS_HOST
      - name: Bitwarden refused or timed out (429 / 5xx) - pause before the one retry
        if: ${{ steps.bws_fit_edge.outcome == 'failure' }}
        run: sleep $((30 + RANDOM % 45))
      - id: bws_fit_edge_retry
        name: Load the same credentials from Bitwarden - the one retry (the job fails if it fails, no fallback)
        if: ${{ steps.bws_fit_edge.outcome == 'failure' }}
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            454e12df-637f-4f65-9ec1-b4e30052942f > TAILSCALE_OAUTH_CLIENT_ID
            e54f0a84-84c3-47d8-8b5b-b4e30052d6e9 > TAILSCALE_OAUTH_CLIENT_SECRET
            6590208b-506d-4238-ab10-b4e30051b25f > IMESSAGE_ALERTS_HOST
      - name: Join the tailnet as an ephemeral tag:v7-runner node (the tailnet policy admits it only to Oracle TCP 47341)
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd   # v4.2.0
        with:
          oauth-client-id: ${{ steps.bws_fit_edge.outputs.TAILSCALE_OAUTH_CLIENT_ID || steps.bws_fit_edge_retry.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_fit_edge.outputs.TAILSCALE_OAUTH_CLIENT_SECRET || steps.bws_fit_edge_retry.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
          use-cache: "false"
      - name: Synthetic Fit proof (writes nothing; synthetic content only in the log)
        env:
          IMESSAGE_ALERTS_HOST: ${{ steps.bws_fit_edge.outputs.IMESSAGE_ALERTS_HOST || steps.bws_fit_edge_retry.outputs.IMESSAGE_ALERTS_HOST }}
          FIT_EDGE_MODE: ${{ inputs.mode }}
        run: |
          python -m lifeos.run fit-edge-test | tee "$RUNNER_TEMP/fit.out"
          grep -q '"failed": 0' "$RUNNER_TEMP/fit.out"        # a refused or unproven test is a red job, never a green one
