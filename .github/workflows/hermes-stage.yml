name: hermes-stage
# LIFE-307 (Jim, Nov 5, 2026: "Approved, go"). MANUAL run of the `hermes` stage (lifeos/hermes_requests.py): every LIFE issue in Agent Go that carries the label `hermes` gets ONE signed,
# correlated Buzz request to Hermes; nothing new means nothing is posted. Dry run unless `live`. NO schedule, no timer, no loop: a person (or an authorized agent) starts it.
# It holds the Jira credentials (from Bitwarden, as the `jira` job does) and the stage's own scoped Buzz member key (a repository secret). No Notion, mail, Calendar or Oracle access.
# Counts and fixed codes only.
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Actually post the Buzz requests (false = dry run: Jira and Buzz are read, nothing is posted)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: life-os-v7-hermes-stage
  cancel-in-progress: false
jobs:
  hermes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the exact commit (own git fetch; the token is passed once and never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - uses: ./.github/actions/python
      - name: Bitwarden helper from a saved, fingerprint-checked copy (LIFE-406; downloads, with a long retry, only when no saved copy exists)
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "200"
      - id: bws_hermes
        name: Load the Jira credentials from Bitwarden (exactly these 2; masked step outputs only, nothing exported job-wide; the job fails if retrieval fails, no fallback)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            3fa6f4f4-bd6d-45e7-8f2c-b4db015ec0c3 > JIRA_API_TOKEN
            e6466367-9a55-4899-ae1c-b4db015ec49f > JIRA_EMAIL
      - name: Hermes stage (every Agent Go issue labelled hermes without a request; dry run unless live; counts and fixed codes only)
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_TOKEN: ${{ steps.bws_hermes.outputs.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ steps.bws_hermes.outputs.JIRA_EMAIL }}
          BUZZ_URL_LIFE_OS: ${{ secrets.BUZZ_URL_LIFE_OS }}
          BUZZ_STAGE_CHANNEL: ${{ secrets.BUZZ_STAGE_CHANNEL }}
          BUZZ_STAGE_HERMES_PUBKEY: ${{ secrets.BUZZ_STAGE_HERMES_PUBKEY }}
          BUZZ_STAGE_KEY: ${{ secrets.BUZZ_STAGE_KEY }}
          LIVE: ${{ inputs.live }}
        run: python -m lifeos.run hermes $([ "$LIVE" = "true" ] && echo --live)
