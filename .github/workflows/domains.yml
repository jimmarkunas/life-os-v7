name: domains
run-name: ${{ github.event_name == 'workflow_run' && 'domains (after tick)' || 'domains (manual)' }}
# The V7 domain jobs: Jira, Outlook (calendar sync), Bills, Agenda (Calendar card) and Amazon Orders. Each reads or writes ONE provider and none
# touches the Jobs pipeline, so they live apart from hourly.yml: this workflow declares NO secrets at the top, so a job can only see what its own steps pass it
# (isolation by construction, not by blanking). Failures are warnings. Runs by itself a few minutes after every hourly TICK (not after a manual hourly run or one the gate cancelled), and by hand with the inputs below.
on:
  workflow_run:
    workflows: ["hourly"]
    types: [completed]
  workflow_dispatch:
    inputs:
      all:
        description: "Run every domain job like an hourly tick does (Jira snapshot + card, Outlook, Bills, Agenda, Amazon, Physical Mail, Hiring Pipeline); dry run unless Actually write is ticked"
        type: boolean
        default: false
      amazon:
        description: "Amazon Orders only (replay from the last recorded order); dry run unless Actually write is ticked"
        type: boolean
        default: false
      physical_mail:
        description: "Physical Mail / Mail Alerts only (MAIL-1.2): read the vendor notices (Gmail, read-only) into the private state and render the Mail Alerts callout; dry run unless Actually write is ticked"
        type: boolean
        default: false
      physical_mail_anchor:
        description: "Physical Mail FIRST run only: how many items were waiting on October 4, 2026 (Jim's anchor). Ignored once the state row exists"
        type: string
        default: ""
      physical_mail_tracking:
        description: "Physical Mail, ONE piece only (temporary until a tracking reader is authorized): mail number | carrier | service | tracking number | bundle. Stored with that piece, not a standing setting"
        type: string
        default: ""
      hiring:
        description: "Hiring Pipeline only (HIRE-1.2, no mail): the Job Ledger Applied state, the Hiring Pipeline pages and the Calendar into the private state row and the floating Hiring Pipeline region; dry run unless Actually write is ticked"
        type: boolean
        default: false
      hiring_outcome_stale_hours:
        description: "Hiring Pipeline PROOF only (LIFE-19, E13): treat the last outcome-mail scan as stale after this many hours (0 to 17; blank = the real 18). 0 shows the DEGRADED banner with the last accepted rows kept; the next normal run clears it. Never loosens the real limit"
        type: string
        default: ""
      imessage:
        description: "iMessage urgent alerts only (COMM-1.4b, LIFE-31): metadata from the private Oracle endpoint over the tailnet; dry run unless Actually write is ticked"
        type: boolean
        default: false
      dcc:
        description: "Daily Command Center only (D175): V7 writes the Command Center callout from the first lines of the other cards; dry run unless Actually write is ticked"
        type: boolean
        default: false
      recruiters:
        description: "Recruiters only (RECR-1.2): Gmail and Outlook Inbox and Junk, last 14 days, into the Recruiters data source (counts only); dry run unless Actually write is ticked"
        type: boolean
        default: false
      interview_convert:
        description: "Interview OS page conversion (Jim, Oct 21): inventory = classify every opportunity page, write nothing; all = convert the legacy ones a few per run (cap INTERVIEW_CONVERT_CAP, default 2) with Jim's content proven unchanged, stopping at the first failure. Blank = the INTERVIEW_CONVERT repository variable"
        type: string
        default: ""
      interview_mail_days:
        description: "Interview OS dry run only (LIFE-88): read this many days of mail for scheduling requests, 14 to 90, instead of 14. Ignored when Actually write is ticked. Leave blank for the usual 14"
        type: string
        default: ""
      interview_journey_proof:
        description: "Synthetic Interview journey proof (LIFE-78): type QA, tick Recruiters, leave Actually write UNticked. Runs the real Interview OS runner on a fresh sandbox under the QA Interview OS page with invented mail, Calendar and Ledger; the real Hiring Pipeline, mailbox, calendar and Ledger are untouched. Blank = the normal Interview step"
        type: string
        default: ""
      calendar_sync:
        description: "Calendar sync only (Outlook invites to your Google calendar, counts only); dry run unless Actually write is ticked"
        type: boolean
        default: false
      allow_mass_delete:
        description: "Calendar sync only: skip the mass-delete brake for THIS run (use only when Outlook answered in full but every event id changed; the brake refuses to delete more than half of V7's copies)"
        type: boolean
        default: false
      megibow:
        description: "MegIBOW only: Jim's weekly job-search table (sent mail and calendars to the Notion block); dry run (counts) unless Actually write is ticked"
        type: boolean
        default: false
      bills_paid:
        description: "Bills: process Paid=true rows (advance Due Date, set Last Paid, clear Paid); also runs on every tick and under Run every domain job. Dry run (counts) unless Actually write is ticked"
        type: boolean
        default: false
      jira:
        description: "Jira only (unticked 'Run every domain job' above): snapshot, card, report (both), rollover, rollover+snapshot, a read-only layout probe, or the Jim & Matt dashboard (JFM-221)"
        type: choice
        options: ["none", "snapshot", "card", "report", "rollover", "both", "probe", "dashboard"]
        default: "none"
      refresh:
        description: "Close screen refresh (Jim, Oct 24): hiring = redraw the Hiring Pipeline region right after a verified close; recruiters = redraw only the Recruiter Outreach table after a verified recruiter close, status or Mark as Sent (no mail read). It queues in the after-tick group, so it never runs beside another Daily Report writer; the Close service skips it when a run is already waiting"
        type: choice
        options: ["none", "hiring", "recruiters"]
        default: "none"
      benchmark:
        description: "Benchmark (LIFE-577, manual only): runs every domain job like `all` in DRY mode (nothing is written, `live` is ignored), refuses to start while another hourly or domains run is in progress, and ends with a summary of seconds per job, the run's wall time and an overlap check, so two runs are comparable."
        type: boolean
        default: false
      live:
        description: "Actually write (saves snapshots, writes Notion, moves mail). Unticked = dry run, counts only. Automatic runs follow the repo variable V7_LIVE."
        type: boolean
        default: false
env:
  ALERTS_MUTED_UNTIL: ${{ vars.ALERTS_MUTED_UNTIL }}      # LIFE-73: silences every alert channel until this time (lifeos.platform.alerts.muted); empty = not muted
  ALERTS_ENABLED: ${{ vars.ALERTS_ENABLED }}      # LIFE-75: the master switch from the Alert settings page; anything but "on" means alerts are OFF (lifeos.platform.alert_settings)
  ALERT_SETTINGS: ${{ vars.ALERT_SETTINGS }}      # LIFE-75: per-alert channel choices from the Alert settings page; empty = the registry defaults
  LIVE: ${{ ((github.event_name == 'workflow_run' && vars.V7_LIVE == 'true') || (github.event_name == 'workflow_dispatch' && inputs.live && !inputs.benchmark)) && 'true' || 'false' }}
permissions:
  contents: read
concurrency:
  # A run that will do nothing (a workflow_run after a manual hourly run, or after one the gate cancelled: every job below is skipped by its `if`) still joins its concurrency
  # group, and a group holds only one WAITING run, so such a run cancels the real run that is waiting (the Oct 20-21 stall: no card refreshed for two and a half hours). It gets
  # its own group, which nothing else uses, so it can only wait behind or replace other do-nothing runs. A manual (workflow_dispatch) run has its own group too: a string of manual
  # runs (8-16 minutes each) otherwise kept the one slot busy and replaced the waiting after-tick runs (Oct 21). The manual Amazon and Recruiters workflows queue behind 'life-os-v7-domains'.
  # A Close screen refresh (inputs.refresh) joins the after-tick group instead: it writes the Hiring Pipeline region, which only one Daily Report writer may change at a time.
  group: ${{ (github.event_name == 'workflow_dispatch' && (inputs.refresh == 'hiring' || inputs.refresh == 'recruiters')) && 'life-os-v7-domains' || github.event_name != 'workflow_run' && 'life-os-v7-domains-manual' || ((github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.display_title != 'tick') && 'life-os-v7-domains-idle' || 'life-os-v7-domains') }}
  cancel-in-progress: false
jobs:
  gate:
    # LIFE-604 item 11: the ONE place that decides whether this run does the domain work, and the benchmark's overlap refusal (LIFE-577). It runs only for a completed tick, `all`, or a
    # benchmark; a manual run of one domain skips it, and then a domain job runs only on its own input. Outputs: due_<job> (LIFE-609: one per domain job, from lifeos/platform/due_table.json; for a tick a job is due when its row says
    # so, for `all` or a benchmark every job is due), tick (only a tick: imessage, granola and the failure push depend on that) and all (only `all` or a benchmark). A benchmark refuses to start while another hourly or domains run is queued or
    # running; a refusal fails this job and every domain job then skips (their `needs.gate.result != 'failure'`).
    # Why each domain job uses always() or !cancelled(): a job that waits for other page writers (needs: ...) uses always() so one failed writer never stops the next card; a job with
    # no writer to wait for uses !cancelled(). Both skip when the gate failed or the run was cancelled, and both run on their own manual input without the gate.
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.display_title == 'tick') || (inputs.all || inputs.benchmark) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tick: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.display_title == 'tick') }}
      all: ${{ (inputs.all || inputs.benchmark) }}
      due_jira: ${{ steps.due.outputs.due_jira }}
      due_outlook: ${{ steps.due.outputs.due_outlook }}
      due_bills: ${{ steps.due.outputs.due_bills }}
      due_agenda: ${{ steps.due.outputs.due_agenda }}
      due_amazon: ${{ steps.due.outputs.due_amazon }}
      due_amazon_retention: ${{ steps.due.outputs.due_amazon_retention }}
      due_mail: ${{ steps.due.outputs.due_mail }}
      due_hiring: ${{ steps.due.outputs.due_hiring }}
      due_megibow: ${{ steps.due.outputs.due_megibow }}
      due_dcc: ${{ steps.due.outputs.due_dcc }}
      due_recruiters: ${{ steps.due.outputs.due_recruiters }}
      due_imessage: ${{ steps.due.outputs.due_imessage }}
      due_granola: ${{ steps.due.outputs.due_granola }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Benchmark gate (LIFE-577) - refuses while another run is in progress
        if: ${{ inputs.benchmark }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m lifeos.platform.bench_gate before
      - id: due
        name: Which domain jobs are due (LIFE-609) - one table, each job's last successful run; an unreadable history makes every job due
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m lifeos.platform.due
  jira:
    # Jira runs in its OWN job, like Interview: scheduled and tick runs refresh the snapshot and the report card (rollover stays manual), only the Jira secrets (the database secrets are
    # re-supplied to the snapshot step alone), and a failure is a warning that never fails the Jobs run.
    needs: [gate]
    if: ${{ !cancelled() && needs.gate.result != 'failure' && (needs.gate.outputs.due_jira == 'true' || (github.event_name == 'workflow_dispatch' && inputs.jira != 'none')) }}   # D212: an empty input (a workflow_run after a manual or cancelled hourly run) is not a request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_BOARDS: ${{ secrets.JIRA_BOARDS }}
      JIRA_GTV_EPIC: ${{ secrets.JIRA_GTV_EPIC }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/python
      - name: Bitwarden helper from a saved, fingerprint-checked copy (LIFE-406; downloads, with a long retry, only when no saved copy exists)
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "300"
      - id: bws_jira
        name: Load the migrated credentials from Bitwarden (EDGE-1.3, exactly these 14; masked step outputs only, nothing exported job-wide; the job fails if retrieval fails, no fallback)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            3fa6f4f4-bd6d-45e7-8f2c-b4db015ec0c3 > JIRA_API_TOKEN
            e6466367-9a55-4899-ae1c-b4db015ec49f > JIRA_EMAIL
            d71bbaed-6a6c-49b5-8a1f-b4db015ecfda > LIFEOS_ACQ_DB_NAME
            00d82e0d-be10-4c8c-bdbe-b4db015ed389 > LIFEOS_ACQ_DB_PASSWORD
            9422b842-3bb0-4153-bb8d-b4db015ed746 > LIFEOS_ACQ_DB_USER
            6f1c86f6-c48f-4e77-b65d-b4db015edb15 > LIFEOS_ACQ_SSH_HOST
            b65dd2fc-2573-4bda-9e80-b4db015edec6 > LIFEOS_ACQ_SSH_KNOWN_HOSTS
            7ada9cea-8711-4b37-bef9-b4db015ee298 > LIFEOS_ACQ_SSH_PRIVATE_KEY
            6b3e12b9-1987-4073-bda2-b4db015ee653 > LIFEOS_ACQ_SSH_USER
            192db2d1-be66-4fca-b9b5-b4e900240507 > LIFEOS_ACQ_SSH_JUMP_KEY
            454e12df-637f-4f65-9ec1-b4e30052942f > TAILSCALE_OAUTH_CLIENT_ID
            e54f0a84-84c3-47d8-8b5b-b4e30052d6e9 > TAILSCALE_OAUTH_CLIENT_SECRET
            53f47cb9-f6bb-4cde-87f4-b4db015ef928 > NOTION_JIRA_TOKEN
            83c553e9-23a6-45aa-9006-b4db015f00ac > NTFY_TOPIC
      - name: LIFE-85 - join the tailnet as the ephemeral tag:v7-runner node (the store's Oracle fallback; the policy admits it only to Oracle TCP 22 and 47341; a failed join only means no fallback)
        continue-on-error: true
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd   # v4.2.0
        with:
          oauth-client-id: ${{ steps.bws_jira.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_jira.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
          use-cache: "false"
      - id: jrollauto
        continue-on-error: true
        name: Jira sprint rollover (scheduled; waits for the sprint to end and Monday 6 AM; live only when V7_LIVE)
        if: ${{ needs.gate.outputs.due_jira == 'true' }}
        env:
          JIRA_API_TOKEN: ${{ steps.bws_jira.outputs.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ steps.bws_jira.outputs.JIRA_EMAIL }}
        run: python -m lifeos.run jira-rollover-scheduled $([ "$LIVE" = "true" ] && echo --live)
      - id: jrollwatch
        continue-on-error: true
        name: Jira rollover watch (pages the phone when the scheduled rollover has not worked for 3 hours; one private state row; counts only)
        if: ${{ always() && steps.jrollauto.outcome != 'skipped' }}
        env:
          JIRA_ROLLOVER_OUTCOME: ${{ steps.jrollauto.outcome }}
          NTFY_TOPIC: ${{ steps.bws_jira.outputs.NTFY_TOPIC }}
          LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
          LIFEOS_ACQ_DB_NAME: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_JUMP_HOST: ${{ vars.V7_STORE_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: ${{ vars.V7_STORE_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_VIA: ${{ vars.V7_STORE_VIA }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_USER }}
        run: python -m lifeos.run jira-rollover-watch $([ "$LIVE" = "true" ] && echo --live)
      - id: jsnap
        continue-on-error: true
        name: Jira snapshot (counts only; saved to the private database only when live)
        if: ${{ inputs.jira == 'snapshot' || inputs.jira == 'both' || inputs.jira == 'report' || needs.gate.outputs.due_jira == 'true' }}
        env:
          LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
          JIRA_API_TOKEN: ${{ steps.bws_jira.outputs.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ steps.bws_jira.outputs.JIRA_EMAIL }}
          LIFEOS_ACQ_DB_NAME: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_JUMP_HOST: ${{ vars.V7_STORE_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: ${{ vars.V7_STORE_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_VIA: ${{ vars.V7_STORE_VIA }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_USER }}
        run: python -m lifeos.run jira-snapshot $([ "$LIVE" = "true" ] && echo --live)
      - id: jcard
        continue-on-error: true
        name: Jira card (Daily Report; counts only; the page is written only when live)
        if: ${{ inputs.jira == 'card' || inputs.jira == 'report' || needs.gate.outputs.due_jira == 'true' }}
        env:
          JIRA_CARD_BLOCK_ID: ${{ secrets.JIRA_CARD_BLOCK_ID }}
          JIRA_CARD_PROJECTS: ${{ secrets.JIRA_CARD_PROJECTS }}
          JIRA_SITE_URL: ${{ secrets.JIRA_SITE_URL }}
          JIRA_GTV_CONTEXT_URL: ${{ secrets.JIRA_GTV_CONTEXT_URL }}
          LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
          JIRA_API_TOKEN: ${{ steps.bws_jira.outputs.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ steps.bws_jira.outputs.JIRA_EMAIL }}
          LIFEOS_ACQ_DB_NAME: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_JUMP_HOST: ${{ vars.V7_STORE_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: ${{ vars.V7_STORE_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_VIA: ${{ vars.V7_STORE_VIA }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_USER }}
          NOTION_JIRA_TOKEN: ${{ steps.bws_jira.outputs.NOTION_JIRA_TOKEN }}
        run: python -m lifeos.run jira-card $([ "$LIVE" = "true" ] && echo --live)
      - id: jmdash
        continue-on-error: true
        name: Jim & Matt dashboard from Jira (JFM-221; Wednesday 7 AM CT check-in, quarterly synopsis, completed archive; reads Jira only; Notion written only when live; counts only)
        if: ${{ inputs.jira == 'dashboard' || needs.gate.outputs.due_jira == 'true' }}
        env:
          LIFEOS_NOTION_IDS: ${{ secrets.LIFEOS_NOTION_IDS }}
          JM_DASHBOARD_PAGE_ID: ${{ vars.JM_DASHBOARD_PAGE_ID }}
          MEGIBOW_BLOCK_ID: ${{ secrets.MEGIBOW_BLOCK_ID }}
          JIRA_SITE_URL: ${{ secrets.JIRA_SITE_URL }}
          JIRA_API_TOKEN: ${{ steps.bws_jira.outputs.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ steps.bws_jira.outputs.JIRA_EMAIL }}
          NOTION_JIRA_TOKEN: ${{ steps.bws_jira.outputs.NOTION_JIRA_TOKEN }}
          NTFY_TOPIC: ${{ steps.bws_jira.outputs.NTFY_TOPIC }}
          LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
          LIFEOS_ACQ_DB_NAME: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_JUMP_HOST: ${{ vars.V7_STORE_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: ${{ vars.V7_STORE_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_VIA: ${{ vars.V7_STORE_VIA }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_USER }}
        run: python -m lifeos.run jm-dashboard $([ "$LIVE" = "true" ] && echo --live)
      - id: jprobe
        continue-on-error: true
        name: Jira layout probe (read-only; counts only)
        if: ${{ inputs.jira == 'probe' }}
        env:
          JIRA_API_TOKEN: ${{ steps.bws_jira.outputs.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ steps.bws_jira.outputs.JIRA_EMAIL }}
        run: python -m lifeos.run jira-probe
      - id: jroll
        continue-on-error: true
        name: Jira sprint rollover (dry run unless live; never before the sprint ends)
        if: ${{ inputs.jira == 'rollover' || inputs.jira == 'both' }}
        env:
          JIRA_API_TOKEN: ${{ steps.bws_jira.outputs.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ steps.bws_jira.outputs.JIRA_EMAIL }}
        run: python -m lifeos.run jira-rollover $([ "$LIVE" = "true" ] && echo --live)
      - name: Jira warning (does not fail the run)
        if: ${{ always() && (steps.jsnap.outcome == 'failure' || steps.jcard.outcome == 'failure' || steps.jrollauto.outcome == 'failure' || steps.jrollwatch.outcome == 'failure' || steps.jroll.outcome == 'failure' || steps.jprobe.outcome == 'failure' || steps.jmdash.outcome == 'failure') }}
        run: echo "::warning title=Jira::a Jira step failed; the Jobs pipeline is unaffected"


  outlook:
    # Outlook (read-only) on every scheduled or tick run: meeting invites into your Google calendar. Its own
    # job like Jira and Interview: every other credential is blanked, the Outlook/calendar/database secrets reach only the steps that need
    # them, and a failure is a warning that never fails the Jobs run.
    needs: [gate]
