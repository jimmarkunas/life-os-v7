          tags: tag:v7-runner
          use-cache: "false"
      - id: imsg
        continue-on-error: true
        name: iMessage urgent alerts (metadata only from Oracle; private alert state; counts-only push)
        env:
          LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
          LIFEOS_ACQ_DB_NAME: ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_JUMP_HOST: ${{ vars.V7_STORE_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: ${{ vars.V7_STORE_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_VIA: ${{ vars.V7_STORE_VIA }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_SSH_USER }}
          NTFY_TOPIC: ${{ steps.bws_imessage.outputs.NTFY_TOPIC }}
          IMESSAGE_ALERTS_HOST: ${{ steps.bws_imessage.outputs.IMESSAGE_ALERTS_HOST }}
        run: python -m lifeos.run imessage-alerts $([ "$LIVE" = "true" ] && echo --live)
      - name: iMessage alerts warning (does not fail the run)
        if: ${{ always() && steps.imsg.outcome == 'failure' }}
        run: echo "::warning title=iMessage alerts::the iMessage alert stage failed; no alert was lost (undelivered alerts stay queued)"
      - id: comms
        continue-on-error: true
        if: ${{ always() }}
        # LIFE-34 (Jim's approval Oct 15 2026): the Messages row of the Daily Report's Communications callout. Oracle returns the 7-day unread count and the
        # newest sender's name scrambled under this run's own key; the name is unscrambled only in memory for the Notion write and is never logged or stored.
        name: Communications card, Messages row (7-day unread count and latest sender; counts only in the log; writes only when live)
        env:
          IMESSAGE_ALERTS_HOST: ${{ steps.bws_imessage.outputs.IMESSAGE_ALERTS_HOST }}
          NOTION_JIRA_TOKEN: ${{ steps.bws_imessage.outputs.NOTION_JIRA_TOKEN }}
          ATTENTION_CARD_BLOCK_ID: ${{ secrets.ATTENTION_CARD_BLOCK_ID }}
          AMAZON_CARD_BLOCK_ID: ${{ secrets.AMAZON_CARD_BLOCK_ID }}
          BILLS_CARD_BLOCK_ID: ${{ secrets.BILLS_CARD_BLOCK_ID }}
          CALENDAR_CARD_BLOCK_ID: ${{ secrets.CALENDAR_CARD_BLOCK_ID }}
          JIRA_CARD_BLOCK_ID: ${{ secrets.JIRA_CARD_BLOCK_ID }}
          HIRING_CARD_BLOCK_ID: ${{ secrets.HIRING_CARD_BLOCK_ID }}
        run: python -m lifeos.run imessage-comms --limit 0 $([ "$LIVE" = "true" ] && echo --live)
      - name: Communications card warning (does not fail the run)
        if: ${{ always() && steps.comms.outcome == 'failure' }}
        run: echo "::warning title=Communications card::the Messages row was not updated; the Daily Report keeps its previous update time"
      - id: oracle
        continue-on-error: true
        if: ${{ always() }}
        # Jim's approval Oct 15 2026 (Option B): the Oracle Cloud callout under Communications Attention. Oracle answers numbers only (OCI cost,
        # metrics and limits read as the VM itself; local memory, disk, services). Jim, Oct 24 (#510): written every tick despite the step name, Codex 5h/Week from the AI Capacity reading.
        # LIFE-129 (Jim, Oct 28 2026): the store and the push topic for the off-site backup alert (lifeos/oraclecloud/backup_watch.py), the same values the iMessage alerts step uses.
        name: Oracle Cloud card (daily from 6 AM CT; numbers only in the log; writes only when live)
        env:
          LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
          LIFEOS_ACQ_DB_NAME: ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_JUMP_HOST: ${{ vars.V7_STORE_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: ${{ vars.V7_STORE_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_VIA: ${{ vars.V7_STORE_VIA }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: ${{ steps.bws_imessage.outputs.LIFEOS_ACQ_SSH_USER }}
          NTFY_TOPIC: ${{ steps.bws_imessage.outputs.NTFY_TOPIC }}
          IMESSAGE_ALERTS_HOST: ${{ steps.bws_imessage.outputs.IMESSAGE_ALERTS_HOST }}
          NOTION_JIRA_TOKEN: ${{ steps.bws_imessage.outputs.NOTION_JIRA_TOKEN }}
          ATTENTION_CARD_BLOCK_ID: ${{ secrets.ATTENTION_CARD_BLOCK_ID }}
          AMAZON_CARD_BLOCK_ID: ${{ secrets.AMAZON_CARD_BLOCK_ID }}
          BILLS_CARD_BLOCK_ID: ${{ secrets.BILLS_CARD_BLOCK_ID }}
          CALENDAR_CARD_BLOCK_ID: ${{ secrets.CALENDAR_CARD_BLOCK_ID }}
          JIRA_CARD_BLOCK_ID: ${{ secrets.JIRA_CARD_BLOCK_ID }}
          HIRING_CARD_BLOCK_ID: ${{ secrets.HIRING_CARD_BLOCK_ID }}
        run: python -m lifeos.run oracle-card --limit 0 $([ "$LIVE" = "true" ] && echo --live)
      - name: Oracle Cloud card warning (does not fail the run)
        if: ${{ always() && steps.oracle.outcome == 'failure' }}
        run: echo "::warning title=Oracle Cloud card::the Oracle Cloud card was not updated; it keeps its previous update time"
      - id: capacity
        continue-on-error: true
        if: ${{ always() }}
        # LIFE-77 D228 (Jim, Oct 20 2026: design approved, placed near Oracle Cloud): every readable AI account allowance, from Oracle's no-model `limits` request.
        # Off unless the repository variable V7_AI_CAPACITY_CARD is "on". Jim (Oct 21) moved it out of the half-width column: it sits at the top level of the report, full width, under the last divider; a card still in the old column is replaced by it and then removed.
        name: AI Capacity card (readings only, no model run; numbers only in the log; writes only when live)
        env:
          IMESSAGE_ALERTS_HOST: ${{ steps.bws_imessage.outputs.IMESSAGE_ALERTS_HOST }}
          NOTION_JIRA_TOKEN: ${{ steps.bws_imessage.outputs.NOTION_JIRA_TOKEN }}
          ATTENTION_CARD_BLOCK_ID: ${{ secrets.ATTENTION_CARD_BLOCK_ID }}
          V7_AI_CAPACITY_CARD: ${{ vars.V7_AI_CAPACITY_CARD || 'off' }}
        run: python -m lifeos.run capacity-card --limit 0 $([ "$LIVE" = "true" ] && echo --live)
      - name: AI Capacity card warning (does not fail the run)
        if: ${{ always() && steps.capacity.outcome == 'failure' }}
        run: echo "::warning title=AI Capacity card::the AI Capacity card was not updated; it keeps its previous reading"

  granola:
    # LIFE-122 (Jim, Oct 26 2026: "Approved, go"): the Granola bridge, automatic. After every tick it carries each synced meeting that has not been carried before into its Interview OS
    # round (lifeos/sources/granola_auto.py): Full Transcript page written and read back, catalogued in Hostinger, and only then purged whole from Oracle. A meeting that matches no round is left
    # on Oracle and counted. It writes only when the run is live AND the repository variable GRANOLA_AUTO is "on" (Jim's switch); otherwise it is a dry run that changes nothing.
    # It queues behind the Recruiters job, which holds the one-writer group of the Interview OS pages.
    needs: [recruiters, gate]
    if: ${{ always() && needs.gate.result != 'failure' && ((needs.gate.outputs.tick == 'true' && needs.gate.outputs.due_granola == 'true' && vars.GRANOLA_AUTO != 'off') || needs.gate.outputs.all == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: life-os-v7-interview-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/python
      - name: Bitwarden helper from a saved, fingerprint-checked copy (LIFE-406; downloads, with a long retry, only when no saved copy exists)
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "400"
      - id: bws_granola
        name: Load the Granola credentials from Bitwarden (exactly these 12; masked step outputs only, nothing exported job-wide; the job fails if retrieval fails, no fallback)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            d71bbaed-6a6c-49b5-8a1f-b4db015ecfda > LIFEOS_ACQ_DB_NAME
            00d82e0d-be10-4c8c-bdbe-b4db015ed389 > LIFEOS_ACQ_DB_PASSWORD
            9422b842-3bb0-4153-bb8d-b4db015ed746 > LIFEOS_ACQ_DB_USER
            6f1c86f6-c48f-4e77-b65d-b4db015edb15 > LIFEOS_ACQ_SSH_HOST
            b65dd2fc-2573-4bda-9e80-b4db015edec6 > LIFEOS_ACQ_SSH_KNOWN_HOSTS
            7ada9cea-8711-4b37-bef9-b4db015ee298 > LIFEOS_ACQ_SSH_PRIVATE_KEY
            6b3e12b9-1987-4073-bda2-b4db015ee653 > LIFEOS_ACQ_SSH_USER
            192db2d1-be66-4fca-b9b5-b4e900240507 > LIFEOS_ACQ_SSH_JUMP_KEY
            092b44ae-32cb-453b-8cc2-b4db015ef571 > NOTION_INTERVIEW_TOKEN
            454e12df-637f-4f65-9ec1-b4e30052942f > TAILSCALE_OAUTH_CLIENT_ID
            e54f0a84-84c3-47d8-8b5b-b4e30052d6e9 > TAILSCALE_OAUTH_CLIENT_SECRET
            6590208b-506d-4238-ab10-b4e30051b25f > IMESSAGE_ALERTS_HOST
      - name: Join the tailnet as an ephemeral tag:v7-runner node (the tailnet policy admits it only to Oracle TCP 22 and 47341)
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd   # v4.2.0
        with:
          oauth-client-id: ${{ steps.bws_granola.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_granola.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
          use-cache: "false"
      - id: gran
        continue-on-error: true
        name: Granola auto (every meeting not yet carried; counts and fixed codes only; writes only when live and GRANOLA_AUTO is on)
        env:
          LIFEOS_NOTION_IDS: ${{ secrets.LIFEOS_NOTION_IDS }}
          NOTION_JOB_LEDGER_DATA_SOURCE_ID: ${{ secrets.NOTION_JOB_LEDGER_DATA_SOURCE_ID }}   # LIFE-360 (Jim approved Nov 7, 4:17 PM CT): the readers take opportunities from Ledger rows first (read-only, Interview token)
          HIRING_PIPELINE_PAGE_ID: ${{ secrets.HIRING_PIPELINE_PAGE_ID }}
          LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
          LIFEOS_ACQ_SSH_JUMP_HOST: ${{ vars.V7_STORE_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: ${{ vars.V7_STORE_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_VIA: ${{ vars.V7_STORE_VIA }}
          LIFEOS_ACQ_DB_NAME: ${{ steps.bws_granola.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: ${{ steps.bws_granola.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: ${{ steps.bws_granola.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: ${{ steps.bws_granola.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: ${{ steps.bws_granola.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ steps.bws_granola.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ steps.bws_granola.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: ${{ steps.bws_granola.outputs.LIFEOS_ACQ_SSH_USER }}
          NOTION_INTERVIEW_TOKEN: ${{ steps.bws_granola.outputs.NOTION_INTERVIEW_TOKEN }}
          IMESSAGE_ALERTS_HOST: ${{ steps.bws_granola.outputs.IMESSAGE_ALERTS_HOST }}
          GRANOLA_LIVE: ${{ env.LIVE == 'true' && vars.GRANOLA_AUTO == 'on' && 'true' || 'false' }}
        run: python -m lifeos.run granola-auto $([ "$GRANOLA_LIVE" = "true" ] && echo --live)
      - name: Granola auto warning
        if: ${{ always() && steps.gran.outcome == 'failure' }}
        run: echo "::warning title=Granola auto::the automatic Granola run stopped; nothing is purged from Oracle that is not safely in Notion and the catalog"
      - name: Granola auto stopped - fail this job (LIFE-312) so the run is red and the report job pushes the phone
        if: ${{ always() && steps.gran.outcome == 'failure' }}
        run: exit 1

  report:
    # A failed domain job (a provider outage, a Bitwarden 503) used to be only a workflow warning, so a stale card and a red run reached nobody. This job pushes the phone once per
    # failed tick-triggered run, counts only; a manual run never pushes. It never writes anything.
    needs: [gate, jira, outlook, bills, agenda, amazon, amazon_retention, mail, hiring, megibow, recruiters, dcc, imessage, granola]
    if: ${{ always() && needs.gate.outputs.tick == 'true' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Bitwarden helper from a saved, fingerprint-checked copy (LIFE-406; downloads, with a long retry, only when no saved copy exists)
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "100"
      - id: bws_report
        name: Load the migrated credentials from Bitwarden (EDGE-1.3, exactly these 1; masked step outputs only, nothing exported job-wide; the job fails if retrieval fails, no fallback)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            83c553e9-23a6-45aa-9006-b4db015f00ac > NTFY_TOPIC
      - name: Domain jobs report here (the run is already red; this pushes the phone)
        env:
          NTFY_TOPIC: ${{ steps.bws_report.outputs.NTFY_TOPIC }}
        run: |
          failed=""
          for pair in jira=${{ needs.jira.result }} outlook=${{ needs.outlook.result }} bills=${{ needs.bills.result }} agenda=${{ needs.agenda.result }} amazon=${{ needs.amazon.result }} amazon_retention=${{ needs.amazon_retention.result }} mail=${{ needs.mail.result }} hiring=${{ needs.hiring.result }} megibow=${{ needs.megibow.result }} recruiters=${{ needs.recruiters.result }} dcc=${{ needs.dcc.result }} imessage=${{ needs.imessage.result }} granola=${{ needs.granola.result }}; do
            [ "${pair#*=}" = "failure" ] && failed="$failed ${pair%=*}"
          done
          python3 -m lifeos.platform.alerts push --key domain_jobs_failed --title "V7 domain jobs failed" --body "Failed domain jobs:$failed. Their cards keep the last good content. Open the Actions tab."

  bench_report:
    # LIFE-577: the run summary for a benchmark: seconds per job, the run's wall time, and whether another run overlapped it. Reads this run's own job records; writes nothing else.
    needs: [jira, outlook, bills, agenda, amazon, amazon_retention, mail, hiring, megibow, dcc, recruiters, imessage, granola, report]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.benchmark }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Benchmark summary (LIFE-577) - seconds per job, wall time, overlap check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m lifeos.platform.bench_gate jobs