name: domains
run-name: ${{ (github.event_name == 'workflow_run' || inputs.phase == 'tick') && 'domains (after tick)' || 'domains (manual)' }}
# The V7 domain jobs: Jira, Outlook (calendar sync), Bills, Agenda (Calendar card) and Amazon Orders. Each reads or writes ONE provider and none
# touches the Jobs pipeline, so they live apart from hourly.yml: this workflow declares NO secrets at the top, so a job can only see what its own steps pass it
# (isolation by construction, not by blanking). A failed stage step is a warning while the stages run, then its job ends red (LIFE-649) and the report job pushes the phone. Runs by itself a few minutes after every hourly TICK (not after a manual hourly run or one the gate cancelled), and by hand with the inputs below.
on:
  workflow_run:
    workflows: ["hourly"]
    types: [completed]
  workflow_dispatch:
    inputs:
      all:
        description: "Run every domain job like an hourly tick does (Jira snapshot + card, Outlook, Bills, Agenda, Amazon, Physical Mail, Hiring Pipeline); dry run unless Actually write is ticked"
        type: boolean
        default: false
      amazon:
        description: "Amazon Orders only (replay from the last recorded order); dry run unless Actually write is ticked"
        type: boolean
        default: false
      physical_mail:
        description: "Physical Mail / Mail Alerts only (MAIL-1.2): read the vendor notices (Gmail, read-only) into the private state and render the Mail Alerts callout; dry run unless Actually write is ticked"
        type: boolean
        default: false
      physical_mail_anchor:
        description: "Physical Mail FIRST run only: how many items were waiting on October 4, 2026 (Jim's anchor). Ignored once the state row exists"
        type: string
        default: ""
      physical_mail_tracking:
        description: "Physical Mail, ONE piece only (temporary until a tracking reader is authorized): mail number | carrier | service | tracking number | bundle. Stored with that piece, not a standing setting"
        type: string
        default: ""
      hiring:
        description: "Hiring Pipeline only (HIRE-1.2, no mail): the Job Ledger Applied state, the Hiring Pipeline pages and the Calendar into the private state row and the floating Hiring Pipeline region; dry run unless Actually write is ticked"
        type: boolean
        default: false
      hiring_outcome_stale_hours:
        description: "Hiring Pipeline PROOF only (LIFE-19, E13): treat the last outcome-mail scan as stale after this many hours (0 to 17; blank = the real 18). 0 shows the DEGRADED banner with the last accepted rows kept; the next normal run clears it. Never loosens the real limit"
        type: string
        default: ""
      imessage:
        description: "iMessage urgent alerts only (COMM-1.4b, LIFE-31): metadata from the private Oracle endpoint over the tailnet; dry run unless Actually write is ticked"
        type: boolean
        default: false
      followup:
        description: "Followup lane only (LIFE-789): the one full reconciliation of every approved source, on demand; dry run unless Actually write is ticked (then it saves the thread state, checkpoints and the payload). Needs no tick"
        type: boolean
        default: false
      dcc:
        description: "Daily Command Center only (D175): V7 writes the Command Center callout from the first lines of the other cards; dry run unless Actually write is ticked"
        type: boolean
        default: false
      recruiters:
        description: "Recruiters only (RECR-1.2): Gmail and Outlook Inbox and Junk, last 14 days, into the Recruiters data source (counts only); dry run unless Actually write is ticked"
        type: boolean
        default: false
      interview_convert:
        description: "Interview OS page conversion (Jim, Oct 21): inventory = classify every opportunity page, write nothing; all = convert the legacy ones a few per run (cap INTERVIEW_CONVERT_CAP, default 2) with Jim's content proven unchanged, stopping at the first failure. Blank = the INTERVIEW_CONVERT repository variable"
        type: string
        default: ""
      interview_mail_days:
        description: "Interview OS dry run only (LIFE-88): read this many days of mail for scheduling requests, 14 to 90, instead of 14. Ignored when Actually write is ticked. Leave blank for the usual 14"
        type: string
        default: ""
      interview_journey_proof:
        description: "Synthetic Interview journey proof (LIFE-78): type QA, tick Recruiters, leave Actually write UNticked. Runs the real Interview OS runner on a fresh sandbox under the QA Interview OS page with invented mail, Calendar and Ledger; the real Hiring Pipeline, mailbox, calendar and Ledger are untouched. Blank = the normal Interview step"
        type: string
        default: ""
      calendar_sync:
        description: "Calendar sync only (Outlook invites to your Google calendar, counts only); dry run unless Actually write is ticked"
        type: boolean
        default: false
      allow_mass_delete:
        description: "Calendar sync only: skip the mass-delete brake for THIS run (use only when Outlook answered in full but every event id changed; the brake refuses to delete more than half of V7's copies)"
        type: boolean
        default: false
      megibow:
        description: "MegIBOW only: Jim's weekly job-search table (sent mail and calendars to the Notion block); dry run (counts) unless Actually write is ticked"
        type: boolean
        default: false
      bills_paid:
        description: "Bills: process Paid=true rows (advance Due Date, set Last Paid, clear Paid); also runs on every tick and under Run every domain job. Dry run (counts) unless Actually write is ticked"
        type: boolean
        default: false
      jira:
        description: "Jira only (unticked 'Run every domain job' above): snapshot, card, report (both), rollover, rollover+snapshot, a read-only layout probe, or (LIFE-918) writers-check = the read-only Jira writer contract check, reconcile = the LIFE-918 daily Jira reconcile once now (JFM and MEJ as one unit; the live box makes it write), writers-verify = the throwaway-sprint writer verification (dry unless the verify input ends in yes)"
        type: choice
        options: ["none", "snapshot", "card", "report", "rollover", "both", "probe", "writers-check", "writers-verify", "reconcile"]
        default: "none"
      verify:
        description: "LIFE-918, writers-verify only: BOARD ISSUE to verify the Jira writers on a throwaway ZZ-LIFE918-TEST sprint, for example JFM JFM-123 (a dry run: contract check and plan). Add a third word, yes, to really write (JFM JFM-123 yes), and a fourth, keep, to keep the test clone because the Free plan cannot delete issues (JFM JFM-123 yes keep). Only that sprint and that one issue are touched"
        type: string
        default: ""
      refresh:
        description: "Close screen refresh (Jim, Oct 24): hiring = redraw the Hiring Pipeline region right after a verified close; recruiters = redraw only the Recruiter Outreach table after a verified recruiter close, status or Mark as Sent (no mail read). It queues in the after-tick group, so it never runs beside another Daily Report writer; the Close service skips it when a run is already waiting"
        type: choice
        options: ["none", "hiring", "recruiters"]
        default: "none"
      phase:
        description: "LIFE-775, set only by the hourly prep job (do not set by hand): tick = the early run of a tick, started while the tick runs, with every domain job that reads nothing the tick writes; megibow, interview and granola stay with the run that starts when the tick finishes"
        type: choice
        options: ["none", "tick"]
        default: "none"
      tick_run:
        description: "LIFE-904, set only by the hourly prep job (do not set by hand): the run ID of the tick this early run belongs to, so the chain receipt can link both domains runs to it"
        type: string
        default: ""
      live:
        description: "Actually write (saves snapshots, writes Notion, moves mail). Unticked = dry run, counts only. Automatic runs follow the repo variable V7_LIVE."
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # A run that will do nothing (a workflow_run after a manual hourly run, or after one the gate cancelled: every job below is skipped by its `if`) still joins its concurrency
  # group, and a group holds only one WAITING run, so such a run cancels the real run that is waiting (the Oct 20-21 stall: no card refreshed for two and a half hours). It gets
  # its own group, which nothing else uses, so it can only wait behind or replace other do-nothing runs. A manual (workflow_dispatch) run has its own group too: a string of manual
  # runs (8-16 minutes each) otherwise kept the one slot busy and replaced the waiting after-tick runs (Oct 21). The manual Amazon and Recruiters workflows queue behind 'life-os-v7-domains'.
  # A Close screen refresh (inputs.refresh) joins the early group instead: it writes the Hiring Pipeline region, which only one Daily Report writer may change at a time.
  # LIFE-775: a tick makes two runs. The EARLY run (phase tick, started by the hourly prep job) holds 'life-os-v7-domains' with the Hiring Pipeline, Amazon, Recruiters and Mail jobs, so the manual
  # Amazon and Recruiters workflows still queue behind them. The run that starts when the tick FINISHES holds its own group, 'life-os-v7-domains-late' (megibow, interview, granola: they read what the tick
  # writes), so it never waits for the early run; only a real after-tick run joins it, so a do-nothing run cannot replace it. With no early run (its dispatch failed or was cancelled) that run does every job.
  group: ${{ (github.event_name == 'workflow_dispatch' && (inputs.refresh == 'hiring' || inputs.refresh == 'recruiters' || inputs.phase == 'tick')) && 'life-os-v7-domains' || github.event_name != 'workflow_run' && 'life-os-v7-domains-manual' || ((github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.display_title != 'tick') && 'life-os-v7-domains-idle' || 'life-os-v7-domains-late') }}
  cancel-in-progress: false
env:
  STAGE_TIMING_FILE: /tmp/stage-timing-domains.jsonl   # LIFE-855: each standalone stage prints its one `stage_timing` line (names and numbers only); a path, not a secret
jobs:
  gate:
    name: ${{ (inputs.tick_run || github.event.workflow_run.id) && format('gate (tick {0})', inputs.tick_run || github.event.workflow_run.id) || 'gate' }}      # LIFE-904: the tick's run ID is the chain's correlation ID; the chain receipt finds this tick's domains runs by it
    # LIFE-604 item 11: the ONE place that decides whether this run does the domain work. It runs only for a completed tick or `all`; a manual run of one domain skips it, and then a domain job runs only on its own input. Outputs: due_<job> (LIFE-609: one per domain job, from lifeos/platform/due_table.json; for a tick a job is due when its row says
    # so, for `all` every job is due), tick (only a tick: imessage, granola and the failure push depend on that) and all (only `all`). A failed gate makes every domain job skip (their `needs.gate.result != 'failure'`).
    # Why each domain job uses always() or !cancelled(): a job that waits for other page writers (needs: ...) uses always() so one failed writer never stops the next card; a job with
    # no writer to wait for uses !cancelled(). Both skip when the gate failed or the run was cancelled, and both run on their own manual input without the gate.
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.display_title == 'tick') || (github.event_name == 'workflow_dispatch' && inputs.phase == 'tick') || inputs.all }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tick: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.display_title == 'tick') || (github.event_name == 'workflow_dispatch' && inputs.phase == 'tick') }}
      early: ${{ inputs.all || inputs.phase == 'tick' || (github.event_name == 'workflow_run' && steps.cover.outputs.early_covered == 'false') }}      # LIFE-775: the jobs that read nothing the tick writes: the early run, `all`, or the after-tick run when it found no early run
      late: ${{ inputs.all || github.event_name == 'workflow_run' }}      # LIFE-775: megibow, interview, granola: the after-tick run, or `all`
      all: ${{ inputs.all }}
      pipeline: ${{ (github.event_name == 'workflow_run' || inputs.phase == 'tick') && steps.ran.outputs.ran != 'false' }}      # LIFE-856: the tick's hourly `finish` job ran (unreadable counts as ran); Network Leads and the Cloud Fit backlog moved here from it
      due_jira: ${{ steps.due.outputs.due_jira }}
      due_followup: ${{ steps.due.outputs.due_followup }}
      due_outlook: ${{ steps.due.outputs.due_outlook }}
      due_bills: ${{ steps.due.outputs.due_bills }}
      due_agenda: ${{ steps.due.outputs.due_agenda }}
      due_amazon: ${{ steps.due.outputs.due_amazon }}
      due_amazon_retention: ${{ steps.due.outputs.due_amazon_retention }}
      due_mail: ${{ steps.due.outputs.due_mail }}
      due_hiring: ${{ steps.due.outputs.due_hiring }}
      due_megibow: ${{ steps.due.outputs.due_megibow }}
      due_dcc: ${{ steps.due.outputs.due_dcc }}
      due_weekly_review: ${{ steps.due.outputs.due_weekly_review }}
      due_recruiters: ${{ steps.due.outputs.due_recruiters }}
      due_hiring_outcomes: ${{ steps.due.outputs.due_hiring_outcomes }}
      due_interview: ${{ steps.due.outputs.due_interview }}
      due_imessage: ${{ steps.due.outputs.due_imessage }}
      due_granola: ${{ steps.due.outputs.due_granola }}
      due_network_surface: ${{ steps.due.outputs.due_network_surface }}
      due_fit_cloud_backlog: ${{ steps.due.outputs.due_fit_cloud_backlog }}
      due_last_seen_purge: ${{ steps.due.outputs.due_last_seen_purge }}
      granola_auto: ${{ steps.settings.outputs.GRANOLA_AUTO }}      # LIFE-703: the page's value when GitHub holds none; GitHub's own value when the page cannot be read
      imessage_alerts: ${{ steps.settings.outputs.V7_IMESSAGE_ALERTS }}
    steps:
      - name: Checkout the exact commit (own git fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - id: due
        name: Which domain jobs are due (LIFE-609) - one table, each job's last successful run; an unreadable history makes every job due
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOMAINS_PHASE: ${{ inputs.phase }}
        run: python3 -m lifeos.platform.due
      - id: cover
        name: LIFE-775 - is the early run of this tick already started (the after-tick run then leaves the early jobs to it; no early run means it runs every job; unreadable leaves them out)
        if: ${{ github.event_name == 'workflow_run' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TICK_STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: python3 -m lifeos.platform.phase
      - id: ran
        name: LIFE-856 - did the tick's hourly finish job run (the moved Network Leads and Cloud Fit backlog jobs run only then; unreadable counts as yes)
        if: ${{ github.event_name == 'workflow_run' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TICK_RUN: ${{ github.event.workflow_run.id }}
        run: python3 -m lifeos.platform.pipeline_ran
      - name: Bitwarden helper from a saved, fingerprint-checked copy (LIFE-406; downloads, with a long retry, only when no saved copy exists)
        continue-on-error: true
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "60"
      - id: bws_settings
        continue-on-error: true
        name: Notion token from Bitwarden so the gate can read the V7 settings page (LIFE-703; read only; if it fails the GitHub values decide)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            53f47cb9-f6bb-4cde-87f4-b4db015ef928 > NOTION_JIRA_TOKEN
            0053654c-d504-4453-87f7-b5080113d136 > V7_RUNTIME_CONFIG_SOURCE_ID
      - id: doppler_bws_settings
        if: ${{ steps.bws_settings.outcome == 'success' }}
        continue-on-error: true       # LIFE-981: a Doppler problem is a fixed code in the log and never fails the job; the Bitwarden values above are the ones this job uses
        name: Doppler parity compare (LIFE-981; the same 2 names read from Doppler and compared with Bitwarden's value by hash; counts and a fixed code only; production keeps Bitwarden)
        uses: ./.github/actions/doppler-load
        with:
          token: ${{ secrets.DOPPLER_TOKEN }}
          names: NOTION_JIRA_TOKEN,V7_RUNTIME_CONFIG_SOURCE_ID
          bitwarden: ${{ toJSON(steps.bws_settings.outputs) }}
      - name: Plain switches from Bitwarden (LIFE-704; read WITHOUT masking, validated; fixed fail modes - dry run, cloud fit off, alerts on, port fails - names and codes only)
        continue-on-error: true
        uses: ./.github/actions/bws-plain
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          names: ALERTS_ENABLED,ALERTS_MUTED_UNTIL,ALERT_SETTINGS,LIVE
          live_mode: ${{ (github.event_name == 'workflow_run' || inputs.phase == 'tick') && 'follow' || github.event_name == 'workflow_dispatch' && (inputs.live && 'true' || 'false') || 'false' }}
      - id: settings
        continue-on-error: true
        name: V7 settings page for the two switches a job condition needs (LIFE-703; names and counts only; an unreadable page changes nothing)
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_settings.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          NOTION_JIRA_TOKEN: ${{ steps.bws_settings.outputs.NOTION_JIRA_TOKEN }}
          GRANOLA_AUTO: ""
          V7_IMESSAGE_ALERTS: ""
        run: python3 -m lifeos.platform.settings --output GRANOLA_AUTO --output V7_IMESSAGE_ALERTS
  jira:
    # Jira runs in its OWN job, like Interview: scheduled and tick runs refresh the snapshot and the report card (rollover stays manual), only the Jira secrets (the database secrets are
    # re-supplied to the snapshot step alone), and a failure is a warning that never fails the Jobs run.
    needs: [gate]
    if: ${{ !cancelled() && needs.gate.result != 'failure' && ((needs.gate.outputs.due_jira == 'true' && needs.gate.outputs.early == 'true') || (github.event_name == 'workflow_dispatch' && inputs.jira != 'none')) }}   # D212: an empty input (a workflow_run after a manual or cancelled hourly run) is not a request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the exact commit (own git fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - uses: ./.github/actions/python
      - name: Bitwarden helper from a saved, fingerprint-checked copy (LIFE-406; downloads, with a long retry, only when no saved copy exists)
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "300"
      - id: bws_jira
        name: Load the migrated credentials from Bitwarden (EDGE-1.3, exactly these 14; masked step outputs only, nothing exported job-wide; the job fails if retrieval fails, no fallback)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            3fa6f4f4-bd6d-45e7-8f2c-b4db015ec0c3 > JIRA_API_TOKEN
            e6466367-9a55-4899-ae1c-b4db015ec49f > JIRA_EMAIL
            d71bbaed-6a6c-49b5-8a1f-b4db015ecfda > LIFEOS_ACQ_DB_NAME
            00d82e0d-be10-4c8c-bdbe-b4db015ed389 > LIFEOS_ACQ_DB_PASSWORD
            9422b842-3bb0-4153-bb8d-b4db015ed746 > LIFEOS_ACQ_DB_USER
            6f1c86f6-c48f-4e77-b65d-b4db015edb15 > LIFEOS_ACQ_SSH_HOST
            b65dd2fc-2573-4bda-9e80-b4db015edec6 > LIFEOS_ACQ_SSH_KNOWN_HOSTS
            7ada9cea-8711-4b37-bef9-b4db015ee298 > LIFEOS_ACQ_SSH_PRIVATE_KEY
            6b3e12b9-1987-4073-bda2-b4db015ee653 > LIFEOS_ACQ_SSH_USER
            192db2d1-be66-4fca-b9b5-b4e900240507 > LIFEOS_ACQ_SSH_JUMP_KEY
            454e12df-637f-4f65-9ec1-b4e30052942f > TAILSCALE_OAUTH_CLIENT_ID
            e54f0a84-84c3-47d8-8b5b-b4e30052d6e9 > TAILSCALE_OAUTH_CLIENT_SECRET
            53f47cb9-f6bb-4cde-87f4-b4db015ef928 > NOTION_JIRA_TOKEN
            83c553e9-23a6-45aa-9006-b4db015f00ac > NTFY_TOPIC
            4d0c7449-ed0a-46c1-9c2c-b503015f8d54 > LIFEOS_ACQ_SSH_JUMP_HOST
            82efa413-6b9c-4c5c-b0d2-b503015f8e3d > LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS
      - id: doppler_bws_jira
        if: ${{ steps.bws_jira.outcome == 'success' }}
        continue-on-error: true       # LIFE-981: a Doppler problem is a fixed code in the log and never fails the job; the Bitwarden values above are the ones this job uses
        name: Doppler parity compare (LIFE-981; the same 16 names read from Doppler and compared with Bitwarden's value by hash; counts and a fixed code only; production keeps Bitwarden)
        uses: ./.github/actions/doppler-load
        with:
          token: ${{ secrets.DOPPLER_TOKEN }}
          names: JIRA_API_TOKEN,JIRA_EMAIL,LIFEOS_ACQ_DB_NAME,LIFEOS_ACQ_DB_PASSWORD,LIFEOS_ACQ_DB_USER,LIFEOS_ACQ_SSH_HOST,LIFEOS_ACQ_SSH_KNOWN_HOSTS,LIFEOS_ACQ_SSH_PRIVATE_KEY,LIFEOS_ACQ_SSH_USER,LIFEOS_ACQ_SSH_JUMP_KEY,TAILSCALE_OAUTH_CLIENT_ID,TAILSCALE_OAUTH_CLIENT_SECRET,NOTION_JIRA_TOKEN,NTFY_TOPIC,LIFEOS_ACQ_SSH_JUMP_HOST,LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS
          bitwarden: ${{ toJSON(steps.bws_jira.outputs) }}
      - name: Plain switches from Bitwarden (LIFE-704; read WITHOUT masking, validated; fixed fail modes - dry run, cloud fit off, alerts on, port fails - names and codes only)
        uses: ./.github/actions/bws-plain
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          names: ALERTS_ENABLED,ALERTS_MUTED_UNTIL,ALERT_SETTINGS,LIFEOS_ACQ_SSH_PORT,V7_STORE_VIA,LIVE
          live_mode: ${{ (github.event_name == 'workflow_run' || inputs.phase == 'tick') && 'follow' || github.event_name == 'workflow_dispatch' && (inputs.live && 'true' || 'false') || 'false' }}
      - name: LIFE-85 - join the tailnet as the ephemeral tag:v7-runner node (the store's Oracle fallback; the policy admits it only to Oracle TCP 22 and 47341; a failed join only means no fallback)
        continue-on-error: true
        uses: ./.github/actions/tailscale
        with:
          oauth-client-id: ${{ steps.bws_jira.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_jira.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
      - id: bws_runtime_config
        continue-on-error: true
        name: Runtime Configuration source ID from Bitwarden so the settings read uses the new source (LIFE-859; read only, an address not a secret; if it fails the step runs exactly as before)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            0053654c-d504-4453-87f7-b5080113d136 > V7_RUNTIME_CONFIG_SOURCE_ID
      - id: doppler_bws_runtime_config
        if: ${{ steps.bws_runtime_config.outcome == 'success' }}
        continue-on-error: true       # LIFE-981: a Doppler problem is a fixed code in the log and never fails the job; the Bitwarden values above are the ones this job uses
        name: Doppler parity compare (LIFE-981; the same 1 name read from Doppler and compared with Bitwarden's value by hash; counts and a fixed code only; production keeps Bitwarden)
        uses: ./.github/actions/doppler-load
        with:
          token: ${{ secrets.DOPPLER_TOKEN }}
          names: V7_RUNTIME_CONFIG_SOURCE_ID
          bitwarden: ${{ toJSON(steps.bws_runtime_config.outputs) }}
      - id: settings
        continue-on-error: true
        name: V7 settings page for the Jira base URL, boards and GTV epic (LIFE-699; names and counts only; an unreadable page changes nothing). Only this step holds the Notion token; the Jira steps get the values through the job environment
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          NOTION_JIRA_TOKEN: ${{ steps.bws_jira.outputs.NOTION_JIRA_TOKEN }}
          JIRA_BASE_URL: ""
          JIRA_BOARDS: ""
          JIRA_GTV_EPIC: ""
          MEJ_SPRINT_AUTOMATION: ""   # LIFE-918: the sprint automation switch, off unless the Runtime Configuration row says on; later steps (rollover, reconcile) read it from the job environment
          MEJ_AUTOMATION_SINCE: ""   # LIFE-918: the activation time for the manual/automatic closure split
          JIRA_WRITERS_VERIFIED: ""   # LIFE-918: yes only after the throwaway-sprint verification passed
          V2_PROMOTION: ""   # LIFE-918: the promotion kill switch, read by the daily reconcile's promotion check
          V2_OFFICIAL: ""   # LIFE-918: the one row the promotion check may set on Jan 1 (LIFE-976)
