name: domain-agenda
on:
  workflow_call:
    inputs:
      live:
        type: boolean
        default: false
      phase:
        type: string
        default: "none"
    secrets:
      DOPPLER_TOKEN:
        required: false
      LIFEOS_BWS_RUNTIME_TOKEN:
        required: false
permissions:
  contents: read
  id-token: write
env:
  STAGE_TIMING_FILE: /tmp/stage-timing-domains.jsonl
jobs:
  agenda:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for try in 1 2 3; do git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA" && break; [ "$try" = 3 ] && exit 1; sleep $((try * 5)); done
          git checkout -q --detach FETCH_HEAD
      - name: Python and the Bitwarden helper
        uses: ./.github/actions/job-start
        with:
          wait_seconds: "300"
      - id: bws_agenda
        name: Load the migrated credentials from Bitwarden
        uses: &a1 ./.github/actions/bws-load
        with:
          access_token: &a2 ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          doppler_compare: &a3 ${{ secrets.DOPPLER_TOKEN }}
          set_env: false
          set: agenda
      - name: Plain switches from Bitwarden
        uses: ./.github/actions/bws-plain
        with:
          access_token: *a2
          names: ALERTS_ENABLED,ALERTS_MUTED_UNTIL,ALERT_SETTINGS,LIFEOS_ACQ_SSH_PORT,V7_STORE_VIA,LIVE
          live_mode: ${{ (github.event_name == 'workflow_run' || inputs.phase == 'tick') && 'follow' || github.event_name == 'workflow_dispatch' && (inputs.live && 'true' || 'false') || 'false' }}
      - name: Join the tailnet as the ephemeral tag:v7-runner node
        continue-on-error: true
        uses: ./.github/actions/tailscale
        with:
          oauth-client-id: ${{ steps.bws_agenda.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_agenda.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
      - id: bws_runtime_config
        continue-on-error: true
        name: Runtime Configuration source ID from Bitwarden
        uses: *a1
        with:
          access_token: *a2
          doppler_compare: *a3
          set_env: false
          set: runtime-config
      - id: asnap
        continue-on-error: true
        name: Agenda snapshot (read-only; saved only when live)
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: &a4 ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          NOTION_JIRA_TOKEN: &a5 ${{ steps.bws_agenda.outputs.NOTION_JIRA_TOKEN }}
          GCAL_CALENDAR_ID: ""
          LIFEOS_ACQ_DB_NAME: &a6 ${{ steps.bws_agenda.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: &a7 ${{ steps.bws_agenda.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: &a8 ${{ steps.bws_agenda.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: &a9 ${{ steps.bws_agenda.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: &a10 ${{ steps.bws_agenda.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_JUMP_HOST: &a11 ${{ steps.bws_agenda.outputs.LIFEOS_ACQ_SSH_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: &a12 ${{ steps.bws_agenda.outputs.LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: &a13 ${{ steps.bws_agenda.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: &a14 ${{ steps.bws_agenda.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: &a15 ${{ steps.bws_agenda.outputs.LIFEOS_ACQ_SSH_USER }}
        run: python -m lifeos.run agenda-snapshot --limit 0 $([ "$LIVE" = "true" ] && echo --live)
      - id: acard
        continue-on-error: true
        name: Agenda card (saved snapshot only; writes only when live)
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: *a4
          CALENDAR_CARD_BLOCK_ID: ""
          JIRA_CARD_BLOCK_ID: ""
          HIRING_CARD_BLOCK_ID: ""
          LIFEOS_ACQ_DB_NAME: *a6
          LIFEOS_ACQ_DB_PASSWORD: *a7
          LIFEOS_ACQ_DB_USER: *a8
          LIFEOS_ACQ_SSH_HOST: *a9
          LIFEOS_ACQ_SSH_JUMP_KEY: *a10
          LIFEOS_ACQ_SSH_JUMP_HOST: *a11
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: *a12
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: *a13
          LIFEOS_ACQ_SSH_PRIVATE_KEY: *a14
          LIFEOS_ACQ_SSH_USER: *a15
          NOTION_JIRA_TOKEN: *a5
        run: python -m lifeos.run agenda-card --limit 0 $([ "$LIVE" = "true" ] && echo --live)
      - name: Agenda warning (does not fail the Jobs run)
        if: ${{ always() && (steps.asnap.outcome == 'failure' || steps.acard.outcome == 'failure') }}
        run: echo "::warning title=Agenda::the Calendar snapshot or card failed; the Jobs pipeline is unaffected"
      - name: Fail the job if any stage step failed
        if: ${{ always() && contains(steps.*.outcome, 'failure') }}
        run: echo "::error title=agenda::a stage step failed in the agenda job (see the step marked failed above)"; exit 1
