name: capacity-card
# LIFE-793 (Jim, Nov 17 2026): the AI Capacity card (LIFE-77, D228) in its own workflow, so the hourly imessage job no longer carries its ~33 s. Same stage, same command, same credentials as the imessage job's capacity step (the tailnet join and Oracle's no-model `limits` request, then the Notion card write).
# The card stays off unless V7_AI_CAPACITY_CARD is "on". The old step stays in domains.yml until this workflow is proven; then it is removed there.
# Hourly at minute 55 (GitHub's cron fires this only every 5 to 10 hours, so the hourly tick also starts it when the last run is 40 minutes or more old: LIFE-957): ticks run at :07/:27/:47, the watchdog at :17/:47, V3 pages at :40. Manual runs are a dry run unless "Actually write" is ticked; a scheduled run follows V7_LIVE (dry run if it cannot be read).
on:
  schedule:
    - cron: "55 * * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Actually write the AI Capacity card. Unticked = dry run, counts only"
        type: boolean
        default: false
      tick:
        description: "Started by the hourly tick (LIFE-957): follows V7_LIVE like a scheduled run; the live box is ignored"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: life-os-v7-capacity-card
  cancel-in-progress: false
jobs:
  capacitycard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the exact commit (own git fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - uses: ./.github/actions/python
      - name: Bitwarden helper from a saved, fingerprint-checked copy (LIFE-406; downloads, with a long retry, only when no saved copy exists)
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "200"
      - id: bws_capacitycard
        name: Load the credentials the AI Capacity card uses from Bitwarden (exactly these 4, the same ids the imessage job loads; masked step outputs only, nothing exported job-wide; the job fails if retrieval fails)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            454e12df-637f-4f65-9ec1-b4e30052942f > TAILSCALE_OAUTH_CLIENT_ID
            e54f0a84-84c3-47d8-8b5b-b4e30052d6e9 > TAILSCALE_OAUTH_CLIENT_SECRET
            53f47cb9-f6bb-4cde-87f4-b4db015ef928 > NOTION_JIRA_TOKEN
      - name: Plain switches from Bitwarden (LIFE-704; read WITHOUT masking, validated; fixed fail modes - dry run when it cannot be read - names and codes only)
        uses: ./.github/actions/bws-plain
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          names: LIVE
          live_mode: ${{ github.event_name == 'workflow_dispatch' && !inputs.tick && (inputs.live && 'true' || 'false') || 'follow' }}
      - id: doppler_trial
        if: ${{ steps.bws_capacitycard.outcome == 'success' }}
        continue-on-error: true       # LIFE-863: a Doppler problem is a code in the log and never fails the job; Bitwarden's values above are the ones this job uses
        name: Doppler trial (LIFE-863; reads the same four names from Doppler and compares each with Bitwarden's value by hash; counts and a fixed code only, no value printed; production keeps Bitwarden)
        uses: ./.github/actions/doppler-load
        with:
          token: ${{ secrets.DOPPLER_TOKEN }}
          names: TAILSCALE_OAUTH_CLIENT_ID,TAILSCALE_OAUTH_CLIENT_SECRET,NOTION_JIRA_TOKEN
          bitwarden: ${{ toJSON(steps.bws_capacitycard.outputs) }}
      - name: Join the tailnet as an ephemeral tag:v7-runner node (the tailnet policy admits it only to Oracle TCP 47341)
        uses: ./.github/actions/tailscale
        with:
          oauth-client-id: ${{ steps.bws_capacitycard.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_capacitycard.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
      - id: bws_runtime_config
        continue-on-error: true
        name: Runtime Configuration source ID from Bitwarden so the settings read uses the new source (LIFE-859; read only, an address not a secret; if it fails the step runs exactly as before)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            0053654c-d504-4453-87f7-b5080113d136 > V7_RUNTIME_CONFIG_SOURCE_ID
      - id: doppler_bws_runtime_config
        if: ${{ steps.bws_runtime_config.outcome == 'success' }}
        continue-on-error: true       # LIFE-981: a Doppler problem is a fixed code in the log and never fails the job; the Bitwarden values above are the ones this job uses
        name: Doppler parity compare (LIFE-981; the same 1 name read from Doppler and compared with Bitwarden's value by hash; counts and a fixed code only; production keeps Bitwarden)
        uses: ./.github/actions/doppler-load
        with:
          token: ${{ secrets.DOPPLER_TOKEN }}
          names: V7_RUNTIME_CONFIG_SOURCE_ID
          bitwarden: ${{ toJSON(steps.bws_runtime_config.outputs) }}
      - id: capacity
        continue-on-error: true
        name: AI Capacity card (readings only, no model run; numbers only in the log; writes only when live)
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          NOTION_JIRA_TOKEN: ${{ steps.bws_capacitycard.outputs.NOTION_JIRA_TOKEN }}
          V7_AI_CAPACITY_CARD: ""
        run: python -m lifeos.run capacity-card --limit 0 $([ "$LIVE" = "true" ] && echo --live)
      - name: AI Capacity card warning (does not fail the run)
        if: ${{ always() && steps.capacity.outcome == 'failure' }}
        run: echo "::warning title=AI Capacity card::the AI Capacity card was not updated; it keeps its previous reading"
