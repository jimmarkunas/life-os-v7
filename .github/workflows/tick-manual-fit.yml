name: tick-manual-fit
on:
  workflow_call:
    inputs:
      audit:
        type: boolean
        default: false
      cloud_backlog:
        type: string
        default: ""
      fit:
        type: boolean
        default: false
      fit_all:
        type: boolean
        default: false
      live:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false
      quick:
        type: boolean
        default: false
      report:
        type: string
        default: ""
      tick:
        type: boolean
        default: false
      prep_pipeline:
        type: string
        default: ""
    secrets:
      DOPPLER_TOKEN:
        required: false
      LIFEOS_BWS_RUNTIME_TOKEN:
        required: false
    outputs:
      codes:
        value: ${{ jobs.manual_fit.outputs.codes }}
      failed:
        value: ${{ jobs.manual_fit.outputs.failed }}
permissions:
  contents: read
env:
  NOTION_JOB_LEDGER_DATA_SOURCE_ID: ""
  V7_FIT_GATE: ""
  HIRING_PIPELINE_PAGE_ID: ""
jobs:
  manual_fit:
    outputs:
      failed: ${{ steps.lanes.outputs.failed }}
      codes: ${{ steps.lanes.outputs.codes }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 58
    env:
      FASTEMBED_CACHE: ${{ github.workspace }}/.cache/fastembed
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for try in 1 2 3; do git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA" && break; [ "$try" = 3 ] && exit 1; sleep $((try * 5)); done
          git checkout -q --detach FETCH_HEAD
      - uses: ./.github/actions/python
      - name: Semantic layer (optional shadow; local embedding model)
        if: &a1 ${{ inputs.prep_pipeline == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.fit || inputs.publish || inputs.quick)) }}
        uses: &a2 actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-v1
      - name: Pip cache for the semantic layer (requirements-fit.lock)
        if: *a1
        uses: *a2
        with:
          path: ~/.cache/pip
          key: pip-fit-${{ runner.os }}-${{ hashFiles('requirements-fit.lock') }}
      - name: Install semantic layer
        if: *a1
        run: pip install --require-hashes -r requirements-fit.lock || echo "semantic layer unavailable (scoring unchanged)"
      - name: Bitwarden helper from a saved, fingerprint-checked copy
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "600"
      - id: bws_finish
        name: Load the migrated credentials from Bitwarden
        uses: &a3 ./.github/actions/bws-load
        with:
          access_token: &a4 ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          doppler_compare: &a5 ${{ secrets.DOPPLER_TOKEN }}
          set_env: false
          set: hourly-manual-fit
      - name: Plain switches from Bitwarden
        uses: ./.github/actions/bws-plain
        with:
          access_token: *a4
          names: ALERTS_ENABLED,ALERTS_MUTED_UNTIL,ALERT_SETTINGS,V7_CLOUD_FIT,V7_CLOUD_FIT_SCHEDULED,V7_CLOUD_FIT_BACKLOG_BUDGET,V7_CLOUD_FIT_BACKLOG_MAX,V7_CLOUD_FIT_PARALLEL,V7_CLOUD_FIT_BACKLOG_PAGE,LIFEOS_ACQ_SSH_PORT,V7_STORE_VIA,LIVE
          live_mode: ${{ github.event_name == 'workflow_dispatch' && !inputs.tick && (inputs.live && 'true' || 'false') || 'follow' }}
      - name: Join the tailnet (Cloud-Fit shadow only)
        continue-on-error: true
        uses: ./.github/actions/tailscale
        with:
          oauth-client-id: ${{ steps.bws_finish.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_finish.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
      - id: bws_runtime_config
        if: ${{ inputs.prep_pipeline == 'true' || (github.event_name == 'workflow_dispatch' && inputs.quick) }}
        continue-on-error: true
        name: Runtime Configuration source ID from Bitwarden
        uses: *a3
        with:
          access_token: *a4
          doppler_compare: *a5
          set_env: false
          set: runtime-config
      - id: fit
        continue-on-error: true
        name: Step 6a - fit scoring (deterministic, private profile)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.fit || inputs.publish) }}
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: &a6 ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          FIT_ALL: ${{ inputs.fit_all && 'true' || '' }}
          FIT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.report || '' }}
          FIT_PROFILE_EXTRA_JSON: &a7 ${{ steps.bws_finish.outputs.FIT_PROFILE_EXTRA_JSON }}
          FIT_PROFILE_JSON: &a8 ${{ steps.bws_finish.outputs.FIT_PROFILE_JSON }}
          JOBRIGHT_EMAIL: &a9 ${{ steps.bws_finish.outputs.JOBRIGHT_EMAIL }}
          JOBRIGHT_PASSWORD: &a10 ${{ steps.bws_finish.outputs.JOBRIGHT_PASSWORD }}
          LIFEOS_ACQ_DB_NAME: &a11 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: &a12 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: &a13 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: &a14 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: &a15 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_JUMP_HOST: &a16 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: &a17 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: &a18 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: &a19 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: &a20 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_USER }}
          NOTION_API_TOKEN: &a21 ${{ steps.bws_finish.outputs.NOTION_API_TOKEN }}
          TINYFISH_API_KEY: &a22 ${{ steps.bws_finish.outputs.TINYFISH_API_KEY }}
        run: python -m lifeos.run fit $([ "$LIVE" = "true" ] && echo --live)
      - id: fit_cloud_backlog
        continue-on-error: true
        name: Step 6a2 - Cloud Fit backlog batch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cloud_backlog != '' && inputs.cloud_backlog != '0' && inputs.prep_pipeline != 'true' }}
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: *a6
          CLOUD_BACKLOG: ${{ inputs.prep_pipeline == 'true' && env.V7_CLOUD_FIT_SCHEDULED || inputs.cloud_backlog }}
          FIT_PROFILE_EXTRA_JSON: *a7
          FIT_PROFILE_JSON: *a8
          LIFEOS_ACQ_DB_NAME: *a11
          LIFEOS_ACQ_DB_PASSWORD: *a12
          LIFEOS_ACQ_DB_USER: *a13
          LIFEOS_ACQ_SSH_HOST: *a14
          LIFEOS_ACQ_SSH_JUMP_KEY: *a15
          LIFEOS_ACQ_SSH_JUMP_HOST: *a16
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: *a17
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: *a18
          LIFEOS_ACQ_SSH_PRIVATE_KEY: *a19
          LIFEOS_ACQ_SSH_USER: *a20
          NOTION_API_TOKEN: *a21
          IMESSAGE_ALERTS_HOST: ${{ steps.bws_finish.outputs.IMESSAGE_ALERTS_HOST }}
          V7_CLOUD_FIT_BACKLOG_MAX: ${{ inputs.prep_pipeline == 'true' && env.V7_CLOUD_FIT_SCHEDULED || env.V7_CLOUD_FIT_BACKLOG_MAX || '0' }}
          V7_CLOUD_FIT_BACKLOG_BUDGET: ${{ inputs.prep_pipeline != 'true' && env.V7_CLOUD_FIT_BACKLOG_BUDGET || '' }}
          V7_CLOUD_FIT_BACKLOG_PAGE: ${{ inputs.prep_pipeline != 'true' && env.V7_CLOUD_FIT_BACKLOG_PAGE || '' }}
          V7_CLOUD_FIT_PROFILE_REF: ""
          V7_CLOUD_FIT_PARALLEL: ${{ env.V7_CLOUD_FIT_PARALLEL || '1' }}
        run: |
          if [ "$PIPELINE" = "true" ]; then
            # LIFE-41 (Jim, Oct 20 2026: "fill every hour"): the scheduled batch runs until about :55, so the next tick never waits, never past the
            # code's 45-minute batch cap (D238), and never past this job's 58 minutes (5 minutes kept for the steps after it). Too little time: skipped, not failed.
            now=$(date +%s); m=$((10#$(date +%M))); s=$((10#$(date +%S))); started=$(stat -c %Y "$GITHUB_WORKSPACE/.git")     # the checkout: this job's first seconds
            to_55=$(( m < 55 ? (55 - m) * 60 - s : 0 )); job_left=$(( 58 * 60 - (now - started) - 300 ))
            budget=$(( to_55 < job_left ? to_55 : job_left )); budget=$(( budget > 2700 ? 2700 : budget ))
            if [ "$budget" -lt 300 ]; then echo "fit-cloud-backlog: skipped this hour (${budget}s left before :55 or the job limit)"; exit 0; fi
            export V7_CLOUD_FIT_BACKLOG_BUDGET=$budget
          fi
          python -m lifeos.run fit-cloud-backlog --limit "$CLOUD_BACKLOG" $([ "$LIVE" = "true" ] && echo --live)
      - id: audit
        continue-on-error: true
        name: Step 6b - precision audit (before publish)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.audit || inputs.publish) }}
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: *a6
          FIT_PROFILE_EXTRA_JSON: *a7
          FIT_PROFILE_JSON: *a8
          JOBRIGHT_EMAIL: *a9
          JOBRIGHT_PASSWORD: *a10
          LIFEOS_ACQ_DB_NAME: *a11
          LIFEOS_ACQ_DB_PASSWORD: *a12
          LIFEOS_ACQ_DB_USER: *a13
          LIFEOS_ACQ_SSH_HOST: *a14
          LIFEOS_ACQ_SSH_JUMP_KEY: *a15
          LIFEOS_ACQ_SSH_JUMP_HOST: *a16
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: *a17
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: *a18
          LIFEOS_ACQ_SSH_PRIVATE_KEY: *a19
          LIFEOS_ACQ_SSH_USER: *a20
          NOTION_API_TOKEN: *a21
          TINYFISH_API_KEY: *a22
        run: python -m lifeos.run audit $([ "$LIVE" = "true" ] && echo --live)
      - id: lanes
        name: Lane failures fail the run (other stages still ran)
        if: ${{ always() }}
        env:
          CODES: ${{ steps.fit.outputs.cloud_fit_code }} ${{ steps.fit_cloud_backlog.outputs.cloud_fit_code }}
        run: |
          codes=$(printf '%s\n' $CODES | grep -E '^[A-Z0-9_]{1,48}$' | sort -u | tr '\n' ' ' || true)   # no code is the normal case (bash -e, pipefail)
          echo "codes=${codes% }" >> "$GITHUB_OUTPUT"
          failed=""
          for pair in fit=${{ steps.fit.outcome }} fit_cloud_backlog=${{ steps.fit_cloud_backlog.outcome }} audit=${{ steps.audit.outcome }}; do
            [ "${pair#*=}" = "failure" ] && failed="$failed ${pair%=*}"
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
          if [ -n "$failed" ]; then echo "FAILED STAGES:$failed"; exit 1; fi
