name: diag
# Manual only, read-only, counts only. Runs in its own concurrency group, so it never blocks or replaces an hourly tick (the hourly gate counts only hourly.yml runs).
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "scale-up-holds: why parked Scale-Up roles do not move (counts from the Jobs store; writes nothing). scale-up-links: re-reads each parked role's own public page and counts why its link check fails (counts only; writes nothing). alerts-open: which alerts are open and the new jobs per source in the last 24 hours (source names and counts only; writes nothing)"
        type: choice
        options: ["scale-up-holds", "scale-up-links", "alerts-open"]
        default: "scale-up-holds"
permissions:
  contents: read
concurrency:
  group: life-os-v7-diag
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python
      - name: Load the database and SSH values from Bitwarden (EDGE-1.3, exactly these 7; the job fails if retrieval fails, no fallback)
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          secrets: |
            d71bbaed-6a6c-49b5-8a1f-b4db015ecfda > LIFEOS_ACQ_DB_NAME
            00d82e0d-be10-4c8c-bdbe-b4db015ed389 > LIFEOS_ACQ_DB_PASSWORD
            9422b842-3bb0-4153-bb8d-b4db015ed746 > LIFEOS_ACQ_DB_USER
            6f1c86f6-c48f-4e77-b65d-b4db015edb15 > LIFEOS_ACQ_SSH_HOST
            b65dd2fc-2573-4bda-9e80-b4db015edec6 > LIFEOS_ACQ_SSH_KNOWN_HOSTS
            7ada9cea-8711-4b37-bef9-b4db015ee298 > LIFEOS_ACQ_SSH_PRIVATE_KEY
            6b3e12b9-1987-4073-bda2-b4db015ee653 > LIFEOS_ACQ_SSH_USER
      - name: Diagnostic (read-only; counts only)
        env:
          LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
          STAGE: ${{ inputs.stage }}
        run: python -m lifeos.run "$STAGE"
