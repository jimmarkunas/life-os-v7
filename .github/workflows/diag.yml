name: diag
# Manual only, counts only; read-only except the one synthetic sandbox proof (notion-sandbox-outreach-proof), which writes only one sandbox page. Runs in its own concurrency group, so it never blocks or replaces an hourly tick (the hourly gate counts only hourly.yml runs).
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "followup-schema-apply (LIFE-756, needs confirm = APPLY): creates the four Followup tables once and reads them back; without the confirm it is a dry run. followup-schema-check (LIFE-756): a read-only look at the V7 database for those four tables (flags and counts only; creates nothing). inbox-schema-apply (LIFE-712, needs confirm = APPLY): creates the four Action Inbox tables once and reads them back; without the confirm it is a dry run. inbox-schema-check (LIFE-712): a read-only look at the V7 database for the four Action Inbox tables: server kind and version, default row format, which tables exist, whether the account may create and write (flags and counts only; creates nothing). scale-up-holds: why parked Scale-Up roles do not move (counts from the Jobs store; writes nothing). scale-up-boards: for each Scale-Up board in the registry, its last read, how many vacancies it lists and what became of them, and the jobs created from it by status (counts and source ids only; writes nothing). scale-up-exclusions: why Scale-Up jobs are EXCLUDED_FIT, split by stored reason, Fit band and source (counts only; writes nothing). scale-up-exclusion-review: the Scale-Up jobs scored at or over the Fit floor that Jim's own exclusion rules removed (count in the clear; the list goes to one private Notion page, written only with confirm = REPORT; a dry run writes nothing). scale-up-register: the current official sponsor register against the Scale-Up registry, London Scale-up sponsors not held (counts in the clear; names go to one private Notion page, only with confirm = REPORT). scale-up-links: re-reads each parked role's own public page and counts why its link check fails (counts only; writes nothing). alerts-open: which alerts are open and the new jobs per source in the last 24 hours (source names and counts only; writes nothing). newsletter-trace (needs message_ref): reads ONE Newsletter message from Gmail (list and read only) and classifies each parsed card against the Jobs store: owned, collision, orphan, suppressed or missing (counts and fixed codes only; writes nothing). notion-sandbox-access: whether the existing Jobs Notion integration can read the synthetic sandbox Job Ledger (three fixed reads; HTTP and error codes only; writes nothing). notion-sandbox-outreach-proof (needs confirm = SYNTHETIC): the one-time LIFE-10 proof of the job-page outreach writer on ONE synthetic page in the sandbox Job Ledger, with fictional in-memory conversations (writes only that page; codes and counts only). interview-ui-probe (needs confirm = QA): LIFE-88's first gate, whether the V7 Notion REST transport can build the accepted UI 3c tree (tabs, tables in callouts, 63/37 columns, in-place updates); reads the UI 3c QA preview and writes only one probe page under the QA Interview OS parent (block types, check codes and counts only) jobs-backlog (LIFE-212): every job not on the Job Ledger yet and why it waits, to one dated private Notion page (type REPORT in confirm; blank is a dry run that counts only). inbox-proof (LIFE-791, needs confirm = INBOX): the Agent Inbox proof: sends three test items through send_to_jim and writes one more straight into the database, reads the counts back, then moves every test row to the trash and reads the counts back again; leaves no row behind; the existing Notion integration, counts and fixed codes only. inbox-recount (needs confirm = INBOX): writes the five tile numbers of the Agent Inbox page from the database."
        type: choice
        options: ["scale-up-holds", "scale-up-links", "scale-up-boards", "scale-up-exclusions", "scale-up-exclusion-review", "scale-up-register", "jobs-backlog", "alerts-open", "newsletter-trace", "notion-sandbox-access", "notion-sandbox-outreach-proof", "interview-ui-probe", "inbox-proof", "inbox-recount", "inbox-schema-check", "inbox-schema-apply", "followup-schema-check", "followup-schema-apply"]
        default: "scale-up-holds"
      message_ref:
        description: "alerts-open (optional) and newsletter-trace (required): the SHA-256 (64 hex) of one Gmail message id, never the id itself. Returns only that message's per-vacancy trace (allowlisted status, source and reason codes, Ledger page and verification recorded, terminal and blocker totals); read-only, counts only."
        type: string
        default: ""
      confirm:
        description: "notion-sandbox-outreach-proof: type SYNTHETIC; scale-up-exclusion-review, scale-up-register and jobs-backlog: type REPORT (writes the one private report page; blank is a dry run); interview-ui-probe: type QA (confirms that only the one sandbox or QA probe page is written); inbox-proof and inbox-recount: type INBOX (confirms that only the Agent Inbox database rows and the five tile numbers are written)"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: life-os-v7-diag
  cancel-in-progress: false
jobs:
  diag:
    if: ${{ inputs.stage != 'scale-up-exclusion-review' && inputs.stage != 'scale-up-register' && inputs.stage != 'jobs-backlog' && inputs.stage != 'newsletter-trace' && inputs.stage != 'notion-sandbox-access' && inputs.stage != 'notion-sandbox-outreach-proof' && inputs.stage != 'interview-ui-probe' && inputs.stage != 'inbox-proof' && inputs.stage != 'inbox-recount' }}
    uses: ./.github/workflows/diag-main.yml
    with:
      confirm: ${{ inputs.confirm || '' }}
      message_ref: ${{ inputs.message_ref || '' }}
      stage: ${{ inputs.stage || 'scale-up-holds' }}
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      LIFEOS_BWS_RUNTIME_TOKEN: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
  trace:
    if: ${{ inputs.stage == 'newsletter-trace' }}
    uses: ./.github/workflows/diag-trace.yml
    with:
      message_ref: ${{ inputs.message_ref || '' }}
      stage: ${{ inputs.stage || 'scale-up-holds' }}
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      LIFEOS_BWS_RUNTIME_TOKEN: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
  sandbox:
    if: ${{ inputs.stage == 'notion-sandbox-access' || inputs.stage == 'notion-sandbox-outreach-proof' }}
    uses: ./.github/workflows/diag-sandbox.yml
    with:
      confirm: ${{ inputs.confirm || '' }}
      stage: ${{ inputs.stage || 'scale-up-holds' }}
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      LIFEOS_BWS_RUNTIME_TOKEN: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
  interview_ui:
    if: ${{ inputs.stage == 'interview-ui-probe' }}
    uses: ./.github/workflows/diag-interview-ui.yml
    with:
      confirm: ${{ inputs.confirm || '' }}
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      LIFEOS_BWS_RUNTIME_TOKEN: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
  report:
    if: ${{ inputs.stage == 'scale-up-exclusion-review' || inputs.stage == 'scale-up-register' || inputs.stage == 'jobs-backlog' }}
    uses: ./.github/workflows/diag-report.yml
    with:
      confirm: ${{ inputs.confirm || '' }}
      stage: ${{ inputs.stage || 'scale-up-holds' }}
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      LIFEOS_BWS_RUNTIME_TOKEN: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
  inbox_view_qa:
    if: ${{ inputs.stage == 'inbox-proof' || inputs.stage == 'inbox-recount' }}
    uses: ./.github/workflows/diag-inbox-view-qa.yml
    with:
      confirm: ${{ inputs.confirm || '' }}
      stage: ${{ inputs.stage || 'scale-up-holds' }}
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      LIFEOS_BWS_RUNTIME_TOKEN: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
