name: diag
# Manual only, counts only; read-only except the one synthetic sandbox proof (notion-sandbox-outreach-proof), which writes only one sandbox page. Runs in its own concurrency group, so it never blocks or replaces an hourly tick (the hourly gate counts only hourly.yml runs).
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "scale-up-holds: why parked Scale-Up roles do not move (counts from the Jobs store; writes nothing). scale-up-boards: for each Scale-Up board in the registry, its last read, how many vacancies it lists and what became of them, and the jobs created from it by status (counts and source ids only; writes nothing). scale-up-links: re-reads each parked role's own public page and counts why its link check fails (counts only; writes nothing). alerts-open: which alerts are open and the new jobs per source in the last 24 hours (source names and counts only; writes nothing). newsletter-trace (needs message_ref): reads ONE Newsletter message from Gmail (list and read only) and classifies each parsed card against the Jobs store: owned, collision, orphan, suppressed or missing (counts and fixed codes only; writes nothing). notion-sandbox-access: whether the existing Jobs Notion integration can read the synthetic sandbox Job Ledger (three fixed reads; HTTP and error codes only; writes nothing). notion-sandbox-outreach-proof (needs confirm = SYNTHETIC): the one-time LIFE-10 proof of the job-page outreach writer on ONE synthetic page in the sandbox Job Ledger, with fictional in-memory conversations (writes only that page; codes and counts only). interview-ui-probe (needs confirm = QA): LIFE-88's first gate, whether the V7 Notion REST transport can build the accepted UI 3c tree (tabs, tables in callouts, 63/37 columns, in-place updates); reads the UI 3c QA preview and writes only one probe page under the QA Interview OS parent (block types, check codes and counts only)"
        type: choice
        options: ["scale-up-holds", "scale-up-links", "scale-up-boards", "alerts-open", "newsletter-trace", "notion-sandbox-access", "notion-sandbox-outreach-proof", "interview-ui-probe"]
        default: "scale-up-holds"
      message_ref:
        description: "alerts-open (optional) and newsletter-trace (required): the SHA-256 (64 hex) of one Gmail message id, never the id itself. Returns only that message's per-vacancy trace (allowlisted status, source and reason codes, Ledger page and verification recorded, terminal and blocker totals); read-only, counts only."
        type: string
        default: ""
      confirm:
        description: "notion-sandbox-outreach-proof: type SYNTHETIC; interview-ui-probe: type QA (confirms that only the one sandbox or QA probe page is written)"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: life-os-v7-diag
  cancel-in-progress: false
jobs:
  diag:
    if: ${{ inputs.stage != 'newsletter-trace' && inputs.stage != 'notion-sandbox-access' && inputs.stage != 'notion-sandbox-outreach-proof' && inputs.stage != 'interview-ui-probe' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python
      - id: bws_diag
        name: Load the database and SSH values from Bitwarden (EDGE-1.3, exactly these 7; the job fails if retrieval fails, no fallback)
        continue-on-error: true                 # D209: one retry below; the retry fails the job
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          secrets: |
            d71bbaed-6a6c-49b5-8a1f-b4db015ecfda > LIFEOS_ACQ_DB_NAME
            00d82e0d-be10-4c8c-bdbe-b4db015ed389 > LIFEOS_ACQ_DB_PASSWORD
            9422b842-3bb0-4153-bb8d-b4db015ed746 > LIFEOS_ACQ_DB_USER
            6f1c86f6-c48f-4e77-b65d-b4db015edb15 > LIFEOS_ACQ_SSH_HOST
            b65dd2fc-2573-4bda-9e80-b4db015edec6 > LIFEOS_ACQ_SSH_KNOWN_HOSTS
            7ada9cea-8711-4b37-bef9-b4db015ee298 > LIFEOS_ACQ_SSH_PRIVATE_KEY
            6b3e12b9-1987-4073-bda2-b4db015ee653 > LIFEOS_ACQ_SSH_USER
      - name: Bitwarden refused or timed out (429 / 5xx) - pause before the one retry
        if: ${{ steps.bws_diag.outcome == 'failure' }}
        run: sleep $((30 + RANDOM % 45))
      - id: bws_diag_retry
        name: Load the same credentials from Bitwarden - the one retry (the job fails if it fails, no fallback)
        if: ${{ steps.bws_diag.outcome == 'failure' }}
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          secrets: |
            d71bbaed-6a6c-49b5-8a1f-b4db015ecfda > LIFEOS_ACQ_DB_NAME
            00d82e0d-be10-4c8c-bdbe-b4db015ed389 > LIFEOS_ACQ_DB_PASSWORD
            9422b842-3bb0-4153-bb8d-b4db015ed746 > LIFEOS_ACQ_DB_USER
            6f1c86f6-c48f-4e77-b65d-b4db015edb15 > LIFEOS_ACQ_SSH_HOST
            b65dd2fc-2573-4bda-9e80-b4db015edec6 > LIFEOS_ACQ_SSH_KNOWN_HOSTS
            7ada9cea-8711-4b37-bef9-b4db015ee298 > LIFEOS_ACQ_SSH_PRIVATE_KEY
            6b3e12b9-1987-4073-bda2-b4db015ee653 > LIFEOS_ACQ_SSH_USER
      - name: Diagnostic (read-only; counts only)
        env:
          LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
          STAGE: ${{ inputs.stage }}
          ALERTS_MESSAGE_REF: ${{ inputs.message_ref }}
        run: python -m lifeos.run "$STAGE"
  # LIFE-64: the one stage that reads Gmail. Its own job, so the Gmail values never reach the database-only diagnostics above. Read-only: the code can list ids and read one message, and select from the store.
  trace:
    if: ${{ inputs.stage == 'newsletter-trace' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python
      - id: bws_trace
        name: Load the database, SSH and Gmail values from Bitwarden (the job fails if retrieval fails, no fallback)
        continue-on-error: true                 # D209: one retry below; the retry fails the job
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          secrets: |
            d71bbaed-6a6c-49b5-8a1f-b4db015ecfda > LIFEOS_ACQ_DB_NAME
            00d82e0d-be10-4c8c-bdbe-b4db015ed389 > LIFEOS_ACQ_DB_PASSWORD
            9422b842-3bb0-4153-bb8d-b4db015ed746 > LIFEOS_ACQ_DB_USER
            6f1c86f6-c48f-4e77-b65d-b4db015edb15 > LIFEOS_ACQ_SSH_HOST
            b65dd2fc-2573-4bda-9e80-b4db015edec6 > LIFEOS_ACQ_SSH_KNOWN_HOSTS
            7ada9cea-8711-4b37-bef9-b4db015ee298 > LIFEOS_ACQ_SSH_PRIVATE_KEY
            6b3e12b9-1987-4073-bda2-b4db015ee653 > LIFEOS_ACQ_SSH_USER
            08245c07-728f-438e-940b-b4db015a6967 > GMAIL_OAUTH_CLIENT_SECRET
            672a44e9-235f-4121-a99d-b4db015a6987 > GMAIL_OAUTH_REFRESH_TOKEN
      - name: Bitwarden refused or timed out (429 / 5xx) - pause before the one retry
        if: ${{ steps.bws_trace.outcome == 'failure' }}
        run: sleep $((30 + RANDOM % 45))
      - id: bws_trace_retry
        name: Load the same credentials from Bitwarden - the one retry (the job fails if it fails, no fallback)
        if: ${{ steps.bws_trace.outcome == 'failure' }}
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          secrets: |
            d71bbaed-6a6c-49b5-8a1f-b4db015ecfda > LIFEOS_ACQ_DB_NAME
            00d82e0d-be10-4c8c-bdbe-b4db015ed389 > LIFEOS_ACQ_DB_PASSWORD
            9422b842-3bb0-4153-bb8d-b4db015ed746 > LIFEOS_ACQ_DB_USER
            6f1c86f6-c48f-4e77-b65d-b4db015edb15 > LIFEOS_ACQ_SSH_HOST
            b65dd2fc-2573-4bda-9e80-b4db015edec6 > LIFEOS_ACQ_SSH_KNOWN_HOSTS
            7ada9cea-8711-4b37-bef9-b4db015ee298 > LIFEOS_ACQ_SSH_PRIVATE_KEY
            6b3e12b9-1987-4073-bda2-b4db015ee653 > LIFEOS_ACQ_SSH_USER
            08245c07-728f-438e-940b-b4db015a6967 > GMAIL_OAUTH_CLIENT_SECRET
            672a44e9-235f-4121-a99d-b4db015a6987 > GMAIL_OAUTH_REFRESH_TOKEN
      - name: Newsletter trace (read-only; counts only)
        env:
          LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          STAGE: ${{ inputs.stage }}
          ALERTS_MESSAGE_REF: ${{ inputs.message_ref }}
        run: python -m lifeos.run "$STAGE"
  # LIFE-10: the two stages that reach Notion. Their own job, so the Jobs Notion token (the VS Code connection) never reaches the database or Gmail diagnostics above, and
  # no other value reaches this one. Both are pinned to the fixed synthetic sandbox ids: notion-sandbox-access only reads (TL comment 10754); notion-sandbox-outreach-proof
  # writes only its one synthetic sandbox page, and only with confirm = SYNTHETIC (Jim's plan approval, LIFE-10 comment 10773). Codes and counts only.
  sandbox:
    if: ${{ inputs.stage == 'notion-sandbox-access' || inputs.stage == 'notion-sandbox-outreach-proof' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python
      - id: bws_sandbox
        name: Load the Jobs Notion token from Bitwarden (exactly this 1; masked step output only, nothing exported job-wide; the job fails if retrieval fails, no fallback)
        continue-on-error: true                 # D209: one retry below; the retry fails the job
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            53dc3d04-dbb2-45fe-8185-b4db015eedcb > NOTION_API_TOKEN
      - name: Bitwarden refused or timed out (429 / 5xx) - pause before the one retry
        if: ${{ steps.bws_sandbox.outcome == 'failure' }}
        run: sleep $((30 + RANDOM % 45))
      - id: bws_sandbox_retry
        name: Load the same token from Bitwarden - the one retry (the job fails if it fails, no fallback)
        if: ${{ steps.bws_sandbox.outcome == 'failure' }}
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            53dc3d04-dbb2-45fe-8185-b4db015eedcb > NOTION_API_TOKEN
      - name: Notion sandbox access (read-only; codes and counts only)
        if: ${{ inputs.stage == 'notion-sandbox-access' }}
        env:
          NOTION_API_TOKEN: ${{ steps.bws_sandbox.outputs.NOTION_API_TOKEN || steps.bws_sandbox_retry.outputs.NOTION_API_TOKEN }}
        run: python -m lifeos.run notion-sandbox-access --limit 0
      - name: Notion sandbox outreach proof (one synthetic sandbox page; typed confirmation; codes and counts only)
        if: ${{ inputs.stage == 'notion-sandbox-outreach-proof' }}
        env:
          NOTION_API_TOKEN: ${{ steps.bws_sandbox.outputs.NOTION_API_TOKEN || steps.bws_sandbox_retry.outputs.NOTION_API_TOKEN }}
          PROOF_CONFIRM: ${{ inputs.confirm }}
        run: python -m lifeos.run notion-sandbox-outreach-proof --limit 0 --live
  # LIFE-88: the UI 3c REST capability probe. Its own job, so the Interview Notion token (LIFE OS Interview OS) reaches nothing else and no other value reaches it.
  # Reads the accepted UI 3c QA preview and writes only its one probe page under the QA Interview OS parent, only with confirm = QA. Codes, block types and counts only.
  interview_ui:
    if: ${{ inputs.stage == 'interview-ui-probe' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python
      - id: bws_interview
        name: Load the Interview Notion token from Bitwarden (exactly this 1; masked step output only, nothing exported job-wide; the job fails if retrieval fails, no fallback)
        continue-on-error: true                 # D209: one retry below; the retry fails the job
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            092b44ae-32cb-453b-8cc2-b4db015ef571 > NOTION_INTERVIEW_TOKEN
      - name: Bitwarden refused or timed out (429 / 5xx) - pause before the one retry
        if: ${{ steps.bws_interview.outcome == 'failure' }}
        run: sleep $((30 + RANDOM % 45))
      - id: bws_interview_retry
        name: Load the same token from Bitwarden - the one retry (the job fails if it fails, no fallback)
        if: ${{ steps.bws_interview.outcome == 'failure' }}
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            092b44ae-32cb-453b-8cc2-b4db015ef571 > NOTION_INTERVIEW_TOKEN
      - name: Interview UI 3c REST capability probe (one QA probe page; typed confirmation; codes, block types and counts only)
        env:
          NOTION_INTERVIEW_TOKEN: ${{ steps.bws_interview.outputs.NOTION_INTERVIEW_TOKEN || steps.bws_interview_retry.outputs.NOTION_INTERVIEW_TOKEN }}
          PROBE_CONFIRM: ${{ inputs.confirm }}
        run: python -m lifeos.run interview-ui-probe --limit 0 --live
