name: domain-jira
on:
  workflow_call:
    inputs:
      jira:
        type: string
        default: "none"
      live:
        type: boolean
        default: false
      phase:
        type: string
        default: "none"
      reconcile_force:
        type: boolean
        default: false
      verify:
        type: string
        default: ""
      gate_due_jira:
        type: string
        default: ""
    secrets:
      DOPPLER_TOKEN:
        required: false
      LIFEOS_BWS_RUNTIME_TOKEN:
        required: false
permissions:
  contents: read
env:
  STAGE_TIMING_FILE: /tmp/stage-timing-domains.jsonl
jobs:
  jira:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for try in 1 2 3; do git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA" && break; [ "$try" = 3 ] && exit 1; sleep $((try * 5)); done
          git checkout -q --detach FETCH_HEAD
      - name: Python and the Bitwarden helper
        uses: ./.github/actions/job-start
        with:
          wait_seconds: "300"
      - id: bws_jira
        name: Load the migrated credentials from Bitwarden
        uses: &a1 ./.github/actions/bws-load
        with:
          access_token: &a2 ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          doppler_compare: &a3 ${{ secrets.DOPPLER_TOKEN }}
          set_env: false
          set: jira
      - name: Plain switches from Bitwarden
        uses: ./.github/actions/bws-plain
        with:
          access_token: *a2
          names: ALERTS_ENABLED,ALERTS_MUTED_UNTIL,ALERT_SETTINGS,LIFEOS_ACQ_SSH_PORT,V7_STORE_VIA,LIVE
          live_mode: ${{ (github.event_name == 'workflow_run' || inputs.phase == 'tick') && 'follow' || github.event_name == 'workflow_dispatch' && (inputs.live && 'true' || 'false') || 'false' }}
      - name: Join the tailnet as the ephemeral tag:v7-runner node
        continue-on-error: true
        uses: ./.github/actions/tailscale
        with:
          oauth-client-id: ${{ steps.bws_jira.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_jira.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
      - id: bws_runtime_config
        continue-on-error: true
        name: Runtime Configuration source ID from Bitwarden
        uses: *a1
        with:
          access_token: *a2
          doppler_compare: *a3
          set_env: false
          set: runtime-config
      - id: settings
        continue-on-error: true
        name: V7 settings page for the Jira base URL, boards and GTV epic
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: &a4 ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          NOTION_JIRA_TOKEN: &a5 ${{ steps.bws_jira.outputs.NOTION_JIRA_TOKEN }}
          JIRA_BASE_URL: ""
          JIRA_BOARDS: ""
          JIRA_GTV_EPIC: ""
          MEJ_SPRINT_AUTOMATION: ""
          MEJ_AUTOMATION_SINCE: ""
          JIRA_WRITERS_VERIFIED: ""
          JIRA_FUTURE_SPRINTS: ""
          V2_PROMOTION: ""
          V2_OFFICIAL: ""
        run: python3 -m lifeos.platform.settings
      - id: jrollauto
        continue-on-error: true
        name: Jira sprint rollover
        if: &a6 ${{ inputs.gate_due_jira == 'true' }}
        env: &m1
          JIRA_API_TOKEN: &a7 ${{ steps.bws_jira.outputs.JIRA_API_TOKEN }}
          JIRA_EMAIL: &a8 ${{ steps.bws_jira.outputs.JIRA_EMAIL }}
        run: python -m lifeos.run jira-rollover-scheduled $([ "$LIVE" = "true" ] && echo --live)
      - id: jrollwatch
        continue-on-error: true
        name: Jira rollover watch
        if: ${{ always() && steps.jrollauto.outcome != 'skipped' }}
        env:
          JIRA_ROLLOVER_OUTCOME: ${{ steps.jrollauto.outcome }}
          NTFY_TOPIC: &a9 ${{ steps.bws_jira.outputs.NTFY_TOPIC }}
          LIFEOS_ACQ_DB_NAME: &a10 ${{ steps.bws_jira.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: &a11 ${{ steps.bws_jira.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: &a12 ${{ steps.bws_jira.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: &a13 ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: &a14 ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_JUMP_HOST: &a15 ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: &a16 ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: &a17 ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: &a18 ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: &a19 ${{ steps.bws_jira.outputs.LIFEOS_ACQ_SSH_USER }}
        run: python -m lifeos.run jira-rollover-watch $([ "$LIVE" = "true" ] && echo --live)
      - id: jreconcile
        continue-on-error: true
        name: Jira daily reconcile
        if: ${{ inputs.gate_due_jira == 'true' || inputs.jira == 'reconcile' }}
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: *a4
          NOTION_JIRA_TOKEN: *a5
          JIRA_API_TOKEN: *a7
          JIRA_EMAIL: *a8
          JIRA_RECONCILE_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.jira == 'reconcile' && inputs.reconcile_force && 'true' || '' }}
          NTFY_TOPIC: *a9
          LIFEOS_ACQ_DB_NAME: *a10
          LIFEOS_ACQ_DB_PASSWORD: *a11
          LIFEOS_ACQ_DB_USER: *a12
          LIFEOS_ACQ_SSH_HOST: *a13
          LIFEOS_ACQ_SSH_JUMP_KEY: *a14
          LIFEOS_ACQ_SSH_JUMP_HOST: *a15
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: *a16
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: *a17
          LIFEOS_ACQ_SSH_PRIVATE_KEY: *a18
          LIFEOS_ACQ_SSH_USER: *a19
        run: python -m lifeos.run jira-reconcile-daily $([ "$LIVE" = "true" ] && echo --live)
      - id: jsnap
        continue-on-error: true
        name: Jira snapshot (counts only; saved only when live)
        if: ${{ inputs.jira == 'snapshot' || inputs.jira == 'both' || inputs.jira == 'report' || inputs.gate_due_jira == 'true' }}
        env:
          JIRA_API_TOKEN: *a7
          JIRA_EMAIL: *a8
          LIFEOS_ACQ_DB_NAME: *a10
          LIFEOS_ACQ_DB_PASSWORD: *a11
          LIFEOS_ACQ_DB_USER: *a12
          LIFEOS_ACQ_SSH_HOST: *a13
          LIFEOS_ACQ_SSH_JUMP_KEY: *a14
          LIFEOS_ACQ_SSH_JUMP_HOST: *a15
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: *a16
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: *a17
          LIFEOS_ACQ_SSH_PRIVATE_KEY: *a18
          LIFEOS_ACQ_SSH_USER: *a19
        run: python -m lifeos.run jira-snapshot $([ "$LIVE" = "true" ] && echo --live)
      - id: jcard
        continue-on-error: true
        name: Jira card (Daily Report; written only when live)
        if: &a20 ${{ inputs.jira == 'card' || inputs.jira == 'report' || inputs.gate_due_jira == 'true' }}
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: *a4
          JIRA_CARD_BLOCK_ID: ""
          GTV_CARD_BLOCK_ID: ""
          JIRA_GTV_EPIC: ""
          JIRA_CARD_PROJECTS: ""
          JIRA_SITE_URL: ""
          JIRA_GTV_CONTEXT_URL: ""
          MEJ_SPRINT_AUTOMATION: ""
          JIRA_API_TOKEN: *a7
          JIRA_EMAIL: *a8
          LIFEOS_ACQ_DB_NAME: *a10
          LIFEOS_ACQ_DB_PASSWORD: *a11
          LIFEOS_ACQ_DB_USER: *a12
          LIFEOS_ACQ_SSH_HOST: *a13
          LIFEOS_ACQ_SSH_JUMP_KEY: *a14
          LIFEOS_ACQ_SSH_JUMP_HOST: *a15
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: *a16
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: *a17
          LIFEOS_ACQ_SSH_PRIVATE_KEY: *a18
          LIFEOS_ACQ_SSH_USER: *a19
          NOTION_JIRA_TOKEN: *a5
        run: python -m lifeos.run jira-card $([ "$LIVE" = "true" ] && echo --live)
      - id: jrelease
        continue-on-error: true
        name: Auto-release
        if: *a20
        env: *m1
        run: python -m lifeos.run jira-release $([ "$LIVE" = "true" ] && echo --live)
      - id: jstalled
        continue-on-error: true
        name: Stall check
        if: *a20
        env: *m1
        run: python -m lifeos.run jira-stalled $([ "$LIVE" = "true" ] && echo --live)
      - id: jfill
        continue-on-error: true
        name: Parent, Component and Fix Version fill
        if: *a20
        env: *m1
        run: python -m lifeos.run jira-fill $([ "$LIVE" = "true" ] && echo --live)
      - id: jcapture
        continue-on-error: true
        name: Jira decision capture
        if: *a6
        env:
          JIRA_API_TOKEN: *a7
          JIRA_EMAIL: *a8
          LIFEOS_MCP_JIRA_CAPTURE: ${{ steps.bws_jira.outputs.LIFEOS_MCP_JIRA_CAPTURE }}
          LIFEOS_MCP_URL: ""
          LIFEOS_ACQ_DB_NAME: *a10
          LIFEOS_ACQ_DB_PASSWORD: *a11
          LIFEOS_ACQ_DB_USER: *a12
          LIFEOS_ACQ_SSH_HOST: *a13
          LIFEOS_ACQ_SSH_JUMP_KEY: *a14
          LIFEOS_ACQ_SSH_JUMP_HOST: *a15
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: *a16
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: *a17
          LIFEOS_ACQ_SSH_PRIVATE_KEY: *a18
          LIFEOS_ACQ_SSH_USER: *a19
        run: python -m lifeos.run jira-capture $([ "$LIVE" = "true" ] && echo --live)
      - id: jprobe
        continue-on-error: true
        name: Jira layout probe (read-only; counts only)
        if: ${{ inputs.jira == 'probe' }}
        env: *m1
        run: python -m lifeos.run jira-probe
      - id: jwcheck
        continue-on-error: true
        name: Jira writer contract check
        if: ${{ inputs.jira == 'writers-check' }}
        env: *m1
        run: python -m lifeos.jira.writers contract-check
      - id: jwverify
        continue-on-error: true
        name: Jira writer verification on a throwaway sprint
        if: ${{ inputs.jira == 'writers-verify' }}
        env:
          JIRA_API_TOKEN: *a7
          JIRA_EMAIL: *a8
          JIRA_WRITERS_VERIFY: &a21 ${{ inputs.verify }}
        run: |
          set -f; set -- $JIRA_WRITERS_VERIFY; VERIFY_BOARD="$1"; VERIFY_ISSUE="$2"; VERIFY_LIVE="${3:-}"; VERIFY_KEEP="${4:-}"
          [ "$#" -ge 2 ] && [ "$#" -le 4 ] || { echo "::error title=jira::verify must be BOARD ISSUE [yes [keep]]"; exit 1; }
          case "$VERIFY_BOARD" in JFM|MEJ) ;; *) echo "::error title=jira::verify board must be JFM or MEJ"; exit 1;; esac
          printf '%s' "$VERIFY_ISSUE" | grep -Eq '^[A-Z][A-Z0-9]{1,9}-[0-9]{1,7}$' || { echo "::error title=jira::verify issue must be one issue key"; exit 1; }
          case "$VERIFY_LIVE" in ""|yes) ;; *) echo "::error title=jira::the third word must be yes or absent"; exit 1;; esac
          case "$VERIFY_KEEP" in ""|keep) ;; *) echo "::error title=jira::the fourth word must be keep or absent"; exit 1;; esac
          [ -z "$VERIFY_KEEP" ] || [ "$VERIFY_LIVE" = "yes" ] || { echo "::error title=jira::keep needs yes before it"; exit 1; }
          if [ "$VERIFY_LIVE" = "yes" ] && [ "$VERIFY_KEEP" = "keep" ]; then python -m lifeos.jira.writers verify --board "$VERIFY_BOARD" --issue "$VERIFY_ISSUE" --live --keep; elif [ "$VERIFY_LIVE" = "yes" ]; then python -m lifeos.jira.writers verify --board "$VERIFY_BOARD" --issue "$VERIFY_ISSUE" --live; else python -m lifeos.jira.writers verify --board "$VERIFY_BOARD" --issue "$VERIFY_ISSUE"; fi
      - id: jsetterproof
        continue-on-error: true
        name: V2_OFFICIAL setter proof (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.jira == 'setter-proof' }}
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: *a4
          NOTION_JIRA_TOKEN: *a5
          JIRA_SETTER_PROOF: *a21
        run: |
          set -f; set -- $JIRA_SETTER_PROOF; PROOF_REVISION="$1"; PROOF_LIVE="${2:-}"
          [ "$#" -ge 1 ] && [ "$#" -le 2 ] || { echo "::error title=jira::verify must be REVISION [yes]"; exit 1; }
          printf '%s' "$PROOF_REVISION" | grep -Eq '^[0-9]{1,6}$' || { echo "::error title=jira::the revision must be a number"; exit 1; }
          case "$PROOF_LIVE" in ""|yes) ;; *) echo "::error title=jira::the second word must be yes or absent"; exit 1;; esac
          if [ "$PROOF_LIVE" = "yes" ]; then python -m lifeos.accountability.setter_proof --live --revision "$PROOF_REVISION"; else python -m lifeos.accountability.setter_proof --revision "$PROOF_REVISION"; fi
      - id: jroll
        continue-on-error: true
        name: Jira sprint rollover (dry run unless live)
        if: ${{ inputs.jira == 'rollover' || inputs.jira == 'both' }}
        env: *m1
        run: python -m lifeos.run jira-rollover $([ "$LIVE" = "true" ] && echo --live)
      - name: Jira warning (does not fail the run)
        if: ${{ always() && (steps.jsnap.outcome == 'failure' || steps.jcard.outcome == 'failure' || steps.jrelease.outcome == 'failure' || steps.jstalled.outcome == 'failure' || steps.jfill.outcome == 'failure' || steps.jcapture.outcome == 'failure' || steps.jrollauto.outcome == 'failure' || steps.jreconcile.outcome == 'failure' || steps.jrollwatch.outcome == 'failure' || steps.jroll.outcome == 'failure' || steps.jprobe.outcome == 'failure' || steps.jwcheck.outcome == 'failure' || steps.jwverify.outcome == 'failure' || steps.jsetterproof.outcome == 'failure') }}
        run: echo "::warning title=Jira::a Jira step failed; the Jobs pipeline is unaffected"
      - name: Fail the job if any stage step failed
        if: ${{ always() && (steps.bws_jira.outcome == 'failure' || steps.settings.outcome == 'failure' || steps.jrollauto.outcome == 'failure' || steps.jreconcile.outcome == 'failure' || steps.jrollwatch.outcome == 'failure' || steps.jsnap.outcome == 'failure' || steps.jcard.outcome == 'failure' || steps.jrelease.outcome == 'failure' || steps.jstalled.outcome == 'failure' || steps.jfill.outcome == 'failure' || steps.jcapture.outcome == 'failure' || steps.jprobe.outcome == 'failure' || steps.jwcheck.outcome == 'failure' || steps.jwverify.outcome == 'failure' || steps.jsetterproof.outcome == 'failure' || steps.jroll.outcome == 'failure') }}
        run: echo "::error title=jira::a stage step failed in the jira job (see the step marked failed above)"; exit 1
