name: bills
# Manual read-only Bill Tracker snapshot. The private database is updated only when Save snapshot is ticked.
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Save the complete snapshot to the private database (unticked = dry run, counts only)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: life-os-v7-bills
  cancel-in-progress: false
jobs:
  bills:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python
      - id: bsnap
        continue-on-error: true
        name: Bills snapshot (read-only; save only when live)
        env:
          NOTION_BILLS_TOKEN: ${{ secrets.NOTION_BILLS_TOKEN }}
          NOTION_BILLS_DATA_SOURCE_ID: ${{ secrets.NOTION_BILLS_DATA_SOURCE_ID }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ secrets.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_DB_PASSWORD: ${{ secrets.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_SSH_HOST: ${{ secrets.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
          LIFEOS_ACQ_SSH_USER: ${{ secrets.LIFEOS_ACQ_SSH_USER }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ secrets.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_DB_NAME: ${{ secrets.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_USER: ${{ secrets.LIFEOS_ACQ_DB_USER }}
        run: python -m lifeos.run bills-snapshot $([ "${{ inputs.live }}" = "true" ] && echo --live)
      - name: Bills warning
        if: ${{ always() && steps.bsnap.outcome == 'failure' }}
        run: echo "::warning title=Bills::the Bill Tracker snapshot failed"
