name: domain-gate
on:
  workflow_call:
    inputs:
      all:
        type: boolean
        default: false
      live:
        type: boolean
        default: false
      phase:
        type: string
        default: "none"
    secrets:
      DOPPLER_TOKEN:
        required: false
      LIFEOS_BWS_RUNTIME_TOKEN:
        required: false
    outputs:
      all:
        value: ${{ jobs.gate.outputs.all }}
      due_agenda:
        value: ${{ jobs.gate.outputs.due_agenda }}
      due_amazon:
        value: ${{ jobs.gate.outputs.due_amazon }}
      due_amazon_retention:
        value: ${{ jobs.gate.outputs.due_amazon_retention }}
      due_bills:
        value: ${{ jobs.gate.outputs.due_bills }}
      due_dcc:
        value: ${{ jobs.gate.outputs.due_dcc }}
      due_fit_cloud_backlog:
        value: ${{ jobs.gate.outputs.due_fit_cloud_backlog }}
      due_followup:
        value: ${{ jobs.gate.outputs.due_followup }}
      due_granola:
        value: ${{ jobs.gate.outputs.due_granola }}
      due_hiring:
        value: ${{ jobs.gate.outputs.due_hiring }}
      due_hiring_outcomes:
        value: ${{ jobs.gate.outputs.due_hiring_outcomes }}
      due_imessage:
        value: ${{ jobs.gate.outputs.due_imessage }}
      due_interview:
        value: ${{ jobs.gate.outputs.due_interview }}
      due_jira:
        value: ${{ jobs.gate.outputs.due_jira }}
      due_last_seen_purge:
        value: ${{ jobs.gate.outputs.due_last_seen_purge }}
      due_mail:
        value: ${{ jobs.gate.outputs.due_mail }}
      due_megibow:
        value: ${{ jobs.gate.outputs.due_megibow }}
      due_network_surface:
        value: ${{ jobs.gate.outputs.due_network_surface }}
      due_outlook:
        value: ${{ jobs.gate.outputs.due_outlook }}
      due_recruiters:
        value: ${{ jobs.gate.outputs.due_recruiters }}
      due_weekly_review:
        value: ${{ jobs.gate.outputs.due_weekly_review }}
      early:
        value: ${{ jobs.gate.outputs.early }}
      granola_auto:
        value: ${{ jobs.gate.outputs.granola_auto }}
      imessage_alerts:
        value: ${{ jobs.gate.outputs.imessage_alerts }}
      late:
        value: ${{ jobs.gate.outputs.late }}
      pipeline:
        value: ${{ jobs.gate.outputs.pipeline }}
      tick:
        value: ${{ jobs.gate.outputs.tick }}
permissions:
  contents: read
  actions: read
env:
  STAGE_TIMING_FILE: /tmp/stage-timing-domains.jsonl
jobs:
  gate:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tick: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.display_title == 'tick') || (github.event_name == 'workflow_dispatch' && inputs.phase == 'tick') }}
      early: ${{ inputs.all || inputs.phase == 'tick' || (github.event_name == 'workflow_run' && steps.cover.outputs.early_covered == 'false') }}
      late: ${{ inputs.all || github.event_name == 'workflow_run' }}
      all: ${{ inputs.all }}
      pipeline: ${{ (github.event_name == 'workflow_run' || inputs.phase == 'tick') && steps.ran.outputs.ran != 'false' }}
      due_jira: ${{ steps.due.outputs.due_jira }}
      due_followup: ${{ steps.due.outputs.due_followup }}
      due_outlook: ${{ steps.due.outputs.due_outlook }}
      due_bills: ${{ steps.due.outputs.due_bills }}
      due_agenda: ${{ steps.due.outputs.due_agenda }}
      due_amazon: ${{ steps.due.outputs.due_amazon }}
      due_amazon_retention: ${{ steps.due.outputs.due_amazon_retention }}
      due_mail: ${{ steps.due.outputs.due_mail }}
      due_hiring: ${{ steps.due.outputs.due_hiring }}
      due_megibow: ${{ steps.due.outputs.due_megibow }}
      due_dcc: ${{ steps.due.outputs.due_dcc }}
      due_weekly_review: ${{ steps.due.outputs.due_weekly_review }}
      due_recruiters: ${{ steps.due.outputs.due_recruiters }}
      due_hiring_outcomes: ${{ steps.due.outputs.due_hiring_outcomes }}
      due_interview: ${{ steps.due.outputs.due_interview }}
      due_imessage: ${{ steps.due.outputs.due_imessage }}
      due_granola: ${{ steps.due.outputs.due_granola }}
      due_network_surface: ${{ steps.due.outputs.due_network_surface }}
      due_fit_cloud_backlog: ${{ steps.due.outputs.due_fit_cloud_backlog }}
      due_last_seen_purge: ${{ steps.due.outputs.due_last_seen_purge }}
      granola_auto: ${{ steps.settings.outputs.GRANOLA_AUTO }}
      imessage_alerts: ${{ steps.settings.outputs.V7_IMESSAGE_ALERTS }}
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for try in 1 2 3; do git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA" && break; [ "$try" = 3 ] && exit 1; sleep $((try * 5)); done
          git checkout -q --detach FETCH_HEAD
      - id: due
        name: Which domain jobs are due
        env:
          GITHUB_TOKEN: &a1 ${{ github.token }}
          DOMAINS_PHASE: ${{ inputs.phase }}
        run: python3 -m lifeos.platform.due
      - id: cover
        name: Is the early run of this tick already started
        if: &a2 ${{ github.event_name == 'workflow_run' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: *a1
          TICK_STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: python3 -m lifeos.platform.phase
      - id: ran
        name: Did the tick's hourly finish job run
        if: *a2
        continue-on-error: true
        env:
          GITHUB_TOKEN: *a1
          TICK_RUN: ${{ github.event.workflow_run.id }}
        run: python3 -m lifeos.platform.pipeline_ran
      - name: Bitwarden helper from a saved, fingerprint-checked copy
        continue-on-error: true
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "60"
      - id: bws_settings
        continue-on-error: true
        name: Notion token from Bitwarden for the V7 settings page
        uses: ./.github/actions/bws-load
        with:
          access_token: &a3 ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          doppler_compare: ${{ secrets.DOPPLER_TOKEN }}
          set_env: false
          set: settings
      - name: Plain switches from Bitwarden
        continue-on-error: true
        uses: ./.github/actions/bws-plain
        with:
          access_token: *a3
          names: ALERTS_ENABLED,ALERTS_MUTED_UNTIL,ALERT_SETTINGS,LIVE
          live_mode: ${{ (github.event_name == 'workflow_run' || inputs.phase == 'tick') && 'follow' || github.event_name == 'workflow_dispatch' && (inputs.live && 'true' || 'false') || 'false' }}
      - id: settings
        continue-on-error: true
        name: V7 settings page for the two switches a job condition needs
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_settings.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          NOTION_JIRA_TOKEN: ${{ steps.bws_settings.outputs.NOTION_JIRA_TOKEN }}
          GRANOLA_AUTO: ""
          V7_IMESSAGE_ALERTS: ""
        run: python3 -m lifeos.platform.settings --output GRANOLA_AUTO --output V7_IMESSAGE_ALERTS
