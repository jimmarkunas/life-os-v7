name: pr-tests
# Secret-free pull request check: the unit tests (32 shards of whole test modules over 8 parallel jobs, tests/shard.py, balanced on CI seconds: LIFE-705), lint and type check, on the PR head merged with its base. Read-only, no secrets, no database, nothing dispatched.
# Every CI invocation takes 60 s or less, warning at 45 s (LIFE-1100, Jim Nov 27 2026). Every merge to main runs the same graph, so the Close auto-release has a tested main commit within a minute (Jim, Oct 25 2026).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]   # LIFE-1096: the merge queue builds each group on its own branch and waits for this workflow's required `unit-tests`; without this trigger the queue would hang
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: life-os-v7-pr-tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # LIFE-604: a newer push replaces the older check of the same pull request; every merge to main keeps its own group
jobs:
  # LIFE-1100: `pick` chooses the tests (a selection is planned into 1 to 4 test jobs), `tests` fans a FULL pick out over 8 jobs (4 of the 32 shards each, one per vCPU), `lint` runs ruff, mypy and Node beside them, and the last job `unit-tests` (the required check, name unchanged)
  # waits for all three and gates the whole run: a job or run over 60 s fails with "TIME GATE ONLY" when every test passed; 45 s warns. At most 8 + lint + second-date jobs run at once per run; GitHub Free allows 20.
  pick:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      t0: ${{ steps.start.outputs.t0 }}
      sd: ${{ steps.start.outputs.sd }}
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=2 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Start time (the job's clock for the 60 s gate)
        id: start
        run: echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"; echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"; if [ "$GITHUB_EVENT_NAME" = "push" ]; then echo 'sd=[1,2,3,4]' >> "$GITHUB_OUTPUT"; else echo 'sd=[1]' >> "$GITHUB_OUTPUT"; fi
      - name: Fetch the merge group's base (LIFE-1096)
        if: ${{ github.event_name == 'merge_group' }}
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$BASE_SHA"
      - name: Restore the newest test index main built (LIFE-644; read-only here, a missing or old one means FULL)
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: docs/test-index.json
          key: test-index-v1-${{ hashFiles('tests/testindex.py', 'requirements-test.lock') }}-${{ github.sha }}
          restore-keys: test-index-v1-${{ hashFiles('tests/testindex.py', 'requirements-test.lock') }}-
      - name: Pick the tests (LIFE-548; a PR runs what its change can affect plus tests/contracts, main runs everything)
        id: pick
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            python3 -m tests.testindex select --base "${BASE_SHA:-HEAD^1}" > selected.txt || { echo FULL > selected.txt; echo "selector failed: fail-open to everything (LIFE-770 counts these)" | tee -a "$GITHUB_STEP_SUMMARY"; }     # any trouble picking means everything
          else
            echo FULL > selected.txt
          fi
          if [ "$(head -n 1 selected.txt)" = "FULL" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "tests picked: everything" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then tail -n +2 selected.txt | grep '^FULL because ' | tee -a "$GITHUB_STEP_SUMMARY" || echo "FULL because the selector gave no reason" | tee -a "$GITHUB_STEP_SUMMARY"; else echo "FULL because a merge to main always runs everything" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "tests picked: $(wc -l < selected.txt) targets" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Plan the test jobs (LIFE-1100; a FULL pick is 8 jobs of shards, a selection is 1 to 4 jobs sized by measured seconds)
        id: plan
        run: python3 -m tests.splitsel selected.txt | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
  tests:
    needs: pick
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pick.outputs.matrix).include }}
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=2 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Start time (the job's clock for the 60 s gate)
        id: start
        run: echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"; echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/python   # LIFE-1100: test-lock
        with:
          test-lock: "true"
      - name: Unit tests (a FULL pick runs shards 4i-3 to 4i of 32, a selection its group of targets, in four processes; warn at 45 s, fail at 60 s)
        env:
          JOB: ${{ matrix.job }}
          GROUP: ${{ matrix.group }}
        run: |
          status=0
          if [ -n "$GROUP" ]; then
            printf '%s\n' $GROUP > selected.txt
            python -m tests.quickselect run-list selected.txt --jobs 4 > shard-1.log 2>&1 || status=$?
            cat shard-1.log
            what="selected targets"
          else
            pids=""
            for j in 1 2 3 4; do
              k=$(( (JOB - 1) * 4 + j ))
              ( python -m tests.shard "$k" 32 > "shard-$k.log" 2>&1 ) &
              pids="$pids $!"
            done
            for p in $pids; do wait "$p" || status=$?; done
            for j in 1 2 3 4; do k=$(( (JOB - 1) * 4 + j )); grep -v '^shard-seconds ' "shard-$k.log" || true; done
            if [ "$status" -eq 0 ]; then echo "::group::per-module shard seconds (input of python -m tests.shard --from-logs; LIFE-1076: left out of a failing run's log)"; for j in 1 2 3 4; do k=$(( (JOB - 1) * 4 + j )); grep -h '^shard-seconds ' "shard-$k.log" || true; done; echo "::endgroup::"; fi
            what="shards $(( (JOB - 1) * 4 + 1 ))-$(( JOB * 4 )) of 32"
          fi
          elapsed=$(( $(date +%s) - JOB_T0 ))
          echo "tests ${JOB} (${what}): exit ${status}, ${elapsed} s from the start of the job" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if [ "$elapsed" -ge 60 ]; then echo "TIME GATE ONLY: every test passed; the job took ${elapsed} s and the limit is 60 s (LIFE-1100)" | tee -a "$GITHUB_STEP_SUMMARY"; echo "::error::Test job ${JOB} took ${elapsed} s; the limit is 60 s"; exit 1; fi
          if [ "$elapsed" -ge 45 ]; then echo "::warning::Test job ${JOB} took ${elapsed} s; the warning level is 45 s"; fi
  # Lint, type check and the Node tests, in parallel with the tests; none of them takes over 5 s (measured Nov 27 2026), so they share one job.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      t0: ${{ steps.start.outputs.t0 }}
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=2 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Start time (the job's clock for the 60 s gate)
        id: start
        run: echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"; echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/python   # LIFE-1100: test-lock
        with:
          test-lock: "true"
      - name: Agent trailer (LIFE-1096, policy section 3; pull requests only)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/agent_trailer_check.py
      - name: Ruff format check (lifeos, tools and tests at 120 columns)
        run: python -m ruff format --check --no-cache lifeos tools tests
      - name: Ruff correctness rules (LIFE-596; BLOCKING on B023, B904, F811 and B017; every other rule is advisory below)
        run: python -m ruff check --no-cache --select B023,B904,F811,B017 --output-format concise .
      - name: Ruff advisory (LIFE-558; changed Python files, counts only, never fails the job)
        continue-on-error: true
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- '*.py' | tr '\n' ' ')
          if [ -z "$files" ]; then echo "ruff (advisory): no Python file changed" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          start=$(date +%s)
          counts=$(python -m ruff check --no-cache --statistics $files 2>/dev/null || true)
          total=$(printf '%s\n' "$counts" | awk '$1 ~ /^[0-9]+$/ {n += $1} END {print n + 0}')
          {
            echo "ruff (advisory): ${total} finding(s) in $(printf '%s\n' $files | wc -l | tr -d ' ') changed Python file(s), $(( $(date +%s) - start )) s. A hint, never a gate. Baseline: docs/platform/lint-baseline.md"
            printf '%s\n' "$counts" | grep -E '^[[:space:]]*[0-9]+' || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Type check advisory (LIFE-559; changed lifeos/platform files, counts only, never fails the job)
        continue-on-error: true
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- 'lifeos/platform/*.py' | tr '\n' ' ')
          if [ -z "$files" ]; then echo "mypy (advisory): no lifeos/platform file changed" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          start=$(date +%s)
          found=$(python -m mypy --no-incremental --no-error-summary $files 2>/dev/null | grep -E ': error:' | sed -E 's/:[0-9]+: error.*//' | sort | uniq -c || true)
          total=$(printf '%s\n' "$found" | awk '$1 ~ /^[0-9]+$/ {n += $1} END {print n + 0}')
          {
            echo "mypy (advisory): ${total} finding(s) in $(printf '%s\n' $files | wc -l | tr -d ' ') changed lifeos/platform file(s), $(( $(date +%s) - start )) s. A hint, never a gate. Baseline: docs/platform/type-baseline.md"
            printf '%s\n' "$found" | grep -E '^[[:space:]]*[0-9]+' || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Type check blocking (LIFE-600, Jim Nov 24 2026; the modules in mypy-blocking.txt; a type error in one fails the job)
        run: |
          start=$(date +%s)
          python -m mypy --no-incremental $(cat mypy-blocking.txt)
          echo "mypy (blocking): $(wc -l < mypy-blocking.txt | tr -d ' ') modules clean, $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      # Jim, Nov 8 2026: the Concord Room plugin is production; its Node tests run on every PR and merge (no install, no secret).
      - uses: ./.github/actions/node
      - name: Concord Room plugin tests (node:test)
        run: node --test tools/orca-concord-room/test/worker.test.mjs
  # THE REQUIRED CHECK (docs/platform/branch-protection.md): runs after the jobs above even if one failed; fails unless each succeeded and gates the whole run.
  unit-tests:
    needs: [pick, tests, lint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verdict and whole-run time gate (fail at 60 s, warn at 45 s)
        env:
          PICK: ${{ needs.pick.result }}
          TESTS: ${{ needs.tests.result }}
          LINT: ${{ needs.lint.result }}
          T0_PICK: ${{ needs.pick.outputs.t0 }}
          T0_LINT: ${{ needs.lint.outputs.t0 }}
        run: |
          bad=0
          [ "$PICK" = "success" ] || bad=1
          [ "$LINT" = "success" ] || bad=1
          [ "$TESTS" = "success" ] || bad=1
          echo "pick=${PICK} tests=${TESTS} lint=${LINT}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$bad" -ne 0 ]; then echo "::error::a needed job did not succeed (pick=${PICK}, tests=${TESTS}, lint=${LINT})"; exit 1; fi
          t0=${T0_PICK:-0}; if [ -n "$T0_LINT" ] && [ "$T0_LINT" -lt "$t0" ]; then t0=$T0_LINT; fi
          elapsed=$(( $(date +%s) - t0 ))
          echo "whole run: ${elapsed} s from the earliest job start" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -ge 60 ]; then echo "TIME GATE ONLY: every test passed; the run took ${elapsed} s and the limit is 60 s (LIFE-1100)" | tee -a "$GITHUB_STEP_SUMMARY"; echo "::error::The run took ${elapsed} s; the limit is 60 s"; exit 1; fi
          if [ "$elapsed" -ge 45 ]; then echo "::warning::The run took ${elapsed} s; the warning level is 45 s"; fi
  # LIFE-644: the test index is not committed. After `unit-tests` passes on a merge to main this job builds it (the whole suite once under coverage) and saves it by builder, lock and commit; a pull request only restores it. Its own job, so the required check stays short.
  test-index:
    needs: unit-tests
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=2 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - uses: ./.github/actions/python
      - name: Test-only dependencies (PyYAML and coverage, from the lock)
        run: pip install --require-hashes -r requirements-test.lock
      - name: Restore the newest index (LIFE-770; read-only here, the save step below is the only writer)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: docs/test-index.json
          key: test-index-v1-${{ hashFiles('tests/testindex.py', 'requirements-test.lock') }}-${{ github.sha }}
          restore-keys: test-index-v1-${{ hashFiles('tests/testindex.py', 'requirements-test.lock') }}-
      - name: Is the newest index under a day old? (LIFE-770; a missing or older one means rebuild)
        id: fresh
        run: |
          if python -m tests.testindex check --max-age-days 1; then echo "fresh=true" >> "$GITHUB_OUTPUT"; echo "test index: reused (under a day old), no rebuild" | tee -a "$GITHUB_STEP_SUMMARY"; else echo "fresh=false" >> "$GITHUB_OUTPUT"; echo "test index: rebuilding" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - name: Build the test index
        if: ${{ steps.fresh.outputs.fresh != 'true' }}
        run: python -m tests.testindex build
      - name: Save the test index
        if: ${{ steps.fresh.outputs.fresh != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: docs/test-index.json
          key: test-index-v1-${{ hashFiles('tests/testindex.py', 'requirements-test.lock') }}-${{ github.sha }}
  # LIFE-692: the suite with the test clock (tests/kit/clock.py) fixed at a second date (LIFEOS_TEST_NOW); not the required check. LIFE-1100: a pull request runs only the date-sensitive modules in tests/second-date-tests.txt (docs/platform/scheduled-checks.md);
  # a merge to main runs everything as 4 jobs of 4 of 16 shards, continue-on-error so a red second date never turns the run red (the Close release and test gate read it).
  unit-tests-second-date:
    needs: pick
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    continue-on-error: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.pick.outputs.sd) }}
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=2 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Does this change touch anything but docs? (LIFE-770; docs cannot read the clock, and unit-tests still runs the contracts on them)
        id: scope
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|[^/]+\.md$)'; then echo "docs_only=false" >> "$GITHUB_OUTPUT"; else echo "docs_only=true" >> "$GITHUB_OUTPUT"; echo "second date: skipped, docs-only change" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - uses: ./.github/actions/python   # LIFE-1100: test-lock
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        with:
          test-lock: "true"
      - name: Unit tests on a second fixed date (LIFEOS_TEST_NOW; the listed modules on a pull request, 4 of 16 shards of everything on a merge to main)
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        env:
          LIFEOS_TEST_NOW: "2027-03-09"
          JOB: ${{ matrix.job }}
        run: |
          status=0
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            pids=""
            for j in 1 2 3 4; do k=$(( (JOB - 1) * 4 + j )); python -m tests.shard "$k" 16 > "shard-$k.log" 2>&1 & pids="$pids $!"; done
            for p in $pids; do wait "$p" || status=$?; done
            for j in 1 2 3 4; do grep -v '^shard-seconds ' "shard-$(( (JOB - 1) * 4 + j )).log" || true; done
          else
            grep -v '^#' tests/second-date-tests.txt | sed -e '/^$/d' -e 's#/#.#g' -e 's#\.py$##' > selected.txt
            python -m unittest $(cat selected.txt) > shard-1.log 2>&1 || status=$?
            cat shard-1.log
          fi
          echo "unit tests on ${LIFEOS_TEST_NOW}: exit ${status}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then echo "::error::The unit tests pass on today's date and fail with the test clock fixed at ${LIFEOS_TEST_NOW}: a test reads the real clock (see docs/platform/scheduled-checks.md)"; fi
          exit "$status"
