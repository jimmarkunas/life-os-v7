name: pr-tests
# Secret-free pull request check: the same unit tests as the `prep` job of hourly.yml (here run as 32 shards of whole test modules over 8 parallel jobs, tests/shard.py, balanced on CI-measured seconds: LIFE-705; hourly.yml runs them in one process), on the PR head merged with its base. Read-only, no secrets, no database, no network beyond installing
# the pinned requirements, nothing dispatched or scheduled. Runtime contract of the deterministic suite: a warning at 45 seconds, a failure at 60 seconds (LIFE-1100, Jim Nov 27 2026; it was 90 and 120 before, LIFE-596; hang guard: timeout-minutes).
# Every merge to main runs the same suite too (Jim, Oct 25 2026), so the Edge's Close auto-release has a tested main commit within a minute of a merge instead of waiting for the next hourly run.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]   # LIFE-1096: the merge queue builds each group on its own branch and waits for this workflow's required `unit-tests`; without this trigger the queue would hang
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: life-os-v7-pr-tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # LIFE-604: a newer push to the same pull request replaces its older check; every merge to main keeps its own group and is never cancelled (the Close release needs a verdict for each); no group is shared with any tick or manual run
jobs:
  # LIFE-1100 step 6: the required check `unit-tests` is now the FINAL job of a small graph, so its name and verdict meaning stay what branch protection and the Close release read. `pick` chooses the tests (and runs a small selection itself), `tests` fans a FULL pick out
  # over 8 parallel jobs (each runs 4 of the 32 shards of tests.shard, so 8 jobs x 4 vCPU), `lint` runs ruff, mypy and the Node tests beside them, and `unit-tests` waits for all three, fails unless each succeeded, and enforces the whole-run time gate.
  # Time rule (Jim, Nov 27 2026): every CI invocation takes 60 s or less. Warning at 45 s; a matrix job over 60 s fails, and so does a whole run over 60 s (earliest job start to the verdict job), with the message "TIME GATE ONLY" when every test passed.
  pick:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.pick.outputs.full }}
      t0: ${{ steps.start.outputs.t0 }}
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=2 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Start time (LIFE-1100; the job's clock for the 60 s gate, read right after the checkout)
        id: start
        run: echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"; echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - name: Fetch the merge group's base (LIFE-1096; a group holds up to five pull requests, so the changed files are everything since the base, not just the last commit)
        if: ${{ github.event_name == 'merge_group' }}
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$BASE_SHA"
      - uses: ./.github/actions/python   # LIFE-1100: test-lock installs the test lock too (PyYAML for the workflow contract tests) and caches the whole environment
        with:
          test-lock: "true"
      - name: Restore the newest test index main built (LIFE-644; a pull request only reads it, never writes it; no cache, a missing file, an unreadable one or one older than 7 days all mean FULL)
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: docs/test-index.json
          key: test-index-v1-${{ hashFiles('tests/testindex.py', 'requirements-test.lock') }}-${{ github.sha }}
          restore-keys: test-index-v1-${{ hashFiles('tests/testindex.py', 'requirements-test.lock') }}-
      - name: Pick the tests (LIFE-548; a pull request or a merge group runs the tests its change can affect plus tests/contracts, a merge to main always runs everything)
        id: pick
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            python -m tests.testindex select --base "${BASE_SHA:-HEAD^1}" > selected.txt || { echo FULL > selected.txt; echo "selector failed: fail-open to everything (LIFE-770 counts these)" | tee -a "$GITHUB_STEP_SUMMARY"; }     # any trouble picking means everything
          else
            echo FULL > selected.txt
          fi
          if [ "$(head -n 1 selected.txt)" = "FULL" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "tests picked: everything" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then tail -n +2 selected.txt | grep '^FULL because ' | tee -a "$GITHUB_STEP_SUMMARY" || echo "FULL because the selector gave no reason" | tee -a "$GITHUB_STEP_SUMMARY"; else echo "FULL because a merge to main always runs everything" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "tests picked: $(wc -l < selected.txt) targets" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Unit tests of a selected run (the small path, the picked targets in four parallel processes in THIS job; a FULL pick skips this step and fans out to the `tests` jobs; warn at 45 s, fail at 60 s)
        if: ${{ steps.pick.outputs.full != 'true' }}
        run: |
          status=0
          python -m tests.quickselect run-list selected.txt --jobs 4 > shard-1.log 2>&1 || status=$?     # the contracts alone are about 50 s on one process
          cat shard-1.log
          elapsed=$(( $(date +%s) - JOB_T0 ))
          echo "unit tests (selected run): exit ${status}, ${elapsed} s from the start of the job" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if [ "$elapsed" -ge 60 ]; then echo "TIME GATE ONLY: every test passed; the job took ${elapsed} s and the limit is 60 s (LIFE-1100)" | tee -a "$GITHUB_STEP_SUMMARY"; echo "::error::The selected tests took ${elapsed} s; the limit is 60 s"; exit 1; fi
          if [ "$elapsed" -ge 45 ]; then echo "::warning::The selected tests took ${elapsed} s; the warning level is 45 s"; fi
  # Eight parallel jobs, each running four of the 32 shards of whole test modules (tests.shard, balanced on CI-measured seconds in tests/shard-weights.json: LIFE-705) on its own 4 vCPU runner. Only a FULL pick runs them; a small selection ran inside `pick`.
  # Up to 8 + lint + second-date = 10 jobs of one run run together; GitHub Free allows 20 at once, so two runs fit and a third queues for the few seconds a job takes.
  tests:
    needs: pick
    if: ${{ needs.pick.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=2 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Start time (LIFE-1100; the job's clock for the 60 s gate, read right after the checkout)
        id: start
        run: echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"; echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/python   # LIFE-1100: test-lock installs the test lock too (PyYAML for the workflow contract tests) and caches the whole environment
        with:
          test-lock: "true"
      - name: Unit tests (shards 4i-3 to 4i of 32, four parallel processes; warn at 45 s, fail at 60 s)
        env:
          JOB: ${{ matrix.job }}
        run: |
          status=0
          pids=""
          for j in 1 2 3 4; do
            k=$(( (JOB - 1) * 4 + j ))
            ( t0=$(date +%s); python -m tests.shard "$k" 32 > "shard-$k.log" 2>&1; rc=$?; echo $(( $(date +%s) - t0 )) > "shard-$k.sec"; exit $rc ) &
            pids="$pids $!"
          done
          for p in $pids; do wait "$p" || status=$?; done
          for j in 1 2 3 4; do k=$(( (JOB - 1) * 4 + j )); grep -v '^shard-seconds ' "shard-$k.log" || true; done
          if [ "$status" -eq 0 ]; then echo "::group::per-module shard seconds (input of python -m tests.shard --from-logs; LIFE-1076: left out of a failing run's log)"; for j in 1 2 3 4; do k=$(( (JOB - 1) * 4 + j )); grep -h '^shard-seconds ' "shard-$k.log" || true; done; echo "::endgroup::"; fi
          elapsed=$(( $(date +%s) - JOB_T0 ))
          echo "tests ${JOB} (shards $(( (JOB - 1) * 4 + 1 ))-$(( JOB * 4 )) of 32): exit ${status}, shard seconds $(for j in 1 2 3 4; do cat "shard-$(( (JOB - 1) * 4 + j )).sec"; echo -n ' '; done), ${elapsed} s from the start of the job" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if [ "$elapsed" -ge 60 ]; then echo "TIME GATE ONLY: every test passed; the job took ${elapsed} s and the limit is 60 s (LIFE-1100): rebalance tests/shard-weights.json (python -m tests.shard --from-logs) or fix the slowest module" | tee -a "$GITHUB_STEP_SUMMARY"; echo "::error::Test job ${JOB} took ${elapsed} s; the limit is 60 s"; exit 1; fi
          if [ "$elapsed" -ge 45 ]; then echo "::warning::Test job ${JOB} took ${elapsed} s; the warning level is 45 s"; fi
  # Lint, type check and the Node tests, in parallel with the tests; none of them takes over 5 s (measured Nov 27 2026), so they share one job.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      t0: ${{ steps.start.outputs.t0 }}
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=2 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Start time (LIFE-1100; the job's clock for the 60 s gate, read right after the checkout)
        id: start
        run: echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"; echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/python   # LIFE-1100: test-lock installs the test lock too (ruff, mypy, PyYAML) and caches the whole environment
        with:
          test-lock: "true"
      - name: Agent trailer (LIFE-1096, policy section 3; pull requests only; every commit and the description carry an Agent line, no secret read)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/agent_trailer_check.py
      - name: Ruff format check (lifeos, tools and tests at 120 columns; ruff is pinned in requirements-test.txt)
        run: python -m ruff format --check --no-cache lifeos tools tests
      - name: Ruff correctness rules (LIFE-596; BLOCKING on B023 loop variable in a closure, B904 raise without from, F811 redefinition and B017 blind assertRaises; every other rule stays advisory below)
        run: python -m ruff check --no-cache --select B023,B904,F811,B017 --output-format concise .
      - name: Ruff advisory (LIFE-558; the Python files this change touches, counts only, can never fail the job or change the required check)
        continue-on-error: true
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- '*.py' | tr '\n' ' ')
          if [ -z "$files" ]; then echo "ruff (advisory): no Python file changed" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          start=$(date +%s)
          counts=$(python -m ruff check --no-cache --statistics $files 2>/dev/null || true)
          total=$(printf '%s\n' "$counts" | awk '$1 ~ /^[0-9]+$/ {n += $1} END {print n + 0}')
          {
            echo "ruff (advisory): ${total} finding(s) in $(printf '%s\n' $files | wc -l | tr -d ' ') changed Python file(s), $(( $(date +%s) - start )) s. A hint, never a gate. Baseline: docs/platform/lint-baseline.md"
            printf '%s\n' "$counts" | grep -E '^[[:space:]]*[0-9]+' || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Type check advisory (LIFE-559; changed files under lifeos/platform, counts only, can never fail the job or change the required check)
        continue-on-error: true
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- 'lifeos/platform/*.py' | tr '\n' ' ')
          if [ -z "$files" ]; then echo "mypy (advisory): no lifeos/platform file changed" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          start=$(date +%s)
          found=$(python -m mypy --no-incremental --no-error-summary $files 2>/dev/null | grep -E ': error:' | sed -E 's/:[0-9]+: error.*//' | sort | uniq -c || true)
          total=$(printf '%s\n' "$found" | awk '$1 ~ /^[0-9]+$/ {n += $1} END {print n + 0}')
          {
            echo "mypy (advisory): ${total} finding(s) in $(printf '%s\n' $files | wc -l | tr -d ' ') changed lifeos/platform file(s), $(( $(date +%s) - start )) s. A hint, never a gate. Baseline: docs/platform/type-baseline.md"
            printf '%s\n' "$found" | grep -E '^[[:space:]]*[0-9]+' || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Type check blocking (LIFE-600, Jim "600 block" Nov 24 2026; exactly the 42 lifeos/platform modules listed in mypy-blocking.txt, clean in every advisory replay Nov 10 to Nov 24; a type error in one of them fails the job, every other module stays advisory above)
        run: |
          start=$(date +%s)
          python -m mypy --no-incremental $(cat mypy-blocking.txt)
          echo "mypy (blocking): $(wc -l < mypy-blocking.txt | tr -d ' ') modules clean, $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      # Jim, Nov 8 2026: the Concord Room Orca plugin (tools/orca-concord-room) is production, so its own Node tests run on every PR and every merge. Node's built-in test runner, no install, no network, no secret.
      - uses: ./.github/actions/node
      - name: Concord Room plugin tests (node:test)
        run: node --test tools/orca-concord-room/test/worker.test.mjs
  # THE REQUIRED CHECK (branch protection: docs/platform/branch-protection.md). It keeps its name `unit-tests` and its meaning (every test, lint and type check passed, in time). It runs after the jobs above even when one of them failed, fails unless each succeeded
  # (`tests` may be skipped only when `pick` ran a small selection itself), and enforces the whole-run time gate: the earliest job start to this verdict.
  unit-tests:
    needs: [pick, tests, lint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verdict and whole-run time gate (LIFE-1100; fail at 60 s, warn at 45 s)
        env:
          PICK: ${{ needs.pick.result }}
          TESTS: ${{ needs.tests.result }}
          LINT: ${{ needs.lint.result }}
          FULL: ${{ needs.pick.outputs.full }}
          T0_PICK: ${{ needs.pick.outputs.t0 }}
          T0_LINT: ${{ needs.lint.outputs.t0 }}
        run: |
          bad=0
          [ "$PICK" = "success" ] || bad=1
          [ "$LINT" = "success" ] || bad=1
          if [ "$FULL" = "true" ]; then [ "$TESTS" = "success" ] || bad=1; else [ "$TESTS" = "skipped" ] || bad=1; fi
          echo "pick=${PICK} tests=${TESTS} lint=${LINT} full=${FULL:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$bad" -ne 0 ]; then echo "::error::a needed job did not succeed (pick=${PICK}, tests=${TESTS}, lint=${LINT})"; exit 1; fi
          t0=${T0_PICK:-0}; if [ -n "$T0_LINT" ] && [ "$T0_LINT" -lt "$t0" ]; then t0=$T0_LINT; fi
          elapsed=$(( $(date +%s) - t0 ))
          echo "whole run: ${elapsed} s from the earliest job start" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -ge 60 ]; then echo "TIME GATE ONLY: every test passed; the run took ${elapsed} s and the limit is 60 s (LIFE-1100)" | tee -a "$GITHUB_STEP_SUMMARY"; echo "::error::The run took ${elapsed} s; the limit is 60 s"; exit 1; fi
          if [ "$elapsed" -ge 45 ]; then echo "::warning::The run took ${elapsed} s; the warning level is 45 s"; fi
  # LIFE-644: the test index is no longer committed. After the unit tests pass on a merge to main, this job builds it (the whole suite once under coverage, about 3 minutes) and saves it under a key made of a hash of the builder and the test lock plus the commit;
  # a pull request restores the newest one with the same builder and lock. It is its own job so the required `unit-tests` check keeps its short verdict for the Close release; if the build fails nothing is saved and pull requests run everything.
  test-index:
    needs: unit-tests
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=2 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - uses: ./.github/actions/python
      - name: Test-only dependencies (PyYAML and coverage, from the lock)
        run: pip install --require-hashes -r requirements-test.lock
      - name: Restore the newest index (LIFE-770; read-only here, the save step below is the only writer)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: docs/test-index.json
          key: test-index-v1-${{ hashFiles('tests/testindex.py', 'requirements-test.lock') }}-${{ github.sha }}
          restore-keys: test-index-v1-${{ hashFiles('tests/testindex.py', 'requirements-test.lock') }}-
      - name: Is the newest index under a day old? (LIFE-770; a missing, unreadable or older one means rebuild; a pull request already treats an index over 7 days old as FULL, and the selector sends any file the index does not list to its mirror folder or FULL)
        id: fresh
        run: |
          if python -m tests.testindex check --max-age-days 1; then echo "fresh=true" >> "$GITHUB_OUTPUT"; echo "test index: reused (under a day old), no rebuild" | tee -a "$GITHUB_STEP_SUMMARY"; else echo "fresh=false" >> "$GITHUB_OUTPUT"; echo "test index: rebuilding" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - name: Build the test index
        if: ${{ steps.fresh.outputs.fresh != 'true' }}
        run: python -m tests.testindex build
      - name: Save the test index
        if: ${{ steps.fresh.outputs.fresh != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: docs/test-index.json
          key: test-index-v1-${{ hashFiles('tests/testindex.py', 'requirements-test.lock') }}-${{ github.sha }}
  # LIFE-692 (Stability 5/7): "today's date changing changes no test result" is enforced here, in a second job that runs in parallel (the wall time of the pull request check does not grow), with the test clock
  # fixture (tests/kit/clock.py) set to a fixed second date through LIFEOS_TEST_NOW. A test that passes today but reads the real clock then fails on this date instead of failing months later (LIFE-349, LIFE-264).
  # It is an additional check, not the required `unit-tests` check (branch protection is unchanged: docs/platform/branch-protection.md).
  # LIFE-1100 RULE (also in docs/platform/scheduled-checks.md): on a pull request this job runs ONLY the date-sensitive test modules listed in tests/second-date-tests.txt (tests/contracts/test_second_date_list.py keeps that list a superset of every module that
  # imports the clock fixture, reads the real clock or imports a helper that does), about 20 s of tests; the FULL suite on the second date runs only on a merge to main (push). On main the job is continue-on-error: a red second date there shows in the job but never turns the
  # run red, because the Close release and the test gate read that run's verdict (lifeos/edge/oracle/close_release.py, lifeos/platform/testgate.py) and only the required `unit-tests` job may decide it.
  unit-tests-second-date:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    continue-on-error: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=2 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Does this change touch anything but docs? (LIFE-770; a change under docs/ or a top-level .md file cannot read the clock, and unit-tests still runs the contracts on it)
        id: scope
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|[^/]+\.md$)'; then echo "docs_only=false" >> "$GITHUB_OUTPUT"; else echo "docs_only=true" >> "$GITHUB_OUTPUT"; echo "second date: skipped, docs-only change" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - uses: ./.github/actions/python   # LIFE-1100: test-lock installs the test lock too and caches the whole environment
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        with:
          test-lock: "true"
      - name: Unit tests on a second fixed date (LIFEOS_TEST_NOW; LIFE-1100 - a pull request runs the date-sensitive modules in tests/second-date-tests.txt, a merge to main runs everything in four parallel shards)
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        env:
          LIFEOS_TEST_NOW: "2027-03-09"
        run: |
          start=$(date +%s)
          status=0
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo FULL > selected.txt
            echo "tests picked (second date): everything (merge to main)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            grep -v '^#' tests/second-date-tests.txt | sed -e '/^$/d' -e 's#/#.#g' -e 's#\.py$##' > selected.txt
            echo "tests picked (second date): $(wc -l < selected.txt) date-sensitive modules from tests/second-date-tests.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$(head -n 1 selected.txt)" = "FULL" ]; then
            ( t0=$(date +%s); python -m tests.shard 1 4 > shard-1.log 2>&1; rc=$?; echo $(( $(date +%s) - t0 )) > shard-1.sec; exit $rc ) &
            first=$!
            ( t0=$(date +%s); python -m tests.shard 2 4 > shard-2.log 2>&1; rc=$?; echo $(( $(date +%s) - t0 )) > shard-2.sec; exit $rc ) &
            second=$!
            ( t0=$(date +%s); python -m tests.shard 3 4 > shard-3.log 2>&1; rc=$?; echo $(( $(date +%s) - t0 )) > shard-3.sec; exit $rc ) &
            third=$!
            ( t0=$(date +%s); python -m tests.shard 4 4 > shard-4.log 2>&1; rc=$?; echo $(( $(date +%s) - t0 )) > shard-4.sec; exit $rc ) &
            fourth=$!
            wait "$first" || status=$?
            wait "$second" || status=$?
            wait "$third" || status=$?
            wait "$fourth" || status=$?
            cat shard-1.log shard-2.log shard-3.log shard-4.log | grep -v '^shard-seconds ' || true
            if [ "$status" -eq 0 ]; then echo "::group::per-module shard seconds (input of python -m tests.shard --from-logs; LIFE-1076: left out of a failing run's log)"; grep -h '^shard-seconds ' shard-1.log shard-2.log shard-3.log shard-4.log || true; echo "::endgroup::"; fi
            echo "shard seconds: 1=$(cat shard-1.sec) 2=$(cat shard-2.sec) 3=$(cat shard-3.sec) 4=$(cat shard-4.sec)" | tee -a "$GITHUB_STEP_SUMMARY"
            for k in 1 2 3 4; do if [ "$(cat shard-$k.sec)" -ge 100 ]; then echo "::warning::Shard $k took $(cat shard-$k.sec) s; the shard guard level is 100 s and the gate is 120 s (LIFE-963): rebalance tests/shard-weights.json (python -m tests.shard --from-logs) or fix the slow module before it reaches 120"; fi; done
          else
            python -m unittest $(cat selected.txt) > shard-1.log 2>&1 || status=$?
            cat shard-1.log
          fi
          echo "unit tests on ${LIFEOS_TEST_NOW}: exit ${status}, $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then echo "::error::The unit tests pass on today's date and fail with the test clock fixed at ${LIFEOS_TEST_NOW}: a test reads the real clock (see docs/platform/scheduled-checks.md)"; fi
          exit "$status"
