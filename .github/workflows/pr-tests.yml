name: pr-tests
# Secret-free pull request check: the same unit tests as the `prep` job of hourly.yml (here run as two parallel shards of whole test modules, tests/shard.py; hourly.yml runs them in one process), on the PR head merged with its base. Read-only, no secrets, no database, no network beyond installing
# the pinned requirements, nothing dispatched or scheduled. Runtime contract of the deterministic suite: a warning at 90 seconds, a failure at 120 seconds (LIFE-596; Nov 9 2026: raised from 75, which was raised from 60 on Oct 25; hang guard: timeout-minutes).
# Every merge to main runs the same suite too (Jim, Oct 25 2026), so the Edge's Close auto-release has a tested main commit within a minute of a merge instead of waiting for the next hourly run.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]      # LIFE-519: adding or removing the approval label re-runs the protected-file check
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: life-os-v7-pr-tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # LIFE-604: a newer push to the same pull request replaces its older check; every merge to main keeps its own group and is never cancelled (the Close release needs a verdict for each); no group is shared with any tick or manual run
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 2                    # the merge commit and its two parents, enough to list what the pull request changes
      - uses: ./.github/actions/python
      - name: Protected privacy files (LIFE-519; a pull request touching docs/PRIVACY.md, tests/contracts/test_privacy.py or .claude/settings.json needs the label protected-file-approved)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python .github/protected_files.py
      - name: Test-only dependency (PyYAML, for the workflow contract tests)
        run: pip install --require-hashes -r requirements-test.lock
      - name: Pick the tests (LIFE-548; a pull request runs the tests its change can affect plus tests/contracts, a merge to main always runs everything)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python -m tests.testindex select --base HEAD^1 > selected.txt || echo FULL > selected.txt     # any trouble picking means everything
          else
            echo FULL > selected.txt
          fi
          if [ "$(head -n 1 selected.txt)" = "FULL" ]; then echo "tests picked: everything" | tee -a "$GITHUB_STEP_SUMMARY"; else echo "tests picked: $(wc -l < selected.txt) targets" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - name: Unit tests (two parallel shards when everything runs; warn at 90 s, fail at 120 s)
        run: |
          start=$(date +%s)
          status=0
          if [ "$(head -n 1 selected.txt)" = "FULL" ]; then
            python -m tests.shard 1 2 > shard-1.log 2>&1 &
            first=$!
            python -m tests.shard 2 2 > shard-2.log 2>&1 &
            second=$!
            wait "$first" || status=$?
            wait "$second" || status=$?
            cat shard-1.log shard-2.log
          else
            python -m unittest $(cat selected.txt) > shard-1.log 2>&1 || status=$?
            cat shard-1.log
          fi
          elapsed=$(( $(date +%s) - start ))
          echo "unit tests: exit ${status}, ${elapsed} s" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if [ "$elapsed" -ge 120 ]; then echo "::error::The unit-test suite took ${elapsed} s; the limit is 120 s"; exit 1; fi
          if [ "$elapsed" -ge 90 ]; then echo "::warning::The unit-test suite took ${elapsed} s; the warning level is 90 s"; fi
      - name: Ruff correctness rules (LIFE-596; BLOCKING on B023 loop variable in a closure, B904 raise without from, F811 redefinition and B017 blind assertRaises; every other rule stays advisory below)
        run: python -m ruff check --no-cache --select B023,B904,F811,B017 --output-format concise .
      - name: Ruff advisory (LIFE-558; the Python files this change touches, counts only, can never fail the job or change the required check)
        continue-on-error: true
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- '*.py' | tr '\n' ' ')
          if [ -z "$files" ]; then echo "ruff (advisory): no Python file changed" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          start=$(date +%s)
          counts=$(python -m ruff check --no-cache --statistics $files 2>/dev/null || true)
          total=$(printf '%s\n' "$counts" | awk '$1 ~ /^[0-9]+$/ {n += $1} END {print n + 0}')
          {
            echo "ruff (advisory): ${total} finding(s) in $(printf '%s\n' $files | wc -l | tr -d ' ') changed Python file(s), $(( $(date +%s) - start )) s. A hint, never a gate. Baseline: docs/platform/lint-baseline.md"
            printf '%s\n' "$counts" | grep -E '^[[:space:]]*[0-9]+' || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Type check advisory (LIFE-559; changed files under lifeos/platform, counts only, can never fail the job or change the required check)
        continue-on-error: true
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- 'lifeos/platform/*.py' | tr '\n' ' ')
          if [ -z "$files" ]; then echo "mypy (advisory): no lifeos/platform file changed" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          start=$(date +%s)
          found=$(python -m mypy --no-incremental --no-error-summary $files 2>/dev/null | grep -E ': error:' | sed -E 's/:[0-9]+: error.*//' | sort | uniq -c || true)
          total=$(printf '%s\n' "$found" | awk '$1 ~ /^[0-9]+$/ {n += $1} END {print n + 0}')
          {
            echo "mypy (advisory): ${total} finding(s) in $(printf '%s\n' $files | wc -l | tr -d ' ') changed lifeos/platform file(s), $(( $(date +%s) - start )) s. A hint, never a gate. Baseline: docs/platform/type-baseline.md"
            printf '%s\n' "$found" | grep -E '^[[:space:]]*[0-9]+' || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
      # Jim, Nov 8 2026: the Concord Room Orca plugin (tools/orca-concord-room) is production, so its own Node tests run on every PR and every merge. Node's built-in test runner, no install, no network, no secret; outside the 90 s Python suite limit above.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - name: Concord Room plugin tests (node:test)
        run: node --test tools/orca-concord-room/test/worker.test.mjs
