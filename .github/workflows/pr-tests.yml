name: pr-tests
# Secret-free pull request check: the same unit tests as the `prep` job of hourly.yml (here run as two parallel shards of whole test modules, tests/shard.py; hourly.yml runs them in one process), on the PR head merged with its base. Read-only, no secrets, no database, no network beyond installing
# the pinned requirements, nothing dispatched or scheduled. Runtime contract of the deterministic suite: a warning at 45 seconds, a failure at 90 seconds (Jim, Nov 9 2026: raised from 75, which was raised from 60 on Oct 25; hang guard: timeout-minutes).
# Every merge to main runs the same suite too (Jim, Oct 25 2026), so the Edge's Close auto-release has a tested main commit within a minute of a merge instead of waiting for the next hourly run.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]      # LIFE-519: adding or removing the approval label re-runs the protected-file check
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: life-os-v7-pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true                  # a newer push to the same PR (or to main) replaces its older check; it shares no group with any tick or manual run
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2                    # the merge commit and its two parents, enough to list what the pull request changes
      - uses: ./.github/actions/python
      - name: Protected privacy files (LIFE-519; a pull request touching docs/PRIVACY.md, tests/contracts/test_privacy.py or .claude/settings.json needs the label protected-file-approved)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python .github/protected_files.py
      - name: Test-only dependency (PyYAML, for the workflow contract tests)
        run: pip install --require-hashes -r requirements-test.lock
      - name: Pick the tests (LIFE-548; a pull request runs the tests its change can affect plus tests/contracts, a merge to main always runs everything)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python -m tests.testindex select --base HEAD^1 > selected.txt || echo FULL > selected.txt     # any trouble picking means everything
          else
            echo FULL > selected.txt
          fi
          if [ "$(head -n 1 selected.txt)" = "FULL" ]; then echo "tests picked: everything" | tee -a "$GITHUB_STEP_SUMMARY"; else echo "tests picked: $(wc -l < selected.txt) targets" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - name: Unit tests (two parallel shards when everything runs; warn at 45 s, fail at 90 s)
        run: |
          start=$(date +%s)
          status=0
          if [ "$(head -n 1 selected.txt)" = "FULL" ]; then
            python -m tests.shard 1 2 > shard-1.log 2>&1 &
            first=$!
            python -m tests.shard 2 2 > shard-2.log 2>&1 &
            second=$!
            wait "$first" || status=$?
            wait "$second" || status=$?
            cat shard-1.log shard-2.log
          else
            python -m unittest $(cat selected.txt) > shard-1.log 2>&1 || status=$?
            cat shard-1.log
          fi
          elapsed=$(( $(date +%s) - start ))
          echo "unit tests: exit ${status}, ${elapsed} s" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if [ "$elapsed" -ge 90 ]; then echo "::error::The unit-test suite took ${elapsed} s; the limit is 90 s"; exit 1; fi
          if [ "$elapsed" -ge 45 ]; then echo "::warning::The unit-test suite took ${elapsed} s; the warning level is 45 s"; fi
      # Jim, Nov 8 2026: the Concord Room Orca plugin (tools/orca-concord-room) is production, so its own Node tests run on every PR and every merge. Node's built-in test runner, no install, no network, no secret; outside the 90 s Python suite limit above.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Concord Room plugin tests (node:test)
        run: node --test tools/orca-concord-room/test/worker.test.mjs
