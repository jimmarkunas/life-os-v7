name: probe-alias
on:
  pull_request:
    paths: [".github/workflows/probe-alias.yml"]
permissions:
  contents: read
jobs:
  a:
    runs-on: ubuntu-24.04
    steps:
      - name: one
        env: &shared
          A: "1"
          B: "2"
        run: echo "A=$A B=$B"
      - name: two
        env: *shared
        run: echo "A=$A B=$B"
