name: amazon-orders
# Manual Gmail -> Notion Amazon Orders pass. Dry run by default.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "orders (the normal recent pass), backfill (every historical month, D140) or retention (D139: mail older than 30 days to the Trash; always a dry run here) or review-reset (D146: trash REVIEW rows that hold no data so a backfill rebuilds them; dry run unless Actually write) or census (DEL-1.1: count tracking numbers in the last year of mail; read-only, writes nothing)"
        type: choice
        options: ["orders", "backfill", "retention", "review-reset", "census"]
        default: "orders"
      since:
        description: "backfill only: first day, YYYY-MM-DD (default 2015-01-01)"
        type: string
        default: "2015-01-01"
      live:
        description: "Persist orders and archive accepted mail (unticked = dry run, counts only)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # The normal manual orders pass talks to Gmail like the domain jobs do, so it queues behind them (the same group as domains.yml) instead of colliding with MegIBOW and Mail. The long
  # maintenance stages (backfill, retention, review-reset) keep their own group so a multi-hour run can never block the hourly system.
  group: ${{ inputs.stage == 'orders' && 'life-os-v7-domains' || 'life-os-v7-amazon-orders' }}
  cancel-in-progress: false
jobs:
  amazon:
    runs-on: ubuntu-24.04
    timeout-minutes: 330                 # a full backfill is one Notion write pass per month of mail; it is replay-safe, so a timeout is resumed by running it again
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python
      - name: Load the Gmail and Notion credentials from Bitwarden (EDGE-1.3, exactly these 3; the job fails if retrieval fails, no fallback)
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          secrets: |
            08245c07-728f-438e-940b-b4db015a6967 > GMAIL_OAUTH_CLIENT_SECRET
            672a44e9-235f-4121-a99d-b4db015a6987 > GMAIL_OAUTH_REFRESH_TOKEN
            46fe195b-82e2-416e-8272-b4db015eea12 > NOTION_AMAZON_TOKEN
      - name: Amazon Orders (Gmail to Notion; archive only after read-back)
        env:
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          NOTION_AMAZON_DATA_SOURCE_ID: ${{ secrets.NOTION_AMAZON_DATA_SOURCE_ID }}
          AMAZON_SINCE: ${{ inputs.since }}
          STAGE: ${{ inputs.stage }}
        run: python -m lifeos.run "amazon-$([ "$STAGE" = "orders" ] && echo orders || echo "$STAGE")" $([ "$STAGE" = "retention" ] && echo "--limit 200") $([ "${{ inputs.live }}" = "true" ] && [ "$STAGE" != "retention" ] && echo --live)
