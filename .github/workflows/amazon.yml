name: amazon-orders
# Manual Gmail -> Notion Amazon Orders pass. Dry run by default.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "orders (the normal recent pass), backfill (every historical month, D140) or retention (D139: mail older than 30 days to the Trash; always a dry run here) or review-reset (D146: trash REVIEW rows that hold no data so a backfill rebuilds them; dry run unless Actually write)"
        type: choice
        options: ["orders", "backfill", "retention", "review-reset"]
        default: "orders"
      since:
        description: "backfill only: first day, YYYY-MM-DD (default 2015-01-01)"
        type: string
        default: "2015-01-01"
      live:
        description: "Persist orders and archive accepted mail (unticked = dry run, counts only)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: life-os-v7-amazon-orders
  cancel-in-progress: false
jobs:
  amazon:
    runs-on: ubuntu-24.04
    timeout-minutes: 330                 # a full backfill is one Notion write pass per month of mail; it is replay-safe, so a timeout is resumed by running it again
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python
      - name: Amazon Orders (Gmail to Notion; archive only after read-back)
        env:
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          NOTION_AMAZON_TOKEN: ${{ secrets.NOTION_AMAZON_TOKEN }}
          NOTION_AMAZON_DATA_SOURCE_ID: ${{ secrets.NOTION_AMAZON_DATA_SOURCE_ID }}
          AMAZON_SINCE: ${{ inputs.since }}
          STAGE: ${{ inputs.stage }}
        run: python -m lifeos.run "amazon-$([ "$STAGE" = "orders" ] && echo orders || echo "$STAGE")" $([ "$STAGE" = "retention" ] && echo "--limit 200") $([ "${{ inputs.live }}" = "true" ] && [ "$STAGE" != "retention" ] && echo --live)
