name: granola-auto
# LIFE-122 (Jim, Oct 26 2026: "Approved, go"). MANUAL run of the automatic Granola bridge (the same stage the hourly tick runs after the tick, in domains.yml job `granola`):
# every synced Granola meeting that has not been carried before goes into its Interview OS round (lifeos/sources/granola_auto.py): written to the Full Transcript page, read back,
# catalogued in Hostinger (v7_meeting_catalog), and only then purged WHOLE from Oracle. A meeting with no matching round is left on Oracle and counted. Dry run unless `live`.
# It holds the store credentials, the Interview token, the Oracle host and the tailnet join; no mail, Calendar or Jobs token. Counts and fixed codes only. No schedule: the one
# recurring scheduler is the hourly tick.
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Actually write pages, save the catalog and purge Oracle (false = dry run: nothing written, nothing purged)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: life-os-v7-interview-writer     # the one writer of the opportunity pages: this run, the after-tick Interview step and the manual-job run take turns
  cancel-in-progress: false
jobs:
  auto:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python
      - id: bws_auto
        name: Load the migrated credentials from Bitwarden (EDGE-1.3, exactly these 11; masked step outputs only, nothing exported job-wide; the job fails if retrieval fails, no fallback)
        continue-on-error: true                 # D209: one retry below; the retry fails the job
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            d71bbaed-6a6c-49b5-8a1f-b4db015ecfda > LIFEOS_ACQ_DB_NAME
            00d82e0d-be10-4c8c-bdbe-b4db015ed389 > LIFEOS_ACQ_DB_PASSWORD
            9422b842-3bb0-4153-bb8d-b4db015ed746 > LIFEOS_ACQ_DB_USER
            6f1c86f6-c48f-4e77-b65d-b4db015edb15 > LIFEOS_ACQ_SSH_HOST
            b65dd2fc-2573-4bda-9e80-b4db015edec6 > LIFEOS_ACQ_SSH_KNOWN_HOSTS
            7ada9cea-8711-4b37-bef9-b4db015ee298 > LIFEOS_ACQ_SSH_PRIVATE_KEY
            6b3e12b9-1987-4073-bda2-b4db015ee653 > LIFEOS_ACQ_SSH_USER
            092b44ae-32cb-453b-8cc2-b4db015ef571 > NOTION_INTERVIEW_TOKEN
            454e12df-637f-4f65-9ec1-b4e30052942f > TAILSCALE_OAUTH_CLIENT_ID
            e54f0a84-84c3-47d8-8b5b-b4e30052d6e9 > TAILSCALE_OAUTH_CLIENT_SECRET
            6590208b-506d-4238-ab10-b4e30051b25f > IMESSAGE_ALERTS_HOST
      - name: Bitwarden refused or timed out (429 / 5xx) - pause before the one retry
        if: ${{ steps.bws_auto.outcome == 'failure' }}
        run: sleep $((30 + RANDOM % 45))
      - id: bws_auto_retry
        name: Load the same credentials from Bitwarden - the one retry (the job fails if it fails, no fallback)
        if: ${{ steps.bws_auto.outcome == 'failure' }}
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            d71bbaed-6a6c-49b5-8a1f-b4db015ecfda > LIFEOS_ACQ_DB_NAME
            00d82e0d-be10-4c8c-bdbe-b4db015ed389 > LIFEOS_ACQ_DB_PASSWORD
            9422b842-3bb0-4153-bb8d-b4db015ed746 > LIFEOS_ACQ_DB_USER
            6f1c86f6-c48f-4e77-b65d-b4db015edb15 > LIFEOS_ACQ_SSH_HOST
            b65dd2fc-2573-4bda-9e80-b4db015edec6 > LIFEOS_ACQ_SSH_KNOWN_HOSTS
            7ada9cea-8711-4b37-bef9-b4db015ee298 > LIFEOS_ACQ_SSH_PRIVATE_KEY
            6b3e12b9-1987-4073-bda2-b4db015ee653 > LIFEOS_ACQ_SSH_USER
            092b44ae-32cb-453b-8cc2-b4db015ef571 > NOTION_INTERVIEW_TOKEN
            454e12df-637f-4f65-9ec1-b4e30052942f > TAILSCALE_OAUTH_CLIENT_ID
            e54f0a84-84c3-47d8-8b5b-b4e30052d6e9 > TAILSCALE_OAUTH_CLIENT_SECRET
            6590208b-506d-4238-ab10-b4e30051b25f > IMESSAGE_ALERTS_HOST
      - name: Join the tailnet as the existing ephemeral tag:v7-runner node (the tailnet policy admits it only to Oracle TCP 22 and 47341); no join means no Oracle, and the run stops with a fixed code
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd   # v4.2.0
        with:
          oauth-client-id: ${{ steps.bws_auto.outputs.TAILSCALE_OAUTH_CLIENT_ID || steps.bws_auto_retry.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_auto.outputs.TAILSCALE_OAUTH_CLIENT_SECRET || steps.bws_auto_retry.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
          use-cache: "false"
      - name: Granola auto (every meeting not yet carried; dry run unless live; counts and fixed codes only)
        env:
          HIRING_PIPELINE_PAGE_ID: ${{ secrets.HIRING_PIPELINE_PAGE_ID }}
          LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
          LIFEOS_ACQ_DB_NAME: ${{ steps.bws_auto.outputs.LIFEOS_ACQ_DB_NAME || steps.bws_auto_retry.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: ${{ steps.bws_auto.outputs.LIFEOS_ACQ_DB_PASSWORD || steps.bws_auto_retry.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: ${{ steps.bws_auto.outputs.LIFEOS_ACQ_DB_USER || steps.bws_auto_retry.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: ${{ steps.bws_auto.outputs.LIFEOS_ACQ_SSH_HOST || steps.bws_auto_retry.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ steps.bws_auto.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS || steps.bws_auto_retry.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ steps.bws_auto.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY || steps.bws_auto_retry.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: ${{ steps.bws_auto.outputs.LIFEOS_ACQ_SSH_USER || steps.bws_auto_retry.outputs.LIFEOS_ACQ_SSH_USER }}
          NOTION_INTERVIEW_TOKEN: ${{ steps.bws_auto.outputs.NOTION_INTERVIEW_TOKEN || steps.bws_auto_retry.outputs.NOTION_INTERVIEW_TOKEN }}
          IMESSAGE_ALERTS_HOST: ${{ steps.bws_auto.outputs.IMESSAGE_ALERTS_HOST || steps.bws_auto_retry.outputs.IMESSAGE_ALERTS_HOST }}
          LIVE: ${{ inputs.live }}
        run: python -m lifeos.run granola-auto $([ "$LIVE" = "true" ] && echo --live)
