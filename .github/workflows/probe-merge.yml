name: probe-merge
on:
  pull_request:
    paths: [".github/workflows/probe-merge.yml"]
permissions:
  contents: read
jobs:
  a:
    runs-on: ubuntu-24.04
    steps:
      - name: one
        env:
          <<: &shared
            A: "1"
            B: "2"
          C: "3"
        run: echo "A=$A B=$B C=$C"
      - name: two
        env:
          <<: *shared
          D: "4"
        run: echo "A=$A B=$B D=$D"
