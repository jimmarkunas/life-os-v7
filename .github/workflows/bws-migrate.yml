name: bws-migrate
# EDGE-1.3: ONE-TIME, MANUAL, RESUMABLE copy of 25 GitHub Actions secrets into the Bitwarden project "LIFE OS GitHub Actions".
# Temporary: delete this file (and tests/contracts/test_bws_migration.py) once the migration is read back and Phase B has landed.
# It changes nothing else: no production workflow reads Bitwarden yet, no GitHub secret is deleted or overwritten, no Bitwarden secret is ever overwritten or deleted.
# Resume: a destination key that already exists is compared with its GitHub source IN MEMORY (shell builtins only); equal = ALREADY_PRESENT, different = stop before any write.
# Fail closed: all 25 sources non-empty, exactly the intended project visible, no duplicate or mismatched destination, all checked before the first write; pending keys are then
# created one request at a time with a fixed pause (rate-limit pressure), and the project is read back and every value re-verified. Output is key names, UUIDs and fixed codes only.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: MIGRATE 25 SECRETS TO BITWARDEN (anything else does nothing)"
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: life-os-v7-bws-migrate
  cancel-in-progress: false
jobs:
  migrate:
    # No checkout and no repository code run here. Only the typed confirmation, on main, starts the job.
    if: ${{ inputs.confirm == 'MIGRATE 25 SECRETS TO BITWARDEN' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install the pinned Bitwarden Secrets Manager CLI (bws 2.1.0, release checksum verified; no secrets in this step)
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/bws.zip" "https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-x86_64-unknown-linux-gnu-2.1.0.zip"
          echo "ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860  $RUNNER_TEMP/bws.zip" | sha256sum -c --quiet -
          unzip -q -o "$RUNNER_TEMP/bws.zip" -d "$RUNNER_TEMP/bws-bin"
          echo "$RUNNER_TEMP/bws-bin" >> "$GITHUB_PATH"
      - name: Migrate (preflight first, then one create per secret; names and UUIDs only)
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.LIFEOS_BWS_MIGRATION_TOKEN }}
          FIT_PROFILE_EXTRA_JSON: ${{ secrets.FIT_PROFILE_EXTRA_JSON }}
          FIT_PROFILE_JSON: ${{ secrets.FIT_PROFILE_JSON }}
          GCAL_SERVICE_ACCOUNT_JSON: ${{ secrets.GCAL_SERVICE_ACCOUNT_JSON }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JOBRIGHT_EMAIL: ${{ secrets.JOBRIGHT_EMAIL }}
          JOBRIGHT_PASSWORD: ${{ secrets.JOBRIGHT_PASSWORD }}
          LIFEOS_ACQ_DB_NAME: ${{ secrets.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: ${{ secrets.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: ${{ secrets.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: ${{ secrets.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ secrets.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ secrets.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: ${{ secrets.LIFEOS_ACQ_SSH_USER }}
          NOTION_AMAZON_TOKEN: ${{ secrets.NOTION_AMAZON_TOKEN }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_BILLS_TOKEN: ${{ secrets.NOTION_BILLS_TOKEN }}
          NOTION_INTERVIEW_TOKEN: ${{ secrets.NOTION_INTERVIEW_TOKEN }}
          NOTION_JIRA_TOKEN: ${{ secrets.NOTION_JIRA_TOKEN }}
          NOTION_RECRUITERS_TOKEN: ${{ secrets.NOTION_RECRUITERS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          OPEN_JOBS_CONTACT: ${{ secrets.OPEN_JOBS_CONTACT }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
          set -euo pipefail
          # Refuse to run with debug logging, which could widen what a step prints.
          [ "${RUNNER_DEBUG:-}" != "1" ] || { echo "refused: runner debug logging is on"; exit 1; }
          PROJECT="3244a340-8b60-45f0-9f33-b4db0082127e"
          PREFIX="lifeos/github-actions/"
          PAUSE=3          # seconds before every per-secret request (read or create): no rapid-fire bursts against the Bitwarden API
          RETRY_WAIT=30    # seconds before the single retry of a create that was identified as a rate-limit response
          RATE_LIMIT_RE='(^|[^0-9])429([^0-9]|$)|too many requests|rate limit'
          NAMES=(
            FIT_PROFILE_EXTRA_JSON FIT_PROFILE_JSON GCAL_SERVICE_ACCOUNT_JSON GMAIL_OAUTH_CLIENT_SECRET GMAIL_OAUTH_REFRESH_TOKEN
            JIRA_API_TOKEN JIRA_EMAIL JOBRIGHT_EMAIL JOBRIGHT_PASSWORD LIFEOS_ACQ_DB_NAME LIFEOS_ACQ_DB_PASSWORD LIFEOS_ACQ_DB_USER
            LIFEOS_ACQ_SSH_HOST LIFEOS_ACQ_SSH_KNOWN_HOSTS LIFEOS_ACQ_SSH_PRIVATE_KEY LIFEOS_ACQ_SSH_USER NOTION_AMAZON_TOKEN
            NOTION_API_TOKEN NOTION_BILLS_TOKEN NOTION_INTERVIEW_TOKEN NOTION_JIRA_TOKEN NOTION_RECRUITERS_TOKEN NTFY_TOPIC
            OPEN_JOBS_CONTACT TINYFISH_API_KEY
          )
          [ "${#NAMES[@]}" -eq 25 ] || { echo "refused: expected 25 sources"; exit 1; }
          declare -A CNT ID

          # Destination listing: key and id only (the CLI's list JSON can carry values, so it is cut down at once). Fills CNT (how many) and ID (last seen).
          load_destination() {
            local lines key id
            CNT=(); ID=()
            lines=$(bws secret list "$PROJECT" -o json 2>/dev/null | jq -r '.[] | "\(.key)\t\(.id)"') || { echo "LIST_FAILED"; return 1; }
            while IFS=$'\t' read -r key id; do
              [ -n "$key" ] || continue
              CNT["$key"]=$(( ${CNT["$key"]:-0} + 1 )); ID["$key"]="$id"
            done <<< "$lines"
            echo "destination holds ${#CNT[@]} distinct key(s)"
            [ -z "$lines" ] || printf '%s\n' "$lines"
          }

          # Stored value of one destination secret, by id, into STORED, newlines kept exactly. It stays in this shell's memory and is never printed.
          fetch_stored() {
            local out
            sleep "$PAUSE"
            out=$(bws secret get "$1" -o json 2>/dev/null) || return 1
            [ "$(printf '%s' "$out" | jq -r '.value | type' 2>/dev/null)" = "string" ] || return 1
            STORED=$(printf '%s' "$out" | jq -j '.value'; printf x)
            STORED=${STORED%x}
          }

          # One create, one retry only when the response is identified as a rate limit. The CLI's output (which may hold a value) is kept in memory and
          # only fixed codes leave this function: CREATED_ID on success, FAIL_CLASS = RATE_LIMIT, UNPARSEABLE_RESPONSE or UNKNOWN_ERROR otherwise.
          create_one() {
            local out attempt
            for attempt in 1 2; do
              sleep "$PAUSE"
              if out=$(bws secret create -o json -- "$PREFIX$1" "${!1}" "$PROJECT" 2>&1); then
                if [[ "$out" =~ \"id\"[[:space:]]*:[[:space:]]*\"([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\" ]]; then
                  CREATED_ID="${BASH_REMATCH[1]}"; return 0
                fi
                FAIL_CLASS=UNPARSEABLE_RESPONSE; return 1
              fi
              if [[ "${out,,}" =~ $RATE_LIMIT_RE ]]; then
                FAIL_CLASS=RATE_LIMIT
                if [ "$attempt" -eq 1 ]; then echo "RATE_LIMIT on $1: waiting ${RETRY_WAIT}s before the single retry"; sleep "$RETRY_WAIT"; continue; fi
              else
                FAIL_CLASS=UNKNOWN_ERROR
              fi
              return 1
            done
          }

          echo "PREFLIGHT 1/4 source values present"
          missing=0
          for n in "${NAMES[@]}"; do
            if [ -z "${!n:-}" ]; then echo "MISSING $n"; missing=$((missing + 1)); fi
          done
          [ "$missing" -eq 0 ] || { echo "preflight failed: $missing source value(s) empty"; exit 1; }
          [ -n "${BWS_ACCESS_TOKEN:-}" ] || { echo "preflight failed: migration token empty"; exit 1; }
          echo "all 25 present"

          echo "PREFLIGHT 2/4 the machine account sees exactly the intended project"
          ids=$(bws project list -o json 2>/dev/null | jq -r '.[].id') || { echo "preflight failed: bws project list"; exit 1; }
          [ "$(printf '%s\n' "$ids" | grep -c .)" -eq 1 ] && [ "$ids" = "$PROJECT" ] || { echo "preflight failed: accessible projects are not exactly the intended one"; exit 1; }
          echo "project access ok (1 project, the intended one)"

          echo "PREFLIGHT 3/4 destination secret names and ids; no approved key may appear twice"
          load_destination || { echo "preflight failed: bws secret list"; exit 1; }
          dupes=0
          for n in "${NAMES[@]}"; do
            if [ "${CNT[$PREFIX$n]:-0}" -gt 1 ]; then echo "DUPLICATE $PREFIX$n"; dupes=$((dupes + 1)); fi
          done
          [ "$dupes" -eq 0 ] || { echo "stopped before any write: $dupes duplicated destination key(s)"; exit 1; }

          echo "PREFLIGHT 4/4 each existing destination must equal its source (in memory; never printed); nothing is overwritten"
          PENDING=(); present=0; mismatched=0
          for n in "${NAMES[@]}"; do
            if [ "${CNT[$PREFIX$n]:-0}" -eq 0 ]; then PENDING+=("$n"); continue; fi
            fetch_stored "${ID[$PREFIX$n]}" || { echo "preflight failed: READ_FAILED $PREFIX$n"; exit 1; }
            if [[ "$STORED" == "${!n}" ]]; then
              echo "$n -> ${ID[$PREFIX$n]} -> ALREADY_PRESENT"; present=$((present + 1))
            else
              echo "MISMATCH $PREFIX$n"; mismatched=$((mismatched + 1))
            fi
          done
          STORED=""
          [ "$mismatched" -eq 0 ] || { echo "stopped before any write: $mismatched destination(s) differ from their source"; exit 1; }
          echo "already present and equal: $present; pending: ${#PENDING[@]}"

          echo "MIGRATING"
          created=0
          for n in "${PENDING[@]}"; do
            if create_one "$n"; then
              echo "$n -> $CREATED_ID -> CREATED"; created=$((created + 1))
            else
              echo "PARTIAL CANDIDATE: BLOCKED ON $n ($FAIL_CLASS; $created created this run, $present already present; nothing deleted or overwritten; rerun resumes)"
              exit 1
            fi
          done

          echo "READ-BACK"
          sleep "$PAUSE"
          load_destination > /dev/null || { echo "read-back failed: bws secret list"; exit 1; }
          problems=0; verified=()
          for n in "${NAMES[@]}"; do
            key="$PREFIX$n"
            if [ "${CNT[$key]:-0}" -eq 0 ]; then echo "MISSING $key"; problems=$((problems + 1)); continue; fi
            if [ "${CNT[$key]}" -gt 1 ]; then echo "DUPLICATE $key"; problems=$((problems + 1)); continue; fi
            if ! fetch_stored "${ID[$key]}"; then echo "READ_FAILED $key"; problems=$((problems + 1)); continue; fi
            if [[ "$STORED" == "${!n}" ]]; then verified+=("$n -> ${ID[$key]} -> VERIFIED"); else echo "MISMATCH $key"; problems=$((problems + 1)); fi
          done
          STORED=""
          [ "$problems" -eq 0 ] || { echo "read-back failed: $problems problem(s); nothing was repaired"; exit 1; }
          printf '%s\n' "${verified[@]}"
          echo "VERIFIED ${#verified[@]} OF 25"
