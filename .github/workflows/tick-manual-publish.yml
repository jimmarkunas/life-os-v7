name: tick-manual-publish
on:
  workflow_call:
    inputs:
      finalize:
        type: boolean
        default: false
      fit:
        type: boolean
        default: false
      live:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false
      quick:
        type: boolean
        default: false
      tick:
        type: boolean
        default: false
      prep_pipeline:
        type: string
        default: ""
    secrets:
      DOPPLER_TOKEN:
        required: false
      LIFEOS_BWS_RUNTIME_TOKEN:
        required: false
    outputs:
      failed:
        value: ${{ jobs.manual_publish.outputs.failed }}
permissions:
  contents: read
  actions: read
env:
  NOTION_JOB_LEDGER_DATA_SOURCE_ID: ""
  V7_FIT_GATE: ""
  HIRING_PIPELINE_PAGE_ID: ""
jobs:
  manual_publish:
    permissions:
      contents: read
      actions: read
    outputs:
      failed: ${{ steps.lanes.outputs.failed }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 58
    env:
      FASTEMBED_CACHE: ${{ github.workspace }}/.cache/fastembed
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for try in 1 2 3; do git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA" && break; [ "$try" = 3 ] && exit 1; sleep $((try * 5)); done
          git checkout -q --detach FETCH_HEAD
      - uses: ./.github/actions/python
      - name: Semantic layer (optional shadow; local embedding model)
        if: &a1 ${{ inputs.prep_pipeline == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.fit || inputs.publish || inputs.quick)) }}
        uses: &a2 actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-v1
      - name: Pip cache for the semantic layer (requirements-fit.lock)
        if: *a1
        uses: *a2
        with:
          path: ~/.cache/pip
          key: pip-fit-${{ runner.os }}-${{ hashFiles('requirements-fit.lock') }}
      - name: Install semantic layer
        if: *a1
        run: pip install --require-hashes -r requirements-fit.lock || echo "semantic layer unavailable (scoring unchanged)"
      - name: Bitwarden helper from a saved, fingerprint-checked copy
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "600"
      - id: bws_finish
        name: Load the migrated credentials from Bitwarden
        uses: &a3 ./.github/actions/bws-load
        with:
          access_token: &a4 ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          doppler_compare: &a5 ${{ secrets.DOPPLER_TOKEN }}
          set_env: false
          set: hourly-manual-publish
      - name: Plain switches from Bitwarden
        uses: ./.github/actions/bws-plain
        with:
          access_token: *a4
          names: ALERTS_ENABLED,ALERTS_MUTED_UNTIL,ALERT_SETTINGS,V7_CLOUD_FIT,V7_CLOUD_FIT_SCHEDULED,V7_CLOUD_FIT_BACKLOG_BUDGET,V7_CLOUD_FIT_BACKLOG_MAX,V7_CLOUD_FIT_PARALLEL,V7_CLOUD_FIT_BACKLOG_PAGE,LIFEOS_ACQ_SSH_PORT,V7_STORE_VIA,LIVE
          live_mode: ${{ github.event_name == 'workflow_dispatch' && !inputs.tick && (inputs.live && 'true' || 'false') || 'follow' }}
      - name: Join the tailnet (Cloud-Fit shadow only)
        continue-on-error: true
        uses: ./.github/actions/tailscale
        with:
          oauth-client-id: ${{ steps.bws_finish.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_finish.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
      - id: bws_runtime_config
        if: ${{ inputs.prep_pipeline == 'true' || (github.event_name == 'workflow_dispatch' && inputs.quick) }}
        continue-on-error: true
        name: Runtime Configuration source ID from Bitwarden
        uses: *a3
        with:
          access_token: *a4
          doppler_compare: *a5
          set_env: false
          set: runtime-config
      - id: publish
        continue-on-error: true
        name: Step 7 - publish READY jobs to Notion
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env: &m1
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          FIT_PROFILE_EXTRA_JSON: &a6 ${{ steps.bws_finish.outputs.FIT_PROFILE_EXTRA_JSON }}
          FIT_PROFILE_JSON: &a7 ${{ steps.bws_finish.outputs.FIT_PROFILE_JSON }}
          GMAIL_OAUTH_CLIENT_SECRET: &a8 ${{ steps.bws_finish.outputs.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_CLIENT_ID: &a9 ${{ steps.bws_finish.outputs.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_REFRESH_TOKEN: &a10 ${{ steps.bws_finish.outputs.GMAIL_OAUTH_REFRESH_TOKEN }}
          JOBRIGHT_EMAIL: &a11 ${{ steps.bws_finish.outputs.JOBRIGHT_EMAIL }}
          JOBRIGHT_PASSWORD: &a12 ${{ steps.bws_finish.outputs.JOBRIGHT_PASSWORD }}
          LIFEOS_ACQ_DB_NAME: &a13 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: &a14 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: &a15 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: &a16 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: &a17 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_JUMP_HOST: &a18 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: &a19 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: &a20 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: &a21 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: &a22 ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_USER }}
          NOTION_API_TOKEN: &a23 ${{ steps.bws_finish.outputs.NOTION_API_TOKEN }}
          TINYFISH_API_KEY: &a24 ${{ steps.bws_finish.outputs.TINYFISH_API_KEY }}
        run: python -m lifeos.run publish --limit 60 $([ "$LIVE" = "true" ] && echo --live)
      - id: holds
        continue-on-error: true
        name: Step 7a - exclude jobs that have sat on HOLD for 7 days
        if: &a25 ${{ github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.finalize) }}
        env: *m1
        run: python -m lifeos.run expire-holds $([ "$LIVE" = "true" ] && echo --live)
      - id: finalize
        continue-on-error: true
        name: Step 7b - close out newsletter mail with outcomes
        if: *a25
        env:
          FIT_PROFILE_EXTRA_JSON: *a6
          FIT_PROFILE_JSON: *a7
          GMAIL_OAUTH_CLIENT_SECRET: *a8
          GMAIL_OAUTH_CLIENT_ID: *a9
          GMAIL_OAUTH_REFRESH_TOKEN: *a10
          JOBRIGHT_EMAIL: *a11
          JOBRIGHT_PASSWORD: *a12
          LIFEOS_ACQ_DB_NAME: *a13
          LIFEOS_ACQ_DB_PASSWORD: *a14
          LIFEOS_ACQ_DB_USER: *a15
          LIFEOS_ACQ_SSH_HOST: *a16
          LIFEOS_ACQ_SSH_JUMP_KEY: *a17
          LIFEOS_ACQ_SSH_JUMP_HOST: *a18
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: *a19
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: *a20
          LIFEOS_ACQ_SSH_PRIVATE_KEY: *a21
          LIFEOS_ACQ_SSH_USER: *a22
          NOTION_API_TOKEN: *a23
          TINYFISH_API_KEY: *a24
        run: python -m lifeos.sources.newsletters.finalize $([ "$LIVE" = "true" ] && echo --live)
      - id: lanes
        name: Lane failures fail the run (other stages still ran)
        if: ${{ always() }}
        run: |
          failed=""
          for pair in publish=${{ steps.publish.outcome }} holds=${{ steps.holds.outcome }} finalize=${{ steps.finalize.outcome }}; do
            [ "${pair#*=}" = "failure" ] && failed="$failed ${pair%=*}"
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
          if [ -n "$failed" ]; then echo "FAILED STAGES:$failed"; exit 1; fi
