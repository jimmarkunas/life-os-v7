name: safety
# SAFE-1.1 (D141, D142): the weekly hardening slice (Mondays, and on demand). Read-only, counts only; a failure pushes to the phone and fails the run.
#   sql-smoke:   every SQL statement in lifeos/ is EXPLAINed on the real database with the real driver (plans, never executes).
#   fit-golden:  the saved representative real-job set (lifeos/jobs/fit_golden.json) is re-scored with today's rules; any changed decision fails.
#   fit-capture: manual only; prints a fresh saved set to commit after an intended rule change.
# Its own concurrency group: it never blocks or replaces an hourly tick.
on:
  schedule:
    - cron: "17 13 * * 1"           # Mondays, 8:17 AM Chicago (CDT); Jim decided a weekly check on Oct 5 (D142). A scheduled run does both checks.
  workflow_dispatch:
    inputs:
      stage:
        description: "all (both database checks), sql-smoke, fit-golden, or fit-capture (prints a new saved set; writes nothing)"
        type: choice
        options: ["all", "sql-smoke", "fit-golden", "fit-capture"]
        default: "all"
permissions:
  contents: read
concurrency:
  group: life-os-v7-safety
  cancel-in-progress: false
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}         # deliberately not in Bitwarden; the other values come from the Bitwarden step below
      STAGE: ${{ inputs.stage || 'all' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python
      - name: Load the database, Fit and push values from Bitwarden (EDGE-1.3, exactly these 10; the job fails if retrieval fails, no fallback)
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          secrets: |
            3e264d79-3af4-4f2a-a86a-b4db015a68de > FIT_PROFILE_EXTRA_JSON
            31a07198-aa35-450f-913c-b4db015a690d > FIT_PROFILE_JSON
            d71bbaed-6a6c-49b5-8a1f-b4db015ecfda > LIFEOS_ACQ_DB_NAME
            00d82e0d-be10-4c8c-bdbe-b4db015ed389 > LIFEOS_ACQ_DB_PASSWORD
            9422b842-3bb0-4153-bb8d-b4db015ed746 > LIFEOS_ACQ_DB_USER
            6f1c86f6-c48f-4e77-b65d-b4db015edb15 > LIFEOS_ACQ_SSH_HOST
            b65dd2fc-2573-4bda-9e80-b4db015edec6 > LIFEOS_ACQ_SSH_KNOWN_HOSTS
            7ada9cea-8711-4b37-bef9-b4db015ee298 > LIFEOS_ACQ_SSH_PRIVATE_KEY
            6b3e12b9-1987-4073-bda2-b4db015ee653 > LIFEOS_ACQ_SSH_USER
            83c553e9-23a6-45aa-9006-b4db015f00ac > NTFY_TOPIC
      - id: smoke
        continue-on-error: true
        name: SQL smoke test (real driver, real database; EXPLAIN only)
        if: ${{ env.STAGE == 'all' || env.STAGE == 'sql-smoke' }}
        run: python -m lifeos.run safety-sql-smoke
      - id: golden
        continue-on-error: true
        name: Fit re-check on the saved representative job set
        if: ${{ env.STAGE == 'all' || env.STAGE == 'fit-golden' }}
        run: python -m lifeos.run safety-fit-golden
      - id: capture
        name: Fit capture (manual; prints a set to save)
        if: ${{ env.STAGE == 'fit-capture' }}
        run: python -m lifeos.run safety-fit-capture
      - name: Phone alert
        if: ${{ steps.smoke.outcome == 'failure' || steps.golden.outcome == 'failure' }}
        run: |
          python3 -m lifeos.platform.alerts push --severity page --title "V7 safety check failed" --body "SQL smoke ${{ steps.smoke.outcome }}, Fit re-check ${{ steps.golden.outcome }}. Open the safety run in Actions."
      - name: Fail the run when a check failed
        if: ${{ steps.smoke.outcome == 'failure' || steps.golden.outcome == 'failure' }}
        run: exit 1
