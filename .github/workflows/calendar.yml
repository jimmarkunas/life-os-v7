name: calendar
# Outlook calendar -> your own Google calendar (manual only). Separate from the hourly workflow (which is at GitHub's 25-input limit)
# and from the job-search secrets. A dry run (live unticked) reads both calendars and prints counts only; nothing is written.
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Add the events to your Google calendar (unticked = dry run: counts only)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: life-os-v7-calendar
  cancel-in-progress: false
jobs:
  calendar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OUTLOOK_CLIENT_ID: ${{ secrets.OUTLOOK_CLIENT_ID }}
      GCAL_CALENDAR_ID: ${{ secrets.GCAL_CALENDAR_ID }}
      LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python
      - id: bws_calendar
        name: Load the migrated credentials from Bitwarden (EDGE-1.3, exactly these 8; masked step outputs only, nothing exported job-wide; the job fails if retrieval fails, no fallback)
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793   # v3.0.1
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            e697c607-f798-4528-9967-b4db015a6940 > GCAL_SERVICE_ACCOUNT_JSON
            d71bbaed-6a6c-49b5-8a1f-b4db015ecfda > LIFEOS_ACQ_DB_NAME
            00d82e0d-be10-4c8c-bdbe-b4db015ed389 > LIFEOS_ACQ_DB_PASSWORD
            9422b842-3bb0-4153-bb8d-b4db015ed746 > LIFEOS_ACQ_DB_USER
            6f1c86f6-c48f-4e77-b65d-b4db015edb15 > LIFEOS_ACQ_SSH_HOST
            b65dd2fc-2573-4bda-9e80-b4db015edec6 > LIFEOS_ACQ_SSH_KNOWN_HOSTS
            7ada9cea-8711-4b37-bef9-b4db015ee298 > LIFEOS_ACQ_SSH_PRIVATE_KEY
            6b3e12b9-1987-4073-bda2-b4db015ee653 > LIFEOS_ACQ_SSH_USER
      - name: Calendar sync (counts only)
        env:
          GCAL_SERVICE_ACCOUNT_JSON: ${{ steps.bws_calendar.outputs.GCAL_SERVICE_ACCOUNT_JSON }}
          LIFEOS_ACQ_DB_NAME: ${{ steps.bws_calendar.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: ${{ steps.bws_calendar.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: ${{ steps.bws_calendar.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: ${{ steps.bws_calendar.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ steps.bws_calendar.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ steps.bws_calendar.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: ${{ steps.bws_calendar.outputs.LIFEOS_ACQ_SSH_USER }}
        run: python -m lifeos.run calendar-sync $([ "${{ inputs.live }}" = "true" ] && echo --live)
