name: calendar
# Outlook calendar -> your own Google calendar (manual only). Separate from the hourly workflow (which is at GitHub's 25-input limit)
# and from the job-search secrets. A dry run (live unticked) reads both calendars and prints counts only; nothing is written.
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Add the events to your Google calendar (unticked = dry run: counts only)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: life-os-v7-calendar
  cancel-in-progress: false
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OUTLOOK_CLIENT_ID: ${{ secrets.OUTLOOK_CLIENT_ID }}
      GCAL_SERVICE_ACCOUNT_JSON: ${{ secrets.GCAL_SERVICE_ACCOUNT_JSON }}
      GCAL_CALENDAR_ID: ${{ secrets.GCAL_CALENDAR_ID }}
      LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ secrets.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
      LIFEOS_ACQ_DB_PASSWORD: ${{ secrets.LIFEOS_ACQ_DB_PASSWORD }}
      LIFEOS_ACQ_SSH_HOST: ${{ secrets.LIFEOS_ACQ_SSH_HOST }}
      LIFEOS_ACQ_SSH_PORT: ${{ secrets.LIFEOS_ACQ_SSH_PORT }}
      LIFEOS_ACQ_SSH_USER: ${{ secrets.LIFEOS_ACQ_SSH_USER }}
      LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ secrets.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
      LIFEOS_ACQ_DB_NAME: ${{ secrets.LIFEOS_ACQ_DB_NAME }}
      LIFEOS_ACQ_DB_USER: ${{ secrets.LIFEOS_ACQ_DB_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Calendar sync (counts only)
        run: python -m lifeos.run calendar-sync $([ "${{ inputs.live }}" = "true" ] && echo --live)
