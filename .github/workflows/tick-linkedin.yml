name: tick-linkedin
on:
  workflow_call:
    inputs:
      live:
        type: boolean
        default: false
      resolve_linkedin:
        type: boolean
        default: false
      tick:
        type: boolean
        default: false
      prep_pipeline:
        type: string
        default: ""
    secrets:
      DOPPLER_TOKEN:
        required: false
      LIFEOS_BWS_RUNTIME_TOKEN:
        required: false
permissions:
  contents: read
env:
  NOTION_JOB_LEDGER_DATA_SOURCE_ID: ""
  V7_FIT_GATE: ""
  HIRING_PIPELINE_PAGE_ID: ""
jobs:
  linkedin:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for try in 1 2 3; do git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA" && break; [ "$try" = 3 ] && exit 1; sleep $((try * 5)); done
          git checkout -q --detach FETCH_HEAD
      - name: Python and the Bitwarden helper
        uses: ./.github/actions/job-start
        with:
          wait_seconds: "600"
      - id: bws_linkedin
        name: Load the migrated credentials from Bitwarden
        uses: &a1 ./.github/actions/bws-load
        with:
          access_token: &a2 ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          doppler_compare: &a3 ${{ secrets.DOPPLER_TOKEN }}
          set_env: false
          set: hourly-jobright
      - name: Plain switches from Bitwarden
        uses: ./.github/actions/bws-plain
        with:
          access_token: *a2
          names: ALERTS_ENABLED,ALERTS_MUTED_UNTIL,ALERT_SETTINGS,LIFEOS_ACQ_SSH_PORT,V7_STORE_VIA,LIVE
          live_mode: ${{ github.event_name == 'workflow_dispatch' && !inputs.tick && (inputs.live && 'true' || 'false') || 'follow' }}
      - name: Join the tailnet as the ephemeral tag:v7-runner node
        continue-on-error: true
        uses: ./.github/actions/tailscale
        with:
          oauth-client-id: ${{ steps.bws_linkedin.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_linkedin.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
      - id: bws_runtime_config
        continue-on-error: true
        name: Runtime Configuration source ID from Bitwarden
        uses: *a1
        with:
          access_token: *a2
          doppler_compare: *a3
          set_env: false
          set: runtime-config
      - id: linkedin
        name: Step 5 - resolve LinkedIn jobs (no login, no browser)
        if: &a4 ${{ inputs.prep_pipeline == 'true' || (github.event_name == 'workflow_dispatch' && inputs.resolve_linkedin) }}
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          FIT_PROFILE_EXTRA_JSON: ${{ steps.bws_linkedin.outputs.FIT_PROFILE_EXTRA_JSON }}
          FIT_PROFILE_JSON: ${{ steps.bws_linkedin.outputs.FIT_PROFILE_JSON }}
          JOBRIGHT_EMAIL: ${{ steps.bws_linkedin.outputs.JOBRIGHT_EMAIL }}
          JOBRIGHT_PASSWORD: ${{ steps.bws_linkedin.outputs.JOBRIGHT_PASSWORD }}
          LIFEOS_ACQ_DB_NAME: &a5 ${{ steps.bws_linkedin.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: &a6 ${{ steps.bws_linkedin.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: &a7 ${{ steps.bws_linkedin.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: &a8 ${{ steps.bws_linkedin.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: &a9 ${{ steps.bws_linkedin.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_JUMP_HOST: &a10 ${{ steps.bws_linkedin.outputs.LIFEOS_ACQ_SSH_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: &a11 ${{ steps.bws_linkedin.outputs.LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: &a12 ${{ steps.bws_linkedin.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: &a13 ${{ steps.bws_linkedin.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: &a14 ${{ steps.bws_linkedin.outputs.LIFEOS_ACQ_SSH_USER }}
          NOTION_API_TOKEN: ${{ steps.bws_linkedin.outputs.NOTION_API_TOKEN }}
          TINYFISH_API_KEY: ${{ steps.bws_linkedin.outputs.TINYFISH_API_KEY }}
        run: python -m lifeos.run resolve-linkedin --limit 150 $([ "$LIVE" = "true" ] && echo --live)
      - id: linkedin_search
        continue-on-error: true
        timeout-minutes: 4
        name: Step 5a - LinkedIn job search
        if: *a4
        env:
          LIFEOS_ACQ_DB_NAME: *a5
          LIFEOS_ACQ_DB_PASSWORD: *a6
          LIFEOS_ACQ_DB_USER: *a7
          LIFEOS_ACQ_SSH_HOST: *a8
          LIFEOS_ACQ_SSH_JUMP_KEY: *a9
          LIFEOS_ACQ_SSH_JUMP_HOST: *a10
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: *a11
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: *a12
          LIFEOS_ACQ_SSH_PRIVATE_KEY: *a13
          LIFEOS_ACQ_SSH_USER: *a14
        run: python -m lifeos.run linkedin-search --limit 40 $([ "$LIVE" = "true" ] && echo --live)
