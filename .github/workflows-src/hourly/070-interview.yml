  interview:
    # Interview OS runs in its OWN job (D38/handoff): dispatch-only until promoted, no Jobs secrets, and its failure never fails the Jobs run
    # (the stale-pipeline alert and the gate are keyed on run success). Step-level continue-on-error + a warning, not job-level.
    needs: prep
    if: ${{ always() && needs.prep.result == 'success' && github.event_name == 'workflow_dispatch' && (inputs.interview || inputs.interview_probe || inputs.interview_acceptance) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:                                   # least privilege: blank every secret this job does not use (workflow-level env is inherited)
      NOTION_API_TOKEN: ""
      NOTION_JOB_LEDGER_DATA_SOURCE_ID: ""
      GMAIL_OAUTH_CLIENT_ID: ""
      GMAIL_OAUTH_CLIENT_SECRET: ""
      GMAIL_OAUTH_REFRESH_TOKEN: ""
      TINYFISH_API_KEY: ""
      JOBRIGHT_EMAIL: ""
      JOBRIGHT_PASSWORD: ""
      LIFEOS_ACQ_SSH_PRIVATE_KEY: ""
      LIFEOS_ACQ_DB_PASSWORD: ""
      LIFEOS_ACQ_SSH_HOST: ""
      LIFEOS_ACQ_SSH_PORT: ""
      LIFEOS_ACQ_SSH_USER: ""
      LIFEOS_ACQ_SSH_KNOWN_HOSTS: ""
      LIFEOS_ACQ_DB_NAME: ""
      LIFEOS_ACQ_DB_USER: ""
      FIT_PROFILE_JSON: ""
      FIT_PROFILE_EXTRA_JSON: ""
      OPEN_JOBS_CONTACT: ""
    steps:
      - name: Checkout the exact commit (own git fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Python and the Bitwarden helper
        uses: ./.github/actions/job-start
        with:
          wait_seconds: "300"
      # why: Load the migrated credentials from Bitwarden (EDGE-1.3, exactly these 3, the Interview token and (LIFE-699) the two private acceptance cases that only the manual acceptance steps use; masked step outputs only, nothing exported job-wide; the job fails if retrieval fails, no fallback)
      - id: bws_interview
        name: Load the migrated credentials from Bitwarden
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          doppler_compare: ${{ secrets.DOPPLER_TOKEN }}
          set_env: false
          secrets: |
            092b44ae-32cb-453b-8cc2-b4db015ef571 > NOTION_INTERVIEW_TOKEN
            1051e89d-233b-4050-b6ce-b50401674a4f > INTERVIEW_ACCEPTANCE_JSON
            881cd6f8-ee94-4e6d-a20d-b5040167732c > INTERVIEW_ACCEPTANCE_NEGATIVE_JSON
      # why: Plain switches from Bitwarden (LIFE-704; read WITHOUT masking, validated; fixed fail modes - dry run, cloud fit off, alerts on, port fails - names and codes only)
      - name: Plain switches from Bitwarden
        uses: ./.github/actions/bws-plain
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          names: ALERTS_ENABLED,ALERTS_MUTED_UNTIL,ALERT_SETTINGS,LIFEOS_ACQ_SSH_PORT,LIVE
          live_mode: ${{ github.event_name == 'workflow_dispatch' && !inputs.tick && (inputs.live && 'true' || 'false') || 'follow' }}
      # why: Runtime Configuration source ID from Bitwarden so the settings read uses the new source (LIFE-859; read only, an address not a secret; if it fails the step runs exactly as before)
      - id: bws_runtime_config
        continue-on-error: true
        name: Runtime Configuration source ID from Bitwarden
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          doppler_compare: ${{ secrets.DOPPLER_TOKEN }}
          set_env: false
          secrets: |
            0053654c-d504-4453-87f7-b5080113d136 > V7_RUNTIME_CONFIG_SOURCE_ID
      - id: iprobe
        continue-on-error: true
        name: Interview shape probe (counts only, writes nothing)
        if: ${{ inputs.interview_probe }}
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          NOTION_INTERVIEW_TOKEN: ${{ steps.bws_interview.outputs.NOTION_INTERVIEW_TOKEN }}
        run: python -m lifeos.run interview-probe
      - id: irun
        continue-on-error: true
        name: Interview stage (live only when Actually move mail is ticked)
        if: ${{ inputs.interview }}
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          LIFEOS_NOTION_IDS: ""
          NOTION_JOB_LEDGER_DATA_SOURCE_ID: ""   # LIFE-360 (Jim approved Nov 7, 4:17 PM CT): the readers take opportunities from Ledger rows first (read-only, Interview token)
          NOTION_INTERVIEW_TOKEN: ${{ steps.bws_interview.outputs.NOTION_INTERVIEW_TOKEN }}
        run: python -m lifeos.run interview --limit 20 $([ "$LIVE" = "true" ] && echo --live)
      - id: iacc
        continue-on-error: true
        name: Interview private acceptance (manual dispatch only; case comes from the secret)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.interview_acceptance == true && inputs.tick != true }}
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          INTERVIEW_ACCEPTANCE_JSON: ${{ steps.bws_interview.outputs.INTERVIEW_ACCEPTANCE_JSON }}
          NOTION_INTERVIEW_TOKEN: ${{ steps.bws_interview.outputs.NOTION_INTERVIEW_TOKEN }}
          NOTION_JOB_LEDGER_DATA_SOURCE_ID: ""   # D231: the Scheduling Pending case reads the exact Ledger rows (read-only, Interview token)
        run: python -m lifeos.run interview-acceptance --limit 1 $([ "$LIVE" = "true" ] && echo --live)
      # why: Interview private acceptance - negative case (always a dry run; skipped when its secret is empty)
      - id: iaccneg
        continue-on-error: true
        name: Interview private acceptance - negative case
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.interview_acceptance == true && inputs.tick != true }}
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          INTERVIEW_ACCEPTANCE_JSON: ${{ steps.bws_interview.outputs.INTERVIEW_ACCEPTANCE_NEGATIVE_JSON }}   # D233: the case that must be refused; always a dry run, so it cannot write
          NOTION_INTERVIEW_TOKEN: ${{ steps.bws_interview.outputs.NOTION_INTERVIEW_TOKEN }}
          NOTION_JOB_LEDGER_DATA_SOURCE_ID: ""
        run: |
          if [ -z "$INTERVIEW_ACCEPTANCE_JSON" ]; then echo "INTERVIEW-ACCEPTANCE NEGATIVE CASE NOT SET"; exit 0; fi
          python -m lifeos.run interview-acceptance --limit 1
      - name: Interview warning (does not fail the run)
        if: ${{ always() && (steps.iprobe.outcome == 'failure' || steps.irun.outcome == 'failure' || steps.iacc.outcome == 'failure' || steps.iaccneg.outcome == 'failure') }}
        run: echo "::warning title=Interview OS::the Interview step failed or was DEGRADED; the Jobs pipeline is unaffected"

