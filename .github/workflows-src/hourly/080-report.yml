  report:
    needs: [prep, unit-tests, jobright, linkedin, lensa, finish]
    if: ${{ always() && (needs.prep.result == 'success' || (needs.prep.result == 'failure' && (github.event_name == 'schedule' || (inputs.tick && (inputs.cloud_backlog == '' || inputs.cloud_backlog == '0'))))) }}   # LIFE-328: also when an automatic run's prep fails (unit tests, credentials): nothing ran or reached Notion (Nov 3-4 2026: 21 silent hours); a failed manual prep has a person watching and loads no credential
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the exact commit (own git fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      # why: Bitwarden helper from a saved, fingerprint-checked copy (LIFE-406; downloads, with a long retry, only when no saved copy exists)
      - name: Bitwarden helper from a saved, fingerprint-checked copy
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "100"
      # why: Load the migrated credentials from Bitwarden (EDGE-1.3, exactly these 1; masked step outputs only, nothing exported job-wide; the job fails if retrieval fails, no fallback)
      - id: bws_report
        name: Load the migrated credentials from Bitwarden
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          doppler_compare: ${{ secrets.DOPPLER_TOKEN }}
          set_env: false
          set: report
      # why: Plain switches from Bitwarden (LIFE-704; read WITHOUT masking, validated; fixed fail modes - dry run, cloud fit off, alerts on, port fails - names and codes only)
      - name: Plain switches from Bitwarden
        uses: ./.github/actions/bws-plain
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          names: ALERTS_ENABLED,ALERTS_MUTED_UNTIL,ALERT_SETTINGS,LIFEOS_ACQ_SSH_PORT,LIVE
          live_mode: ${{ github.event_name == 'workflow_dispatch' && !inputs.tick && (inputs.live && 'true' || 'false') || 'follow' }}
      - name: Resolver lanes and the finish job report here (the run fails if any lane failed)
        env:
          NTFY_TOPIC: ${{ steps.bws_report.outputs.NTFY_TOPIC }}
          STAGES: ${{ needs.finish.outputs.failed }}
          CODES: ${{ needs.finish.outputs.codes }}
        run: |
          failed=""
          for pair in prep=${{ needs.prep.result }} unit-tests=${{ needs.unit-tests.result }} sweep=${{ needs.prep.outputs.sweep }} jobright=${{ needs.jobright.result }} linkedin=${{ needs.linkedin.result }} lensa=${{ needs.lensa.result }} finish=${{ needs.finish.result }}; do
            [ "${pair#*=}" = "failure" ] && failed="$failed ${pair%=*}"
          done
          if [ -n "$failed" ]; then
            python3 -m lifeos.platform.alerts push --key run_failed --title "V7 run failed" --body "Failed lanes:$failed${STAGES:+; stages: $STAGES}${CODES:+; codes: $CODES}. Open the Actions tab."
            echo "FAILED LANES:$failed"; exit 1
          fi

