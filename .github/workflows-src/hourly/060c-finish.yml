        run: python -m lifeos.run web --limit 12 $([ "$LIVE" = "true" ] && echo --live)
      - id: enrich
        continue-on-error: true
        name: Step 6 - enrich RESOLVED jobs (final page)
        timeout-minutes: 15                 # LIFE-76: 450 reads took about 5 minutes on Oct 25; a slow batch must not take the boards step's 25 minutes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enrich }}
        env:
