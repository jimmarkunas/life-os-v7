      - id: publish
        continue-on-error: true
        name: Step 7 - publish READY jobs to Notion
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
