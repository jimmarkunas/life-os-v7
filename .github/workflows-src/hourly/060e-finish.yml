          LIFEOS_ACQ_SSH_USER: ${{ steps.bws_finish.outputs.LIFEOS_ACQ_SSH_USER }}
          NOTION_API_TOKEN: ${{ steps.bws_finish.outputs.NOTION_API_TOKEN }}
          OPEN_JOBS_CONTACT: ${{ steps.bws_finish.outputs.OPEN_JOBS_CONTACT }}
          TINYFISH_API_KEY: ${{ steps.bws_finish.outputs.TINYFISH_API_KEY }}
        run: python -m lifeos.run publish --limit 60 $([ "$LIVE" = "true" ] && echo --live)
      # why: Step 7a - exclude jobs that have sat on HOLD for 7 days (so their newsletter mail can close)
      - id: holds
        continue-on-error: true
        name: Step 7a - exclude jobs that have sat on HOLD for 7 days
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.finalize) }}
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          FIT_PROFILE_EXTRA_JSON: ${{ steps.bws_finish.outputs.FIT_PROFILE_EXTRA_JSON }}
