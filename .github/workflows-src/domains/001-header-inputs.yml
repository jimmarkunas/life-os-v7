      megibow:
        description: "MegIBOW only: Jim's weekly job-search table (sent mail and calendars to the Notion block); dry run (counts) unless Actually write is ticked"
        type: boolean
        default: false
      bills_paid:
        description: "Bills: process Paid=true rows (advance Due Date, set Last Paid, clear Paid); also runs on every tick and under Run every domain job. Dry run (counts) unless Actually write is ticked"
        type: boolean
        default: false
      jira:
        description: "Jira only (unticked 'Run every domain job' above): snapshot, card, report (both), rollover, rollover+snapshot, a read-only layout probe, or (LIFE-918) writers-check = the read-only Jira writer contract check, reconcile = the LIFE-918 daily Jira reconcile once now (JFM and MEJ as one unit; the live box makes it write), writers-verify = the throwaway-sprint writer verification (dry unless the verify input ends in yes), setter-proof = the one same-value V2_OFFICIAL update proof (verify input: the expected Revision, then yes to really send it)"
        type: choice
        options: ["none", "snapshot", "card", "report", "rollover", "both", "probe", "writers-check", "writers-verify", "reconcile", "setter-proof"]
        default: "none"
      reconcile_force:
        description: "Manual LIFE-918 reconcile only: bypass today's already-ran check after 8 AM CT; still dry run unless Actually write is ticked"
        type: boolean
        default: false
      verify:
        description: "LIFE-918, writers-verify only: BOARD ISSUE to verify the Jira writers on a throwaway ZZ-LIFE918-TEST sprint, for example JFM JFM-123 (a dry run: contract check and plan). Add a third word, yes, to really write (JFM JFM-123 yes), and a fourth, keep, to keep the test clone because the Free plan cannot delete issues (JFM JFM-123 yes keep). Only that sprint and that one issue are touched. For setter-proof the input is REVISION [yes]: the Revision the V2_OFFICIAL row must hold (a dry run reads the row and reports), then yes to send the one same-value update"
        type: string
        default: ""
      refresh:
        description: "Close screen refresh (Jim, Oct 24): hiring = redraw the Hiring Pipeline region right after a verified close; recruiters = redraw only the Recruiter Outreach table after a verified recruiter close, status or Mark as Sent (no mail read). It queues in the after-tick group, so it never runs beside another Daily Report writer; the Close service skips it when a run is already waiting"
        type: choice
        options: ["none", "hiring", "recruiters"]
        default: "none"
      phase:
        description: "LIFE-775, set only by the hourly prep job (do not set by hand): tick = the early run of a tick, started while the tick runs, with every domain job that reads nothing the tick writes; megibow, interview and granola stay with the run that starts when the tick finishes"
        type: choice
        options: ["none", "tick"]
        default: "none"
      tick_run:
        description: "LIFE-904, set only by the hourly prep job (do not set by hand): the run ID of the tick this early run belongs to, so the chain receipt can link both domains runs to it"
        type: string
        default: ""
      live:
        description: "Actually write (saves snapshots, writes Notion, moves mail). Unticked = dry run, counts only. Automatic runs follow the repo variable V7_LIVE."
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # It gets its own group, which nothing else uses, so it can only wait behind or replace other do-nothing runs. The manual Amazon and Recruiters
  # workflows queue behind 'life-os-v7-domains'.
  group: ${{ (github.event_name == 'workflow_dispatch' && (inputs.refresh == 'hiring' || inputs.refresh == 'recruiters' || inputs.phase == 'tick')) && 'life-os-v7-domains' || github.event_name != 'workflow_run' && 'life-os-v7-domains-manual' || ((github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.display_title != 'tick') && 'life-os-v7-domains-idle' || 'life-os-v7-domains-late') }}
  cancel-in-progress: false
env:
  STAGE_TIMING_FILE: /tmp/stage-timing-domains.jsonl  # each standalone stage prints its one `stage_timing` line (names and numbers only); a path, not a secret
jobs:
