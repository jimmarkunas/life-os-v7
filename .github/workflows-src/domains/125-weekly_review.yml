  weekly_review:
    # LIFE-945 (Jim, Nov 24 2026): the Weekly LIFE OS Review. It runs after the dcc job on the same ticks; the stage itself decides whether anything is due (the first run at or after Friday 10 PM CT makes that week's one row)
    # and does nothing unless the WEEKLY_REVIEW setting is on. Its own job because the Drive lane reads through Oracle: it joins the tailnet as the ephemeral tag:v7-runner node (the policy admits it only to Oracle TCP 47341)
    # with the credentials the iMessage job already uses, and holds the Notion token the other cards use; nothing new is stored or issued. A failure is a warning.
    needs: [dcc, gate]
    if: ${{ always() && needs.gate.result != 'failure' && ((needs.gate.outputs.due_weekly_review == 'true' && needs.gate.outputs.early == 'true') || inputs.dcc) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Python and the Bitwarden helper
        uses: ./.github/actions/job-start
        with:
          wait_seconds: "200"
      # why: Load the Weekly Review credentials from Bitwarden (exactly these 4, all already used by other jobs; masked step outputs only, nothing exported job-wide; the job fails if retrieval fails, no fallback)
      - id: bws_weekly_review
        name: Load the Weekly Review credentials from Bitwarden
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          doppler_compare: ${{ secrets.DOPPLER_TOKEN }}
          set_env: false
          set: weekly-review
      # why: Plain switches from Bitwarden (LIFE-704; read WITHOUT masking, validated; fixed fail modes - dry run, cloud fit off, alerts on, port fails - names and codes only)
      - name: Plain switches from Bitwarden
        uses: ./.github/actions/bws-plain
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          names: ALERTS_ENABLED,ALERTS_MUTED_UNTIL,ALERT_SETTINGS,LIVE
          live_mode: ${{ (github.event_name == 'workflow_run' || inputs.phase == 'tick') && 'follow' || github.event_name == 'workflow_dispatch' && (inputs.live && 'true' || 'false') || 'false' }}
      # why: Runtime Configuration source ID from Bitwarden for the settings read (LIFE-859; read only, an address not a secret; if it fails the stage finds no settings and writes nothing)
      - id: bws_runtime_config
        continue-on-error: true
        name: Runtime Configuration source ID from Bitwarden
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          doppler_compare: ${{ secrets.DOPPLER_TOKEN }}
          set_env: false
          set: runtime-config
      # why: Join the tailnet as an ephemeral tag:v7-runner node (the tailnet policy admits it only to Oracle TCP 47341; a failed join only means the Drive lane shows Degraded)
      - name: Join the tailnet as an ephemeral tag:v7-runner node
        continue-on-error: true
        uses: ./.github/actions/tailscale
        with:
          oauth-client-id: ${{ steps.bws_weekly_review.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_weekly_review.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
      # why: Weekly LIFE OS Review (LIFE-945; off unless WEEKLY_REVIEW is on; the first run at or after Friday 10 PM CT makes that week's one Weekly Reviews row from six read-only lanes, sets Status Generated, moves Current and the one pointer line; Reviewed and Applied are never written)
      - id: weeklyreview
        continue-on-error: true
        name: Weekly LIFE OS Review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          JIRA_CARD_BLOCK_ID: ""
          WEEKLY_REVIEW: ""
          WEEKLY_REVIEW_PAGE_ID: ""
          LIFEOS_NOTION_IDS: ""
          NOTION_WEEKLY_REVIEWS_DATA_SOURCE_ID: ""
          NOTION_JIRA_TOKEN: ${{ steps.bws_weekly_review.outputs.NOTION_JIRA_TOKEN }}
          IMESSAGE_ALERTS_HOST: ${{ steps.bws_weekly_review.outputs.IMESSAGE_ALERTS_HOST }}
        run: python -m lifeos.run weekly-review --limit 0 $([ "$LIVE" = "true" ] && echo --live)
      - name: Weekly LIFE OS Review warning (does not fail the Jobs run)
        if: ${{ always() && steps.weeklyreview.outcome == 'failure' }}
        run: echo "::warning title=Weekly LIFE OS Review::the weekly row could not be written or read back; the week's row is made by the next run inside 48 hours"
      # why: A failed stage step makes this job red after every stage has run (LIFE-649), so the report job pushes the phone
      - name: Fail the job if any stage step failed
        if: ${{ always() && contains(steps.*.outcome, 'failure') }}
        run: echo "::error title=weekly_review::a stage step failed in the weekly_review job (see the step marked failed above)"; exit 1
