      # why: Step 6a2 - Cloud Fit backlog batch (LIFE-41 D219; after each tick when V7_CLOUD_FIT_SCHEDULED is set; moved from the hourly finish job, LIFE-856; one Oracle request at a time)
      - id: fit_cloud_backlog
        continue-on-error: true
        name: Step 6a2 - Cloud Fit backlog batch
        if: ${{ env.V7_CLOUD_FIT_SCHEDULED && env.V7_CLOUD_FIT_SCHEDULED != '0' }}   # LIFE-41 (Jim, Oct 19 2026): one call a tick is too few; after the tick, the strongest never-asked jobs get the Cloud Fit call, bounded
        env:
          NOTION_JOB_LEDGER_DATA_SOURCE_ID: ""   # LIFE-856: the old hourly.yml declared these three at workflow level, so the settings source filled them for every step; a domains step must declare them itself
          HIRING_PIPELINE_PAGE_ID: ""
          V7_FIT_GATE: ""
          PIPELINE: "true"
          CLOUD_BACKLOG: ${{ env.V7_CLOUD_FIT_SCHEDULED }}
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          FIT_PROFILE_EXTRA_JSON: ${{ steps.bws_fit_cloud_backlog.outputs.FIT_PROFILE_EXTRA_JSON }}
          FIT_PROFILE_JSON: ${{ steps.bws_fit_cloud_backlog.outputs.FIT_PROFILE_JSON }}
          LIFEOS_ACQ_DB_NAME: ${{ steps.bws_fit_cloud_backlog.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: ${{ steps.bws_fit_cloud_backlog.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: ${{ steps.bws_fit_cloud_backlog.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: ${{ steps.bws_fit_cloud_backlog.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: ${{ steps.bws_fit_cloud_backlog.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_JUMP_HOST: ${{ steps.bws_fit_cloud_backlog.outputs.LIFEOS_ACQ_SSH_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: ${{ steps.bws_fit_cloud_backlog.outputs.LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ steps.bws_fit_cloud_backlog.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ steps.bws_fit_cloud_backlog.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: ${{ steps.bws_fit_cloud_backlog.outputs.LIFEOS_ACQ_SSH_USER }}
          NOTION_API_TOKEN: ${{ steps.bws_fit_cloud_backlog.outputs.NOTION_API_TOKEN }}
          IMESSAGE_ALERTS_HOST: ${{ steps.bws_fit_cloud_backlog.outputs.IMESSAGE_ALERTS_HOST }}
          V7_CLOUD_FIT_BACKLOG_MAX: ${{ env.V7_CLOUD_FIT_SCHEDULED || '0' }}     # a tick: the scheduled count itself; 0 (unset) asks nothing
          V7_CLOUD_FIT_BACKLOG_BUDGET: ""     # a tick: sized below to the time left in the hour
          V7_CLOUD_FIT_BACKLOG_PAGE: ""     # LIFE-41 G6: Jim's one preapproved Ledger page, manual runs only; a tick never narrows to it
          V7_CLOUD_FIT_PROFILE_REF: ""
          V7_CLOUD_FIT_PARALLEL: ${{ env.V7_CLOUD_FIT_PARALLEL || '1' }}     # D232: calls in flight at once, one per Oracle lane (1-3); unset is 1, one at a time
        run: |
          # LIFE-41 (Jim, Oct 20 2026: "fill every hour"): the scheduled batch runs until about :55, so the next tick never waits, never past the
          # code's 45-minute batch cap (D238), and never past this job's 58 minutes (5 minutes kept for the steps after it). Too little time: skipped, not failed.
          now=$(date +%s); m=$((10#$(date +%M))); s=$((10#$(date +%S))); started=$(stat -c %Y "$GITHUB_WORKSPACE/.git")     # the checkout: this job's first seconds
          to_55=$(( m < 55 ? (55 - m) * 60 - s : 0 )); job_left=$(( 58 * 60 - (now - started) - 300 ))
          budget=$(( to_55 < job_left ? to_55 : job_left )); budget=$(( budget > 2700 ? 2700 : budget ))
          if [ "$budget" -lt 300 ]; then echo "fit-cloud-backlog: skipped this hour (${budget}s left before :55 or the job limit)"; exit 0; fi
          export V7_CLOUD_FIT_BACKLOG_BUDGET=$budget
          python -m lifeos.run fit-cloud-backlog --limit "$CLOUD_BACKLOG" $([ "$LIVE" = "true" ] && echo --live)
      # why: A failed stage step makes this job red after every stage has run (LIFE-649), so the report job pushes the phone
      - name: Fail the job if any stage step failed
        if: ${{ always() && contains(steps.*.outcome, 'failure') }}
        run: echo "::error title=fit_cloud_backlog::a stage step failed in the fit_cloud_backlog job (see the step marked failed above)"; exit 1
