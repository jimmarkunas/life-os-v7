  megibow:
    # D134: MegIBOW is its own job. It reads sent mail and calendars (read only) and writes only its one Notion block, its review list and two tiny private tables; a failure is a
    # warning that never touches another card or the Jobs run, and a failed source leaves the last good table in place and says DEGRADED.
    needs: [gate]
    if: ${{ !cancelled() && needs.gate.result != 'failure' && ((needs.gate.outputs.due_megibow == 'true' && needs.gate.outputs.late == 'true') || inputs.megibow) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout the exact commit (own git fetch; the token is passed once and never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - uses: ./.github/actions/python
      - name: Bitwarden helper from a saved, fingerprint-checked copy (LIFE-406; downloads, with a long retry, only when no saved copy exists)
        uses: ./.github/actions/bws-helper
        with:
          wait_seconds: "400"
      - id: bws_megibow
        name: Load the migrated credentials from Bitwarden (EDGE-1.3, exactly these 15; masked step outputs only, nothing exported job-wide; the job fails if retrieval fails, no fallback)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            e697c607-f798-4528-9967-b4db015a6940 > GCAL_SERVICE_ACCOUNT_JSON
            08245c07-728f-438e-940b-b4db015a6967 > GMAIL_OAUTH_CLIENT_SECRET
            672a44e9-235f-4121-a99d-b4db015a6987 > GMAIL_OAUTH_REFRESH_TOKEN
            d71bbaed-6a6c-49b5-8a1f-b4db015ecfda > LIFEOS_ACQ_DB_NAME
            00d82e0d-be10-4c8c-bdbe-b4db015ed389 > LIFEOS_ACQ_DB_PASSWORD
            9422b842-3bb0-4153-bb8d-b4db015ed746 > LIFEOS_ACQ_DB_USER
            6f1c86f6-c48f-4e77-b65d-b4db015edb15 > LIFEOS_ACQ_SSH_HOST
            b65dd2fc-2573-4bda-9e80-b4db015edec6 > LIFEOS_ACQ_SSH_KNOWN_HOSTS
            7ada9cea-8711-4b37-bef9-b4db015ee298 > LIFEOS_ACQ_SSH_PRIVATE_KEY
            6b3e12b9-1987-4073-bda2-b4db015ee653 > LIFEOS_ACQ_SSH_USER
            192db2d1-be66-4fca-b9b5-b4e900240507 > LIFEOS_ACQ_SSH_JUMP_KEY
            454e12df-637f-4f65-9ec1-b4e30052942f > TAILSCALE_OAUTH_CLIENT_ID
            e54f0a84-84c3-47d8-8b5b-b4e30052d6e9 > TAILSCALE_OAUTH_CLIENT_SECRET
            53f47cb9-f6bb-4cde-87f4-b4db015ef928 > NOTION_JIRA_TOKEN
            83c553e9-23a6-45aa-9006-b4db015f00ac > NTFY_TOPIC
            8657d1ed-2cde-4298-bd62-b50301523e01 > GMAIL_OAUTH_CLIENT_ID
            2b2c73a9-7a1e-44b9-95f0-b50301509b09 > OUTLOOK_CLIENT_ID
            4d0c7449-ed0a-46c1-9c2c-b503015f8d54 > LIFEOS_ACQ_SSH_JUMP_HOST
            82efa413-6b9c-4c5c-b0d2-b503015f8e3d > LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS
      - id: doppler_bws_megibow
        if: ${{ steps.bws_megibow.outcome == 'success' }}
        continue-on-error: true       # LIFE-981: a Doppler problem is a fixed code in the log and never fails the job; the Bitwarden values above are the ones this job uses
        name: Doppler parity compare (LIFE-981; the same 19 names read from Doppler and compared with Bitwarden's value by hash; counts and a fixed code only; production keeps Bitwarden)
        uses: ./.github/actions/doppler-load
        with:
          token: ${{ secrets.DOPPLER_TOKEN }}
          names: GCAL_SERVICE_ACCOUNT_JSON,GMAIL_OAUTH_CLIENT_SECRET,GMAIL_OAUTH_REFRESH_TOKEN,LIFEOS_ACQ_DB_NAME,LIFEOS_ACQ_DB_PASSWORD,LIFEOS_ACQ_DB_USER,LIFEOS_ACQ_SSH_HOST,LIFEOS_ACQ_SSH_KNOWN_HOSTS,LIFEOS_ACQ_SSH_PRIVATE_KEY,LIFEOS_ACQ_SSH_USER,LIFEOS_ACQ_SSH_JUMP_KEY,TAILSCALE_OAUTH_CLIENT_ID,TAILSCALE_OAUTH_CLIENT_SECRET,NOTION_JIRA_TOKEN,NTFY_TOPIC,GMAIL_OAUTH_CLIENT_ID,OUTLOOK_CLIENT_ID,LIFEOS_ACQ_SSH_JUMP_HOST,LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS
          bitwarden: ${{ toJSON(steps.bws_megibow.outputs) }}
      - name: Plain switches from Bitwarden (LIFE-704; read WITHOUT masking, validated; fixed fail modes - dry run, cloud fit off, alerts on, port fails - names and codes only)
        uses: ./.github/actions/bws-plain
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          names: ALERTS_ENABLED,ALERTS_MUTED_UNTIL,ALERT_SETTINGS,LIFEOS_ACQ_SSH_PORT,V7_STORE_VIA,LIVE
          live_mode: ${{ (github.event_name == 'workflow_run' || inputs.phase == 'tick') && 'follow' || github.event_name == 'workflow_dispatch' && (inputs.live && 'true' || 'false') || 'false' }}
      - name: LIFE-85 - join the tailnet as the ephemeral tag:v7-runner node (the store's Oracle fallback; the policy admits it only to Oracle TCP 22 and 47341; a failed join only means no fallback)
        continue-on-error: true
        uses: ./.github/actions/tailscale
        with:
          oauth-client-id: ${{ steps.bws_megibow.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_megibow.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
      - id: bws_runtime_config
        continue-on-error: true
        name: Runtime Configuration source ID from Bitwarden so the settings read uses the new source (LIFE-859; read only, an address not a secret; if it fails the step runs exactly as before)
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          set_env: false
          secrets: |
            0053654c-d504-4453-87f7-b5080113d136 > V7_RUNTIME_CONFIG_SOURCE_ID
      - id: doppler_bws_runtime_config
        if: ${{ steps.bws_runtime_config.outcome == 'success' }}
        continue-on-error: true       # LIFE-981: a Doppler problem is a fixed code in the log and never fails the job; the Bitwarden values above are the ones this job uses
        name: Doppler parity compare (LIFE-981; the same 1 name read from Doppler and compared with Bitwarden's value by hash; counts and a fixed code only; production keeps Bitwarden)
        uses: ./.github/actions/doppler-load
        with:
          token: ${{ secrets.DOPPLER_TOKEN }}
          names: V7_RUNTIME_CONFIG_SOURCE_ID
          bitwarden: ${{ toJSON(steps.bws_runtime_config.outputs) }}
      - id: megibow
        continue-on-error: true
        name: MegIBOW (Gmail, Outlook and calendars to the Notion table; counts only; writes only when live; a failed source is DEGRADED)
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          LIFEOS_NOTION_IDS: ""
          GMAIL_OAUTH_CLIENT_ID: ${{ steps.bws_megibow.outputs.GMAIL_OAUTH_CLIENT_ID }}
          OUTLOOK_CLIENT_ID: ${{ steps.bws_megibow.outputs.OUTLOOK_CLIENT_ID }}
          GCAL_CALENDAR_ID: ""
          MEGIBOW_BLOCK_ID: ""
          MEGIBOW_REVIEW_DB_ID: ""   # LIFE-703: declared empty so the V7 settings page can fill it; the code's own default applies when both are empty
          MEGIBOW_EXCLUDED_DOMAINS: ""   # LIFE-703: declared empty so the V7 settings page can fill it; the code's own default applies when both are empty
          GCAL_SERVICE_ACCOUNT_JSON: ${{ steps.bws_megibow.outputs.GCAL_SERVICE_ACCOUNT_JSON }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ steps.bws_megibow.outputs.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ steps.bws_megibow.outputs.GMAIL_OAUTH_REFRESH_TOKEN }}
          LIFEOS_ACQ_DB_NAME: ${{ steps.bws_megibow.outputs.LIFEOS_ACQ_DB_NAME }}
          LIFEOS_ACQ_DB_PASSWORD: ${{ steps.bws_megibow.outputs.LIFEOS_ACQ_DB_PASSWORD }}
          LIFEOS_ACQ_DB_USER: ${{ steps.bws_megibow.outputs.LIFEOS_ACQ_DB_USER }}
          LIFEOS_ACQ_SSH_HOST: ${{ steps.bws_megibow.outputs.LIFEOS_ACQ_SSH_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KEY: ${{ steps.bws_megibow.outputs.LIFEOS_ACQ_SSH_JUMP_KEY }}
          LIFEOS_ACQ_SSH_JUMP_HOST: ${{ steps.bws_megibow.outputs.LIFEOS_ACQ_SSH_JUMP_HOST }}
          LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS: ${{ steps.bws_megibow.outputs.LIFEOS_ACQ_SSH_JUMP_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_KNOWN_HOSTS: ${{ steps.bws_megibow.outputs.LIFEOS_ACQ_SSH_KNOWN_HOSTS }}
          LIFEOS_ACQ_SSH_PRIVATE_KEY: ${{ steps.bws_megibow.outputs.LIFEOS_ACQ_SSH_PRIVATE_KEY }}
          LIFEOS_ACQ_SSH_USER: ${{ steps.bws_megibow.outputs.LIFEOS_ACQ_SSH_USER }}
          NOTION_JIRA_TOKEN: ${{ steps.bws_megibow.outputs.NOTION_JIRA_TOKEN }}
          NTFY_TOPIC: ${{ steps.bws_megibow.outputs.NTFY_TOPIC }}
        run: python -m lifeos.run megibow --limit 0 $([ "$LIVE" = "true" ] && echo --live)
      - name: MegIBOW warning (does not fail the Jobs run)
        if: ${{ always() && steps.megibow.outcome == 'failure' }}
        run: echo "::warning title=MegIBOW::the MegIBOW stage failed or a source was unread; the table shows DEGRADED and the Jobs pipeline is unaffected"
      - name: A failed stage step makes this job red after every stage has run (LIFE-649), so the report job pushes the phone
        if: ${{ always() && contains(steps.*.outcome, 'failure') }}
        run: echo "::error title=megibow::a stage step failed in the megibow job (see the step marked failed above)"; exit 1

