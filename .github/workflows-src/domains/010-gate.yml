  gate:
    name: ${{ (inputs.tick_run || github.event.workflow_run.id) && format('gate (tick {0})', inputs.tick_run || github.event.workflow_run.id) || 'gate' }}  # the tick's run ID is the chain's correlation ID; the chain receipt finds this tick's domains runs by it
    # item 11: the ONE place that decides whether this run does the domain work. It runs only for a completed tick or `all`
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.display_title == 'tick') || (github.event_name == 'workflow_dispatch' && inputs.phase == 'tick') || inputs.all }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tick: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.display_title == 'tick') || (github.event_name == 'workflow_dispatch' && inputs.phase == 'tick') }}
      early: ${{ inputs.all || inputs.phase == 'tick' || (github.event_name == 'workflow_run' && steps.cover.outputs.early_covered == 'false') }}  # the jobs that read nothing the tick writes: the early run, `all`, or the after-tick run when it found no early run
      late: ${{ inputs.all || github.event_name == 'workflow_run' }}  # megibow, interview, granola: the after-tick run, or `all`
      all: ${{ inputs.all }}
      pipeline: ${{ (github.event_name == 'workflow_run' || inputs.phase == 'tick') && steps.ran.outputs.ran != 'false' }}  # the tick's hourly `finish` job ran (unreadable counts as ran)
      due_jira: ${{ steps.due.outputs.due_jira }}
      due_followup: ${{ steps.due.outputs.due_followup }}
      due_outlook: ${{ steps.due.outputs.due_outlook }}
      due_bills: ${{ steps.due.outputs.due_bills }}
      due_agenda: ${{ steps.due.outputs.due_agenda }}
      due_amazon: ${{ steps.due.outputs.due_amazon }}
      due_amazon_retention: ${{ steps.due.outputs.due_amazon_retention }}
      due_mail: ${{ steps.due.outputs.due_mail }}
      due_hiring: ${{ steps.due.outputs.due_hiring }}
      due_megibow: ${{ steps.due.outputs.due_megibow }}
      due_dcc: ${{ steps.due.outputs.due_dcc }}
      due_weekly_review: ${{ steps.due.outputs.due_weekly_review }}
      due_recruiters: ${{ steps.due.outputs.due_recruiters }}
      due_hiring_outcomes: ${{ steps.due.outputs.due_hiring_outcomes }}
      due_interview: ${{ steps.due.outputs.due_interview }}
      due_imessage: ${{ steps.due.outputs.due_imessage }}
      due_granola: ${{ steps.due.outputs.due_granola }}
      due_network_surface: ${{ steps.due.outputs.due_network_surface }}
      due_fit_cloud_backlog: ${{ steps.due.outputs.due_fit_cloud_backlog }}
      due_last_seen_purge: ${{ steps.due.outputs.due_last_seen_purge }}
      granola_auto: ${{ steps.settings.outputs.GRANOLA_AUTO }}  # the page's value when GitHub holds none; GitHub's own value when the page cannot be read
      imessage_alerts: ${{ steps.settings.outputs.V7_IMESSAGE_ALERTS }}
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - id: due
        name: Which domain jobs are due
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOMAINS_PHASE: ${{ inputs.phase }}
        run: python3 -m lifeos.platform.due
      - id: cover
        name: Is the early run of this tick already started
        if: ${{ github.event_name == 'workflow_run' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TICK_STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: python3 -m lifeos.platform.phase
      - id: ran
        name: Did the tick's hourly finish job run
        if: ${{ github.event_name == 'workflow_run' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TICK_RUN: ${{ github.event.workflow_run.id }}
        run: python3 -m lifeos.platform.pipeline_ran
