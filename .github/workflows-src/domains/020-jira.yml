  jira:
    # Jira runs in its own job, like Interview: scheduled and tick runs refresh the snapshot and the report card (rollover stays manual).
    # It holds only the Jira secrets; the database secrets are re-supplied to the snapshot step alone.
    needs: [gate]
    if: ${{ !cancelled() && needs.gate.result != 'failure' && ((needs.gate.outputs.due_jira == 'true' && needs.gate.outputs.early == 'true') || (github.event_name == 'workflow_dispatch' && inputs.jira != 'none')) }}  # an empty input (a workflow_run after a manual or cancelled hourly run) is not a request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the exact commit (own fetch, token never stored)
        run: |
          auth=$(printf 'x-access-token:%s' '${{ github.token }}' | base64 | tr -d '\n'); echo "::add-mask::$auth"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Python and the Bitwarden helper
        uses: ./.github/actions/job-start
        with:
          wait_seconds: "300"
      - id: bws_jira
        name: Load the migrated credentials from Bitwarden
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          doppler_compare: ${{ secrets.DOPPLER_TOKEN }}
          set_env: false
          set: jira
      - name: Plain switches from Bitwarden
        uses: ./.github/actions/bws-plain
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          names: ALERTS_ENABLED,ALERTS_MUTED_UNTIL,ALERT_SETTINGS,LIFEOS_ACQ_SSH_PORT,V7_STORE_VIA,LIVE
          live_mode: ${{ (github.event_name == 'workflow_run' || inputs.phase == 'tick') && 'follow' || github.event_name == 'workflow_dispatch' && (inputs.live && 'true' || 'false') || 'false' }}
      - name: Join the tailnet as the ephemeral tag:v7-runner node
        continue-on-error: true
        uses: ./.github/actions/tailscale
        with:
          oauth-client-id: ${{ steps.bws_jira.outputs.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.bws_jira.outputs.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:v7-runner
      - id: bws_runtime_config
        continue-on-error: true
        name: Runtime Configuration source ID from Bitwarden
        uses: ./.github/actions/bws-load
        with:
          access_token: ${{ secrets.LIFEOS_BWS_RUNTIME_TOKEN }}
          doppler_compare: ${{ secrets.DOPPLER_TOKEN }}
          set_env: false
          set: runtime-config
      - id: settings
        continue-on-error: true
        name: V7 settings page for the Jira base URL, boards and GTV epic
        env:
          V7_RUNTIME_CONFIG_SOURCE_ID: ${{ steps.bws_runtime_config.outputs.V7_RUNTIME_CONFIG_SOURCE_ID }}
          NOTION_JIRA_TOKEN: ${{ steps.bws_jira.outputs.NOTION_JIRA_TOKEN }}
          JIRA_BASE_URL: ""
          JIRA_BOARDS: ""
          JIRA_GTV_EPIC: ""
          MEJ_SPRINT_AUTOMATION: ""  # the sprint automation switch, off unless the Runtime Configuration row says on; later steps (rollover, reconcile) read it from the job environment
          MEJ_AUTOMATION_SINCE: ""  # the activation time for the manual/automatic closure split
          JIRA_WRITERS_VERIFIED: ""  # yes only after the throwaway-sprint verification passed
          JIRA_FUTURE_SPRINTS: ""  # configured number of future weekly sprints, default eight
          V2_PROMOTION: ""  # the promotion kill switch, read by the daily reconcile's promotion check
          V2_OFFICIAL: ""  # the one row the promotion check may set on Jan 1
        run: python3 -m lifeos.platform.settings
      - id: jrollauto
        continue-on-error: true
        name: Jira sprint rollover
        if: ${{ needs.gate.outputs.due_jira == 'true' }}
        env:
          JIRA_API_TOKEN: ${{ steps.bws_jira.outputs.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ steps.bws_jira.outputs.JIRA_EMAIL }}
        run: python -m lifeos.run jira-rollover-scheduled $([ "$LIVE" = "true" ] && echo --live)
