# Why each step of a workflow-src part is written the way it is (LIFE-1016). tools/regen.py builds docs/workflows.md from this file; the text is the history that used to sit as `# why:` lines in the parts.
# One list per part file, in step order; each entry is {step id or name: why}. This is the only place in workflows-src where ticket numbers may appear.
domains/010-gate.yml:
  - {"due": "Which domain jobs are due (LIFE-609) - one table, each job's last successful run; an unreadable history makes every job due"}
  - {"cover": "LIFE-775 - is the early run of this tick already started (the after-tick run then leaves the early jobs to it; no early run means it runs every job; unreadable leaves them out)"}
  - {"ran": "LIFE-856 - did the tick's hourly finish job run (the moved Network Leads and Cloud Fit backlog jobs run only then; unreadable counts as yes)"}
domains/010b-gate.yml:
  - {"Bitwarden helper from a saved, fingerprint-checked copy": "Bitwarden helper from a saved, fingerprint-checked copy (LIFE-406; downloads, with a long retry, only when no saved copy exists)"}
  - {"bws_settings": "Notion token from Bitwarden so the gate can read the V7 settings page (LIFE-703; read only; if it fails the GitHub values decide)"}
  - {"Plain switches from Bitwarden": "Plain switches from Bitwarden (LIFE-704; read WITHOUT masking, validated; fixed fail modes - dry run, cloud fit off, alerts on, port fails - names and codes only)"}
  - {"settings": "V7 settings page for the two switches a job condition needs (LIFE-703; names and counts only; an unreadable page changes nothing)"}
domains/020-jira.yml:
  - {"bws_jira": "Load the migrated credentials from Bitwarden (EDGE-1.3, exactly these 14; masked step outputs only, nothing exported job-wide; the job fails if retrieval fails, no fallback)"}
  - {"Plain switches from Bitwarden": "Plain switches from Bitwarden (LIFE-704; read WITHOUT masking, validated; fixed fail modes - dry run, cloud fit off, alerts on, port fails - names and codes only)"}
  - {"Join the tailnet as the ephemeral tag:v7-runner node": "LIFE-85 - join the tailnet as the ephemeral tag:v7-runner node (the store's Oracle fallback; the policy admits it only to Oracle TCP 22 and 47341; a failed join only means no fallback)"}
  - {"bws_runtime_config": "Runtime Configuration source ID from Bitwarden so the settings read uses the new source (LIFE-859; read only, an address not a secret; if it fails the step runs exactly as before)"}
  - {"settings": "V7 settings page for the Jira base URL, boards and GTV epic (LIFE-699; names and counts only; an unreadable page changes nothing). Only this step holds the Notion token; the Jira steps get the values through the job environment"}
  - {"jrollauto": "Jira sprint rollover (scheduled; waits for the sprint to end and Monday 6 AM; live only when V7_LIVE)"}
domains/020b-jira.yml:
  - {"jrollwatch": "Jira rollover watch (pages the phone when the scheduled rollover has not worked for 3 hours; one private state row; counts only)"}
  - {"jreconcile": "Jira daily reconcile (LIFE-918 / LIFE-998; off unless MEJ_SPRINT_AUTOMATION is on; once a day at or after 8 AM CT; a manual force skips only today's date guard; dry run unless live; counts only)"}
domains/020c-jira.yml:
  - {"jrelease": "Auto-release (LIFE-727; moves ready tickets of an epic labelled auto-release to Agent Go, at most 3 an hour; written only when live; counts only)"}
  - {"jstalled": "Stall check (LIFE-729; read-only; names LIFE tickets idle with no waiting-on note)"}
  - {"jfill": "Parent, Component and Fix Version fill (LIFE-752; LIFE tickets updated in the last 2 days; one [sweep] comment each; written only when live; counts only)"}
  - {"jcapture": "Jira decision capture (LIFE-994; LIFE tickets updated in the last two hours, decision comments only, into the shared memory through the governed tools; the server filters sensitive text; counts only; dry run unless live)"}
domains/020d-jira.yml:
  - {"jwcheck": "Jira writer contract check (LIFE-918; manual only; GET requests only, nothing is written; booleans and counts only)"}
  - {"jwverify": "Jira writer verification on a throwaway sprint (LIFE-918 decision E; manual only; a dry run unless the third word of verify is yes; a fourth word keep keeps the test clone because the Jira Free plan cannot delete; only a ZZ-LIFE918-TEST sprint and the one named issue; counts and fixed codes only)"}
  - {"jsetterproof": "V2_OFFICIAL setter proof (LIFE-1026 Option A; manual only, never scheduled; the verify input is REVISION then yes; one same-value off-over-off update checked against the expected row, value and revision, then a whole-page read-back; never retried; codes only)"}
  - {"Fail the job if any stage step failed": "A failed stage step makes this job red after every stage has run (LIFE-649), so the report job pushes the phone"}
