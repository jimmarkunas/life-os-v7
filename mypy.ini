# LIFE-559: type-checker configuration (mypy), lenient mode, lifeos/platform only. The check is ADVISORY: it runs on changed files in every pull request, prints counts and cannot fail the job.
# (pyproject.toml stays ruff-only on purpose: tests/contracts/test_ruff_advisory.py pins it, and the ticket says no existing test is edited.)
[mypy]
python_version = 3.12
files = lifeos/platform
ignore_missing_imports = True
follow_imports = silent
show_error_codes = True
no_error_summary = False
cache_dir = /dev/null
